name: 02_英语学习系统 - 考试解析 V1.2 测试

on:
  workflow_dispatch:
    inputs:
      test_date:
        description: "测试日期（留空=自动使用 output 中最新日期）"
        required: false
        default: "2026-09-26"
        type: string

permissions:
  contents: read

jobs:
  parser-test:

    name: English Exam Parser V1.2 Full Test

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Python
      # ============================================================

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. 检查 Parser 和测试脚本
      # ============================================================

      - name: 🔍 检查 Parser 和测试脚本
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "检查 English Exam Parser V1.2"
          echo "=========================================="

          PARSER="02_英语学习系统/scripts/english_exam_parser.py"
          TEST="02_英语学习系统/scripts/test_english_exam_parser_v1_1.py"

          if [ ! -f "$PARSER" ]; then
            echo "❌ Parser 不存在:"
            echo "   $PARSER"
            exit 1
          fi

          if [ ! -f "$TEST" ]; then
            echo "❌ 测试脚本不存在:"
            echo "   $TEST"
            exit 1
          fi

          echo "✅ Parser:"
          echo "   $PARSER"

          echo "✅ Test:"
          echo "   $TEST"

          echo
          echo "检查 Parser 版本:"

          if grep -q 'English Exam Parser V1.2' "$PARSER"; then
            echo "✅ 已检测到 Parser V1.2"
          else
            echo "❌ 当前 Parser 不是 V1.2"
            echo
            echo "Parser 文件开头:"
            head -n 25 "$PARSER"
            exit 1
          fi

          echo
          echo "检查 build_exam() 版本:"

          if grep -q '"version": "1.2"' "$PARSER"; then
            echo "✅ build_exam() version = 1.2"
          else
            echo "❌ build_exam() version 不是 1.2"
            exit 1
          fi

      # ============================================================
      # 4. 检查 output 并确定测试文件
      # ============================================================

      - name: 📂 检查英语学习系统输出
        shell: bash
        env:
          INPUT_TEST_DATE: ${{ inputs.test_date }}
        run: |
          set -e

          echo "=========================================="
          echo "检查测试日期与考试文件"
          echo "=========================================="

          OUTPUT_ROOT="02_英语学习系统/output"

          if [ ! -d "$OUTPUT_ROOT" ]; then
            echo "❌ 不存在:"
            echo "   $OUTPUT_ROOT"
            exit 1
          fi

          # ----------------------------------------------------------
          # 确定测试日期
          # ----------------------------------------------------------

          if [ -n "$INPUT_TEST_DATE" ]; then

            TEST_DATE="$INPUT_TEST_DATE"

            echo "指定测试日期:"
            echo "   $TEST_DATE"

            OUTPUT_DIR="$OUTPUT_ROOT/$TEST_DATE"

            if [ ! -d "$OUTPUT_DIR" ]; then
              echo "❌ 测试日期目录不存在:"
              echo "   $OUTPUT_DIR"
              exit 1
            fi

          else

            OUTPUT_DIR="$(
              find "$OUTPUT_ROOT" \
                -mindepth 1 \
                -maxdepth 1 \
                -type d \
                | sort \
                | tail -n 1
            )"

            if [ -z "$OUTPUT_DIR" ]; then
              echo "❌ 没有找到任何 output 日期目录"
              exit 1
            fi

            TEST_DATE="$(basename "$OUTPUT_DIR")"

            echo "自动选择最新日期:"
            echo "   $TEST_DATE"

          fi

          # ----------------------------------------------------------
          # 检查配套试卷目录
          # ----------------------------------------------------------

          EXAM_DIR="$OUTPUT_DIR/配套试卷"

          if [ ! -d "$EXAM_DIR" ]; then
            echo "❌ 配套试卷目录不存在:"
            echo "   $EXAM_DIR"
            exit 1
          fi

          echo
          echo "测试目录:"
          echo "   $OUTPUT_DIR"

          echo
          echo "配套试卷目录:"
          echo "   $EXAM_DIR"

          echo
          echo "目录内容:"
          find "$OUTPUT_DIR" \
            -maxdepth 3 \
            -type f \
            | sort

          # ----------------------------------------------------------
          # 找试卷
          # ----------------------------------------------------------

          EXAM_FILE="$(
            find "$EXAM_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*试卷.md' \
              | sort \
              | head -n 1
          )"

          if [ -z "$EXAM_FILE" ]; then
            echo
            echo "❌ 未找到试卷文件"
            echo "   搜索目录: $EXAM_DIR"
            exit 1
          fi

          # ----------------------------------------------------------
          # 找答案与解析
          # ----------------------------------------------------------

          ANSWER_FILE="$(
            find "$EXAM_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*答案与解析.md' \
              | sort \
              | head -n 1
          )"

          if [ -z "$ANSWER_FILE" ]; then
            echo
            echo "❌ 未找到答案与解析文件"
            echo "   搜索目录: $EXAM_DIR"
            exit 1
          fi

          # ----------------------------------------------------------
          # 写入 GITHUB_ENV
          # ----------------------------------------------------------

          {
            echo "ENGLISH_TEST_DATE=$TEST_DATE"
            echo "ENGLISH_EXAM_FILE=$EXAM_FILE"
            echo "ENGLISH_ANSWER_FILE=$ANSWER_FILE"
          } >> "$GITHUB_ENV"

          echo
          echo "=========================================="
          echo "✅ 测试文件确定"
          echo "=========================================="

          echo
          echo "测试日期:"
          echo "   $TEST_DATE"

          echo
          echo "试卷:"
          echo "   $EXAM_FILE"

          echo
          echo "答案与解析:"
          echo "   $ANSWER_FILE"

      # ============================================================
      # 5. 执行 Parser V1.2 全量测试
      # ============================================================

      - name: 🧪 Parser V1.2 - 61题全量测试
        shell: bash
        run: |
          set -e

          echo
          echo "======================================================================"
          echo "748686 ENGLISH EXAM PARSER V1.2"
          echo "FULL AUTOMATIC TEST"
          echo "======================================================================"
          echo

          echo "测试日期:"
          echo "  $ENGLISH_TEST_DATE"

          echo
          echo "试卷:"
          echo "  $ENGLISH_EXAM_FILE"

          echo
          echo "答案与解析:"
          echo "  $ENGLISH_ANSWER_FILE"

          echo
          echo "======================================================================"
          echo "开始执行测试"
          echo "======================================================================"
          echo

          python \
            "02_英语学习系统/scripts/test_english_exam_parser_v1_1.py" \
            --exam "$ENGLISH_EXAM_FILE" \
            --answers "$ENGLISH_ANSWER_FILE"

      # ============================================================
      # 6. 最终结果
      # ============================================================

      - name: ✅ 输出测试结果
        if: success()
        run: |
          echo
          echo "======================================================================"
          echo "✅ ENGLISH EXAM PARSER V1.2 TEST PASSED"
          echo "======================================================================"
          echo
          echo "61 / 61 questions"
          echo "50 / 50 auto-graded answers"
          echo "10 / 10 translation references"
          echo "1 / 1 writing reference"
          echo
          echo "Parser V1.2 可以进入 Grader 测试阶段。"
          echo "======================================================================"

      # ============================================================
      # 7. 失败结果
      # ============================================================

      - name: ❌ 输出失败结果
        if: failure()
        run: |
          echo
          echo "======================================================================"
          echo "❌ ENGLISH EXAM PARSER V1.2 TEST FAILED"
          echo "======================================================================"
          echo
          echo "请查看上方具体 FAIL 项目。"
          echo
          echo "当前阶段不要进入 Feishu 交互测试。"
          echo "======================================================================"
