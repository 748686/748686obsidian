name: 748686 飞书日报周报带图卡片测试

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  feishu-report-test:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout 748686obsidian
        uses: actions/checkout@v4

      # ==========================================================
      # 2. 检查飞书 Webhook
      #
      # 注意：
      #
      # 这里完全按照之前已经测试成功的飞书方式。
      #
      # 只使用：
      #
      #     FEISHU_WEBHOOK
      #
      # 不再要求：
      #
      #     FEISHU_APP_ID
      #     FEISHU_APP_SECRET
      # ==========================================================

      - name: 检查飞书 Webhook
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          set -e

          echo
          echo "=================================================="
          echo "检查飞书 Webhook"
          echo "=================================================="

          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "❌ FEISHU_WEBHOOK 未配置"
            exit 1
          fi

          echo "✅ FEISHU_WEBHOOK 已配置"

      # ==========================================================
      # 3. 检查日报 / 周报目录
      # ==========================================================

      - name: 检查日报周报目录
        run: |
          set -e

          echo
          echo "=================================================="
          echo "检查日报周报实际文件"
          echo "=================================================="

          echo
          echo "【05_日报】"

          if [ -d "01_自生长知识系统/05_日报" ]; then

            find \
              "01_自生长知识系统/05_日报" \
              -type f \
              -name "*.md" \
              -print \
              | sort \
              | tail -n 30

          else

            echo "⚠ 日报目录不存在"

          fi

          echo
          echo "【06_周报】"

          if [ -d "01_自生长知识系统/06_周报" ]; then

            find \
              "01_自生长知识系统/06_周报" \
              -type f \
              -name "*.md" \
              -print \
              | sort \
              | tail -n 30

          else

            echo "⚠ 周报目录不存在"

          fi

      # ==========================================================
      # 4. 查找最新带图日报
      #
      # 日报：
      #
      #     必须存在
      #
      # 找不到直接失败。
      # ==========================================================

      - name: 查找最新带图日报
        id: find_daily
        run: |
          set -e

          DAILY_DIR="01_自生长知识系统/05_日报"

          echo
          echo "=================================================="
          echo "查找最新带图日报"
          echo "=================================================="

          if [ ! -d "$DAILY_DIR" ]; then

            echo "❌ 日报目录不存在：$DAILY_DIR"
            exit 1

          fi

          DAILY_REPORT=$(
            find "$DAILY_DIR" \
              -type f \
              -name "*_带图.md" \
              -print \
              | sort \
              | tail -n 1
          )

          if [ -z "$DAILY_REPORT" ]; then

            echo "❌ 没有找到 *_带图.md 日报"

            echo
            echo "当前日报 Markdown："

            find "$DAILY_DIR" \
              -type f \
              -name "*.md" \
              -print \
              | sort

            exit 1

          fi

          echo
          echo "✅ 找到最新带图日报："
          echo "$DAILY_REPORT"

          echo "daily_report=$DAILY_REPORT" \
            >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 5. 查找最新带图周报
      #
      # 周报：
      #
      #     可选
      #
      # 没有：
      #
      #     SKIP
      #
      # 不失败。
      # ==========================================================

      - name: 查找最新带图周报
        id: find_weekly
        run: |
          set -e

          WEEKLY_DIR="01_自生长知识系统/06_周报"

          echo
          echo "=================================================="
          echo "查找最新带图周报"
          echo "=================================================="

          if [ ! -d "$WEEKLY_DIR" ]; then

            echo "⚠ 周报目录不存在"
            echo "⚠ 本次跳过周报发送"

            echo "weekly_report=" >> "$GITHUB_OUTPUT"
            echo "weekly_status=SKIPPED" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          WEEKLY_REPORT=$(
            find "$WEEKLY_DIR" \
              -type f \
              -name "*_带图.md" \
              -print \
              | sort \
              | tail -n 1
          )

          if [ -z "$WEEKLY_REPORT" ]; then

            echo "⚠ 没有找到 *_带图.md 周报"
            echo "⚠ 本次跳过周报发送"

            echo
            echo "当前周报目录中的 Markdown："

            find "$WEEKLY_DIR" \
              -type f \
              -name "*.md" \
              -print \
              | sort

            echo "weekly_report=" >> "$GITHUB_OUTPUT"
            echo "weekly_status=SKIPPED" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          echo
          echo "✅ 找到最新带图周报："
          echo "$WEEKLY_REPORT"

          echo "weekly_report=$WEEKLY_REPORT" \
            >> "$GITHUB_OUTPUT"

          echo "weekly_status=FOUND" \
            >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 6. 确认测试文件
      # ==========================================================

      - name: 确认带图日报周报
        env:
          DAILY_REPORT: ${{ steps.find_daily.outputs.daily_report }}
          WEEKLY_REPORT: ${{ steps.find_weekly.outputs.weekly_report }}
          WEEKLY_STATUS: ${{ steps.find_weekly.outputs.weekly_status }}
        run: |
          set -e

          echo
          echo "=================================================="
          echo "748686 飞书日报周报带图卡片测试"
          echo "=================================================="

          echo
          echo "【日报】"
          echo "$DAILY_REPORT"

          if [ ! -s "$DAILY_REPORT" ]; then
            echo "❌ 日报文件为空"
            exit 1
          fi

          echo
          echo "日报大小："
          wc -c "$DAILY_REPORT"

          echo
          echo "【周报】"

          if [ "$WEEKLY_STATUS" = "FOUND" ]; then

            echo "$WEEKLY_REPORT"

            if [ ! -s "$WEEKLY_REPORT" ]; then
              echo "❌ 周报文件为空"
              exit 1
            fi

            echo
            echo "周报大小："
            wc -c "$WEEKLY_REPORT"

          else

            echo "SKIPPED"
            echo "本次没有可发送的带图周报"

          fi

      # ==========================================================
      # 7. 发送带图日报
      #
      # 完全使用之前已经成功的：
      #
      #     FEISHU_WEBHOOK
      #
      # 不需要 APP_ID。
      # 不需要 APP_SECRET。
      # 不需要 tenant_access_token。
      # ==========================================================

      - name: 发送带图日报到飞书
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DAILY_REPORT: ${{ steps.find_daily.outputs.daily_report }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -e

          echo
          echo "=================================================="
          echo "FEISHU DAILY REPORT"
          echo "=================================================="

          python - "$DAILY_REPORT" <<'PY'

          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request
          from pathlib import Path


          REPORT_PATH = Path(sys.argv[1]).resolve()

          WEBHOOK = os.environ["FEISHU_WEBHOOK"]

          REPOSITORY = os.environ["GITHUB_REPOSITORY"]
          BRANCH = os.environ["GITHUB_REF_NAME"]


          if not REPORT_PATH.exists():

              print(
                  f"❌ 日报不存在：{REPORT_PATH}"
              )

              sys.exit(1)


          content = REPORT_PATH.read_text(
              encoding="utf-8"
          ).strip()


          if not content:

              print("❌ 日报内容为空")
              sys.exit(1)


          print()
          print("日报：")
          print(REPORT_PATH)


          # ======================================================
          # Markdown 图片
          #
          # 支持：
          #
          # ![首图](../04_图片/xxx.png)
          #
          # 把 GitHub 仓库里的本地图片转换成：
          #
          # https://raw.githubusercontent.com/
          #     owner/repo/branch/path
          #
          # 这样 Webhook 卡片可以引用公开图片地址。
          # ======================================================

          IMAGE_PATTERN = re.compile(
              r"!\[([^\]]*)\]\(\s*<?([^)>]+)>?\s*\)"
          )


          def local_to_raw_url(raw_path):

              raw_path = raw_path.strip()

              # 已经是 HTTP 图片
              if re.match(
                  r"^https?://",
                  raw_path,
                  re.IGNORECASE,
              ):
                  return raw_path

              raw_path = urllib.parse.unquote(
                  raw_path
              )

              # 相对于 Markdown 文件所在目录
              image_path = (
                  REPORT_PATH.parent
                  / raw_path
              ).resolve()

              # 必须存在
              if not image_path.exists():

                  raise FileNotFoundError(
                      f"图片不存在：{image_path}"
                  )

              if not image_path.is_file():

                  raise RuntimeError(
                      f"图片不是文件：{image_path}"
                  )

              # 转换成仓库相对路径
              repo_root = Path.cwd().resolve()

              try:

                  relative_path = (
                      image_path
                      .relative_to(repo_root)
                  )

              except ValueError:

                  raise RuntimeError(
                      "图片不在 GitHub 仓库目录内："
                      f"{image_path}"
                  )

              raw_url = (
                  "https://raw.githubusercontent.com/"
                  f"{REPOSITORY}/"
                  f"{BRANCH}/"
                  f"{relative_path.as_posix()}"
              )

              return raw_url


          # ======================================================
          # 转换 Markdown 图片
          # ======================================================

          matches = list(
              IMAGE_PATTERN.finditer(content)
          )


          print()
          print(
              f"检测到 Markdown 图片："
              f"{len(matches)} 张"
          )


          converted_images = 0


          def replace_image(match):

              global converted_images

              alt = match.group(1).strip()

              raw_path = match.group(2).strip()

              try:

                  raw_url = local_to_raw_url(
                      raw_path
                  )

              except Exception as exc:

                  print()
                  print(
                      f"❌ 图片解析失败：{raw_path}"
                  )
                  print(
                      f"   {exc}"
                  )

                  raise

              print()
              print("图片：")
              print(f"  ALT : {alt}")
              print(f"  原始: {raw_path}")
              print(f"  URL : {raw_url}")

              converted_images += 1

              return (
                  f"![{alt or '图片'}]"
                  f"({raw_url})"
              )


          converted_content = IMAGE_PATTERN.sub(
              replace_image,
              content,
          )


          # ======================================================
          # 为了测试 Webhook 卡片，
          # 这里保留 Markdown 原始内容。
          #
          # 图片路径已经变
