name: 748686 自生长知识系统｜飞书带图版测试

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feishu-image-test:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. 检查飞书 Webhook
      # ============================================================

      - name: 检查飞书 Webhook
        shell: bash
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          set -e

          echo
          echo "=================================================="
          echo "检查飞书 Webhook"
          echo "=================================================="

          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "❌ FEISHU_WEBHOOK 未配置"
            exit 1
          fi

          echo "✅ FEISHU_WEBHOOK 已配置"


      # ============================================================
      # 3. 检查日报目录
      # ============================================================

      - name: 检查日报目录
        shell: bash
        run: |
          set -e

          echo
          echo "=================================================="
          echo "检查日报目录"
          echo "=================================================="

          DAILY_ROOT="01_自生长知识系统/05_日报"

          if [ ! -d "$DAILY_ROOT" ]; then
            echo "❌ 日报目录不存在：$DAILY_ROOT"
            exit 1
          fi

          echo "✅ 日报目录存在：$DAILY_ROOT"

          echo
          echo "最近日报带图版："

          find "$DAILY_ROOT" -type f -name "*_带图.md" -print \
            | sort \
            | tail -n 20


      # ============================================================
      # 4. 检查周报目录
      # ============================================================

      - name: 检查周报目录
        shell: bash
        run: |
          set -e

          echo
          echo "=================================================="
          echo "检查周报目录"
          echo "=================================================="

          WEEKLY_ROOT="01_自生长知识系统/06_周报"

          if [ ! -d "$WEEKLY_ROOT" ]; then
            echo "⚠️ 周报目录不存在"
            echo "周报发送：SKIP"
            exit 0
          fi

          echo "✅ 周报目录存在：$WEEKLY_ROOT"

          echo
          echo "最近周报带图版："

          find "$WEEKLY_ROOT" -type f -name "*_带图.md" -print \
            | sort \
            | tail -n 20


      # ============================================================
      # 5. 检查图片资源目录
      # ============================================================

      - name: 检查图片资源目录
        shell: bash
        run: |
          set -e

          echo
          echo "=================================================="
          echo "检查图片资源目录"
          echo "=================================================="

          IMAGE_ROOT="01_自生长知识系统/04_图片"

          if [ ! -d "$IMAGE_ROOT" ]; then
            echo "❌ 图片目录不存在：$IMAGE_ROOT"
            exit 1
          fi

          echo
          echo "图片目录："
          echo "$IMAGE_ROOT"

          echo
          echo "最近图片："

          find "$IMAGE_ROOT" -type f -print \
            | grep -Ei '\.(png|jpg|jpeg|webp)$' \
            | sort \
            | tail -n 50 || true


      # ============================================================
      # 6. 找到最新日报带图版
      # ============================================================

      - name: 定位最新日报带图版
        shell: bash
        run: |
          set -e

          DAILY_ROOT="01_自生长知识系统/05_日报"

          DAILY_REPORT="$(
            find "$DAILY_ROOT" \
              -type f \
              -name "*_带图.md" \
              -print \
              | sort \
              | tail -n 1
          )"

          if [ -z "$DAILY_REPORT" ]; then
            echo "❌ 没有找到日报 *_带图.md"
            exit 1
          fi

          echo
          echo "=================================================="
          echo "日报带图版"
          echo "=================================================="

          echo "$DAILY_REPORT"

          echo "DAILY_REPORT=$DAILY_REPORT" >> "$GITHUB_ENV"


      # ============================================================
      # 7. 找到最新周报带图版
      #
      # 周报是可选项：
      # 没有就 SKIP，不失败
      # ============================================================

      - name: 定位最新周报带图版
        shell: bash
        run: |
          set -e

          WEEKLY_ROOT="01_自生长知识系统/06_周报"

          if [ ! -d "$WEEKLY_ROOT" ]; then
            echo "WEEKLY_REPORT="
            echo "WEEKLY_REPORT=" >> "$GITHUB_ENV"
            exit 0
          fi

          WEEKLY_REPORT="$(
            find "$WEEKLY_ROOT" \
              -type f \
              -name "*_带图.md" \
              -print \
              | sort \
              | tail -n 1
          )"

          if [ -z "$WEEKLY_REPORT" ]; then
            echo "⚠️ 没有找到周报 *_带图.md"
            echo "周报发送：SKIP"

            echo "WEEKLY_REPORT=" >> "$GITHUB_ENV"
            exit 0
          fi

          echo
          echo "=================================================="
          echo "周报带图版"
          echo "=================================================="

          echo "$WEEKLY_REPORT"

          echo "WEEKLY_REPORT=$WEEKLY_REPORT" >> "$GITHUB_ENV"


      # ============================================================
      # 8. 检查日报文件
      # ============================================================

      - name: 检查日报文件
        shell: bash
        run: |
          set -e

          echo
          echo "=================================================="
          echo "检查日报文件"
          echo "=================================================="

          if [ ! -f "$DAILY_REPORT" ]; then
            echo "❌ 日报文件不存在：$DAILY_REPORT"
            exit 1
          fi

          if [ ! -s "$DAILY_REPORT" ]; then
            echo "❌ 日报文件为空：$DAILY_REPORT"
            exit 1
          fi

          echo "✅ 日报文件有效"

          echo
          echo "文件大小："
          wc -c "$DAILY_REPORT"


      # ============================================================
      # 9. 检查周报文件
      # ============================================================

      - name: 检查周报文件
        shell: bash
        run: |
          set -e

          if [ -z "$WEEKLY_REPORT" ]; then
            echo "周报：SKIP"
            exit 0
          fi

          echo
          echo "=================================================="
          echo "检查周报文件"
          echo "=================================================="

          if [ ! -f "$WEEKLY_REPORT" ]; then
            echo "⚠️ 周报文件不存在"
            echo "周报：SKIP"
            exit 0
          fi

          if [ ! -s "$WEEKLY_REPORT" ]; then
            echo "⚠️ 周报文件为空"
            echo "周报：SKIP"
            exit 0
          fi

          echo "✅ 周报文件有效"

          echo
          echo "文件大小："
          wc -c "$WEEKLY_REPORT"


      # ============================================================
      # 10. 发送日报带图版
      #
      # 当前阶段：
      # 本地图片 → GitHub Raw URL
      #
      # 暂不使用 Feishu image_key。
      # 先确认：
      # 1. Webhook 正常
      # 2. Markdown 正常
      # 3. 图片路径正确
      # 4. Feishu 卡片能否显示远程图片
      # ============================================================

      - name: 发送日报带图版
        shell: bash
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -e

          echo
          echo "=================================================="
          echo "FEISHU DAILY REPORT"
          echo "=================================================="

          echo
          echo "日报："
          echo "$DAILY_REPORT"

          python - "$DAILY_REPORT" <<'PY'
          import sys
          import os
          import re
          import json
          import urllib.parse
          import urllib.request

          report_path = sys.argv[1]

          webhook = os.environ.get("FEISHU_WEBHOOK", "").strip()
          repository = os.environ.get("GITHUB_REPOSITORY", "").strip()
          branch = os.environ.get("GITHUB_REF_NAME", "").strip()

          if not webhook:
              print("❌ FEISHU_WEBHOOK 未配置")
              sys.exit(1)

          if not repository:
              print("❌ GITHUB_REPOSITORY 不存在")
              sys.exit(1)

          if not branch:
              print("❌ GITHUB_REF_NAME 不存在")
              sys.exit(1)

          if not os.path.isfile(report_path):
              print(f"❌ 日报不存在：{report_path}")
              sys.exit(1)

          print()
          print("读取 Markdown：")
          print(report_path)

          with open(report_path, "r", encoding="utf-8") as f:
              content = f.read()

          image_pattern = re.compile(
              r'!\[([^\]]*)\]\(([^)]+)\)'
          )

          matches = image_pattern.findall(content)

          print()
          print(f"检测到 Markdown 图片：{len(matches)} 张")

          if not matches:
              print("⚠️ 日报中没有检测到 Markdown 图片")
          else:
              for alt, raw_path in matches:

                  raw_path = raw_path.strip()

                  print()
                  print("图片：")
                  print(f"  ALT  : {alt}")
                  print(f"  PATH : {raw_path}")

                  # --------------------------------------------------
                  # 1. 已经是远程 URL
                  # --------------------------------------------------

                  if raw_path.startswith("http://") or raw_path.startswith("https://"):
                      print("  类型 : Remote URL")
                      continue

                  # --------------------------------------------------
                  # 2. 去掉可能存在的 <...>
                  # --------------------------------------------------

                  if raw_path.startswith("<") and raw_path.endswith(">"):
                      raw_path = raw_path[1:-1].strip()

                  # --------------------------------------------------
                  # 3. 图片根目录
                  # --------------------------------------------------

                  image_root = os.path.normpath(
                      "01_自生长知识系统/04_图片"
                  )

                  report_dir = os.path.dirname(
                      os.path.abspath(report_path)
                  )

                  candidate_paths = []

                  # --------------------------------------------------
                  # A. Markdown 文件所在目录相对路径
                  # --------------------------------------------------

                  candidate_paths.append(
                      os.path.normpath(
                          os.path.join(report_dir, raw_path)
                      )
                  )

                  # --------------------------------------------------
                  # B. 如果路径里明确出现 04_图片
                  #    直接从系统图片根目录解析
                  # --------------------------------------------------

                  normalized_raw = raw_path.replace("\\", "/")

                  marker = "04_图片/"

                  if marker in normalized_raw:
                      suffix = normalized_raw.split(marker, 1)[1]

                      candidate_paths.append(
                          os.path.normpath(
                              os.path.join(
                                  image_root,
                                  suffix
                              )
                          )
                      )

                  # --------------------------------------------------
                  # C. 路径组件中出现 04_图片
                  # --------------------------------------------------

                  parts = normalized_raw.split("/")

                  if "04_图片" in parts:
                      index = parts.index("04_图片")
                      suffix = "/".join(parts[index + 1:])

                      candidate_paths.append(
                          os.path.normpath(
                              os.path.join(
                                  image_root,
                                  suffix
                              )
                          )
                      )

                  # --------------------------------------------------
                  # D. 直接把路径最后部分尝试到图片根目录
                  # --------------------------------------------------

                  basename = os.path.basename(normalized_raw)

                  if basename:
                      candidate_paths.append(
                          os.path.normpath(
                              os.path.join(
                                  image_root,
                                  basename
                              )
                          )
                      )

                  # --------------------------------------------------
                  # 找到真实文件
                  # --------------------------------------------------

                  real_path = None

                  for candidate in candidate_paths:
                      if os.path.isfile(candidate):
                          real_path = candidate
                          break

                  if real_path is None:
                      print("  ❌ 图片不存在")

                      print()
                      print("  尝试过的路径：")

                      for candidate in candidate_paths:
                          print(f"    {candidate}")

                      sys.exit(1)

                  print(f"  ✅ 本地图片：{real_path}")

                  # --------------------------------------------------
                  # 转换为仓库相对路径
                  # --------------------------------------------------

                  repo_root = os.path.abspath(".")

                  relative_path = os.path.relpath(
                      os.path.abspath(real_path),
                      repo_root
                  )

                  relative_path = relative_path.replace("\\", "/")

                  # --------------------------------------------------
                  # URL encode
                  # --------------------------------------------------

                  encoded_path = "/".join(
                      urllib.parse.quote(
                          part,
                          safe=""
                      )
                      for part in relative_path.split("/")
                  )

                  raw_url = (
                      "https://raw.githubusercontent.com/"
                      f"{repository}/"
                      f"{urllib.parse.quote(branch, safe='')}/"
                      f"{encoded_path}"
                  )

                  print(f"  🌐 Raw URL：{raw_url}")

                  # --------------------------------------------------
                  # 替换 Markdown 图片地址
                  # --------------------------------------------------

                  old_markdown = f"![{alt}]({raw_path})"
                  new_markdown = f"![{alt}]({raw_url})"

                  content = content.replace(
                      old_markdown,
                      new_markdown
                  )

          # ==========================================================
          # 限制单卡片长度
          # ==========================================================

          MAX_CHARS = 6000

          chunks = []

          while len(content) > MAX_CHARS:
              cut = content.rfind("\n", 0, MAX_CHARS)

              if cut <= 0:
                  cut = MAX_CHARS

              chunks.append(content[:cut])
              content = content[cut:]

          if content:
              chunks.append(content)

          print()
          print(f"最终发送卡片数量：{len(chunks)}")

          # ==========================================================
          # 发送 Feishu Interactive Card
          # ==========================================================

          for index, chunk in enumerate(chunks, start=1):

              title = "748686｜自生长知识系统｜日报｜带图版"

              if len(chunks) > 1:
                  title += f"｜{index}/{len(chunks)}"

              payload = {
                  "msg_type": "interactive",
                  "card": {
                      "header": {
                          "title": {
                              "tag": "plain_text",
                              "content": title
                          },
                          "template": "blue"
                      },
                      "elements": [
                          {
                              "tag": "markdown",
                              "content": chunk
                          }
                      ]
                  }
              }

              data = json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8")

              request = urllib.request.Request(
                  webhook,
                  data=data,
                  headers={
                      "Content-Type":
                          "application/json; charset=utf-8"
                  },
                  method="POST"
              )

              print()
              print(
                  f"正在发送日报卡片 "
                  f"{index}/{len(chunks)} ..."
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      status = response.status
                      body = response.read().decode(
                          "utf-8",
                          errors="replace"
                      )

              except Exception as e:
                  print(f"❌ 飞书请求失败：{e}")
                  sys.exit(1)

              print(f"HTTP Status: {status}")
              print(f"Response: {body}")

              if status != 200:
                  print("❌ 飞书 HTTP 请求失败")
                  sys.exit(1)

              try:
                  result = json.loads(body)
              except Exception:
                  print("❌ 飞书返回内容不是 JSON")
                  sys.exit(1)

              code = result.get("code")

              if code != 0:
                  print("❌ 飞书接口返回错误")
                  print(json.dumps(
                      result,
                      ensure_ascii=False,
                      indent=2
                  ))
                  sys.exit(1)

              print("✅ 日报卡片发送成功")

          print()
          print("==================================================")
          print("日报发送完成")
          print("==================================================")
          PY


      # ============================================================
      # 11. 发送周报带图版
      #
      # 周报没有则 SKIP
      # ============================================================

      - name: 发送周报带图版
        shell: bash
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -e

          if [ -z "$WEEKLY_REPORT" ]; then
            echo
            echo "=================================================="
            echo "FEISHU WEEKLY REPORT"
            echo "=================================================="
            echo "⚠️ 没有周报带图版"
            echo "周报发送：SKIP"
            exit 0
          fi

          echo
          echo "=================================================="
          echo "FEISHU WEEKLY REPORT"
          echo "=================================================="

          echo
          echo "周报："
          echo "$WEEKLY_REPORT"

          python - "$WEEKLY_REPORT" <<'PY'
          import sys
          import os
          import re
          import json
          import urllib.parse
          import urllib.request

          report_path = sys.argv[1]

          webhook = os.environ.get("FEISHU_WEBHOOK", "").strip()
          repository = os.environ.get("GITHUB_REPOSITORY", "").strip()
          branch = os.environ.get("GITHUB_REF_NAME", "").strip()

          if not webhook:
              print("❌ FEISHU_WEBHOOK 未配置")
              sys.exit(1)

          if not os.path.isfile(report_path):
              print(f"⚠️ 周报不存在：{report_path}")
              sys.exit(0)

          with open(report_path, "r", encoding="utf-8") as f:
              content = f.read()

          image_pattern = re.compile(
              r'!\[([^\]]*)\]\(([^)]+)\)'
          )

          matches = image_pattern.findall(content)

          print()
          print(f"检测到 Markdown 图片：{len(matches)} 张")

          image_root = os.path.normpath(
              "01_自生长知识系统/04_图片"
          )

          report_dir = os.path.dirname(
              os.path.abspath(report_path)
          )

          for alt, raw_path in matches:

              raw_path = raw_path.strip()

              if raw_path.startswith("http://") or raw_path.startswith("https://"):
                  continue

              if raw_path.startswith("<") and raw_path.endswith(">"):
                  raw_path = raw_path[1:-1].strip()

              normalized_raw = raw_path.replace("\\", "/")

              candidate_paths = []

              # ----------------------------------------------
              # A. Markdown 相对路径
              # ----------------------------------------------

              candidate_paths.append(
                  os.path.normpath(
                      os.path.join(
                          report_dir,
                          raw_path
                      )
                  )
              )

              # ----------------------------------------------
              # B. 04_图片 路径
              # ----------------------------------------------

              marker = "04_图片/"

              if marker in normalized_raw:
                  suffix = normalized_raw.split(
                      marker,
                      1
                  )[1]

                  candidate_paths.append(
                      os.path.normpath(
                          os.path.join(
                              image_root,
                              suffix
                          )
                      )
                  )

              # ----------------------------------------------
              # C. 路径组件
              # ----------------------------------------------

              parts = normalized_raw.split("/")

              if "04_图片" in parts:
                  index = parts.index("04_图片")

                  suffix = "/".join(
                      parts[index + 1:]
                  )

                  candidate_paths.append(
                      os.path.normpath(
                          os.path.join(
                              image_root,
                              suffix
                          )
                      )
                  )

              # ----------------------------------------------
              # D. 文件名兜底
              # ----------------------------------------------

              basename = os.path.basename(
                  normalized_raw
              )

              if basename:
                  candidate_paths.append(
                      os.path.normpath(
                          os.path.join(
                              image_root,
                              basename
                          )
                      )
                  )

              real_path = None

              for candidate in candidate_paths:
                  if os.path.isfile(candidate):
                      real_path = candidate
                      break

              if real_path is None:
                  print(
                      f"⚠️ 图片不存在，保留原 Markdown："
                      f"{raw_path}"
                  )
                  continue

              relative_path = os.path.relpath(
                  os.path.abspath(real_path),
                  os.path.abspath(".")
              ).replace("\\", "/")

              encoded_path = "/".join(
                  urllib.parse.quote(
                      part,
                      safe=""
                  )
                  for part in relative_path.split("/")
              )

              raw_url = (
                  "https://raw.githubusercontent.com/"
                  f"{repository}/"
                  f"{urllib.parse.quote(branch, safe='')}/"
                  f"{encoded_path}"
              )

              old_markdown = f"![{alt}]({raw_path})"
              new_markdown = f"![{alt}]({raw_url})"

              content = content.replace(
                  old_markdown,
                  new_markdown
              )

              print()
              print(f"✅ 图片：{real_path}")
              print(f"🌐 URL：{raw_url}")

          # ==========================================================
          # 卡片拆分
          # ==========================================================

          MAX_CHARS = 6000

          chunks = []

          while len(content) > MAX_CHARS:

              cut = content.rfind(
                  "\n",
                  0,
                  MAX_CHARS
              )

              if cut <= 0:
                  cut = MAX_CHARS

              chunks.append(
                  content[:cut]
              )

              content = content[cut:]

          if content:
              chunks.append(content)

          print()
          print(f"最终发送卡片数量：{len(chunks)}")

          # ==========================================================
          # Feishu
          # ==========================================================

          for index, chunk in enumerate(
              chunks,
              start=1
          ):

              title = (
                  "748686｜自生长知识系统｜"
                  "周报｜带图版"
              )

              if len(chunks) > 1:
                  title += (
                      f"｜{index}/{len(chunks)}"
                  )

              payload = {
                  "msg_type": "interactive",
                  "card": {
                      "header": {
                          "title": {
                              "tag": "plain_text",
                              "content": title
                          },
                          "template": "green"
                      },
                      "elements": [
                          {
                              "tag": "markdown",
                              "content": chunk
                          }
                      ]
                  }
              }

              data = json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8")

              request = urllib.request.Request(
                  webhook,
                  data=data,
                  headers={
                      "Content-Type":
                          "application/json; charset=utf-8"
                  },
                  method="POST"
              )

              print()
              print(
                  f"正在发送周报卡片 "
                  f"{index}/{len(chunks)} ..."
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      status = response.status

                      body = response.read().decode(
                          "utf-8",
                          errors="replace"
                      )

              except Exception as e:
                  print(
                      f"⚠️ 飞书请求失败：{e}"
                  )
                  sys.exit(1)

              print(f"HTTP Status: {status}")
              print(f"Response: {body}")

              if status != 200:
                  print(
                      "❌ 飞书 HTTP 请求失败"
                  )
                  sys.exit(1)

              try:
                  result = json.loads(body)
              except Exception:
                  print(
                      "❌ 飞书返回内容不是 JSON"
                  )
                  sys.exit(1)

              code = result.get("code")

              if code != 0:
                  print(
                      "❌ 飞书接口返回错误"
                  )

                  print(
                      json.dumps(
                          result,
                          ensure_ascii=False,
                          indent=2
                      )
                  )

                  sys.exit(1)

              print(
