name: 748686 飞书日报周报带图卡片测试

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  feishu-report-test:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout 748686obsidian
        uses: actions/checkout@v4

      # ==========================================================
      # 2. 检查飞书 Webhook
      #
      # 只使用已经验证成功的：
      #
      #     FEISHU_WEBHOOK
      #
      # 不需要：
      #
      #     FEISHU_APP_ID
      #     FEISHU_APP_SECRET
      # ==========================================================

      - name: 检查飞书 Webhook
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          set -e

          echo
          echo "=================================================="
          echo "检查飞书 Webhook"
          echo "=================================================="

          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "❌ FEISHU_WEBHOOK 未配置"
            exit 1
          fi

          echo "✅ FEISHU_WEBHOOK 已配置"

      # ==========================================================
      # 3. 检查日报 / 周报目录
      # ==========================================================

      - name: 检查日报周报目录
        run: |
          set -e

          echo
          echo "=================================================="
          echo "检查日报周报实际文件"
          echo "=================================================="

          echo
          echo "【05_日报】"

          if [ -d "01_自生长知识系统/05_日报" ]; then

            find \
              "01_自生长知识系统/05_日报" \
              -type f \
              -name "*.md" \
              -print \
              | sort \
              | tail -n 30

          else

            echo "⚠ 日报目录不存在"

          fi

          echo
          echo "【06_周报】"

          if [ -d "01_自生长知识系统/06_周报" ]; then

            find \
              "01_自生长知识系统/06_周报" \
              -type f \
              -name "*.md" \
              -print \
              | sort \
              | tail -n 30

          else

            echo "⚠ 周报目录不存在"

          fi

      # ==========================================================
      # 4. 检查图片目录
      #
      # 这一步专门帮助确认：
      #
      # 01_自生长知识系统/04_图片
      #
      # 是否存在真正的 PNG。
      # ==========================================================

      - name: 检查带图资源目录
        run: |
          set -e

          echo
          echo "=================================================="
          echo "检查图片资源目录"
          echo "=================================================="

          IMAGE_ROOT="01_自生长知识系统/04_图片"

          if [ ! -d "$IMAGE_ROOT" ]; then

            echo "❌ 图片目录不存在：$IMAGE_ROOT"
            exit 1

          fi

          echo
          echo "图片目录："
          echo "$IMAGE_ROOT"

          echo
          echo "最近 PNG："

          find "$IMAGE_ROOT" \
            -type f \
            $begin:math:text$ \\
              \-iname \"\*\.png\" \\
              \-o \\
              \-iname \"\*\.jpg\" \\
              \-o \\
              \-iname \"\*\.jpeg\" \\
              \-o \\
              \-iname \"\*\.webp\" \\
            $end:math:text$ \
            -print \
            | sort \
            | tail -n 50

      # ==========================================================
      # 5. 查找最新带图日报
      #
      # 日报必须存在。
      # ==========================================================

      - name: 查找最新带图日报
        id: find_daily
        run: |
          set -e

          DAILY_DIR="01_自生长知识系统/05_日报"

          echo
          echo "=================================================="
          echo "查找最新带图日报"
          echo "=================================================="

          if [ ! -d "$DAILY_DIR" ]; then

            echo "❌ 日报目录不存在：$DAILY_DIR"
            exit 1

          fi

          DAILY_REPORT=$(
            find "$DAILY_DIR" \
              -type f \
              -name "*_带图.md" \
              -print \
              | sort \
              | tail -n 1
          )

          if [ -z "$DAILY_REPORT" ]; then

            echo "❌ 没有找到 *_带图.md 日报"

            echo
            echo "当前日报 Markdown："

            find "$DAILY_DIR" \
              -type f \
              -name "*.md" \
              -print \
              | sort

            exit 1

          fi

          echo
          echo "✅ 找到最新带图日报："
          echo "$DAILY_REPORT"

          echo "daily_report=$DAILY_REPORT" \
            >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 6. 查找最新带图周报
      #
      # 周报可选。
      # ==========================================================

      - name: 查找最新带图周报
        id: find_weekly
        run: |
          set -e

          WEEKLY_DIR="01_自生长知识系统/06_周报"

          echo
          echo "=================================================="
          echo "查找最新带图周报"
          echo "=================================================="

          if [ ! -d "$WEEKLY_DIR" ]; then

            echo "⚠ 周报目录不存在"
            echo "⚠ 本次跳过周报发送"

            echo "weekly_report=" >> "$GITHUB_OUTPUT"
            echo "weekly_status=SKIPPED" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          WEEKLY_REPORT=$(
            find "$WEEKLY_DIR" \
              -type f \
              -name "*_带图.md" \
              -print \
              | sort \
              | tail -n 1
          )

          if [ -z "$WEEKLY_REPORT" ]; then

            echo "⚠ 没有找到 *_带图.md 周报"
            echo "⚠ 本次跳过周报发送"

            echo "weekly_report=" >> "$GITHUB_OUTPUT"
            echo "weekly_status=SKIPPED" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          echo
          echo "✅ 找到最新带图周报："
          echo "$WEEKLY_REPORT"

          echo "weekly_report=$WEEKLY_REPORT" \
            >> "$GITHUB_OUTPUT"

          echo "weekly_status=FOUND" \
            >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 7. 确认文件
      # ==========================================================

      - name: 确认带图日报周报
        env:
          DAILY_REPORT: ${{ steps.find_daily.outputs.daily_report }}
          WEEKLY_REPORT: ${{ steps.find_weekly.outputs.weekly_report }}
          WEEKLY_STATUS: ${{ steps.find_weekly.outputs.weekly_status }}
        run: |
          set -e

          echo
          echo "=================================================="
          echo "748686 飞书日报周报带图卡片测试"
          echo "=================================================="

          echo
          echo "【日报】"
          echo "$DAILY_REPORT"

          if [ ! -s "$DAILY_REPORT" ]; then
            echo "❌ 日报文件为空"
            exit 1
          fi

          wc -c "$DAILY_REPORT"

          echo
          echo "【周报】"

          if [ "$WEEKLY_STATUS" = "FOUND" ]; then

            echo "$WEEKLY_REPORT"

            if [ ! -s "$WEEKLY_REPORT" ]; then
              echo "❌ 周报文件为空"
              exit 1
            fi

            wc -c "$WEEKLY_REPORT"

          else

            echo "⏭ SKIPPED"

          fi

      # ==========================================================
      # 8. 发送带图日报
      #
      # 核心：
      #
      # Markdown 图片
      #       ↓
      # 查找真实 PNG
      #       ↓
      # 转换 GitHub Raw URL
      #       ↓
      # Interactive Card
      #       ↓
      # FEISHU_WEBHOOK
      #
      # 不需要 APP_ID / APP_SECRET。
      # ==========================================================

      - name: 发送带图日报到飞书
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DAILY_REPORT: ${{ steps.find_daily.outputs.daily_report }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -e

          echo
          echo "=================================================="
          echo "FEISHU DAILY REPORT"
          echo "=================================================="

          python - "$DAILY_REPORT" <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request
          from pathlib import Path


          REPORT_PATH = Path(sys.argv[1]).resolve()

          WEBHOOK = os.environ["FEISHU_WEBHOOK"]

          REPOSITORY = os.environ["GITHUB_REPOSITORY"]

          BRANCH = os.environ["GITHUB_REF_NAME"]

          REPO_ROOT = Path.cwd().resolve()

          KNOWLEDGE_ROOT = (
              REPO_ROOT
              / "01_自生长知识系统"
          )

          IMAGE_ROOT = (
              KNOWLEDGE_ROOT
              / "04_图片"
          )


          print()
          print("日报：")
          print(REPORT_PATH)

          print()
          print("仓库根目录：")
          print(REPO_ROOT)

          print()
          print("知识系统目录：")
          print(KNOWLEDGE_ROOT)

          print()
          print("图片根目录：")
          print(IMAGE_ROOT)


          if not REPORT_PATH.exists():
              raise FileNotFoundError(
                  f"日报不存在：{REPORT_PATH}"
              )


          content = REPORT_PATH.read_text(
              encoding="utf-8"
          ).strip()


          if not content:
              raise RuntimeError(
                  "日报内容为空"
              )


          # ======================================================
          # Markdown 图片
          # ======================================================

          IMAGE_PATTERN = re.compile(
              r"!$begin:math:display$\(\[\^$end:math:display$]*)\]"
              r"$begin:math:text$\\s\*\<\?\(\[\^\)\>\]\+\)\>\?\\s\*$end:math:text$"
          )


          matches = list(
              IMAGE_PATTERN.finditer(content)
          )


          print()
          print(
              f"检测到 Markdown 图片："
              f"{len(matches)} 张"
          )


          # ======================================================
          # 图片路径解析
          #
          # 第一优先：
          #
          # 1. 相对于 Markdown 文件解析
          #
          # 第二优先：
          #
          # 2. 如果 Markdown 写法是：
          #
          #    ../04_图片/...
          #
          #    则按照知识系统图片目录解析。
          #
          # ======================================================

          def resolve_image_path(raw_path):

              raw_path = raw_path.strip()

              raw_path = urllib.parse.unquote(
                  raw_path
              )

              # 去掉可能存在的 < >
              raw_path = raw_path.strip("<>")


              # --------------------------------------------------
              # HTTP / HTTPS
              # --------------------------------------------------

              if re.match(
                  r"^https?://",
                  raw_path,
                  re.IGNORECASE,
              ):
                  return None


              # --------------------------------------------------
              # 绝对路径
              # --------------------------------------------------

              path = Path(raw_path)

              if path.is_absolute():

                  if path.exists():

                      return path.resolve()


              # --------------------------------------------------
              # 方案 A：
              # 相对于 Markdown 文件
              # --------------------------------------------------

              candidate_a = (
                  REPORT_PATH.parent
                  / raw_path
              ).resolve()


              if candidate_a.exists():

                  return candidate_a


              # --------------------------------------------------
              # 方案 B：
              # 以 04_图片 为根目录
              #
              # 例如：
              #
              # ../04_图片/2026-09-21/首图.png
              #
              # 解析为：
              #
              # 01_自生长知识系统/
              # └── 04_图片/
              #     └── 2026-09-21/
              #         └── 首图.png
              # --------------------------------------------------

              normalized = raw_path.replace(
                  "\\",
                  "/"
              )

              marker = "04_图片/"

              if marker in normalized:

                  suffix = normalized.split(
                      marker,
                      1
                  )[1]

                  candidate_b = (
                      IMAGE_ROOT
                      / suffix
                  ).resolve()

                  if candidate_b.exists():

                      return candidate_b


              # --------------------------------------------------
              # 方案 C：
              # 只取 04_图片 后面的部分
              # --------------------------------------------------

              parts = Path(
                  normalized
              ).parts

              if "04_图片" in parts:

                  index = parts.index(
                      "04_图片"
                  )

                  suffix_parts = parts[
                      index + 1:
                  ]

                  candidate_c = (
                      IMAGE_ROOT
                      / Path(
                          *suffix_parts
                      )
                  ).resolve()

                  if candidate_c.exists():

                      return candidate_c


              # --------------------------------------------------
              # 最终失败
              # --------------------------------------------------

              print()
              print("❌ 图片无法解析")

              print(
                  "原始路径：",
                  raw_path
              )

              print(
                  "尝试路径 A：",
                  candidate_a
              )

              print(
                  "图片根目录：",
                  IMAGE_ROOT
              )

              raise FileNotFoundError(
                  f"图片不存在：{raw_path}"
              )


          # ======================================================
          # GitHub Raw URL
          # ======================================================

          def image_to_raw_url(image_path):

              image_path = image_path.resolve()


              try:

                  relative_path = (
                      image_path
                      .relative_to(REPO_ROOT)
                  )

              except ValueError:

                  raise RuntimeError(
                      "图片不在 GitHub 仓库目录内："
                      f"{image_path}"
                  )


              encoded_parts = []

              for part in relative_path.parts:

                  encoded_parts.append(
                      urllib.parse.quote(
                          part,
                          safe=""
                      )
                  )


              relative_url = "/".join(
                  encoded_parts
              )


              return (
                  "https://raw.githubusercontent.com/"
                  f"{REPOSITORY}/"
                  f"{BRANCH}/"
                  f"{relative_url}"
              )


          # ======================================================
          # 替换图片
          # ======================================================

          converted_images = 0


          def replace_image(match):

              nonlocal_dummy = None

              alt = match.group(1).strip()

              raw_path = match.group(2).strip()


              print()
              print(
                  "------------------------------------------"
              )

              print(
                  "发现图片："
              )

              print(
                  "ALT :",
                  alt
              )

              print(
                  "PATH:",
                  raw_path
              )


              image_path = resolve_image_path(
                  raw_path
              )


              # --------------------------------------------------
              # 远程图片
              # --------------------------------------------------

              if image_path is None:

                  print(
                      "类型：远程图片"
                  )

                  return match.group(0)


              print(
                  "本地文件："
              )

              print(
                  image_path
              )


              if not image_path.is_file():

                  raise RuntimeError(
                      f"图片不是文件：{image_path}"
                  )


              size = image_path.stat().st_size


              if size <= 0:

                  raise RuntimeError(
                      f"图片为空：{image_path}"
                  )


              raw_url = image_to_raw_url(
                  image_path
              )


              print(
                  "文件大小：",
                  size,
                  "bytes"
              )

              print(
                  "Raw URL："
              )

              print(
                  raw_url
              )


              nonlocal_dummy = None


              return (
                  f"![{alt or '图片'}]"
                  f"({raw_url})"
              )


          converted_content = (
              IMAGE_PATTERN.sub(
                  replace_image,
                  content,
              )
          )


          converted_images = len(
              [
                  match
                  for match in IMAGE_PATTERN.finditer(
                      content
                  )
                  if match
              ]
          )


          print()
          print(
              "=================================================="
          )

          print(
              "图片路径转换完成"
          )

          print(
              f"Markdown 图片数量："
              f"{len(matches)}"
          )

          print(
              "=================================================="
          )


          # ======================================================
          # Card Markdown 长度限制
          # ======================================================

          MAX_CHARS = 6000


          chunks = []

          remaining = converted_content


          while len(remaining) > MAX_CHARS:

              cut = remaining.rfind(
                  "\n",
                  0,
                  MAX_CHARS,
              )


              if cut <= 0:

                  cut = MAX_CHARS


              chunks.append(
                  remaining[:cut]
              )


              remaining = (
                  remaining[cut:]
                  .lstrip()
              )


          if remaining:

              chunks.append(
                  remaining
              )


          if not chunks:

              chunks = [
                  "带图日报内容为空。"
              ]


          # ======================================================
          # 发送飞书
          # ======================================================

          print()
          print(
              f"最终日报卡片数量："
              f"{len(chunks)}"
          )


          for index, chunk in enumerate(
              chunks,
              start=1,
          ):


              if len(chunks) == 1:

                  title = (
                      "748686｜自生长知识系统"
                      "｜日报｜带图版"
                  )

              else:

                  title = (
                      "748686｜自生长知识系统"
                      "｜日报｜带图版"
                      f"｜第 {index}/{len(chunks)} 部分"
                  )


              payload = {

                  "msg_type": "interactive",

                  "card": {

                      "header": {

                          "title": {

                              "tag": "plain_text",

                              "content": title,

                          },

                          "template": "blue",

                      },

                      "elements": [

                          {

                              "tag": "markdown",

                              "content": chunk,

                          }

                      ],

                  },

              }


              data = json.dumps(
                  payload,
                  ensure_ascii=False,
              ).encode(
                  "utf-8"
              )


              request = (
                  urllib.request.Request(
                      WEBHOOK,
                      data=data,
                      headers={
                          "Content-Type":
                              "application/json; "
                              "charset=utf-8"
                      },
                      method="POST",
                  )
              )


              print()
              print(
                  f"发送日报卡片 "
                  f"{index}/{len(chunks)}"
              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=60,
                  ) as response:

                      status = (
                          response.status
                      )

                      body = (
                          response.read()
                          .decode("utf-8")
                      )

              except Exception as exc:

                  print()
                  print(
                      "❌ 飞书 Webhook 请求失败"
                  )

                  print(
                      repr(exc)
                  )

                  raise


              print(
                  "HTTP:",
                  status
              )


              try:

                  result = json.loads(
                      body
                  )

              except Exception:

                  print(body)

                  raise RuntimeError(
                      "飞书 Webhook 返回非 JSON"
                  )


              print(
                  json.dumps(
                      result,
                      ensure_ascii=False,
                      indent=2,
                  )
              )


              if status != 200:

                  raise RuntimeError(
                      "飞书日报 HTTP 发送失败"
                  )


              if result.get("code") != 0:

                  raise RuntimeError(
                      "飞书日报发送失败"
                  )


              print(
                  f"✅ 日报卡片 "
                  f"{index}/{len(chunks)} "
                  f"发送成功"
              )


          print()
          print(
              "=================================================="
          )

          print(
              "✅ 带图日报发送完成"
          )

          print(
              f"   Markdown 图片："
              f"{len(matches)} 张"
          )

          print(
              f"   卡片数量："
              f"{len(chunks)} 张"
          )

          print(
              "=================================================="

          )
          PY

      # ==========================================================
      # 9. 发送带图周报
      #
      # 周报不存在：
      #
      #     SKIP
      #
      # 不失败。
      # ==========================================================

      - name: 发送带图周报到飞书
        if: steps.find_weekly.outputs.weekly_status == 'FOUND'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WEEKLY_REPORT: ${{ steps.find_weekly.outputs.weekly_report }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -e

          echo
          echo "=================================================="
          echo "FEISHU WEEKLY REPORT"
          echo "=================================================="

          python - "$WEEKLY_REPORT" <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request
          from pathlib import Path


          REPORT_PATH = Path(sys.argv[1]).resolve()

          WEBHOOK = os.environ["FEISHU_WEBHOOK"]

          REPOSITORY = os.environ["GITHUB_REPOSITORY"]

          BRANCH = os.environ["GITHUB_REF_NAME"]

          REPO_ROOT = Path.cwd().resolve()

          KNOWLEDGE_ROOT = (
              REPO_ROOT
              / "01_自生长知识系统"
          )

          IMAGE_ROOT = (
              KNOWLEDGE_ROOT
              / "04_图片"
          )


          print()
          print("周报：")
          print(REPORT_PATH)


          if not REPORT_PATH.exists():

              raise FileNotFoundError(
                  f"周报不存在：{REPORT_PATH}"
              )


          content = REPORT_PATH.read_text(
              encoding="utf-8"
          ).strip()


          if not content:

              raise RuntimeError(
                  "周报内容为空"
              )


          IMAGE_PATTERN = re.compile(
              r"!$begin:math:display$\(\[\^$end:math:display$]*)\]"
              r"$begin:math:text$\\s\*\<\?\(\[\^\)\>\]\+\)\>\?\\s\*$end:math:text$"
          )


          matches = list(
              IMAGE_PATTERN.finditer(content)
          )


          print()
          print(
              f"检测到 Markdown 图片："
              f"{len(matches)} 张"
          )


          def resolve_image_path(raw_path):

              raw_path = raw_path.strip()

              raw_path = urllib.parse.unquote(
                  raw_path
              )

              raw_path = raw_path.strip(
                  "<>"
              )


              if re.match(
                  r"^https?://",
                  raw_path,
                  re.IGNORECASE,
              ):

                  return None


              path = Path(raw_path)


              if path.is_absolute():

                  if path.exists():

                      return path.resolve()


              candidate_a = (
                  REPORT_PATH.parent
                  / raw_path
              ).resolve()


              if candidate_a.exists():

                  return candidate_a


              normalized = raw_path.replace(
                  "\\",
                  "/"
              )


              marker = "04_图片/"


              if marker in normalized:

                  suffix = normalized.split(
                      marker,
                      1
                  )[1]


                  candidate_b = (
                      IMAGE_ROOT
                      / suffix
                  ).resolve()


                  if candidate_b.exists():

                      return candidate_b


              parts = Path(
                  normalized
              ).parts


              if "04_图片" in parts:

                  index = parts.index(
                      "04_图片"
                  )


                  suffix_parts = parts[
                      index + 1:
                  ]


                  candidate_c = (
                      IMAGE_ROOT
                      / Path(
                          *suffix_parts
                      )
                  ).resolve()


                  if candidate_c.exists():

                      return candidate_c


              raise FileNotFoundError(
                  f"图片不存在：{raw_path}"
              )


          def image_to_raw_url(image_path):

              image_path = image_path.resolve()


              try:

                  relative_path = (
                      image_path
                      .relative_to(REPO_ROOT)
                  )

              except ValueError:

                  raise RuntimeError(
                      "图片不在 GitHub 仓库目录内："
                      f"{image_path}"
                  )


              encoded_parts = []


              for part in relative_path.parts:

                  encoded_parts.append(
                      urllib.parse.quote(
                          part,
                          safe=""
                      )
                  )


              relative_url = "/".join(
                  encoded_parts
              )


              return (
                  "https://raw.githubusercontent.com/"
                  f"{REPOSITORY}/"
                  f"{BRANCH}/"
                  f"{relative_url}"
              )


          def replace_image(match):

              alt = match.group(1).strip()

              raw_path = match.group(2).strip()


              print()
              print(
                  "图片："
              )

              print(
                  "  ALT :",
                  alt
              )

              print(
                  "  PATH:",
                  raw_path
              )


              image_path = resolve_image_path(
                  raw_path
              )


              if image_path is None:

                  return match.group(0)


              print(
                  "  FILE:",
                  image_path
              )


              size = image_path.stat().st_size


              if size <= 0:

                  raise RuntimeError(
                      f"图片为空：{image_path}"
                  )


              raw_url = image_to_raw_url(
                  image_path
              )


              print(
                  "  SIZE:",
                  size,
                  "bytes"
              )

              print(
                  "  URL :",
                  raw_url
              )


              return (
                  f"![{alt or '图片'}]"
                  f"({raw_url})"
              )


          converted_content = (
              IMAGE_PATTERN.sub(
                  replace_image,
                  content,
              )
          )


          MAX_CHARS = 6000


          chunks = []

          remaining = converted_content


          while len(remaining) > MAX_CHARS:

              cut = remaining.rfind(
                  "\n",
                  0,
                  MAX_CHARS,
              )


              if cut <= 0:

                  cut = MAX_CHARS


              chunks.append(
                  remaining[:cut]
              )


              remaining = (
                  remaining[cut:]
                  .lstrip()
              )


          if remaining:

              chunks.append(
                  remaining
              )


          if not chunks:

              chunks = [
                  "带图周报内容为空。"
              ]


          total = len(chunks)


          print()
          print(
              f"最终周报卡片数量：{total}"
          )


          for index, chunk in enumerate(
              chunks,
              start=1,
          ):


              if total == 1:

                  title = (
                      "748686｜自生长知识系统"
                      "｜周报｜带图版"
                  )

              else:

                  title = (
                      "748686｜自生长知识系统"
                      "｜周报｜带图版"
                      f"｜第 {index}/{total} 部分"
                  )


              payload = {

                  "msg_type": "interactive",

                  "card": {

                      "header": {

                          "title": {

                              "tag": "plain_text",

                              "content": title,

                          },

                          "template": "green",

                      },

                      "elements": [

                          {

                              "tag": "markdown",

                              "content": chunk,

                          }

                      ],

                  },

              }


              data = json.dumps(
                  payload,
                  ensure_ascii=False,
              ).encode(
                  "utf-8"
              )


              request = (
                  urllib.request.Request(
                      WEBHOOK,
                      data=data,
                      headers={
                          "Content-Type":
                              "application/json; "
                              "charset=utf-8"
                      },
                      method="POST",
                  )
              )


              print()
              print(
                  f"发送周报卡片 "
                  f"{index}/{total}"
              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=60,
                  ) as response:

                      status = response.status

                      body = (
                          response.read()
                          .decode("utf-8")
                      )

              except Exception as exc:

                  print(
                      "❌ 飞书 Webhook 请求失败"
                  )

                  print(
                      repr(exc)
                  )

                  raise


              print(
                  "HTTP:",
                  status
              )


              try:

                  result = json.loads(
                      body
                  )

              except Exception:

                  print(body)

                  raise RuntimeError(
                      "飞书 Webhook 返回非 JSON"
                  )


              print(
                  json.dumps(
                      result,
                      ensure_ascii=False,
                      indent=2,
                  )
              )


              if status != 200:

                  raise RuntimeError(
                      "飞书周报 HTTP 发送失败"
                  )


              if result.get("code") != 0:

                  raise RuntimeError(
                      "飞书周报发送失败"
                  )


              print(
                  f"✅ 周报卡片 "
                  f"{index}/{total} "
                  f"发送成功"
              )


          print()
          print(
              "=================================================="
          )

          print(
              "✅ 带图周报发送完成"
          )

          print(
              f"   Markdown 图片："
              f"{len(matches)} 张"
          )

          print(
              f"   卡片数量："
              f"{total} 张"
          )

          print(
              "=================================================="
          )
          PY

