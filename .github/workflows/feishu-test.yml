name: 748686 飞书日报周报带图卡片测试

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  feishu-report-test:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout 748686obsidian
      # ==========================================================

      - name: Checkout 748686obsidian
        uses: actions/checkout@v4

      # ==========================================================
      # 2. 检查 FEISHU_WEBHOOK
      # ==========================================================

      - name: 检查 FEISHU_WEBHOOK
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          set -e

          echo
          echo "=========================================="
          echo "检查 FEISHU_WEBHOOK"
          echo "=========================================="

          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "❌ FEISHU_WEBHOOK 未配置"
            exit 1
          fi

          echo "✅ FEISHU_WEBHOOK 已配置"

      # ==========================================================
      # 3. 查找最新带图日报
      # ==========================================================

      - name: 查找最新带图日报
        id: find_daily
        run: |
          set -e

          DAILY_DIR="01_自生长知识系统/05_日报"

          echo
          echo "=========================================="
          echo "查找最新带图日报"
          echo "=========================================="

          if [ ! -d "$DAILY_DIR" ]; then
            echo "❌ 日报目录不存在：$DAILY_DIR"
            exit 1
          fi

          DAILY_REPORT=$(find "$DAILY_DIR" \
            -type f \
            -name "*_带图.md" \
            | sort \
            | tail -n 1)

          if [ -z "$DAILY_REPORT" ]; then
            echo "❌ 没有找到 *_带图.md 日报"
            exit 1
          fi

          echo "✅ 找到最新带图日报："
          echo "$DAILY_REPORT"

          echo "daily_report=$DAILY_REPORT" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 4. 查找最新带图周报
      # ==========================================================

      - name: 查找最新带图周报
        id: find_weekly
        run: |
          set -e

          WEEKLY_DIR="01_自生长知识系统/06_周报"

          echo
          echo "=========================================="
          echo "查找最新带图周报"
          echo "=========================================="

          if [ ! -d "$WEEKLY_DIR" ]; then
            echo "❌ 周报目录不存在：$WEEKLY_DIR"
            exit 1
          fi

          WEEKLY_REPORT=$(find "$WEEKLY_DIR" \
            -type f \
            -name "*_带图.md" \
            | sort \
            | tail -n 1)

          if [ -z "$WEEKLY_REPORT" ]; then
            echo "❌ 没有找到 *_带图.md 周报"
            exit 1
          fi

          echo "✅ 找到最新带图周报："
          echo "$WEEKLY_REPORT"

          echo "weekly_report=$WEEKLY_REPORT" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 5. 确认测试文件
      # ==========================================================

      - name: 确认带图日报周报
        env:
          DAILY_REPORT: ${{ steps.find_daily.outputs.daily_report }}
          WEEKLY_REPORT: ${{ steps.find_weekly.outputs.weekly_report }}
        run: |
          set -e

          echo
          echo "=================================================="
          echo "748686 飞书日报周报带图卡片测试"
          echo "=================================================="

          echo
          echo "日报："
          echo "$DAILY_REPORT"

          echo
          echo "周报："
          echo "$WEEKLY_REPORT"

          echo
          echo "日报大小："
          wc -c "$DAILY_REPORT"

          echo
          echo "周报大小："
          wc -c "$WEEKLY_REPORT"

          echo
          echo "=================================================="

      # ==========================================================
      # 6. 发送带图日报
      #
      # 直接读取 *_带图.md
      # 不再读取普通日报
      # 不再重新生成日报内容
      # ==========================================================

      - name: 发送带图日报到飞书
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DAILY_REPORT: ${{ steps.find_daily.outputs.daily_report }}
        run: |
          set -e

          echo
          echo "=========================================="
          echo "FEISHU DAILY REPORT — 带图版"
          echo "=========================================="

          if [ ! -f "$DAILY_REPORT" ]; then
            echo "❌ 带图日报文件不存在：$DAILY_REPORT"
            exit 1
          fi

          python - "$DAILY_REPORT" > /tmp/feishu_daily_cards.jsonl <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              content = f.read().strip()

          title = "748686｜自生长知识系统｜日报｜带图版"

          MAX_CHARS = 7000

          paragraphs = content.split("\n\n")

          chunks = []
          current = ""

          for paragraph in paragraphs:

              paragraph = paragraph.strip()

              if not paragraph:
                  continue

              candidate = (
                  current + "\n\n" + paragraph
                  if current
                  else paragraph
              )

              if len(candidate) <= MAX_CHARS:

                  current = candidate

              else:

                  if current:
                      chunks.append(current)

                  while len(paragraph) > MAX_CHARS:

                      chunks.append(
                          paragraph[:MAX_CHARS]
                      )

                      paragraph = paragraph[
                          MAX_CHARS:
                      ]

                  current = paragraph

          if current:
              chunks.append(current)

          if not chunks:
              chunks = ["带图日报内容为空。"]

          total = len(chunks)

          for index, chunk in enumerate(
              chunks,
              1
          ):

              if total == 1:
                  header_title = title
              else:
                  header_title = (
                      f"{title}｜"
                      f"第 {index}/{total} 部分"
                  )

              payload = {
                  "msg_type": "interactive",
                  "card": {
                      "header": {
                          "template": "blue",
                          "title": {
                              "tag": "plain_text",
                              "content": header_title
                          }
                      },
                      "elements": [
                          {
                              "tag": "markdown",
                              "content": chunk
                          }
                      ]
                  }
              }

              print(
                  json.dumps(
                      payload,
                      ensure_ascii=False
                  )
              )
          PY

          TOTAL=$(wc -l < /tmp/feishu_daily_cards.jsonl)

          echo "日报卡片数量：$TOTAL"

          INDEX=0

          while IFS= read -r PAYLOAD; do

              INDEX=$((INDEX + 1))

              echo
              echo "发送日报带图版：$INDEX / $TOTAL"

              RESPONSE=$(curl -sS \
                -X POST \
                -H "Content-Type: application/json" \
                --data-binary "$PAYLOAD" \
                "$FEISHU_WEBHOOK")

              echo
              echo "飞书返回："
              echo "$RESPONSE"

              echo "$RESPONSE" | grep -q '"code":0' || {
                echo "❌ 飞书日报发送失败"
                exit 1
              }

              echo "✅ 日报带图版 $INDEX / $TOTAL 发送成功"

              sleep 1

          done < /tmp/feishu_daily_cards.jsonl

          echo
          echo "=========================================="
          echo "✅ 带图日报发送完成"
          echo "=========================================="

      # ==========================================================
      # 7. 发送带图周报
      #
      # 直接读取 *_带图.md
      # ==========================================================

      - name: 发送带图周报到飞书
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WEEKLY_REPORT: ${{ steps.find_weekly.outputs.weekly_report }}
        run: |
          set -e

          echo
          echo "=========================================="
          echo "FEISHU WEEKLY REPORT — 带图版"
          echo "=========================================="

          if [ ! -f "$WEEKLY_REPORT" ]; then
            echo "❌ 带图周报文件不存在：$WEEKLY_REPORT"
            exit 1
          fi

          python - "$WEEKLY_REPORT" > /tmp/feishu_weekly_cards.jsonl <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              content = f.read().strip()

          title = "748686｜自生长知识系统｜周报｜带图版"

          MAX_CHARS = 7000

          paragraphs = content.split("\n\n")

          chunks = []
          current = ""

          for paragraph in paragraphs:

              paragraph = paragraph.strip()

              if not paragraph:
                  continue

              candidate = (
                  current + "\n\n" + paragraph
                  if current
                  else paragraph
              )

              if len(candidate) <= MAX_CHARS:

                  current = candidate

              else:

                  if current:
                      chunks.append(current)

                  while len(paragraph) > MAX_CHARS:

                      chunks.append(
                          paragraph[:MAX_CHARS]
                      )

                      paragraph = paragraph[
                          MAX_CHARS:
                      ]

                  current = paragraph

          if current:
              chunks.append(current)

          if not chunks:
              chunks = ["带图周报内容为空。"]

          total = len(chunks)

          for index, chunk in enumerate(
              chunks,
              1
          ):

              if total == 1:
                  header_title = title
              else:
                  header_title = (
                      f"{title}｜"
                      f"第 {index}/{total} 部分"
                  )

              payload = {
                  "msg_type": "interactive",
                  "card": {
                      "header": {
                          "template": "green",
                          "title": {
                              "tag": "plain_text",
                              "content": header_title
                          }
                      },
                      "elements": [
                          {
                              "tag": "markdown",
                              "content": chunk
                          }
                      ]
                  }
              }

              print(
                  json.dumps(
                      payload,
                      ensure_ascii=False
                  )
              )
          PY

          TOTAL=$(wc -l < /tmp/feishu_weekly_cards.jsonl)

          echo "周报卡片数量：$TOTAL"

          INDEX=0

          while IFS= read -r PAYLOAD; do

              INDEX=$((INDEX + 1))

              echo
              echo "发送周报带图版：$INDEX / $TOTAL"

              RESPONSE=$(curl -sS \
                -X POST \
                -H "Content-Type: application/json" \
                --data-binary "$PAYLOAD" \
                "$FEISHU_WEBHOOK")

              echo
              echo "飞书返回："
              echo "$RESPONSE"

              echo "$RESPONSE" | grep -q '"code":0' || {
                echo "❌ 飞书周报发送失败"
                exit 1
              }

              echo "✅ 周报带图版 $INDEX / $TOTAL 发送成功"

              sleep 1

          done < /tmp/feishu_weekly_cards.jsonl

          echo
          echo "=========================================="
          echo "✅ 带图周报发送完成"
          echo "=========================================="

      # ==========================================================
      # 8. 测试完成
      # ==========================================================

      - name: 飞书日报周报带图卡片测试完成
        run: |
          echo
          echo "=================================================="
          echo "748686 飞书日报周报带图卡片测试完成"
          echo "=================================================="
          echo
          echo "✅ 使用的是 *_带图.md"
          echo "✅ 没有使用普通日报"
          echo "✅ 没有使用普通周报"
          echo "✅ 没有重新生成报告"
          echo "✅ 直接读取完整带图 Markdown 文件"
          echo "✅ 日报已发送到飞书"
          echo "✅ 周报已发送到飞书"
          echo
          echo "本次测试没有运行："
          echo "  - Horizon"
          echo "  - 新闻抓取"
          echo "  - AI 分析"
          echo "  - EventUnit"
          echo "  - Skills"
          echo "  - Knowledge Asset"
          echo
          echo "测试链路："
          echo
          echo "05_日报/*_带图.md"
          echo "        ↓"
          echo "完整 Markdown"
          echo "        ↓"
          echo "飞书 Interactive Card"
          echo
          echo "06_周报/*_带图.md"
          echo "        ↓"
          echo "完整 Markdown"
          echo "        ↓"
          echo "飞书 Interactive Card"
          echo
          echo "=================================================="
