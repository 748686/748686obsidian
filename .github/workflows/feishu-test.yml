name: 飞书日报周报带图版测试

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-feishu-image-reports:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. 检查 FEISHU_WEBHOOK
      # ============================================================
      - name: Check Feishu Webhook
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          set -e

          echo
          echo "=================================================="
          echo "检查飞书 Webhook"
          echo "=================================================="

          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "❌ FEISHU_WEBHOOK 未配置"
            exit 1
          fi

          echo "✅ FEISHU_WEBHOOK 已配置"

      # ============================================================
      # 3. 查找最新日报 / 周报带图版
      # ============================================================
      - name: Find latest image reports
        id: find_reports
        run: |
          set -e

          echo
          echo "=================================================="
          echo "查找带图版日报 / 周报"
          echo "=================================================="

          DAILY_ROOT="01_自生长知识系统/05_日报"
          WEEKLY_ROOT="01_自生长知识系统/06_周报"

          echo
          echo "日报目录：$DAILY_ROOT"

          if [ ! -d "$DAILY_ROOT" ]; then
            echo "❌ 日报目录不存在：$DAILY_ROOT"
            exit 1
          fi

          DAILY_REPORT=$(
            find "$DAILY_ROOT" \
              -type f \
              -name '*_带图.md' \
              -print \
            | sort \
            | tail -n 1
          )

          if [ -z "$DAILY_REPORT" ]; then
            echo "❌ 没有找到日报 *_带图.md"
            exit 1
          fi

          echo "✅ 最新日报：$DAILY_REPORT"

          echo
          echo "周报目录：$WEEKLY_ROOT"

          WEEKLY_REPORT=""

          if [ -d "$WEEKLY_ROOT" ]; then
            WEEKLY_REPORT=$(
              find "$WEEKLY_ROOT" \
                -type f \
                -name '*_带图.md' \
                -print \
            | sort \
            | tail -n 1
            )
          fi

          if [ -n "$WEEKLY_REPORT" ]; then
            echo "✅ 最新周报：$WEEKLY_REPORT"
          else
            echo "ℹ️ 没有找到周报 *_带图.md"
            echo "ℹ️ 周报带图版为可选，不阻塞 Workflow"
          fi

          {
            echo "daily_report=$DAILY_REPORT"
            echo "weekly_report=$WEEKLY_REPORT"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. 发送日报带图版
      #
      # 核心逻辑：
      #
      # Markdown 原文：
      #
      # ![首图](../04_图片/2026-09-21/首图.png)
      #
      # 转换为：
      #
      # ![首图](https://raw.githubusercontent.com/748686/748686obsidian/main/01_自生长知识系统/04_图片/2026-09-21/首图.png)
      #
      # 其他 Markdown 内容完全不动。
      #
      # 不检查 Runner 本地图片是否存在。
      # ============================================================
      - name: Send Daily Image Report
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DAILY_REPORT: ${{ steps.find_reports.outputs.daily_report }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -e

          echo
          echo "=================================================="
          echo "发送日报带图版"
          echo "=================================================="

          echo "日报文件：$DAILY_REPORT"
          echo "GitHub Repository：$GITHUB_REPOSITORY"
          echo "GitHub Branch：$GITHUB_REF_NAME"

          python - "$DAILY_REPORT" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$FEISHU_WEBHOOK" <<'PY'
          import sys
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          report_file = Path(sys.argv[1])
          repository = sys.argv[2]
          branch = sys.argv[3]
          webhook = sys.argv[4]

          if not report_file.exists():
              print(f"❌ 报告文件不存在：{report_file}")
              sys.exit(1)

          print()
          print("--------------------------------------------------")
          print("读取日报 Markdown")
          print("--------------------------------------------------")

          content = report_file.read_text(encoding="utf-8")

          if not content.strip():
              print("❌ 日报 Markdown 为空")
              sys.exit(1)

          print(f"原始字符数：{len(content)}")

          # ==========================================================
          # GitHub Raw 基础地址
          # ==========================================================

          raw_base = (
              f"https://raw.githubusercontent.com/"
              f"{repository}/"
              f"{branch}/"
          )

          print(f"Raw Base：{raw_base}")

          # ==========================================================
          # Markdown 图片路径转换
          #
          # 只修改：
          #
          # ![xxx](图片路径)
          #
          # 其他内容完全保持不变。
          # ==========================================================

          image_pattern = re.compile(
              r'(!\[[^\]]*\]\()([^)]+)(\))'
          )

          image_count = 0

          def replace_image(match):
              nonlocal image_count

              prefix = match.group(1)
              image_path = match.group(2)
              suffix = match.group(3)

              image_path = image_path.strip()

              # ------------------------------------------------------
              # 已经是网络图片，完全不动
              # ------------------------------------------------------
              if image_path.startswith("http://") or image_path.startswith("https://"):
                  print(f"ℹ️ 已是 URL，不修改：{image_path}")
                  return match.group(0)

              # ------------------------------------------------------
              # 去掉可能存在的标题：
              #
              # image.png "title"
              #
              # 当前只处理最常见的纯路径情况。
              # ------------------------------------------------------
              path_only = image_path

              title_part = ""

              if " " in image_path:
                  possible_path, possible_title = image_path.split(" ", 1)

                  if possible_title.strip().startswith('"') or possible_title.strip().startswith("'"):
                      path_only = possible_path
                      title_part = " " + possible_title

              # ------------------------------------------------------
              # URL 解码
              # ------------------------------------------------------
              decoded_path = urllib.parse.unquote(path_only)

              # ------------------------------------------------------
              # 找到 04_图片/
              #
              # 不管 Markdown 原来是：
              #
              # ../04_图片/2026-09-21/首图.png
              #
              # ../../04_图片/2026-09-21/首图.png
              #
              # 还是：
              #
              # 04_图片/2026-09-21/首图.png
              #
              # 最终统一映射到：
              #
              # 01_自生长知识系统/04_图片/...
              # ------------------------------------------------------

              marker = "04_图片/"

              if marker in decoded_path:
                  suffix_path = decoded_path.split(marker, 1)[1]

                  repo_image_path = (
                      "01_自生长知识系统/"
                      "04_图片/"
                      + suffix_path
                  )

              else:
                  # --------------------------------------------------
                  # 如果不是 04_图片，则尝试按照仓库相对路径处理。
                  # --------------------------------------------------
                  clean_path = decoded_path

                  while clean_path.startswith("../"):
                      clean_path = clean_path[3:]

                  while clean_path.startswith("./"):
                      clean_path = clean_path[2:]

                  repo_image_path = clean_path

              # ------------------------------------------------------
              # GitHub Raw URL
              # ------------------------------------------------------

              encoded_path = urllib.parse.quote(
                  repo_image_path,
                  safe="/"
              )

              raw_url = raw_base + encoded_path

              image_count += 1

              print()
              print(f"🖼️ 图片 #{image_count}")
              print(f"   Markdown：{image_path}")
              print(f"   Repo：    {repo_image_path}")
              print(f"   Raw：     {raw_url}")

              return prefix + raw_url + title_part + suffix

          transformed = image_pattern.sub(
              replace_image,
              content
          )

          print()
          print("--------------------------------------------------")
          print("Markdown 图片转换完成")
          print("--------------------------------------------------")

          print(f"发现图片数量：{image_count}")

          if image_count == 0:
              print("⚠️ 没有发现 Markdown 图片引用")
          else:
              print(f"✅ 已转换 {image_count} 个图片引用")

          # ==========================================================
          # 为避免一次 Webhook 内容过长：
          #
          # 按 Markdown 行进行切分。
          #
          # 不改变行内容。
          # ==========================================================

          MAX_CHARS = 28000

          lines = transformed.splitlines()

          chunks = []
          current = ""

          for line in lines:

              candidate = (
                  current + "\n" + line
                  if current
                  else line
              )

              if len(candidate) <= MAX_CHARS:
                  current = candidate
              else:
                  if current:
                      chunks.append(current)

                  # 单独一行超过限制时，强制切开
                  if len(line) > MAX_CHARS:
                      start = 0

                      while start < len(line):
                          chunks.append(
                              line[start:start + MAX_CHARS]
                          )
                          start += MAX_CHARS

                      current = ""
                  else:
                      current = line

          if current:
              chunks.append(current)

          print()
          print("--------------------------------------------------")
          print("准备发送飞书")
          print("--------------------------------------------------")

          print(f"消息块数量：{len(chunks)}")

          # ==========================================================
          # 发送函数
          # ==========================================================

          def send_feishu(content_chunk, index, total):

              title = (
                  "748686｜自生长知识系统｜日报｜带图版"
              )

              payload = {
                  "msg_type": "interactive",
                  "card": {
                      "header": {
                          "title": {
                              "tag": "plain_text",
                              "content": title
                          },
                          "template": "blue"
                      },
                      "elements": [
                          {
                              "tag": "markdown",
                              "content": content_chunk
                          }
                      ]
                  }
              }

              data = json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8")

              request = urllib.request.Request(
                  webhook,
                  data=data,
                  headers={
                      "Content-Type":
                          "application/json; charset=utf-8"
                  },
                  method="POST"
              )

              print()
              print(
                  f"▶️ 发送日报消息 "
                  f"{index}/{total}"
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      status = response.status
                      response_body = (
                          response.read()
                          .decode("utf-8", errors="replace")
                      )

              except Exception as exc:
                  print(f"❌ 飞书请求失败：{exc}")
                  raise

              print(f"HTTP Status：{status}")
              print(f"Response：{response_body}")

              if status != 200:
                  raise RuntimeError(
                      f"飞书 HTTP 状态异常：{status}"
                  )

              try:
                  result = json.loads(response_body)
              except json.JSONDecodeError:
                  raise RuntimeError(
                      "飞书返回内容不是合法 JSON"
                  )

              code = result.get("code")

              if code != 0:
                  raise RuntimeError(
                      f"飞书发送失败：{result}"
                  )

              print("✅ 飞书发送成功")

          # ==========================================================
          # 正式发送
          # ==========================================================

          total = len(chunks)

          for index, chunk in enumerate(
              chunks,
              start=1
          ):
              send_feishu(
                  chunk,
                  index,
                  total
              )

          print()
          print("==================================================")
          print("✅ 日报带图版发送完成")
          print("==================================================")
          PY

      # ============================================================
      # 5. 发送周报带图版
      #
      # 周报是可选项：
      #
      # 没有周报
      #      ↓
      # SKIP
      #      ↓
      # Workflow 仍然成功
      # ============================================================
      - name: Send Weekly Image Report
        if: ${{ steps.find_reports.outputs.weekly_report != '' }}
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WEEKLY_REPORT: ${{ steps.find_reports.outputs.weekly_report }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -e

          echo
          echo "=================================================="
          echo "发送周报带图版"
          echo "=================================================="

          echo "周报文件：$WEEKLY_REPORT"
          echo "GitHub Repository：$GITHUB_REPOSITORY"
          echo "GitHub Branch：$GITHUB_REF_NAME"

          python - "$WEEKLY_REPORT" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$FEISHU_WEBHOOK" <<'PY'
          import sys
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          report_file = Path(sys.argv[1])
          repository = sys.argv[2]
          branch = sys.argv[3]
          webhook = sys.argv[4]

          if not report_file.exists():
              print(f"❌ 报告文件不存在：{report_file}")
              sys.exit(1)

          print()
          print("--------------------------------------------------")
          print("读取周报 Markdown")
          print("--------------------------------------------------")

          content = report_file.read_text(encoding="utf-8")

          if not content.strip():
              print("❌ 周报 Markdown 为空")
              sys.exit(1)

          print(f"原始字符数：{len(content)}")

          # ==========================================================
          # GitHub Raw 基础地址
          # ==========================================================

          raw_base = (
              f"https://raw.githubusercontent.com/"
              f"{repository}/"
              f"{branch}/"
          )

          print(f"Raw Base：{raw_base}")

          # ==========================================================
          # Markdown 图片转换
          # ==========================================================

          image_pattern = re.compile(
              r'(!\[[^\]]*\]\()([^)]+)(\))'
          )

          image_count = 0

          def replace_image(match):
              nonlocal image_count

              prefix = match.group(1)
              image_path = match.group(2)
              suffix = match.group(3)

              image_path = image_path.strip()

              # 已经是 URL，不修改
              if image_path.startswith("http://") or image_path.startswith("https://"):
                  print(f"ℹ️ 已是 URL，不修改：{image_path}")
                  return match.group(0)

              path_only = image_path
              title_part = ""

              if " " in image_path:
                  possible_path, possible_title = image_path.split(" ", 1)

                  if possible_title.strip().startswith('"') or possible_title.strip().startswith("'"):
                      path_only = possible_path
                      title_part = " " + possible_title

              decoded_path = urllib.parse.unquote(path_only)

              marker = "04_图片/"

              if marker in decoded_path:
                  suffix_path = decoded_path.split(
                      marker,
                      1
                  )[1]

                  repo_image_path = (
                      "01_自生长知识系统/"
                      "04_图片/"
                      + suffix_path
                  )

              else:
                  clean_path = decoded_path

                  while clean_path.startswith("../"):
                      clean_path = clean_path[3:]

                  while clean_path.startswith("./"):
                      clean_path = clean_path[2:]

                  repo_image_path = clean_path

              encoded_path = urllib.parse.quote(
                  repo_image_path,
                  safe="/"
              )

              raw_url = raw_base + encoded_path

              image_count += 1

              print()
              print(f"🖼️ 图片 #{image_count}")
              print(f"   Markdown：{image_path}")
              print(f"   Repo：    {repo_image_path}")
              print(f"   Raw：     {raw_url}")

              return prefix + raw_url + title_part + suffix

          transformed = image_pattern.sub(
              replace_image,
              content
          )

          print()
          print("--------------------------------------------------")
          print("Markdown 图片转换完成")
          print("--------------------------------------------------")

          print(f"发现图片数量：{image_count}")

          if image_count == 0:
              print("⚠️ 没有发现 Markdown 图片")
          else:
              print(f"✅ 已转换 {image_count} 个图片引用")

          # ==========================================================
          # Markdown 分块
          # ==========================================================

          MAX_CHARS = 28000

          lines = transformed.splitlines()

          chunks = []
          current = ""

          for line in lines:

              candidate = (
                  current + "\n" + line
                  if current
                  else line
              )

              if len(candidate) <= MAX_CHARS:
                  current = candidate
              else:
                  if current:
                      chunks.append(current)

                  if len(line) > MAX_CHARS:
                      start = 0

                      while start < len(line):
                          chunks.append(
                              line[start:start + MAX_CHARS]
                          )
                          start += MAX_CHARS

                      current = ""
                  else:
                      current = line

          if current:
              chunks.append(current)

          print()
          print("--------------------------------------------------")
          print("准备发送飞书")
          print("--------------------------------------------------")

          print(f"消息块数量：{len(chunks)}")

          # ==========================================================
          # 发送飞书
          # ==========================================================

          def send_feishu(content_chunk, index, total):

              title = (
                  "748686｜自生长知识系统｜周报｜带图版"
              )

              payload = {
                  "msg_type": "interactive",
                  "card": {
                      "header": {
                          "title": {
                              "tag": "plain_text",
                              "content": title
                          },
                          "template": "green"
                      },
                      "elements": [
                          {
                              "tag": "markdown",
                              "content": content_chunk
                          }
                      ]
                  }
              }

              data = json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8")

              request = urllib.request.Request(
                  webhook,
                  data=data,
                  headers={
                      "Content-Type":
                          "application/json; charset=utf-8"
                  },
                  method="POST"
              )

              print()
              print(
                  f"▶️ 发送周报消息 "
                  f"{index}/{total}"
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      status = response.status
                      response_body = (
                          response.read()
                          .decode("utf-8", errors="replace")
                      )

              except Exception as exc:
                  print(f"❌ 飞书请求失败：{exc}")
                  raise

              print(f"HTTP Status：{status}")
              print(f"Response：{response_body}")

              if status != 200:
                  raise RuntimeError(
                      f"飞书 HTTP 状态异常：{status}"
                  )

              try:
                  result = json.loads(response_body)
              except json.JSONDecodeError:
                  raise RuntimeError(
                      "飞书返回内容不是合法 JSON"
                  )

              code = result.get("code")

              if code != 0:
                  raise RuntimeError(
                      f"飞书发送失败：{result}"
                  )

              print("✅ 飞书发送成功")

          total = len(chunks)

          for index, chunk in enumerate(
              chunks,
              start=1
          ):
              send_feishu(
                  chunk,
                  index,
                  total
              )

          print()
          print("==================================================")
          print("✅ 周报带图版发送完成")
          print("==================================================")
          PY

      # ============================================================
      # 6. 最终结果
      # ============================================================
      - name: Final result
        run: |
          echo
          echo "=================================================="
          echo "飞书日报 / 周报带图版测试完成"
          echo "=================================================="
          echo
          echo "日报：必发"
          echo "周报：有则发送，无则 SKIP"
          echo
          echo "本次没有检查 Runner 本地 04_图片。"
          echo "图片地址直接按照 GitHub Repository + Branch"
          echo "转换为 raw.githubusercontent.com 地址。"
          echo
          echo "=================================================="
