name: 748686 自生长知识系统分段

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:

  knowledge-system:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout 748686obsidian
      # ==========================================================

      - name: Checkout 748686obsidian
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. Setup Python
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================================
      # 3. Install uv
      # ==========================================================

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # ==========================================================
      # 4. Calculate three processing dates
      #
      # GitHub Actions UTC = 唯一业务时间基准
      #
      # 注意：
      # 本版本不修改现有日期契约。
      # Task 1 ~ Task 4 继续使用同一 UTC 日期逻辑。
      # ==========================================================

      - name: Calculate three processing dates
        run: |
          set -e

          TODAY=$(date -u +%Y-%m-%d)
          YESTERDAY=$(date -u -d "$TODAY -1 day" +%Y-%m-%d)
          DAY_BEFORE=$(date -u -d "$TODAY -2 days" +%Y-%m-%d)

          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          echo "YESTERDAY=$YESTERDAY" >> "$GITHUB_ENV"
          echo "DAY_BEFORE=$DAY_BEFORE" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo "PROCESSING DATES"
          echo "============================================================"

          echo "DAY_BEFORE : $DAY_BEFORE"
          echo "YESTERDAY  : $YESTERDAY"
          echo "TODAY      : $TODAY"
          echo
          echo "Timezone: UTC"
          echo "Time source: GitHub Actions Runner"

      # ==========================================================
      # 5. Checkout Horizon main
      # ==========================================================

      - name: Checkout Horizon main
        uses: actions/checkout@v4
        with:
          repository: 748686/Horizon
          ref: main
          path: horizon

      # ==========================================================
      # 6. Install Horizon
      # ==========================================================

      - name: Install Horizon
        working-directory: horizon
        run: |
          set -e

          echo "============================================================"
          echo "INSTALL HORIZON"
          echo "============================================================"

          uv sync

          if [ ! -f "data/config.github.json" ]; then
            echo "❌ Horizon native config not found"
            exit 1
          fi

          echo "✅ Horizon installed"
          echo "✅ Native config found"

      # ==========================================================
      # 7. Check AGNES
      # ==========================================================

      - name: Check Agnes API configuration
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -e

          if [ -z "$AGNES_API_KEY" ]; then
            echo "❌ AGNES_API_KEY is missing"
            exit 1
          fi

          echo "✅ AGNES_API_KEY exists"

      # ==========================================================
      # 8. Get Horizon gh-pages
      # ==========================================================

      - name: Get Horizon gh-pages
        run: |
          set -e

          rm -rf horizon-pages

          git clone \
            --quiet \
            --depth 1 \
            --branch gh-pages \
            "https://github.com/748686/Horizon.git" \
            horizon-pages

          if [ ! -d "horizon-pages/_posts" ]; then
            echo "❌ Horizon _posts directory not found"
            exit 1
          fi

          echo "✅ Horizon gh-pages downloaded"

      # ==========================================================
      # 9. Check / Import three-day Raw News
      # ==========================================================

      - name: Check three-day Raw News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          mkdir -p "$RAW_ROOT"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            echo
            echo "============================================================"
            echo "RAW CHECK: $DATE"
            echo "============================================================"

            RAW_DIR="$RAW_ROOT/$DATE"

            mkdir -p "$RAW_DIR"

            COUNT=$(find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Local Raw files: $COUNT"

            if [ "$COUNT" -ge 2 ]; then
              echo "✅ Raw News exists"
              continue
            fi

            echo "⚠️ Raw News incomplete"
            echo "Searching Horizon..."

            HCOUNT=$(find "horizon-pages/_posts" \
              -maxdepth 1 \
              -type f \
              -name "$DATE*.md" \
              | wc -l)

            echo "Horizon files: $HCOUNT"

            if [ "$HCOUNT" -gt 0 ]; then

              while IFS= read -r file; do
                cp "$file" "$RAW_DIR/"
              done < <(
                find "horizon-pages/_posts" \
                  -maxdepth 1 \
                  -type f \
                  -name "$DATE*.md" \
                  | sort
              )

              echo "✅ Imported $DATE from Horizon"

            else

              echo "⚠️ Horizon has no $DATE output"

              if [ "$DATE" != "$TODAY" ]; then
                echo "❌ Historical Raw News missing: $DATE"
                exit 1
              fi

              echo "▶️ Today's Horizon output must be generated"

            fi

          done

      # ==========================================================
      # 10. Determine whether today's Horizon must run
      # ==========================================================

      - name: Check whether Horizon must run
        run: |
          set -e

          RAW_DIR="01_自生长知识系统/Raw News/$TODAY"

          mkdir -p "$RAW_DIR"

          COUNT=$(find "$RAW_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "Today's Raw files: $COUNT"

          if [ "$COUNT" -ge 2 ]; then

            echo "HORIZON_TODAY_READY=true" >> "$GITHUB_ENV"

            echo "✅ Today's Raw News exists"
            echo "⏭️ Horizon will not run"

          else

            echo "HORIZON_TODAY_READY=false" >> "$GITHUB_ENV"

            echo "❌ Today's Raw News incomplete"
            echo "▶️ Horizon must run"

          fi

      # ==========================================================
      # 11. Run Horizon
      # ==========================================================

      - name: Run Horizon
        if: env.HORIZON_TODAY_READY != 'true'
        working-directory: horizon
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          echo "============================================================"
          echo "RUN HORIZON"
          echo "============================================================"

          echo "Date: $TODAY"
          echo "Timezone: UTC"

          uv run horizon \
            --hours 24 \
            --config data/config.github.json

          echo "✅ Horizon process finished"

      # ==========================================================
      # 12. Refresh Horizon gh-pages
      # ==========================================================

      - name: Refresh Horizon gh-pages
        if: env.HORIZON_TODAY_READY != 'true'
        run: |
          set -e

          rm -rf horizon-pages

          FOUND=false

          for i in {1..10}; do

            echo
            echo "============================================================"
            echo "HORIZON OUTPUT CHECK $i / 10"
            echo "============================================================"

            git clone \
              --quiet \
              --depth 1 \
              --branch gh-pages \
              "https://github.com/748686/Horizon.git" \
              horizon-pages

            COUNT=$(find \
              "horizon-pages/_posts" \
              -maxdepth 1 \
              -type f \
              -name "$TODAY*.md" \
              | wc -l)

            echo "Today's Horizon files: $COUNT"

            if [ "$COUNT" -ge 2 ]; then

              FOUND=true

              echo "✅ Today's bilingual Horizon output found"
              break

            fi

            rm -rf horizon-pages

            if [ "$i" -lt 10 ]; then
              sleep 30
            fi

          done

          if [ "$FOUND" != "true" ]; then
            echo "❌ Today's bilingual Horizon output not found"
            exit 1
          fi

      # ==========================================================
      # 13. Validate three-day Raw News
      # ==========================================================

      - name: Validate three-day Raw News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          echo "============================================================"
          echo "FINAL THREE-DAY RAW VALIDATION"
          echo "============================================================"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            RAW_DIR="$RAW_ROOT/$DATE"

            echo
            echo "DATE: $DATE"

            if [ ! -d "$RAW_DIR" ]; then
              echo "❌ Raw folder does not exist"
              exit 1
            fi

            COUNT=$(find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Raw files: $COUNT"

            if [ "$COUNT" -lt 2 ]; then
              echo "❌ Raw News incomplete: $DATE"
              exit 1
            fi

            echo "✅ Raw folder complete"

          done

          echo
          echo "✅ THREE-DAY RAW NEWS COMPLETE"

      # ==========================================================
      # 14. Build Atomic News
      # ==========================================================

      - name: Build three-day Atomic News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"
          SCRIPT="01_自生长知识系统/scripts/horizon_split.py"

          if [ ! -f "$SCRIPT" ]; then
            echo "❌ horizon_split.py not found"
            exit 1
          fi

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            echo
            echo "============================================================"
            echo "ATOMIC NEWS: $DATE"
            echo "============================================================"

            ATOMIC_DIR="$RAW_ROOT/${DATE}-Atomic"
            ZH_DIR="$ATOMIC_DIR/zh"
            EN_DIR="$ATOMIC_DIR/en"

            mkdir -p "$ZH_DIR"
            mkdir -p "$EN_DIR"

            ZH_COUNT=$(find "$ZH_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            EN_COUNT=$(find "$EN_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Existing Atomic zh: $ZH_COUNT"
            echo "Existing Atomic en: $EN_COUNT"

            if [ "$ZH_COUNT" -gt 0 ] && \
               [ "$EN_COUNT" -gt 0 ]; then

              echo "✅ Atomic already exists: $DATE"
              continue

            fi

            python "$SCRIPT" \
              --raw-root "$RAW_ROOT" \
              --date "$DATE"

            if [ ! -d "$ZH_DIR" ]; then
              echo "❌ Atomic zh folder missing"
              exit 1
            fi

            if [ ! -d "$EN_DIR" ]; then
              echo "❌ Atomic en folder missing"
              exit 1
            fi

            ZH_COUNT=$(find "$ZH_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            EN_COUNT=$(find "$EN_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Final Atomic zh: $ZH_COUNT"
            echo "Final Atomic en: $EN_COUNT"

            if [ "$ZH_COUNT" -eq 0 ] || \
               [ "$EN_COUNT" -eq 0 ]; then

              echo "❌ Atomic incomplete: $DATE"
              exit 1

            fi

            echo "✅ Atomic News complete: $DATE"

          done

      # ==========================================================
      # 15. Atomic validation
      # ==========================================================

      - name: Validate three-day Atomic News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            ATOMIC_DIR="$RAW_ROOT/${DATE}-Atomic"

            ZH_COUNT=$(find "$ATOMIC_DIR/zh" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            EN_COUNT=$(find "$ATOMIC_DIR/en" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "$DATE"
            echo "  Atomic zh: $ZH_COUNT"
            echo "  Atomic en: $EN_COUNT"

            if [ "$ZH_COUNT" -eq 0 ] || \
               [ "$EN_COUNT" -eq 0 ]; then

              echo "❌ Atomic incomplete: $DATE"
              exit 1

            fi

          done

          echo "✅ THREE-DAY ATOMIC NEWS COMPLETE"

      # ==========================================================
      # 16. Atomic immediate Push + Pull
      # ==========================================================

      - name: Sync Atomic News immediately
        run: |
          set -e

          git config user.name \
            "748686 Knowledge Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "01_自生长知识系统/Raw News"

          if git diff --cached --quiet; then

            echo "ℹ️ No new Atomic News changes"

          else

            git commit \
              -m "data: sync Atomic News $TODAY"

            git push origin HEAD:main

            echo "✅ Atomic News pushed"

          fi

          git pull --ff-only origin main

          echo "✅ Atomic News PUSH + PULL COMPLETE"

      # ==========================================================
      # 17. Source Enrichment
      # ==========================================================

      - name: Build three-day Enriched News
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install requests

          SCRIPT="01_自生长知识系统/scripts/source_enrichment.py"
          RAW_ROOT="01_自生长知识系统/Raw News"

          if [ ! -f "$SCRIPT" ]; then
            echo "❌ source_enrichment.py not found"
            exit 1
          fi

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            echo
            echo "============================================================"
            echo "SOURCE ENRICHMENT: $DATE"
            echo "============================================================"

            ATOMIC_ROOT="$RAW_ROOT/${DATE}-Atomic"
            OUTPUT="$RAW_ROOT/${DATE}-Enriched"

            ZH="$ATOMIC_ROOT/zh"
            EN="$ATOMIC_ROOT/en"

            if [ ! -d "$ZH" ]; then
              echo "❌ Atomic zh missing"
              exit 1
            fi

            if [ ! -d "$EN" ]; then
              echo "❌ Atomic en missing"
              exit 1
            fi

            ATOMIC_ZH=$(find "$ZH" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            ATOMIC_EN=$(find "$EN" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            if [ "$ATOMIC_ZH" -eq 0 ] || \
               [ "$ATOMIC_EN" -eq 0 ]; then

              echo "❌ Atomic bilingual content incomplete"
              exit 1

            fi

            mkdir -p "$OUTPUT/zh"
            mkdir -p "$OUTPUT/en"

            ENRICHED_ZH=$(find "$OUTPUT/zh" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            ENRICHED_EN=$(find "$OUTPUT/en" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            if [ "$ENRICHED_ZH" -gt 0 ] && \
               [ "$ENRICHED_EN" -gt 0 ]; then

              echo "✅ Enriched already exists: $DATE"
              continue

            fi

            python "$SCRIPT" \
              --raw-root "$RAW_ROOT" \
              --date "$DATE"

            ENRICHED_ZH=$(find "$OUTPUT/zh" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            ENRICHED_EN=$(find "$OUTPUT/en" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            if [ "$ENRICHED_ZH" -eq 0 ] || \
               [ "$ENRICHED_EN" -eq 0 ]; then

              echo "❌ Enriched generation failed: $DATE"
              exit 1

            fi

            echo "✅ Enriched complete: $DATE"

          done

      # ==========================================================
      # 18. Enriched validation
      # ==========================================================

      - name: Validate three-day Enriched News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            OUTPUT="$RAW_ROOT/${DATE}-Enriched"

            ZH_COUNT=$(find "$OUTPUT/zh" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            EN_COUNT=$(find "$OUTPUT/en" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "$DATE"
            echo "  Enriched zh: $ZH_COUNT"
            echo "  Enriched en: $EN_COUNT"

            if [ "$ZH_COUNT" -eq 0 ] || \
               [ "$EN_COUNT" -eq 0 ]; then

              echo "❌ Enriched incomplete: $DATE"
              exit 1

            fi

          done

          echo "✅ THREE-DAY ENRICHED COMPLETE"

      # ==========================================================
      # 19. Enriched immediate Push + Pull
      # ==========================================================

      - name: Sync Enriched News immediately
        run: |
          set -e

          git config user.name \
            "748686 Knowledge Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "01_自生长知识系统/Raw News"

          if git diff --cached --quiet; then

            echo "ℹ️ No new Enriched News changes"

          else

            git commit \
              -m "data: sync Enriched News $TODAY"

            git push origin HEAD:main

            echo "✅ Enriched News pushed"

          fi

          git pull --ff-only origin main

          echo "✅ Enriched News PUSH + PULL COMPLETE"

      # ==========================================================
      # 20. KNOWLEDGE PROCESSING UNITS
      #
      # Processing Unit = DATE + LANGUAGE
      #
      # Task 1
      #   ↓
      # Task 2
      #   ↓
      # Task 3
      #   ↓
      # _COMPLETE
      #   ↓
      # Git Push
      #   ↓
      # Git Pull
      #
      # LANGUAGE:
      #
      #     en
      #     zh
      #
      # 严禁大小写转换。
      # ==========================================================

      - name: Knowledge Pipeline - six Processing Units
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          TASK1="01_自生长知识系统/scripts/knowledge_task_1_cluster.py"
          TASK2="01_自生长知识系统/scripts/knowledge_task_2_merge.py"
          TASK3="01_自生长知识系统/scripts/knowledge_task_3_eventunit.py"

          if [ ! -f "$TASK1" ]; then
            echo "❌ knowledge_task_1_cluster.py not found"
            exit 1
          fi

          if [ ! -f "$TASK2" ]; then
            echo "❌ knowledge_task_2_merge.py not found"
            exit 1
          fi

          if [ ! -f "$TASK3" ]; then
            echo "❌ knowledge_task_3_eventunit.py not found"
            exit 1
          fi

          echo
          echo "######################################################################"
          echo "KNOWLEDGE PIPELINE"
          echo "SIX PROCESSING UNITS"
          echo "######################################################################"

          UNITS=(
            "$DAY_BEFORE|en"
            "$DAY_BEFORE|zh"
            "$YESTERDAY|en"
            "$YESTERDAY|zh"
            "$TODAY|en"
            "$TODAY|zh"
          )

          UNIT_NO=0

          for UNIT in "${UNITS[@]}"; do

            UNIT_NO=$((UNIT_NO + 1))

            DATE="${UNIT%%|*}"
            LANGUAGE="${UNIT##*|}"

            if [ "$LANGUAGE" != "en" ] && \
               [ "$LANGUAGE" != "zh" ]; then

              echo "❌ INVALID LANGUAGE CONTRACT"
              echo "Language must be exactly: en or zh"
              echo "Received: [$LANGUAGE]"
              exit 1

            fi

            EVENT_ROOT="$RAW_ROOT/${DATE}-EventUnit"
            LANG_ROOT="$EVENT_ROOT/$LANGUAGE"

            EVENT_UNITS_DIR="$LANG_ROOT/event_units"
            COMPLETE_MARKER="$LANG_ROOT/_COMPLETE"

            echo
            echo
            echo "######################################################################"
            echo "PROCESSING UNIT $UNIT_NO / 6"
            echo "DATE     : $DATE"
            echo "LANGUAGE : $LANGUAGE"
            echo "######################################################################"

            if [ -f "$COMPLETE_MARKER" ]; then

              echo
              echo "✅ Unit already COMPLETE"
              echo "⏭️ Skip $DATE $LANGUAGE"

              continue

            fi

            if [ "$LANGUAGE" = "zh" ]; then

              PREVIOUS_MARKER="$RAW_ROOT/${DATE}-EventUnit/en/_COMPLETE"

              echo
              echo "Checking dependency:"
              echo "$DATE en"

              if [ ! -f "$PREVIOUS_MARKER" ]; then

                echo "❌ en Unit is not complete"
                echo "Required:"
                echo "$PREVIOUS_MARKER"
                exit 1

              fi

              echo "✅ en Unit complete"

            fi

            ATOMIC_ROOT="$RAW_ROOT/${DATE}-Atomic"
            ENRICHED_ROOT="$RAW_ROOT/${DATE}-Enriched"

            ATOMIC_DIR="$ATOMIC_ROOT/$LANGUAGE"
            ENRICHED_DIR="$ENRICHED_ROOT/$LANGUAGE"

            echo
            echo "Input directories:"
            echo "Atomic   : $ATOMIC_DIR"
            echo "Enriched : $ENRICHED_DIR"

            if [ ! -d "$ATOMIC_DIR" ]; then
              echo "❌ Atomic input missing:"
              echo "$ATOMIC_DIR"
              exit 1
            fi

            if [ ! -d "$ENRICHED_DIR" ]; then
              echo "❌ Enriched input missing:"
              echo "$ENRICHED_DIR"
              exit 1
            fi

            ATOMIC_COUNT=$(find "$ATOMIC_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            ENRICHED_COUNT=$(find "$ENRICHED_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo
            echo "Atomic $LANGUAGE   : $ATOMIC_COUNT"
            echo "Enriched $LANGUAGE : $ENRICHED_COUNT"

            if [ "$ATOMIC_COUNT" -eq 0 ]; then
              echo "❌ Atomic input empty"
              exit 1
            fi

            if [ "$ENRICHED_COUNT" -eq 0 ]; then
              echo "❌ Enriched input empty"
              exit 1
            fi

            mkdir -p "$EVENT_UNITS_DIR"

            echo
            echo "------------------------------------------------------------"
            echo "TASK 1 — CLUSTER"
            echo "------------------------------------------------------------"

            python "$TASK1" \
              --date "$DATE" \
              --language "$LANGUAGE"

            echo "✅ Task 1 Cluster returned successfully"

            echo
            echo "------------------------------------------------------------"
            echo "TASK 2 — MERGE"
            echo "------------------------------------------------------------"

            python "$TASK2" \
              --date "$DATE" \
              --language "$LANGUAGE"

            echo "✅ Task 2 Merge returned successfully"

            echo
            echo "------------------------------------------------------------"
            echo "TASK 3 — EVENTUNIT SYNTHESIS"
            echo "------------------------------------------------------------"

            python "$TASK3" \
              --date "$DATE" \
              --language "$LANGUAGE"

            echo "✅ Task 3 EventUnit returned successfully"

            echo
            echo "------------------------------------------------------------"
            echo "EVENTUNIT VALIDATION"
            echo "------------------------------------------------------------"

            if [ ! -d "$EVENT_ROOT" ]; then
              echo "❌ EventUnit root missing"
              echo "$EVENT_ROOT"
              exit 1
            fi

            if [ ! -d "$LANG_ROOT" ]; then
              echo "❌ Language directory missing"
              echo "$LANG_ROOT"
              exit 1
            fi

            if [ ! -d "$EVENT_UNITS_DIR" ]; then
              echo "❌ event_units directory missing"
              echo "$EVENT_UNITS_DIR"
              exit 1
            fi

            EVENT_INDEX="$LANG_ROOT/_event_index.json"

            if [ ! -f "$EVENT_INDEX" ]; then
              echo "❌ _event_index.json missing"
              echo "$EVENT_INDEX"
              exit 1
            fi

            if [ ! -s "$EVENT_INDEX" ]; then
              echo "❌ _event_index.json is empty"
              exit 1
            fi

            EVENT_COUNT=$(find "$EVENT_UNITS_DIR" \
              -maxdepth 1 \
              -type f \
              -name "EVT-*.md" \
              ! -name "*_analysis.md" \
              | wc -l)

            echo "EventUnits : $EVENT_COUNT"

            if [ "$EVENT_COUNT" -eq 0 ]; then
              echo "❌ No EventUnits generated"
              exit 1
            fi

            EMPTY_EVENT_COUNT=$(find "$EVENT_UNITS_DIR" \
              -maxdepth 1 \
              -type f \
              -name "EVT-*.md" \
              ! -name "*_analysis.md" \
              -size 0 \
