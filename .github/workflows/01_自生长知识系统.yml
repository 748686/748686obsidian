name: 01 自生长知识系统 - 主运行

on:
  workflow_dispatch:

  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:

  knowledge-system:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout 748686obsidian
      # ==========================================================

      - name: Checkout 748686obsidian
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 2. Setup Python
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================================
      # 3. Install uv
      # ==========================================================

      - name: Install uv
        uses: astral-sh/setup-uv@v6


      # ==========================================================
      # 4. Calculate three processing dates
      #
      # 前天 / 昨天 / 今天
      # 北京时间
      # ==========================================================

      - name: Calculate three processing dates
        run: |
          set -e

          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          YESTERDAY=$(TZ=Asia/Shanghai date -d "$TODAY -1 day" +%Y-%m-%d)
          DAY_BEFORE=$(TZ=Asia/Shanghai date -d "$TODAY -2 days" +%Y-%m-%d)

          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          echo "YESTERDAY=$YESTERDAY" >> "$GITHUB_ENV"
          echo "DAY_BEFORE=$DAY_BEFORE" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "PROCESSING DATES"
          echo "=========================================="

          echo "DAY_BEFORE : $DAY_BEFORE"
          echo "YESTERDAY  : $YESTERDAY"
          echo "TODAY      : $TODAY"

          echo
          echo "Timezone: Asia/Shanghai"


      # ==========================================================
      # 5. Checkout Horizon
      # ==========================================================

      - name: Checkout Horizon main
        uses: actions/checkout@v4
        with:
          repository: 748686/Horizon
          ref: main
          path: horizon


      # ==========================================================
      # 6. Install Horizon
      # ==========================================================

      - name: Install Horizon
        working-directory: horizon
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL HORIZON"
          echo "=========================================="

          uv sync

          if [ ! -f "data/config.github.json" ]; then
            echo "❌ Horizon native config not found"
            exit 1
          fi

          echo "✅ Horizon installed"
          echo "✅ Native config found"


      # ==========================================================
      # 7. Check AGNES
      # ==========================================================

      - name: Check Agnes API configuration
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -e

          if [ -z "$AGNES_API_KEY" ]; then
            echo "❌ AGNES_API_KEY is missing"
            exit 1
          fi

          echo "✅ AGNES_API_KEY exists"


      # ==========================================================
      # 8. Get Horizon gh-pages
      # ==========================================================

      - name: Get Horizon gh-pages
        run: |
          set -e

          rm -rf horizon-pages

          git clone \
            --quiet \
            --depth 1 \
            --branch gh-pages \
            "https://github.com/748686/Horizon.git" \
            horizon-pages

          if [ ! -d "horizon-pages/_posts" ]; then
            echo "❌ Horizon _posts directory not found"
            exit 1
          fi

          echo "✅ Horizon gh-pages downloaded"


      # ==========================================================
      # 9. Check / Import three-day Raw News
      #
      # 这里的判断逻辑：
      #
      # 第一优先级：
      #     本系统对应日期 Raw News 文件夹存在且有日报
      #
      # 第二优先级：
      #     从 Horizon gh-pages 补回来
      #
      # TODAY 如果 Horizon 没有：
      #     启动 Horizon
      #
      # ==========================================================

      - name: Check three-day Raw News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          mkdir -p "$RAW_ROOT"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            echo
            echo "=========================================="
            echo "RAW CHECK: $DATE"
            echo "=========================================="

            RAW_DIR="$RAW_ROOT/$DATE"

            # ----------------------------------------------------
            # 第一层：先保证文件夹存在
            # ----------------------------------------------------

            if [ ! -d "$RAW_DIR" ]; then
              echo "📁 Raw folder missing"
              echo "▶️ Creating: $RAW_DIR"
              mkdir -p "$RAW_DIR"
            else
              echo "📁 Raw folder exists"
            fi

            COUNT=$(find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Local Raw files: $COUNT"

            # ----------------------------------------------------
            # 已经有 Horizon 日报
            # ----------------------------------------------------

            if [ "$COUNT" -ge 2 ]; then

              echo "✅ Raw News folder and files exist"
              continue

            fi

            # ----------------------------------------------------
            # 从 Horizon gh-pages 补回
            # ----------------------------------------------------

            echo "⚠️ Raw News incomplete"
            echo "Searching Horizon..."

            HCOUNT=$(find "horizon-pages/_posts" \
              -maxdepth 1 \
              -type f \
              -name "$DATE*.md" \
              | wc -l)

            echo "Horizon files: $HCOUNT"

            if [ "$HCOUNT" -gt 0 ]; then

              while IFS= read -r file; do
                cp "$file" "$RAW_DIR/"
              done < <(
                find "horizon-pages/_posts" \
                  -maxdepth 1 \
                  -type f \
                  -name "$DATE*.md" \
                  | sort
              )

              echo "✅ Imported $DATE from Horizon"

            else

              echo "⚠️ Horizon has no $DATE output"

              if [ "$DATE" != "$TODAY" ]; then
                echo "❌ Historical Raw News missing: $DATE"
                exit 1
              fi

              echo "▶️ Today's Horizon output must be generated"

            fi

          done


      # ==========================================================
      # 10. Determine whether today's Horizon must run
      # ==========================================================

      - name: Check whether Horizon must run
        run: |
          set -e

          RAW_DIR="01_自生长知识系统/Raw News/$TODAY"

          if [ ! -d "$RAW_DIR" ]; then
            mkdir -p "$RAW_DIR"
          fi

          COUNT=$(find "$RAW_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "Today's Raw files: $COUNT"

          if [ "$COUNT" -ge 2 ]; then

            echo "HORIZON_TODAY_READY=true" >> "$GITHUB_ENV"

            echo "✅ Today's Horizon Raw News exists"
            echo "⏭️ Horizon will not run"

          else

            echo "HORIZON_TODAY_READY=false" >> "$GITHUB_ENV"

            echo "❌ Today's Horizon Raw News incomplete"
            echo "▶️ Horizon must run"

          fi


      # ==========================================================
      # 11. Run Horizon
      # ==========================================================

      - name: Run Horizon
        if: env.HORIZON_TODAY_READY != 'true'
        working-directory: horizon
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          echo "=========================================="
          echo "RUN HORIZON"
          echo "=========================================="

          echo "Date: $TODAY"

          uv run horizon \
            --hours 24 \
            --config data/config.github.json

          echo "✅ Horizon process finished"


      # ==========================================================
      # 12. Refresh Horizon gh-pages
      # ==========================================================

      - name: Refresh Horizon gh-pages
        if: env.HORIZON_TODAY_READY != 'true'
        run: |
          set -e

          rm -rf horizon-pages

          FOUND=false

          for i in {1..10}; do

            echo
            echo "=========================================="
            echo "HORIZON OUTPUT CHECK $i / 10"
            echo "=========================================="

            git clone \
              --quiet \
              --depth 1 \
              --branch gh-pages \
              "https://github.com/748686/Horizon.git" \
              horizon-pages

            COUNT=$(find \
              "horizon-pages/_posts" \
              -maxdepth 1 \
              -type f \
              -name "$TODAY*.md" \
              | wc -l)

            echo "Today's Horizon files: $COUNT"

            if [ "$COUNT" -ge 2 ]; then

              FOUND=true

              echo "✅ Today's bilingual Horizon output found"
              break

            fi

            rm -rf horizon-pages

            if [ "$i" -lt 10 ]; then
              sleep 30
            fi

          done

          if [ "$FOUND" != "true" ]; then
            echo "❌ Today's bilingual Horizon output not found"
            exit 1
          fi


      # ==========================================================
      # 13. Complete three-day Raw News
      #
      # 最终确认：
      #
      # 三个日期的 Raw 文件夹
      # 三个日期都有至少两份 Horizon MD
      #
      # 才能进入 Atomic。
      # ==========================================================

      - name: Validate three-day Raw News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          echo "=========================================="
          echo "FINAL THREE-DAY RAW VALIDATION"
          echo "=========================================="

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            RAW_DIR="$RAW_ROOT/$DATE"

            echo
            echo "DATE: $DATE"

            if [ ! -d "$RAW_DIR" ]; then
              echo "❌ Raw folder does not exist"
              exit 1
            fi

            COUNT=$(find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Raw files: $COUNT"

            if [ "$COUNT" -lt 2 ]; then
              echo "❌ Raw News incomplete: $DATE"
              exit 1
            fi

            echo "✅ Raw folder exists"
            echo "✅ Raw bilingual files exist"

          done

          echo
          echo "✅ THREE-DAY RAW NEWS COMPLETE"


      # ==========================================================
      # 14. Atomic News
      #
      # ★ 这里正式调用 horizon_split.py
      #
      # 绝对不再复制 Raw → Atomic
      #
      # 正确流程：
      #
      # Raw 中文日报
      #      ↓
      # horizon_split.py
      #      ↓
      # Atomic/zh
      #
      # Raw 英文日报
      #      ↓
      # horizon_split.py
      #      ↓
      # Atomic/en
      #
      # 三天逐日检查。
      # ==========================================================

      - name: Build three-day Atomic News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"
          SCRIPT="01_自生长知识系统/scripts/horizon_split.py"

          if [ ! -f "$SCRIPT" ]; then
            echo "❌ horizon_split.py not found"
            exit 1
          fi

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            echo
            echo "============================================================"
            echo "ATOMIC NEWS: $DATE"
            echo "============================================================"

            RAW_DIR="$RAW_ROOT/$DATE"
            ATOMIC_DIR="$RAW_ROOT/${DATE}-Atomic"

            ZH_DIR="$ATOMIC_DIR/zh"
            EN_DIR="$ATOMIC_DIR/en"

            # ----------------------------------------------------
            # 第一件事：建立整个 Atomic 层级
            # ----------------------------------------------------

            if [ ! -d "$ATOMIC_DIR" ]; then
              echo "📁 Atomic root missing"
              echo "▶️ Creating $ATOMIC_DIR"
              mkdir -p "$ATOMIC_DIR"
            else
              echo "📁 Atomic root exists"
            fi

            if [ ! -d "$ZH_DIR" ]; then
              echo "📁 Atomic zh missing"
              mkdir -p "$ZH_DIR"
            else
              echo "📁 Atomic zh exists"
            fi

            if [ ! -d "$EN_DIR" ]; then
              echo "📁 Atomic en missing"
              mkdir -p "$EN_DIR"
            else
              echo "📁 Atomic en exists"
            fi

            # ----------------------------------------------------
            # 检查是否已经完成
            # ----------------------------------------------------

            ZH_COUNT=$(find "$ZH_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            EN_COUNT=$(find "$EN_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Existing Atomic ZH: $ZH_COUNT"
            echo "Existing Atomic EN: $EN_COUNT"

            if [ "$ZH_COUNT" -gt 0 ] && [ "$EN_COUNT" -gt 0 ]; then

              echo "✅ Atomic folders already contain data"
              echo "⏭️ Skip Atomic generation for $DATE"

              continue

            fi

            # ----------------------------------------------------
            # 找到 Horizon 中文 / 英文日报
            #
            # 优先文件名判断。
            # 如果 Horizon 文件名没有 zh/en，
            # 用内容语言自动判断。
            # ----------------------------------------------------

            echo
            echo "Searching bilingual Horizon digest..."

            python - "$RAW_DIR" "$DATE" <<'PY'
          import sys
          import re
          from pathlib import Path

          raw_dir = Path(sys.argv[1])
          date = sys.argv[2]

          files = sorted(raw_dir.glob("*.md"))

          if len(files) < 2:
              raise SystemExit(
                  f"❌ Need at least 2 Horizon MD files for {date}, found {len(files)}"
              )

          zh = None
          en = None

          # 先根据文件名判断
          for f in files:
              name = f.name.lower()

              if (
                  "-zh" in name
                  or "_zh" in name
                  or ".zh." in name
                  or "chinese" in name
                  or "中文" in name
              ):
                  zh = f

              if (
                  "-en" in name
                  or "_en" in name
                  or ".en." in name
                  or "english" in name
                  or "英文" in name
              ):
                  en = f

          # 文件名无法判断时，用内容判断
          if zh is None or en is None:

              candidates = []

              for f in files:
                  text = f.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )

                  chinese = len(
                      re.findall(
                          r"[\u4e00-\u9fff]",
                          text
                      )
                  )

                  english = len(
                      re.findall(
                          r"[A-Za-z]",
                          text
                      )
                  )

                  candidates.append(
                      (f, chinese, english)
                  )

              candidates.sort(
                  key=lambda x: x[1] - x[2],
                  reverse=True
              )

              if zh is None:
                  zh = candidates[0][0]

              if en is None:
                  remaining = [
                      x for x in candidates
                      if x[0] != zh
                  ]

                  if remaining:
                      remaining.sort(
                          key=lambda x: x[2] - x[1],
                          reverse=True
                      )
                      en = remaining[0][0]

          if zh is None or en is None:
              raise SystemExit(
                  "❌ Cannot identify Chinese and English Horizon files"
              )

          print(f"ZH_FILE={zh}")
          print(f"EN_FILE={en}")

          with open(
              "zh_input.txt",
              "w",
              encoding="utf-8"
          ) as out:
              out.write(str(zh))

          with open(
              "en_input.txt",
              "w",
              encoding="utf-8"
          ) as out:
              out.write(str(en))
          PY

            ZH_INPUT=$(cat zh_input.txt)
            EN_INPUT=$(cat en_input.txt)

            echo "Chinese digest:"
            echo "$ZH_INPUT"

            echo
            echo "English digest:"
            echo "$EN_INPUT"

            # ----------------------------------------------------
            # 正式调用 Horizon Splitter
            # ----------------------------------------------------

            python "$SCRIPT" \
              --zh "$ZH_INPUT" \
              --en "$EN_INPUT" \
              --output "$ATOMIC_DIR" \
              --date "$DATE"

            # ----------------------------------------------------
            # 完成后重新检查文件夹
            # ----------------------------------------------------

            if [ ! -d "$ZH_DIR" ]; then
              echo "❌ Atomic ZH folder was not generated"
              exit 1
            fi

            if [ ! -d "$EN_DIR" ]; then
              echo "❌ Atomic EN folder was not generated"
              exit 1
            fi

            ZH_COUNT=$(find "$ZH_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            EN_COUNT=$(find "$EN_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo
            echo "Final Atomic ZH: $ZH_COUNT"
            echo "Final Atomic EN: $EN_COUNT"

            if [ "$ZH_COUNT" -eq 0 ]; then
              echo "❌ Atomic ZH generation failed"
              exit 1
            fi

            if [ "$EN_COUNT" -eq 0 ]; then
              echo "❌ Atomic EN generation failed"
              exit 1
            fi

            echo "✅ Atomic News complete: $DATE"

          done


      # ==========================================================
      # 15. Final three-day Atomic validation
      #
      # 在进入 Source Enrichment 之前，
      # 三天全部必须通过。
      # ==========================================================

      - name: Validate three-day Atomic News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          echo "=========================================="
          echo "FINAL THREE-DAY ATOMIC VALIDATION"
          echo "=========================================="

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            ATOMIC_DIR="$RAW_ROOT/${DATE}-Atomic"
            ZH_DIR="$ATOMIC_DIR/zh"
            EN_DIR="$ATOMIC_DIR/en"

            echo
            echo "DATE: $DATE"

            if [ ! -d "$ATOMIC_DIR" ]; then
              echo "❌ Atomic root missing"
              exit 1
            fi

            if [ ! -d "$ZH_DIR" ]; then
              echo "❌ Atomic ZH folder missing"
              exit 1
            fi

            if [ ! -d "$EN_DIR" ]; then
              echo "❌ Atomic EN folder missing"
              exit 1
            fi

            ZH_COUNT=$(find "$ZH_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            EN_COUNT=$(find "$EN_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "ZH: $ZH_COUNT"
            echo "EN: $EN_COUNT"

            if [ "$ZH_COUNT" -eq 0 ] || [ "$EN_COUNT" -eq 0 ]; then
              echo "❌ Atomic bilingual content incomplete"
              exit 1
            fi

            echo "✅ $DATE Atomic complete"

          done

          echo
          echo "✅ THREE-DAY ATOMIC NEWS COMPLETE"


      # ==========================================================
      # 16. Source Enrichment
      #
      # ★ 正式调用 source_enrichment.py
      #
      # Atomic
      #   ↓
      # RSS
      #   ↓
      # Agnes
      #   ↓
      # Real Source
      #   ↓
      # Enriched
      #
      # 每一天独立检查。
      # ==========================================================

      - name: Build three-day Enriched News
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.com/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install requests

          SCRIPT="01_自生长知识系统/scripts/source_enrichment.py"

          if [ ! -f "$SCRIPT" ]; then
            echo "❌ source_enrichment.py not found"
            exit 1
          fi

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            echo
            echo "============================================================"
            echo "SOURCE ENRICHMENT: $DATE"
            echo "============================================================"

            ATOMIC_ROOT="01_自生长知识系统/Raw News/${DATE}-Atomic"

            ZH="$ATOMIC_ROOT/zh"
            EN="$ATOMIC_ROOT/en"

            OUTPUT="01_自生长知识系统/Raw News/${DATE}-Enriched"

            # ----------------------------------------------------
            # 第一件事：建立 Enriched 文件夹
            # ----------------------------------------------------

            if [ ! -d "$OUTPUT" ]; then
              echo "📁 Enriched root missing"
              echo "▶️ Creating $OUTPUT"
              mkdir -p "$OUTPUT"
            else
              echo "📁 Enriched root exists"
            fi

            if [ ! -d "$OUTPUT/zh" ]; then
              echo "📁 Enriched ZH missing"
              mkdir -p "$OUTPUT/zh"
            else
              echo "📁 Enriched ZH exists"
            fi

            if [ ! -d "$OUTPUT/en" ]; then
              echo "📁 Enriched EN missing"
              mkdir -p "$OUTPUT/en"
            else
              echo "📁 Enriched EN exists"
            fi

            ATOMIC_ZH=$(find "$ZH" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            ATOMIC_EN=$(find "$EN" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            ENRICHED_ZH=$(find "$OUTPUT/zh" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            ENRICHED_EN=$(find "$OUTPUT/en" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Atomic ZH: $ATOMIC_ZH"
            echo "Atomic EN: $ATOMIC_EN"
            echo "Enriched ZH: $ENRICHED_ZH"
            echo "Enriched EN: $ENRICHED_EN"

            # ----------------------------------------------------
            # 如果双语都已经有内容，跳过
            # ----------------------------------------------------

            if [ "$ENRICHED_ZH" -gt 0 ] && \
               [ "$ENRICHED_EN" -gt 0 ]; then

              echo "✅ Enriched bilingual folders already contain data"
              echo "⏭️ Skip $DATE"

              continue

            fi

            # ----------------------------------------------------
            # Atomic 必须存在
            # ----------------------------------------------------

            if [ "$ATOMIC_ZH" -eq 0 ]; then
              echo "❌ Atomic ZH missing for $DATE"
              exit 1
            fi

            if [ "$ATOMIC_EN" -eq 0 ]; then
              echo "❌ Atomic EN missing for $DATE"
              exit 1
            fi

            # ----------------------------------------------------
            # 正式调用 Source Enrichment
            # ----------------------------------------------------

            python "$SCRIPT" \
              --zh "$ZH" \
              --en "$EN" \
              --output "$OUTPUT" \
              --date "$DATE"

            # ----------------------------------------------------
            # 最终检查
            # ----------------------------------------------------

            ENRICHED_ZH=$(find "$OUTPUT/zh" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            ENRICHED_EN=$(find "$OUTPUT/en" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo
            echo "Final Enriched ZH: $ENRICHED_ZH"
            echo "Final Enriched EN: $ENRICHED_EN"

            if [ "$ENRICHED_ZH" -eq 0 ]; then
              echo "❌ Enriched ZH generation failed"
              exit 1
            fi

            if [ "$ENRICHED_EN" -eq 0 ]; then
              echo "❌ Enriched EN generation failed"
              exit 1
            fi

            echo "✅ Enriched complete: $DATE"

          done


      # ==========================================================
      # 17. Final three-day Enriched validation
      #
      # ★ 只有这里全部通过，
      #   才允许 Knowledge Pipeline。
      # ==========================================================

      - name: Validate three-day Enriched News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          echo "============================================================"
          echo "FINAL THREE-DAY ENRICHED VALIDATION"
          echo "============================================================"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            OUTPUT="$RAW_ROOT/${DATE}-Enriched"

            ZH="$OUTPUT/zh"
            EN="$OUTPUT/en"

            echo
            echo "DATE: $DATE"

            if [ ! -d "$OUTPUT" ]; then
              echo "❌ Enriched root missing"
              exit 1
            fi

            if [ ! -d "$ZH" ]; then
              echo "❌ Enriched ZH folder missing"
              exit 1
            fi

            if [ ! -d "$EN" ]; then
              echo "❌ Enriched EN folder missing"
              exit 1
            fi

            ZH_COUNT=$(find "$ZH" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            EN_COUNT=$(find "$EN" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Enriched ZH: $ZH_COUNT"
            echo "Enriched EN: $EN_COUNT"

            if [ "$ZH_COUNT" -eq 0 ]; then
              echo "❌ Enriched ZH empty"
              exit 1
            fi

            if [ "$EN_COUNT" -eq 0 ]; then
              echo "❌ Enriched EN empty"
              exit 1
            fi

            echo "✅ $DATE Enriched complete"

