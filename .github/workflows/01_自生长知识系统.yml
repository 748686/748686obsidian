name: 01 自生长知识系统 - 主运行

on:
  workflow_dispatch:

  schedule:
  - cron: "0 0 * * *"

permissions:
  contents: write

jobs:

  knowledge-system:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout 748686obsidian
      # ==========================================================

      - name: Checkout 748686obsidian
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 2. Setup Python
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================================
      # 3. Install uv
      # ==========================================================

      - name: Install uv
        uses: astral-sh/setup-uv@v6


      # ==========================================================
      # 4. Calculate three processing dates
      #
      # GitHub Actions UTC = 唯一业务时间基准
      # ==========================================================

      - name: Calculate three processing dates
        run: |
          set -e

          TODAY=$(date -u +%Y-%m-%d)
          YESTERDAY=$(date -u -d "$TODAY -1 day" +%Y-%m-%d)
          DAY_BEFORE=$(date -u -d "$TODAY -2 days" +%Y-%m-%d)

          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          echo "YESTERDAY=$YESTERDAY" >> "$GITHUB_ENV"
          echo "DAY_BEFORE=$DAY_BEFORE" >> "$GITHUB_ENV"

          echo
          echo "=========================================="
          echo "PROCESSING DATES"
          echo "=========================================="

          echo "DAY_BEFORE : $DAY_BEFORE"
          echo "YESTERDAY  : $YESTERDAY"
          echo "TODAY      : $TODAY"

          echo
          echo "Timezone: UTC"
          echo "Time source: GitHub Actions Runner"


      # ==========================================================
      # 5. Checkout Horizon
      # ==========================================================

      - name: Checkout Horizon main
        uses: actions/checkout@v4
        with:
          repository: 748686/Horizon
          ref: main
          path: horizon


      # ==========================================================
      # 6. Install Horizon
      # ==========================================================

      - name: Install Horizon
        working-directory: horizon
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL HORIZON"
          echo "=========================================="

          uv sync

          if [ ! -f "data/config.github.json" ]; then
            echo "❌ Horizon native config not found"
            exit 1
          fi

          echo "✅ Horizon installed"
          echo "✅ Native config found"


      # ==========================================================
      # 7. Check AGNES
      # ==========================================================

      - name: Check Agnes API configuration
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -e

          if [ -z "$AGNES_API_KEY" ]; then
            echo "❌ AGNES_API_KEY is missing"
            exit 1
          fi

          echo "✅ AGNES_API_KEY exists"


      # ==========================================================
      # 8. Get Horizon gh-pages
      # ==========================================================

      - name: Get Horizon gh-pages
        run: |
          set -e

          rm -rf horizon-pages

          git clone \
            --quiet \
            --depth 1 \
            --branch gh-pages \
            "https://github.com/748686/Horizon.git" \
            horizon-pages

          if [ ! -d "horizon-pages/_posts" ]; then
            echo "❌ Horizon _posts directory not found"
            exit 1
          fi

          echo "✅ Horizon gh-pages downloaded"


      # ==========================================================
      # 9. Check / Import three-day Raw News
      # ==========================================================

      - name: Check three-day Raw News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          mkdir -p "$RAW_ROOT"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            echo
            echo "=========================================="
            echo "RAW CHECK: $DATE"
            echo "=========================================="

            RAW_DIR="$RAW_ROOT/$DATE"

            if [ ! -d "$RAW_DIR" ]; then
              echo "📁 Raw folder missing"
              echo "▶️ Creating: $RAW_DIR"
              mkdir -p "$RAW_DIR"
            else
              echo "📁 Raw folder exists"
            fi

            COUNT=$(find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Local Raw files: $COUNT"

            if [ "$COUNT" -ge 2 ]; then
              echo "✅ Raw News folder and files exist"
              continue
            fi

            echo "⚠️ Raw News incomplete"
            echo "Searching Horizon..."

            HCOUNT=$(find "horizon-pages/_posts" \
              -maxdepth 1 \
              -type f \
              -name "$DATE*.md" \
              | wc -l)

            echo "Horizon files: $HCOUNT"

            if [ "$HCOUNT" -gt 0 ]; then

              while IFS= read -r file; do
                cp "$file" "$RAW_DIR/"
              done < <(
                find "horizon-pages/_posts" \
                  -maxdepth 1 \
                  -type f \
                  -name "$DATE*.md" \
                  | sort
              )

              echo "✅ Imported $DATE from Horizon"

            else

              echo "⚠️ Horizon has no $DATE output"

              if [ "$DATE" != "$TODAY" ]; then
                echo "❌ Historical Raw News missing: $DATE"
                exit 1
              fi

              echo "▶️ Today's Horizon output must be generated"

            fi

          done


      # ==========================================================
      # 10. Determine whether today's Horizon must run
      # ==========================================================

      - name: Check whether Horizon must run
        run: |
          set -e

          RAW_DIR="01_自生长知识系统/Raw News/$TODAY"

          if [ ! -d "$RAW_DIR" ]; then
            mkdir -p "$RAW_DIR"
          fi

          COUNT=$(find "$RAW_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "Today's Raw files: $COUNT"

          if [ "$COUNT" -ge 2 ]; then

            echo "HORIZON_TODAY_READY=true" >> "$GITHUB_ENV"

            echo "✅ Today's Raw News exists"
            echo "⏭️ Horizon will not run"

          else

            echo "HORIZON_TODAY_READY=false" >> "$GITHUB_ENV"

            echo "❌ Today's Raw News incomplete"
            echo "▶️ Horizon must run"

          fi


      # ==========================================================
      # 11. Run Horizon
      # ==========================================================

      - name: Run Horizon
        if: env.HORIZON_TODAY_READY != 'true'
        working-directory: horizon
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          echo "=========================================="
          echo "RUN HORIZON"
          echo "=========================================="

          echo "Date: $TODAY"
          echo "Timezone: UTC"

          uv run horizon \
            --hours 24 \
            --config data/config.github.json

          echo "✅ Horizon process finished"


      # ==========================================================
      # 12. Refresh Horizon gh-pages
      # ==========================================================

      - name: Refresh Horizon gh-pages
        if: env.HORIZON_TODAY_READY != 'true'
        run: |
          set -e

          rm -rf horizon-pages

          FOUND=false

          for i in {1..10}; do

            echo
            echo "=========================================="
            echo "HORIZON OUTPUT CHECK $i / 10"
            echo "=========================================="

            git clone \
              --quiet \
              --depth 1 \
              --branch gh-pages \
              "https://github.com/748686/Horizon.git" \
              horizon-pages

            COUNT=$(find \
              "horizon-pages/_posts" \
              -maxdepth 1 \
              -type f \
              -name "$TODAY*.md" \
              | wc -l)

            echo "Today's Horizon files: $COUNT"

            if [ "$COUNT" -ge 2 ]; then

              FOUND=true

              echo "✅ Today's bilingual Horizon output found"
              break

            fi

            rm -rf horizon-pages

            if [ "$i" -lt 10 ]; then
              sleep 30
            fi

          done

          if [ "$FOUND" != "true" ]; then
            echo "❌ Today's bilingual Horizon output not found"
            exit 1
          fi


      # ==========================================================
      # 13. Validate three-day Raw News
      # ==========================================================

      - name: Validate three-day Raw News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          echo "=========================================="
          echo "FINAL THREE-DAY RAW VALIDATION"
          echo "=========================================="

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            RAW_DIR="$RAW_ROOT/$DATE"

            echo
            echo "DATE: $DATE"

            if [ ! -d "$RAW_DIR" ]; then
              echo "❌ Raw folder does not exist"
              exit 1
            fi

            COUNT=$(find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Raw files: $COUNT"

            if [ "$COUNT" -lt 2 ]; then
              echo "❌ Raw News incomplete: $DATE"
              exit 1
            fi

            echo "✅ Raw folder complete"

          done

          echo
          echo "✅ THREE-DAY RAW NEWS COMPLETE"


      # ==========================================================
      # 14. Atomic News
      #
      # 上游仍然按照 DATE 处理。
      # Processing Unit 从 EventUnit 阶段开始拆为 DATE+LANGUAGE。
      # ==========================================================

      - name: Build three-day Atomic News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"
          SCRIPT="01_自生长知识系统/scripts/horizon_split.py"

          if [ ! -f "$SCRIPT" ]; then
            echo "❌ horizon_split.py not found"
            exit 1
          fi

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            echo
            echo "============================================================"
            echo "ATOMIC NEWS: $DATE"
            echo "============================================================"

            ATOMIC_DIR="$RAW_ROOT/${DATE}-Atomic"
            ZH_DIR="$ATOMIC_DIR/zh"
            EN_DIR="$ATOMIC_DIR/en"

            if [ -d "$ZH_DIR" ] && [ -d "$EN_DIR" ]; then

              ZH_COUNT=$(find "$ZH_DIR" \
                -maxdepth 1 \
                -type f \
                -name "*.md" \
                | wc -l)

              EN_COUNT=$(find "$EN_DIR" \
                -maxdepth 1 \
                -type f \
                -name "*.md" \
                | wc -l)

              echo "Existing Atomic ZH: $ZH_COUNT"
              echo "Existing Atomic EN: $EN_COUNT"

              if [ "$ZH_COUNT" -gt 0 ] && [ "$EN_COUNT" -gt 0 ]; then
                echo "✅ Atomic already complete: $DATE"
                continue
              fi

            fi

            python "$SCRIPT" \
              --raw-root "$RAW_ROOT" \
              --date "$DATE"

            if [ ! -d "$ZH_DIR" ]; then
              echo "❌ Atomic ZH folder was not generated"
              exit 1
            fi

            if [ ! -d "$EN_DIR" ]; then
              echo "❌ Atomic EN folder was not generated"
              exit 1
            fi

            ZH_COUNT=$(find "$ZH_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            EN_COUNT=$(find "$EN_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Final Atomic ZH: $ZH_COUNT"
            echo "Final Atomic EN: $EN_COUNT"

            if [ "$ZH_COUNT" -eq 0 ]; then
              echo "❌ Atomic ZH generation failed"
              exit 1
            fi

            if [ "$EN_COUNT" -eq 0 ]; then
              echo "❌ Atomic EN generation failed"
              exit 1
            fi

            echo "✅ Atomic News complete: $DATE"

          done


      # ==========================================================
      # 15. Final Atomic validation
      # ==========================================================

      - name: Validate three-day Atomic News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            ATOMIC_DIR="$RAW_ROOT/${DATE}-Atomic"

            ZH_COUNT=$(find "$ATOMIC_DIR/zh" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            EN_COUNT=$(find "$ATOMIC_DIR/en" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "$DATE"
            echo "  Atomic ZH: $ZH_COUNT"
            echo "  Atomic EN: $EN_COUNT"

            if [ "$ZH_COUNT" -eq 0 ] || [ "$EN_COUNT" -eq 0 ]; then
              echo "❌ Atomic incomplete: $DATE"
              exit 1
            fi

          done

          echo "✅ THREE-DAY ATOMIC NEWS COMPLETE"


      # ==========================================================
      # 16. Atomic immediately Push + Pull
      # ==========================================================

      - name: Sync Atomic News immediately
        run: |
          set -e

          git config user.name \
            "748686 Knowledge Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "01_自生长知识系统/Raw News"

          if git diff --cached --quiet; then

            echo "ℹ️ No new Atomic News changes"

          else

            git commit \
              -m "data: sync Atomic News $TODAY"

            git push origin HEAD:main

            echo "✅ Atomic News pushed"

          fi

          git pull --ff-only origin main

          echo "✅ Atomic News PUSH + PULL COMPLETE"


      # ==========================================================
      # 17. Source Enrichment
      # ==========================================================

      - name: Build three-day Enriched News
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install requests

          SCRIPT="01_自生长知识系统/scripts/source_enrichment.py"
          RAW_ROOT="01_自生长知识系统/Raw News"

          if [ ! -f "$SCRIPT" ]; then
            echo "❌ source_enrichment.py not found"
            exit 1
          fi

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            echo
            echo "============================================================"
            echo "SOURCE ENRICHMENT: $DATE"
            echo "============================================================"

            ATOMIC_ROOT="$RAW_ROOT/${DATE}-Atomic"
            OUTPUT="$RAW_ROOT/${DATE}-Enriched"

            ZH="$ATOMIC_ROOT/zh"
            EN="$ATOMIC_ROOT/en"

            if [ ! -d "$ZH" ]; then
              echo "❌ Atomic ZH missing"
              exit 1
            fi

            if [ ! -d "$EN" ]; then
              echo "❌ Atomic EN missing"
              exit 1
            fi

            ATOMIC_ZH=$(find "$ZH" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            ATOMIC_EN=$(find "$EN" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            if [ "$ATOMIC_ZH" -eq 0 ] || [ "$ATOMIC_EN" -eq 0 ]; then
              echo "❌ Atomic bilingual content incomplete"
              exit 1
            fi

            mkdir -p "$OUTPUT/zh"
            mkdir -p "$OUTPUT/en"

            ENRICHED_ZH=$(find "$OUTPUT/zh" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            ENRICHED_EN=$(find "$OUTPUT/en" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            if [ "$ENRICHED_ZH" -gt 0 ] && \
               [ "$ENRICHED_EN" -gt 0 ]; then

              echo "✅ Enriched already exists: $DATE"
              continue

            fi

            python "$SCRIPT" \
              --raw-root "$RAW_ROOT" \
              --date "$DATE"

            ENRICHED_ZH=$(find "$OUTPUT/zh" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            ENRICHED_EN=$(find "$OUTPUT/en" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            if [ "$ENRICHED_ZH" -eq 0 ] || \
               [ "$ENRICHED_EN" -eq 0 ]; then

              echo "❌ Enriched generation failed: $DATE"
              exit 1

            fi

            echo "✅ Enriched complete: $DATE"

          done


      # ==========================================================
      # 18. Final Enriched validation
      # ==========================================================

      - name: Validate three-day Enriched News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            OUTPUT="$RAW_ROOT/${DATE}-Enriched"

            ZH_COUNT=$(find "$OUTPUT/zh" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            EN_COUNT=$(find "$OUTPUT/en" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "$DATE"
            echo "  Enriched ZH: $ZH_COUNT"
            echo "  Enriched EN: $EN_COUNT"

            if [ "$ZH_COUNT" -eq 0 ] || [ "$EN_COUNT" -eq 0 ]; then
              echo "❌ Enriched incomplete: $DATE"
              exit 1
            fi

          done

          echo "✅ THREE-DAY ENRICHED COMPLETE"


      # ==========================================================
      # 19. Enriched immediately Push + Pull
      # ==========================================================

      - name: Sync Enriched News immediately
        run: |
          set -e

          git config user.name \
            "748686 Knowledge Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "01_自生长知识系统/Raw News"

          if git diff --cached --quiet; then

            echo "ℹ️ No new Enriched News changes"

          else

            git commit \
              -m "data: sync Enriched News $TODAY"

            git push origin HEAD:main

            echo "✅ Enriched News pushed"

          fi

          git pull --ff-only origin main

          echo "✅ Enriched News PUSH + PULL COMPLETE"


      # ==========================================================
      # 20. KNOWLEDGE PIPELINE
      #
      # ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
      #
      # Processing Unit 正式定义：
      #
      #     Processing Unit = DATE + LANGUAGE
      #
      # 固定顺序：
      #
      #     DAY_BEFORE EN
      #     DAY_BEFORE ZH
      #     YESTERDAY  EN
      #     YESTERDAY  ZH
      #     TODAY      EN
      #     TODAY      ZH
      #
      # 每一个 Unit：
      #
      #     Aggregation
      #          ↓
      #     EventUnit
      #          ↓
      #     articles/
      #          ↓
      #     event_units/
      #          ↓
      #     _COMPLETE
      #          ↓
      #     Git commit
      #          ↓
      #     Git push
      #          ↓
      #     Git pull
      #          ↓
      #     下一 Unit
      #
      # ★ 一个 Unit 失败：
      #       整个 Job 立即停止
      #
      # ★ 一个 Unit 已 COMPLETE：
      #       恢复运行时安全跳过
      #
      # ★ 不再存在“三天 Aggregation 完成后统一 Push”
      #
      # ==========================================================

      - name: Knowledge Pipeline - six Processing Units
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          SCRIPT="01_自生长知识系统/scripts/knowledge_pipeline.py"
          RAW_ROOT="01_自生长知识系统/Raw News"

          if [ ! -f "$SCRIPT" ]; then
            echo "❌ knowledge_pipeline.py not found"
            exit 1
          fi

          echo
          echo "######################################################################"
          echo "KNOWLEDGE PIPELINE"
          echo "SIX PROCESSING UNITS"
          echo "######################################################################"

          UNITS=(
            "$DAY_BEFORE|EN"
            "$DAY_BEFORE|ZH"
            "$YESTERDAY|EN"
            "$YESTERDAY|ZH"
            "$TODAY|EN"
            "$TODAY|ZH"
          )

          UNIT_NO=0

          for UNIT in "${UNITS[@]}"; do

            UNIT_NO=$((UNIT_NO + 1))

            DATE="${UNIT%%|*}"
            LANGUAGE="${UNIT##*|}"

            echo
            echo
            echo "######################################################################"
            echo "PROCESSING UNIT $UNIT_NO / 6"
            echo "DATE     : $DATE"
            echo "LANGUAGE : $LANGUAGE"
            echo "######################################################################"

            EVENT_ROOT="$RAW_ROOT/${DATE}-EventUnit"
            LANG_ROOT="$EVENT_ROOT/$LANGUAGE"

            ARTICLES_DIR="$LANG_ROOT/articles"
            EVENT_UNITS_DIR="$LANG_ROOT/event_units"
            COMPLETE_MARKER="$LANG_ROOT/_COMPLETE"

            # ------------------------------------------------------
            # Recovery
            # ------------------------------------------------------

            if [ -f "$COMPLETE_MARKER" ]; then

              echo
              echo "✅ Unit already COMPLETE"
              echo "⏭️ Skip $DATE $LANGUAGE"

              continue

            fi

            # ------------------------------------------------------
            # Previous Unit dependency
            # ------------------------------------------------------

            if [ "$LANGUAGE" = "ZH" ]; then

              PREVIOUS_MARKER="$RAW_ROOT/${DATE}-EventUnit/EN/_COMPLETE"

              echo
              echo "Checking dependency:"
              echo "$DATE EN"

              if [ ! -f "$PREVIOUS_MARKER" ]; then
                echo "❌ EN Unit is not complete"
                exit 1
              fi

              echo "✅ EN Unit complete"

            fi

            # ------------------------------------------------------
            # Input verification
            # ------------------------------------------------------

            ATOMIC_ROOT="$RAW_ROOT/${DATE}-Atomic"
            ENRICHED_ROOT="$RAW_ROOT/${DATE}-Enriched"

            if [ "$LANGUAGE" = "EN" ]; then
              ATOMIC_DIR="$ATOMIC_ROOT/en"
              ENRICHED_DIR="$ENRICHED_ROOT/en"
            else
              ATOMIC_DIR="$ATOMIC_ROOT/zh"
              ENRICHED_DIR="$ENRICHED_ROOT/zh"
            fi

            if [ ! -d "$ATOMIC_DIR" ]; then
              echo "❌ Atomic input missing:"
              echo "$ATOMIC_DIR"
              exit 1
            fi

            if [ ! -d "$ENRICHED_DIR" ]; then
              echo "❌ Enriched input missing:"
              echo "$ENRICHED_DIR"
              exit 1
            fi

            ATOMIC_COUNT=$(find "$ATOMIC_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            ENRICHED_COUNT=$(find "$ENRICHED_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo
            echo "Atomic $LANGUAGE   : $ATOMIC_COUNT"
            echo "Enriched $LANGUAGE : $ENRICHED_COUNT"

            if [ "$ATOMIC_COUNT" -eq 0 ]; then
              echo "❌ Atomic input empty"
              exit 1
            fi

            if [ "$ENRICHED_COUNT" -eq 0 ]; then
              echo "❌ Enriched input empty"
              exit 1
            fi

            # ------------------------------------------------------
            # Create Unit directories
            # ------------------------------------------------------

            mkdir -p "$ARTICLES_DIR"
            mkdir -p "$EVENT_UNITS_DIR"

            # ------------------------------------------------------
            # Aggregation
            # ------------------------------------------------------

            echo
            echo "------------------------------------------------------------"
            echo "AGGREGATION"
            echo "------------------------------------------------------------"

            python \
              "$SCRIPT" \
              --date "$DATE" \
              --language "$LANGUAGE" \
              --stage aggregation

            echo "✅ Aggregation returned successfully"

            # ------------------------------------------------------
            # Validate EventUnit
            # ------------------------------------------------------

            echo
            echo "------------------------------------------------------------"
            echo "EVENTUNIT VALIDATION"
            echo "------------------------------------------------------------"

            if [ ! -d "$EVENT_ROOT" ]; then
              echo "❌ EventUnit root missing"
              exit 1
            fi

            if [ ! -d "$LANG_ROOT" ]; then
              echo "❌ Language directory missing"
              exit 1
            fi

            if [ ! -d "$ARTICLES_DIR" ]; then
              echo "❌ articles directory missing"
              exit 1
            fi

            if [ ! -d "$EVENT_UNITS_DIR" ]; then
              echo "❌ event_units directory missing"
              exit 1
            fi

            EVENT_COUNT=$(find "$EVENT_UNITS_DIR" \
              -maxdepth 1 \
              -type f \
              -name "EVT-*.md" \
              | wc -l)

            echo "EventUnits: $EVENT_COUNT"

            if [ "$EVENT_COUNT" -eq 0 ]; then
              echo "❌ No EventUnits generated"
              exit 1
            fi

            # ------------------------------------------------------
            # COMPLETE marker
            # ------------------------------------------------------

            touch "$COMPLETE_MARKER"

            if [ ! -f "$COMPLETE_MARKER" ]; then
              echo "❌ COMPLETE marker creation failed"
              exit 1
            fi

            echo
            echo "============================================================"
            echo "PROCESSING UNIT COMPLETE"
            echo "============================================================"

            echo "DATE       : $DATE"
            echo "LANGUAGE   : $LANGUAGE"
            echo "EventUnits : $EVENT_COUNT"
            echo "COMPLETE   : YES"

            # ------------------------------------------------------
            # Git transaction
            # ------------------------------------------------------

            git config user.name \
              "748686 Knowledge Bot"

            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add \
              "$EVENT_ROOT"

            if git diff --cached --quiet; then

              echo "ℹ️ No changes detected"

            else

              git commit \
                -m "data: complete EventUnit ${DATE} ${LANGUAGE}"

              echo
              echo "▶️ PUSH:"
              echo "$DATE $LANGUAGE"

              git push origin HEAD:main

              echo "✅ PUSH COMPLETE"

            fi

            # ------------------------------------------------------
            # Pull immediately
            # ------------------------------------------------------

            echo
            echo "▶️ PULL:"
            echo "$DATE $LANGUAGE"

            git pull --ff-only origin main

            echo "✅ PULL COMPLETE"

            # ------------------------------------------------------
            # Post-sync validation
            # ------------------------------------------------------

            if [ ! -f "$COMPLETE_MARKER" ]; then

              echo "❌ COMPLETE marker missing after pull"
              exit 1

            fi

            echo
            echo "######################################################################"
            echo "UNIT $UNIT_NO / 6 SUCCESS"
            echo "######################################################################"

            echo "$DATE $LANGUAGE"
            echo "STATUS : COMPLETE"
            echo "GIT    : PUSHED"
            echo "SYNC   : PULLED"

            echo
            echo "▶️ Next Unit is now allowed."

          done

          echo
          echo
          echo "######################################################################"
          echo "ALL SIX PROCESSING UNITS COMPLETE"
          echo "######################################################################"

          echo "1. $DAY_BEFORE EN  ✅"
          echo "2. $DAY_BEFORE ZH  ✅"
          echo "3. $YESTERDAY EN    ✅"
          echo "4. $YESTERDAY ZH    ✅"
          echo "5. $TODAY EN        ✅"
          echo "6. $TODAY ZH        ✅"


      # ==========================================================
      # 21. Final Six Processing Units Validation
      #
      # 这里只验证，不生成。
      # ==========================================================

      - name: Validate six Processing Units
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          UNITS=(
            "$DAY_BEFORE|EN"
            "$DAY_BEFORE|ZH"
            "$YESTERDAY|EN"
            "$YESTERDAY|ZH"
            "$TODAY|EN"
            "$TODAY|ZH"
          )

          UNIT_NO=0

          echo
          echo "============================================================"
          echo "FINAL SIX PROCESSING UNIT VALIDATION"
          echo "============================================================"

          for UNIT in "${UNITS[@]}"; do

            UNIT_NO=$((UNIT_NO + 1))

            DATE="${UNIT%%|*}"
            LANGUAGE="${UNIT##*|}"

            LANG_ROOT="$RAW_ROOT/${DATE}-EventUnit/$LANGUAGE"
            ARTICLES_DIR="$LANG_ROOT/articles"
            EVENT_UNITS_DIR="$LANG_ROOT/event_units"
            COMPLETE_MARKER="$LANG_ROOT/_COMPLETE"

            echo
            echo "------------------------------------------------------------"
            echo "UNIT $UNIT_NO / 6"
            echo "DATE     : $DATE"
            echo "LANGUAGE : $LANGUAGE"
            echo "------------------------------------------------------------"

            if [ ! -d "$LANG_ROOT" ]; then
              echo "❌ Language directory missing"
              exit 1
            fi

            if [ ! -d "$ARTICLES_DIR" ]; then
              echo "❌ articles directory missing"
              exit 1
            fi

            if [ ! -d "$EVENT_UNITS_DIR" ]; then
              echo "❌ event_units directory missing"
              exit 1
            fi

            if [ ! -f "$COMPLETE_MARKER" ]; then
              echo "❌ _COMPLETE missing"
              exit 1
            fi

            EVENT_COUNT=$(find "$EVENT_UNITS_DIR" \
              -maxdepth 1 \
              -type f \
              -name "EVT-*.md" \
              | wc -l)

            echo "EventUnits : $EVENT_COUNT"
            echo "COMPLETE   : YES"

            if [ "$EVENT_COUNT" -eq 0 ]; then
              echo "❌ EventUnits empty"
              exit 1
            fi

            echo "✅ Unit complete"

          done

          echo
          echo "============================================================"
          echo "✅ ALL SIX PROCESSING UNITS VALIDATED"
          echo "============================================================"


      # ==========================================================
      # 22. KNOWLEDGE PIPELINE - STAGE 2
      #
      # 当前先保持 Skills 的 DATE 级入口。
      #
      # 但执行前强制要求：
      #
      #     DATE EN COMPLETE
      #     DATE ZH COMPLETE
      #
      # 六个 Unit 全部完成之后才允许进入。
      # ==========================================================

      - name: Knowledge Pipeline - three-day Skills
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          SCRIPT="01_自生长知识系统/scripts/knowledge_pipeline.py"

          if [ ! -f "$SCRIPT" ]; then
            echo "❌ knowledge_pipeline.py not found"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "KNOWLEDGE PIPELINE STAGE 2"
          echo "THREE-DAY SKILLS"
          echo "============================================================"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            EVENT_ROOT="01_自生长知识系统/Raw News/${DATE}-EventUnit"

            echo
            echo "============================================================"
            echo "SKILLS: $DATE"
            echo "============================================================"

            if [ ! -f "$EVENT_ROOT/EN/_COMPLETE" ]; then
              echo "❌ EN incomplete"
              exit 1
            fi

            if [ ! -f "$EVENT_ROOT/ZH/_COMPLETE" ]; then
              echo "❌ ZH incomplete"
              exit 1
            fi

            python \
              "$SCRIPT" \
              --date "$DATE" \
              --stage skills

            echo "✅ Skills finished: $DATE"

          done

          echo
          echo "============================================================"
          echo "✅ THREE-DAY SKILLS FINISHED"
          echo "============================================================"


      # ==========================================================
      # 23. Weekly Report
      # ==========================================================

      - name: Run Weekly Report V2
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          echo "============================================================"
          echo "WEEKLY REPORT"
          echo "============================================================"

          python \
            "01_自生长知识系统/scripts/weekly_report.py"

          echo "✅ Weekly Report completed"


      # ==========================================================
      # 24. Final result
      # ==========================================================

      - name: Show three-day final result
        run: |
          set -e

          echo
          echo "============================================================"
          echo "748686 自生长知识系统 - FINAL RESULT"
          echo "============================================================"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            echo
            echo "############################################################"
            echo "DATE: $DATE"
            echo "############################################################"

            echo
            echo "RAW:"
            find \
              "01_自生长知识系统/Raw News/$DATE" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | sort

            echo
            echo "ATOMIC:"
            find \
              "01_自生长知识系统/Raw News/${DATE}-Atomic" \
              -type f \
              -name "*.md" \
              | sort

            echo
            echo "ENRICHED:"
            find \
              "01_自生长知识系统/Raw News/${DATE}-Enriched" \
              -type f \
              -name "*.md" \
              | sort

            echo
            echo "EVENTUNITS:"

            find \
              "01_自生长知识系统/Raw News/${DATE}-EventUnit" \
              -type f \
              | sort

            echo
            echo "DAILY REPORT:"

            REPORT="01_自生长知识系统/05_日报/${DATE:0:4}/${DATE:5:2}/${DATE}.md"

            if [ -f "$REPORT" ]; then
              echo "✅ $REPORT"
            else
              echo "❌ Missing $REPORT"
              exit 1
            fi

          done


      # ==========================================================
      # 25. Final Commit
      #
      # Skills / Knowledge / Weekly 等后续产物
      # ==========================================================

      - name: Commit Knowledge System
        run: |
          set -e

          git config user.name \
            "748686 Knowledge Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "01_自生长知识系统"

          if git diff --cached --quiet; then

            echo "No changes to commit"

          else

            git commit \
              -m "chore: three-day knowledge system $TODAY"

            git push origin HEAD:main

            echo "✅ Changes pushed"

          fi


      # ==========================================================
      # 26. RUN RETURN LOG
      # ==========================================================

      - name: Run Return Log
        if: always()
        run: |
          echo
          echo "######################################################################"
          echo "748686 KNOWLEDGE SYSTEM"
          echo "RUN RETURN LOG"
          echo "######################################################################"

          echo
          echo "============================================================"
          echo "RUN INFORMATION"
          echo "============================================================"

          echo "Workflow  : 01 自生长知识系统 - 主运行"
          echo "Run ID    : $GITHUB_RUN_ID"
          echo "Run No.   : $GITHUB_RUN_NUMBER"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch    : $GITHUB_REF_NAME"
          echo "Commit    : $GITHUB_SHA"
          echo "Runner    : ubuntu-latest"
          echo "Python    : 3.12"
          echo "Timezone  : UTC"

          echo
          echo "============================================================"
          echo "PROCESSING UNITS"
          echo "============================================================"

          echo "1. $DAY_BEFORE EN"
          echo "2. $DAY_BEFORE ZH"
          echo "3. $YESTERDAY EN"
          echo "4. $YESTERDAY ZH"
          echo "5. $TODAY EN"
          echo "6. $TODAY ZH"

          echo
          echo "============================================================"
          echo "PROCESSING UNIT STATUS"
          echo "============================================================"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            for LANGUAGE in EN ZH
            do

              EVENT_DIR="01_自生长知识系统/Raw News/${DATE}-EventUnit/${LANGUAGE}"

              if [ -f "$EVENT_DIR/_COMPLETE" ]; then
                STATUS="COMPLETE"
              else
                STATUS="INCOMPLETE"
              fi

              if [ -d "$EVENT_DIR/event_units" ]; then
                EVENT_COUNT=$(find "$EVENT_DIR/event_units" \
                  -maxdepth 1 \
                  -type f \
                  -name "EVT-*.md" \
                  | wc -l)
              else
                EVENT_COUNT=0
              fi

              echo "$DATE $LANGUAGE : $STATUS : EventUnits=$EVENT_COUNT"

            done

          done

          echo
          echo "============================================================"
          echo "LATEST GIT COMMIT"
          echo "============================================================"

          git log -1 \
            --pretty=format:"Commit: %H%nAuthor: %an%nDate: %ad%nMessage: %s" \
            --date=iso

          echo

          echo
          echo "============================================================"
          echo "GITHUB ACTIONS STEP SUMMARY"
          echo "============================================================"

          {
            echo "# 748686 自生长知识系统 — Run Return Log"
            echo
            echo "## Run Information"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Workflow | 01 自生长知识系统 - 主运行 |"
            echo "| Run ID | $GITHUB_RUN_ID |"
            echo "| Run Number | $GITHUB_RUN_NUMBER |"
            echo "| Repository | $GITHUB_REPOSITORY |"
            echo "| Branch | $GITHUB_REF_NAME |"
            echo "| Commit | $GITHUB_SHA |"
            echo "| Timezone | UTC |"
            echo
            echo "## Processing Units"
            echo
            echo "| # | Date | Language | Status | EventUnits |"
            echo "|---:|---|---|---|---:|"

            NO=0

            for DATE in \
              "$DAY_BEFORE" \
              "$YESTERDAY" \
              "$TODAY"
            do

              for LANGUAGE in EN ZH
              do

                NO=$((NO + 1))

                EVENT_DIR="01_自生长知识系统/Raw News/${DATE}-EventUnit/${LANGUAGE}"

                if [ -f "$EVENT_DIR/_COMPLETE" ]; then
                  STATUS="COMPLETE"
                else
                  STATUS="INCOMPLETE"
                fi

                if [ -d "$EVENT_DIR/event_units" ]; then
                  EVENT_COUNT=$(find "$EVENT_DIR/event_units" \
                    -maxdepth 1 \
                    -type f \
                    -name "EVT-*.md" \
                    | wc -l)
                else
                  EVENT_COUNT=0
                fi

                echo "| $NO | $DATE | $LANGUAGE | $STATUS | $EVENT_COUNT |"

              done

            done

            echo
            echo "## Pipeline"
            echo
            echo "- ✅ Three-day Raw News"
            echo "- ✅ Three-day Atomic News"
            echo "- ✅ Atomic push + pull"
            echo "- ✅ Three-day Enriched News"
            echo "- ✅ Enriched push + pull"
            echo "- ✅ 08-29 EN Processing Unit"
            echo "- ✅ 08-29 ZH Processing Unit"
            echo "- ✅ 08-30 EN Processing Unit"
            echo "- ✅ 08-30 ZH Processing Unit"
            echo "- ✅ 08-31 EN Processing Unit"
            echo "- ✅ 08-31 ZH Processing Unit"
            echo "- ✅ Per-Unit COMPLETE marker"
            echo "- ✅ Per-Unit push + pull"
            echo "- ✅ Three-day Skills"
            echo "- ✅ Weekly Report"
            echo "- ✅ Final Commit"

            echo
            echo "## Latest Git Commit"
            echo
            echo '```text'

            git log -1 \
              --pretty=format:"%H%n%an%n%ad%n%s" \
              --date=iso

            echo
            echo '```'

          } >> "$GITHUB_STEP_SUMMARY"

          echo
          echo "######################################################################"
          echo "RETURN LOG COMPLETE"
          echo "######################################################################"


      # ==========================================================
      # 27. Complete Job
      # ==========================================================

      - name: Complete Job
        run: |
          set -e

          echo
          echo "============================================================"
          echo "748686 自生长知识系统"
          echo "============================================================"

          echo
          echo "Processing Units:"
          echo

          echo "1. $DAY_BEFORE EN  → COMPLETE"
          echo "2. $DAY_BEFORE ZH  → COMPLETE"
          echo "3. $YESTERDAY EN    → COMPLETE"
          echo "4. $YESTERDAY ZH    → COMPLETE"
          echo "5. $TODAY EN        → COMPLETE"
          echo "6. $TODAY ZH        → COMPLETE"

          echo
          echo "============================================================"
          echo "TIME STANDARD"
          echo "============================================================"

          echo "✅ GitHub Actions UTC"
          echo "✅ cron uses UTC"
          echo "✅ Processing dates use UTC"

          echo
          echo "============================================================"
          echo "PROCESSING UNIT MODEL"
          echo "============================================================"

          echo "Processing Unit = DATE + LANGUAGE"

          echo
          echo "============================================================"
          echo "TRANSACTION MODEL"
          echo "============================================================"

          echo "Aggregation"
          echo "    ↓"
          echo "EventUnits"
          echo "    ↓"
          echo "_COMPLETE"
          echo "    ↓"
          echo "Git commit"
          echo "    ↓"
          echo "Git push"
          echo "    ↓"
          echo "Git pull"
          echo "    ↓"
          echo "Next Processing Unit"

          echo
          echo "============================================================"
          echo "SYSTEM COMPLETE"
          echo "============================================================"
