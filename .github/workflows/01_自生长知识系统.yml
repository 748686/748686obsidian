            echo "############################################################"

            echo
            echo "RAW:"
            find \
              "01_自生长知识系统/Raw News/$DATE" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | sort

            echo
            echo "ATOMIC:"
            find \
              "01_自生长知识系统/Raw News/${DATE}-Atomic" \
              -type f \
              -name "*.md" \
              | sort

