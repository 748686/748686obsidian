name: 01 自生长知识系统 - 主运行

on:
  workflow_dispatch:

  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:

  knowledge-system:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout 748686obsidian
      # ==========================================================

      - name: Checkout 748686obsidian
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 2. Setup Python
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================================
      # 3. Install uv
      # ==========================================================

      - name: Install uv
        uses: astral-sh/setup-uv@v6


      # ==========================================================
      # 4. Calculate three processing dates
      #
      # 北京时间：
      #
      # 前天
      # 昨天
      # 今天
      #
      # 例如：
      #
      # 2026-08-28
      # 2026-08-29
      # 2026-08-30
      # ==========================================================

      - name: Calculate three processing dates
        run: |
          set -e

          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          YESTERDAY=$(TZ=Asia/Shanghai date -d "$TODAY -1 day" +%Y-%m-%d)
          DAY_BEFORE=$(TZ=Asia/Shanghai date -d "$TODAY -2 days" +%Y-%m-%d)

          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          echo "YESTERDAY=$YESTERDAY" >> "$GITHUB_ENV"
          echo "DAY_BEFORE=$DAY_BEFORE" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "PROCESSING DATES"
          echo "=========================================="

          echo "DAY_BEFORE : $DAY_BEFORE"
          echo "YESTERDAY  : $YESTERDAY"
          echo "TODAY      : $TODAY"

          echo
          echo "Timezone:"
          echo "Asia/Shanghai"


      # ==========================================================
      # 5. Checkout Horizon main
      # ==========================================================

      - name: Checkout Horizon main
        uses: actions/checkout@v4
        with:
          repository: 748686/Horizon
          ref: main
          path: horizon


      # ==========================================================
      # 6. Install Horizon
      # ==========================================================

      - name: Install Horizon
        working-directory: horizon
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL HORIZON"
          echo "=========================================="

          uv sync

          if [ ! -f "data/config.github.json" ]; then
            echo "❌ Horizon native config not found"
            exit 1
          fi

          echo "✅ Horizon installed"
          echo "✅ Native config found"


      # ==========================================================
      # 7. Check AGNES
      # ==========================================================

      - name: Check Agnes API configuration
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -e

          if [ -z "$AGNES_API_KEY" ]; then
            echo "❌ AGNES_API_KEY is missing"
            exit 1
          fi

          echo "✅ AGNES_API_KEY exists"


      # ==========================================================
      # 8. Get Horizon gh-pages
      #
      # 一次性获取 Horizon 当前最新 gh-pages。
      # ==========================================================

      - name: Get Horizon gh-pages
        run: |
          set -e

          rm -rf horizon-pages

          git clone \
            --quiet \
            --depth 1 \
            --branch gh-pages \
            "https://github.com/748686/Horizon.git" \
            horizon-pages

          if [ ! -d "horizon-pages/_posts" ]; then
            echo "❌ Horizon _posts directory not found"
            exit 1
          fi

          echo "✅ Horizon gh-pages downloaded"


      # ==========================================================
      # 9. Check three-day Raw News
      #
      # 先检查本系统 Raw News。
      #
      # 已存在：
      #     跳过
      #
      # 不存在：
      #     再去 Horizon 找
      #
      # 三天分别检查。
      # ==========================================================

      - name: Check three-day Raw News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          mkdir -p "$RAW_ROOT"

          echo "=========================================="
          echo "CHECK THREE-DAY RAW NEWS"
          echo "=========================================="

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            RAW_DIR="$RAW_ROOT/$DATE"

            mkdir -p "$RAW_DIR"

            COUNT=$(find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo
            echo "------------------------------------------"
            echo "DATE: $DATE"
            echo "------------------------------------------"

            echo "Existing Raw News: $COUNT"

            if [ "$COUNT" -gt 0 ]; then

              echo "✅ Raw News already exists"
              echo "⏭️ Skip Raw import"

            else

              echo "❌ Raw News missing"
              echo "Will import from Horizon if available"

              POSTS_DIR="horizon-pages/_posts"

              HCOUNT=$(find "$POSTS_DIR" \
                -maxdepth 1 \
                -type f \
                -name "$DATE*.md" \
                | wc -l)

              echo "Horizon files: $HCOUNT"

              if [ "$HCOUNT" -gt 0 ]; then

                while IFS= read -r file; do

                  cp "$file" "$RAW_DIR/"

                done < <(
                  find "$POSTS_DIR" \
                    -maxdepth 1 \
                    -type f \
                    -name "$DATE*.md" \
                    | sort
                )

                echo "✅ Imported $DATE from Horizon"

              else

                echo "⚠️ Horizon does not currently contain $DATE"

                if [ "$DATE" = "$TODAY" ]; then
                  echo "TODAY missing from Horizon"
                  echo "Horizon must run"
                else
                  echo "Historical date missing from Horizon"
                  echo "Cannot fabricate historical Horizon output"
                fi

              fi

            fi

          done


      # ==========================================================
      # 10. Determine whether today's Horizon must run
      #
      # 只有 TODAY 缺失时启动 Horizon。
      #
      # 28 / 29 不通过伪造方式让 Horizon 生成。
      # 如果 Horizon gh-pages 已有，就直接补进本系统。
      # ==========================================================

      - name: Check whether Horizon must run
        run: |
          set -e

          RAW_DIR="01_自生长知识系统/Raw News/$TODAY"

          COUNT=$(find "$RAW_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "Today's Raw News: $COUNT"

          if [ "$COUNT" -gt 0 ]; then

            echo "HORIZON_TODAY_READY=true" >> "$GITHUB_ENV"

            echo "✅ Today's Raw News already exists"
            echo "⏭️ Horizon does not need to run"

          else

            echo "HORIZON_TODAY_READY=false" >> "$GITHUB_ENV"

            echo "❌ Today's Raw News missing"
            echo "▶️ Horizon must run"

          fi


      # ==========================================================
      # 11. Run Horizon only when today's data is missing
      # ==========================================================

      - name: Run Horizon
        if: env.HORIZON_TODAY_READY != 'true'
        working-directory: horizon
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          echo "=========================================="
          echo "RUN HORIZON"
          echo "=========================================="

          echo "Date:"
          echo "$TODAY"

          uv run horizon \
            --hours 24 \
            --config data/config.github.json

          echo
          echo "✅ Horizon process finished"


      # ==========================================================
      # 12. Refresh Horizon gh-pages after Horizon run
      # ==========================================================

      - name: Refresh Horizon gh-pages
        if: env.HORIZON_TODAY_READY != 'true'
        run: |
          set -e

          rm -rf horizon-pages

          for i in {1..10}; do

            echo
            echo "=========================================="
            echo "HORIZON OUTPUT CHECK $i / 10"
            echo "=========================================="

            git clone \
              --quiet \
              --depth 1 \
              --branch gh-pages \
              "https://github.com/748686/Horizon.git" \
              horizon-pages

            COUNT=$(find \
              "horizon-pages/_posts" \
              -maxdepth 1 \
              -type f \
              -name "$TODAY*.md" \
              | wc -l)

            echo "Today's Horizon files: $COUNT"

            if [ "$COUNT" -gt 0 ]; then

              echo "✅ Today's Horizon output found"

              break

            fi

            rm -rf horizon-pages

            if [ "$i" -lt 10 ]; then
              sleep 30
            fi

          done

          COUNT=$(find \
            "horizon-pages/_posts" \
            -maxdepth 1 \
            -type f \
            -name "$TODAY*.md" \
            | wc -l)

          if [ "$COUNT" -eq 0 ]; then

            echo "❌ Today's Horizon output not found"

            exit 1

          fi


      # ==========================================================
      # 13. Import missing Raw News again
      #
      # Horizon 运行完之后，
      # 再次检查三天。
      #
      # 这一步非常重要。
      # ==========================================================

      - name: Complete three-day Raw News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            RAW_DIR="$RAW_ROOT/$DATE"

            mkdir -p "$RAW_DIR"

            COUNT=$(find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            if [ "$COUNT" -gt 0 ]; then

              echo "✅ $DATE Raw News ready: $COUNT"

              continue

            fi

            echo "⚠️ $DATE Raw News still missing"

            HCOUNT=$(find \
              "horizon-pages/_posts" \
              -maxdepth 1 \
              -type f \
              -name "$DATE*.md" \
              | wc -l)

            if [ "$HCOUNT" -gt 0 ]; then

              while IFS= read -r file; do
                cp "$file" "$RAW_DIR/"
              done < <(
                find \
                  "horizon-pages/_posts" \
                  -maxdepth 1 \
                  -type f \
                  -name "$DATE*.md" \
                  | sort
              )

              echo "✅ $DATE imported"

            else

              echo "❌ Cannot obtain Raw News for $DATE"

              exit 1

            fi

          done


      # ==========================================================
      # 14. Atomic News
      #
      # 三天逐日检查。
      #
      # 已存在：
      #     跳过
      #
      # 不存在：
      #     从对应 Raw News 生成。
      # ==========================================================

      - name: Build missing Atomic News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            RAW_DIR="$RAW_ROOT/$DATE"
            ATOMIC_DIR="$RAW_ROOT/${DATE}-Atomic"

            ZH_DIR="$ATOMIC_DIR/zh"
            EN_DIR="$ATOMIC_DIR/en"

            echo
            echo "=========================================="
            echo "ATOMIC CHECK: $DATE"
            echo "=========================================="

            mkdir -p "$ZH_DIR"
            mkdir -p "$EN_DIR"

            ATOMIC_COUNT=$(find "$ATOMIC_DIR" \
              -type f \
              -name "*.md" \
              | wc -l)

            RAW_COUNT=$(find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Raw: $RAW_COUNT"
            echo "Atomic: $ATOMIC_COUNT"

            if [ "$RAW_COUNT" -eq 0 ]; then

              echo "❌ No Raw News for $DATE"
              exit 1

            fi

            if [ "$ATOMIC_COUNT" -ge "$RAW_COUNT" ]; then

              echo "✅ Atomic News already complete"
              echo "⏭️ Skip $DATE"

              continue

            fi

            echo "❌ Atomic News incomplete"
            echo "▶️ Generating missing Atomic News"


            while IFS= read -r file; do

              filename=$(basename "$file")

              if [ -f "$ZH_DIR/$filename" ] || \
                 [ -f "$EN_DIR/$filename" ]; then

                echo "⏭️ Already exists: $filename"

                continue

              fi

              language="zh"

              if grep -qi \
                -E \
                'language:[[:space:]]*(en|english)' \
                "$file"; then

                language="en"

              elif grep -qi \
                -E \
                'language:[[:space:]]*zh' \
                "$file"; then

                language="zh"

              elif [[ "$filename" == *"-en.md" ]]; then

                language="en"

              elif [[ "$filename" == *"-zh.md" ]]; then

                language="zh"

              fi

              if [ "$language" = "en" ]; then

                cp "$file" "$EN_DIR/$filename"

              else

                cp "$file" "$ZH_DIR/$filename"

              fi

              echo "✅ Atomic: $filename"

            done < <(
              find "$RAW_DIR" \
                -maxdepth 1 \
                -type f \
                -name "*.md" \
                | sort
            )

            FINAL_COUNT=$(find "$ATOMIC_DIR" \
              -type f \
              -name "*.md" \
              | wc -l)

            echo
            echo "Final Atomic count: $FINAL_COUNT"

            if [ "$FINAL_COUNT" -lt "$RAW_COUNT" ]; then

              echo "❌ Atomic generation incomplete for $DATE"

              exit 1

            fi

            echo "✅ Atomic complete: $DATE"

          done


      # ==========================================================
      # 15. Source Enrichment
      #
      # 三天逐日检查。
      #
      # Enriched 已经完整：
      #     跳过
      #
      # 缺失：
      #     只处理该日期。
      #
      # 不重新处理已经完成日期。
      # ==========================================================

      - name: Build missing Enriched News
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install requests

          SCRIPT="01_自生长知识系统/scripts/source_enrichment.py"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            echo
            echo "=========================================="
            echo "SOURCE ENRICHMENT CHECK: $DATE"
            echo "=========================================="

            ZH="01_自生长知识系统/Raw News/${DATE}-Atomic/zh"
            EN="01_自生长知识系统/Raw News/${DATE}-Atomic/en"

            OUTPUT="01_自生长知识系统/Raw News/${DATE}-Enriched"

            mkdir -p "$OUTPUT"

            ATOMIC_COUNT=$(find \
              "01_自生长知识系统/Raw News/${DATE}-Atomic" \
              -type f \
              -name "*.md" \
              | wc -l)

            ENRICHED_COUNT=$(find "$OUTPUT" \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Atomic: $ATOMIC_COUNT"
            echo "Enriched: $ENRICHED_COUNT"

            if [ "$ATOMIC_COUNT" -eq 0 ]; then

              echo "❌ Atomic News missing for $DATE"
              exit 1

            fi

            if [ "$ENRICHED_COUNT" -ge "$ATOMIC_COUNT" ]; then

              echo "✅ Enriched already complete"
              echo "⏭️ Skip $DATE"

              continue

            fi

            echo "❌ Enriched incomplete"
            echo "▶️ Run Source Enrichment for $DATE"

            python "$SCRIPT" \
              --zh "$ZH" \
              --en "$EN" \
              --output "$OUTPUT" \
              --date "$DATE"

            FINAL_COUNT=$(find "$OUTPUT" \
              -type f \
              -name "*.md" \
              | wc -l)

            echo
            echo "Final Enriched count: $FINAL_COUNT"

            if [ "$FINAL_COUNT" -lt "$ATOMIC_COUNT" ]; then

              echo "❌ Enrichment incomplete for $DATE"

              exit 1

            fi

            echo "✅ Enriched complete: $DATE"

          done


      # ==========================================================
      # 16. Validate all three days
      # ==========================================================

      - name: Validate three-day Enriched News
        run: |
          set -e

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            DIR="01_自生长知识系统/Raw News/${DATE}-Enriched"

            COUNT=$(find "$DIR" \
              -type f \
              -name "*.md" \
              | wc -l)

            echo
            echo "$DATE Enriched: $COUNT"

            if [ "$COUNT" -eq 0 ]; then

              echo "❌ No Enriched News for $DATE"

              exit 1

            fi

          done

          echo
          echo "✅ Three-day Enriched News ready"


      # ==========================================================
      # 17. Knowledge Pipeline
      #
      # 最重要的一步：
      #
      # 28 → 29 → 30
      #
      # 每天独立处理。
      #
      # 已完成：
      #     跳过
      #
      # 未完成：
      #     当前日期完整处理
      # ==========================================================

      - name: Run Knowledge Pipeline - three days
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            echo
            echo "=========================================="
            echo "KNOWLEDGE PIPELINE: $DATE"
            echo "=========================================="

            python \
              "01_自生长知识系统/scripts/knowledge_pipeline.py" \
              --date "$DATE"

            echo
            echo "✅ Knowledge Pipeline finished: $DATE"

          done


      # ==========================================================
      # 18. Weekly Report
      # ==========================================================

      - name: Run Weekly Report V2
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          python \
            "01_自生长知识系统/scripts/weekly_report.py"

          echo "✅ Weekly Report completed"


      # ==========================================================
      # 19. Final result
      # ==========================================================

      - name: Show three-day final result
        run: |
          set -e

          echo
          echo "============================================================"
          echo "748686 自生长知识系统 - THREE DAY RESULT"
          echo "============================================================"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            echo
            echo "############################################################"
            echo "DATE: $DATE"
            echo "############################################################"

            echo
            echo "RAW:"
            find \
              "01_自生长知识系统/Raw News/$DATE" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | sort

            echo
            echo "ATOMIC:"
            find \
              "01_自生长知识系统/Raw News/${DATE}-Atomic" \
              -type f \
              -name "*.md" \
              | sort

            echo
            echo "ENRICHED:"
            find \
              "01_自生长知识系统/Raw News/${DATE}-Enriched" \
              -type f \
              -name "*.md" \
              | sort

            echo
            echo "DAILY REPORT:"

            REPORT="01_自生长知识系统/05_日报/${DATE:0:4}/${DATE:5:2}/${DATE}.md"

            if [ -f "$REPORT" ]; then

              echo "✅ $REPORT"

            else

              echo "❌ Missing $REPORT"

              exit 1

            fi

          done


      # ==========================================================
      # 20. Commit
      # ==========================================================

      - name: Commit Knowledge System
        run: |
          set -e

          git config user.name \
            "748686 Knowledge Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "01_自生长知识系统"

          if git diff --cached --quiet; then

            echo "No changes to commit"

          else

            git commit \
              -m "chore: three-day knowledge system $TODAY"

            git push

            echo "✅ Changes pushed"

          fi


      # ==========================================================
      # 21. Complete
      # ==========================================================

      - name: Complete Job
        run: |
          set -e

          echo
          echo "============================================================"
          echo "748686 自生长知识系统"
          echo "============================================================"

          echo
          echo "前天:"
          echo "$DAY_BEFORE"

          echo
          echo "昨天:"
          echo "$YESTERDAY"

          echo
          echo "今天:"
          echo "$TODAY"

          echo
          echo "Horizon:"
          echo "✅ checked"

          echo
          echo "Raw News:"
          echo "✅ three-day checked"

          echo
          echo "Atomic News:"
          echo "✅ three-day checked"

          echo
          echo "Source Enrichment:"
          echo "✅ three-day checked"

          echo
          echo "Knowledge Pipeline:"
          echo "✅ processed day-by-day"

          echo
          echo "Weekly Report:"
          echo "✅ completed"

          echo
          echo "GitHub:"
          echo "✅ pushed"

          echo
          echo "============================================================"
          echo "SYSTEM COMPLETE"
          echo "============================================================"
