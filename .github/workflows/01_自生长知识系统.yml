name: 748686 自生长知识系统
on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:

  knowledge-system:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout 748686obsidian
      # ==========================================================

      - name: Checkout 748686obsidian
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. Setup Python
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================================
      # 3. Install uv
      # ==========================================================

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # ==========================================================
      # 4. Calculate three processing dates
      #
      # GitHub Actions UTC = 唯一业务时间基准
      # ==========================================================

      - name: Calculate three processing dates
        run: |
          set -e

          TODAY=$(date -u +%Y-%m-%d)
          YESTERDAY=$(date -u -d "$TODAY -1 day" +%Y-%m-%d)
          DAY_BEFORE=$(date -u -d "$TODAY -2 days" +%Y-%m-%d)

          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          echo "YESTERDAY=$YESTERDAY" >> "$GITHUB_ENV"
          echo "DAY_BEFORE=$DAY_BEFORE" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo "PROCESSING DATES"
          echo "============================================================"

          echo "DAY_BEFORE : $DAY_BEFORE"
          echo "YESTERDAY  : $YESTERDAY"
          echo "TODAY      : $TODAY"
          echo
          echo "Timezone: UTC"
          echo "Time source: GitHub Actions Runner"

      # ==========================================================
      # 5. Checkout Horizon
      # ==========================================================

      - name: Checkout Horizon main
        uses: actions/checkout@v4
        with:
          repository: 748686/Horizon
          ref: main
          path: horizon

      # ==========================================================
      # 6. Install Horizon
      # ==========================================================

      - name: Install Horizon
        working-directory: horizon
        run: |
          set -e

          echo "============================================================"
          echo "INSTALL HORIZON"
          echo "============================================================"

          uv sync

          if [ ! -f "data/config.github.json" ]; then
            echo "❌ Horizon native config not found"
            exit 1
          fi

          echo "✅ Horizon installed"
          echo "✅ Native config found"

      # ==========================================================
      # 7. Check AGNES
      # ==========================================================

      - name: Check Agnes API configuration
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -e

          if [ -z "$AGNES_API_KEY" ]; then
            echo "❌ AGNES_API_KEY is missing"
            exit 1
          fi

          echo "✅ AGNES_API_KEY exists"

      # ==========================================================
      # 8. Get Horizon gh-pages
      # ==========================================================

      - name: Get Horizon gh-pages
        run: |
          set -e

          rm -rf horizon-pages

          git clone \
            --quiet \
            --depth 1 \
            --branch gh-pages \
            "https://github.com/748686/Horizon.git" \
            horizon-pages

          if [ ! -d "horizon-pages/_posts" ]; then
            echo "❌ Horizon _posts directory not found"
            exit 1
          fi

          echo "✅ Horizon gh-pages downloaded"

      # ==========================================================
      # 9. Check / Import three-day Raw News
      # ==========================================================

      - name: Check three-day Raw News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          mkdir -p "$RAW_ROOT"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            echo
            echo "============================================================"
            echo "RAW CHECK: $DATE"
            echo "============================================================"

            RAW_DIR="$RAW_ROOT/$DATE"

            mkdir -p "$RAW_DIR"

            COUNT=$(find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Local Raw files: $COUNT"

            if [ "$COUNT" -ge 2 ]; then
              echo "✅ Raw News exists"
              continue
            fi

            echo "⚠️ Raw News incomplete"
            echo "Searching Horizon..."

            HCOUNT=$(find "horizon-pages/_posts" \
              -maxdepth 1 \
              -type f \
              -name "$DATE*.md" \
              | wc -l)

            echo "Horizon files: $HCOUNT"

            if [ "$HCOUNT" -gt 0 ]; then

              while IFS= read -r file; do
                cp "$file" "$RAW_DIR/"
              done < <(
                find "horizon-pages/_posts" \
                  -maxdepth 1 \
                  -type f \
                  -name "$DATE*.md" \
                  | sort
              )

              echo "✅ Imported $DATE from Horizon"

            else

              echo "⚠️ Horizon has no $DATE output"

              if [ "$DATE" != "$TODAY" ]; then
                echo "❌ Historical Raw News missing: $DATE"
                exit 1
              fi

              echo "▶️ Today's Horizon output must be generated"

            fi

          done

      # ==========================================================
      # 10. Determine whether today's Horizon must run
      # ==========================================================

      - name: Check whether Horizon must run
        run: |
          set -e

          RAW_DIR="01_自生长知识系统/Raw News/$TODAY"

          mkdir -p "$RAW_DIR"

          COUNT=$(find "$RAW_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "Today's Raw files: $COUNT"

          if [ "$COUNT" -ge 2 ]; then

            echo "HORIZON_TODAY_READY=true" >> "$GITHUB_ENV"

            echo "✅ Today's Raw News exists"
            echo "⏭️ Horizon will not run"

          else

            echo "HORIZON_TODAY_READY=false" >> "$GITHUB_ENV"

            echo "❌ Today's Raw News incomplete"
            echo "▶️ Horizon must run"

          fi

      # ==========================================================
      # 11. Run Horizon
      # ==========================================================

      - name: Run Horizon
        if: env.HORIZON_TODAY_READY != 'true'
        working-directory: horizon
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          echo "============================================================"
          echo "RUN HORIZON"
          echo "============================================================"

          echo "Date: $TODAY"
          echo "Timezone: UTC"

          uv run horizon \
            --hours 24 \
            --config data/config.github.json

          echo "✅ Horizon process finished"

      # ==========================================================
      # 12. Refresh Horizon gh-pages
      # ==========================================================

      - name: Refresh Horizon gh-pages
        if: env.HORIZON_TODAY_READY != 'true'
        run: |
          set -e

          rm -rf horizon-pages

          FOUND=false

          for i in {1..10}; do

            echo
            echo "============================================================"
            echo "HORIZON OUTPUT CHECK $i / 10"
            echo "============================================================"

            git clone \
              --quiet \
              --depth 1 \
              --branch gh-pages \
              "https://github.com/748686/Horizon.git" \
              horizon-pages

            COUNT=$(find \
              "horizon-pages/_posts" \
              -maxdepth 1 \
              -type f \
              -name "$TODAY*.md" \
              | wc -l)

            echo "Today's Horizon files: $COUNT"

            if [ "$COUNT" -ge 2 ]; then

              FOUND=true

              echo "✅ Today's bilingual Horizon output found"
              break

            fi

            rm -rf horizon-pages

            if [ "$i" -lt 10 ]; then
              sleep 30
            fi

          done

          if [ "$FOUND" != "true" ]; then
            echo "❌ Today's bilingual Horizon output not found"
            exit 1
          fi

      # ==========================================================
      # 13. Validate three-day Raw News
      # ==========================================================

      - name: Validate three-day Raw News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          echo "============================================================"
          echo "FINAL THREE-DAY RAW VALIDATION"
          echo "============================================================"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            RAW_DIR="$RAW_ROOT/$DATE"

            echo
            echo "DATE: $DATE"

            if [ ! -d "$RAW_DIR" ]; then
              echo "❌ Raw folder does not exist"
              exit 1
            fi

            COUNT=$(find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Raw files: $COUNT"

            if [ "$COUNT" -lt 2 ]; then
              echo "❌ Raw News incomplete: $DATE"
              exit 1
            fi

            echo "✅ Raw folder complete"

          done

          echo
          echo "✅ THREE-DAY RAW NEWS COMPLETE"

      ######################################################################
      # 14
      # BUILD ATOMIC NEWS
      ######################################################################

      - name: "14 - Build 3-Day Atomic News"
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "BUILD ATOMIC NEWS"
          echo "######################################################################"

          echo "Atomic News build stage."


      ######################################################################
      # 15
      # ATOMIC VALIDATION
      ######################################################################

      - name: "15 - Atomic Validation"
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "ATOMIC VALIDATION"
          echo "######################################################################"

          echo "Atomic validation stage."


      ######################################################################
      # 16
      # ATOMIC IMMEDIATE PUSH + PULL
      ######################################################################

      - name: "16 - Atomic Immediate Push Pull"
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "ATOMIC IMMEDIATE PUSH + PULL"
          echo "######################################################################"

          git status --short

          if git diff --quiet && git diff --cached --quiet; then
            echo "No Atomic changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add "01_自生长知识系统/Raw News"

            git commit \
              -m "Knowledge System: Atomic News"

            git push origin HEAD
          fi

          CURRENT_BRANCH=$(git branch --show-current)

          if [ -n "$CURRENT_BRANCH" ]; then
            git fetch origin "$CURRENT_BRANCH"
            git pull --rebase origin "$CURRENT_BRANCH"
          else
            echo "❌ Unable to determine current branch."
            exit 1
          fi


      ######################################################################
      # 17
      # SOURCE ENRICHMENT
      ######################################################################

      - name: "17 - Source Enrichment"
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "SOURCE ENRICHMENT"
          echo "######################################################################"

          echo "Source enrichment stage."


      ######################################################################
      # 18
      # ENRICHED VALIDATION
      ######################################################################

      - name: "18 - Enriched Validation"
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "ENRICHED VALIDATION"
          echo "######################################################################"

          echo "Enriched validation stage."


      ######################################################################
      # 19
      # ENRICHED IMMEDIATE PUSH + PULL
      ######################################################################

      - name: "19 - Enriched Immediate Push Pull"
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "ENRICHED IMMEDIATE PUSH + PULL"
          echo "######################################################################"

          git status --short

          if git diff --quiet && git diff --cached --quiet; then
            echo "No Enriched changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add "01_自生长知识系统/Raw News"

            git commit \
              -m "Knowledge System: Enriched News"

            git push origin HEAD
          fi

          CURRENT_BRANCH=$(git branch --show-current)

          if [ -n "$CURRENT_BRANCH" ]; then
            git fetch origin "$CURRENT_BRANCH"
            git pull --rebase origin "$CURRENT_BRANCH"
          else
            echo "❌ Unable to determine current branch."
            exit 1
          fi


      ######################################################################
      # 20
      # KNOWLEDGE PIPELINE
      #
      # SIX PROCESSING UNITS
      #
      # 1. DAY_BEFORE / en
      # 2. DAY_BEFORE / zh
      # 3. YESTERDAY  / en
      # 4. YESTERDAY  / zh
      # 5. TODAY      / en
      # 6. TODAY      / zh
      #
      # EACH UNIT:
      #
      # TASK 1
      #     Cluster
      #
      #      ↓
      #
      # TASK 2
      #     Global Merge
      #
      #      ↓
      #
      # TASK 3
      #     EventUnit Synthesis / Materialization
      #
      #      ↓
      #
      # EVENTUNIT VALIDATION
      #
      #      ↓
      #
      # _COMPLETE
      #
      #      ↓
      #
      # IMMEDIATE GIT PUSH + PULL
      #
      ######################################################################

      - name: "20 - Knowledge Pipeline - Six Processing Units"
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "KNOWLEDGE PIPELINE"
          echo "SIX PROCESSING UNITS"
          echo "######################################################################"

          RAW_ROOT="01_自生长知识系统/Raw News"

          TASK1="01_自生长知识系统/scripts/knowledge_task_1_cluster.py"
          TASK2="01_自生长知识系统/scripts/knowledge_task_2_merge.py"
          TASK3="01_自生长知识系统/scripts/knowledge_task_3_eventunit.py"


          ####################################################################
          # SCRIPT VALIDATION
          ####################################################################

          echo
          echo "Checking Knowledge Task scripts..."

          if [ ! -f "$TASK1" ]; then
            echo "❌ Task 1 script missing:"
            echo "   $TASK1"
            exit 1
          fi

          if [ ! -f "$TASK2" ]; then
            echo "❌ Task 2 script missing:"
            echo "   $TASK2"
            exit 1
          fi

          if [ ! -f "$TASK3" ]; then
            echo "❌ Task 3 script missing:"
            echo "   $TASK3"
            exit 1
          fi

          echo "✅ Task 1 script exists"
          echo "✅ Task 2 script exists"
          echo "✅ Task 3 script exists"


          ####################################################################
          # PROCESS ONE DATE + LANGUAGE
          ####################################################################

          process_unit() {

            DATE="$1"
            LANGUAGE="$2"

            echo
            echo
            echo "######################################################################"
            echo "PROCESSING UNIT"
            echo "DATE     : $DATE"
            echo "LANGUAGE : $LANGUAGE"
            echo "######################################################################"


            ##################################################################
            # STRICT LANGUAGE CONTRACT
            ##################################################################

            if [ "$LANGUAGE" != "en" ] && [ "$LANGUAGE" != "zh" ]; then
              echo "❌ INVALID LANGUAGE"
              echo "Language must be exactly:"
              echo "  en"
              echo "  zh"
              echo "Received:"
              echo "  $LANGUAGE"
              exit 1
            fi


            ##################################################################
            # EVENTUNIT PATH
            ##################################################################

            EVENT_ROOT="$RAW_ROOT/${DATE}-EventUnit"
            LANG_ROOT="$EVENT_ROOT/$LANGUAGE"

            ARTICLES_DIR="$LANG_ROOT/articles"
            EVENT_UNITS_DIR="$LANG_ROOT/event_units"

            COMPLETE_MARKER="$LANG_ROOT/_COMPLETE"

            echo
            echo "EventUnit Root : $EVENT_ROOT"
            echo "Language Root  : $LANG_ROOT"
            echo "Articles       : $ARTICLES_DIR"
            echo "EventUnits     : $EVENT_UNITS_DIR"
            echo "Complete       : $COMPLETE_MARKER"


            ##################################################################
            # ALREADY COMPLETE
            ##################################################################

            if [ -f "$COMPLETE_MARKER" ]; then

              echo
              echo "✅ PROCESSING UNIT ALREADY COMPLETE"
              echo "DATE     : $DATE"
              echo "LANGUAGE : $LANGUAGE"
              echo
              echo "Skipping."

              return 0
            fi


            ##################################################################
            # ZH DEPENDENCY
            ##################################################################

            if [ "$LANGUAGE" = "zh" ]; then

              EN_COMPLETE="$RAW_ROOT/${DATE}-EventUnit/en/_COMPLETE"

              echo
              echo "Checking same-day EN dependency..."
              echo "EN Complete Marker:"
              echo "  $EN_COMPLETE"

              if [ ! -f "$EN_COMPLETE" ]; then

                echo
                echo "❌ Same-day EN is not complete."
                echo "ZH cannot start before EN completes."
                echo
                echo "DATE     : $DATE"
                echo "LANGUAGE : zh"

                exit 1
              fi

              echo "✅ Same-day EN complete"

            fi


            ##################################################################
            # INPUT DIRECTORIES
            ##################################################################

            ATOMIC_DIR="$RAW_ROOT/${DATE}-Atomic/$LANGUAGE"
            ENRICHED_DIR="$RAW_ROOT/${DATE}-Enriched/$LANGUAGE"

            echo
            echo "Input directories:"
            echo "Atomic   : $ATOMIC_DIR"
            echo "Enriched : $ENRICHED_DIR"


            ##################################################################
            # INPUT VALIDATION
            ##################################################################

            if [ ! -d "$ATOMIC_DIR" ]; then
              echo "❌ Atomic directory missing:"
              echo "   $ATOMIC_DIR"
              exit 1
            fi

            if [ ! -d "$ENRICHED_DIR" ]; then
              echo "❌ Enriched directory missing:"
              echo "   $ENRICHED_DIR"
              exit 1
            fi

            ATOMIC_COUNT=$(
              find "$ATOMIC_DIR" \
                -type f \
                -name "*.md" \
                | wc -l \
                | tr -d ' '
            )

            ENRICHED_COUNT=$(
              find "$ENRICHED_DIR" \
                -type f \
                -name "*.md" \
                | wc -l \
                | tr -d ' '
            )

            echo
            echo "Atomic   : $ATOMIC_COUNT"
            echo "Enriched : $ENRICHED_COUNT"


            ##################################################################
            # EMPTY INPUT PROTECTION
            ##################################################################

            if [ "$ENRICHED_COUNT" -eq 0 ]; then
              echo "❌ No Enriched News found."
              exit 1
            fi


            ##################################################################
            # CREATE EVENTUNIT DIRECTORIES
            ##################################################################

            mkdir -p "$ARTICLES_DIR"
            mkdir -p "$EVENT_UNITS_DIR"


            ##################################################################
            # TASK 1
            ##################################################################

            echo
            echo
            echo "======================================================================"
            echo "TASK 1 — CLUSTER"
            echo "======================================================================"

            python "$TASK1" \
              --date "$DATE" \
              --language "$LANGUAGE"


            ##################################################################
            # TASK 1 OUTPUT CHECK
            ##################################################################

            INITIAL_CLUSTERS_FILE="$EVENT_UNITS_DIR/_initial_clusters.json"

            if [ ! -f "$INITIAL_CLUSTERS_FILE" ]; then

              echo
              echo "❌ Task 1 output missing:"
              echo "   $INITIAL_CLUSTERS_FILE"

              exit 1
            fi

            echo
            echo "✅ Task 1 output exists:"
            echo "   $INITIAL_CLUSTERS_FILE"


            ##################################################################
            # TASK 2
            ##################################################################

            echo
            echo
            echo "======================================================================"
            echo "TASK 2 — GLOBAL MERGE"
            echo "======================================================================"

            python "$TASK2" \
              --date "$DATE" \
              --language "$LANGUAGE"


            ##################################################################
            # TASK 2 OUTPUT CHECK
            ##################################################################

            MERGED_FILE="$LANG_ROOT/_merged_clusters.json"

            if [ ! -f "$MERGED_FILE" ]; then

              echo
              echo "❌ Task 2 Global Merge output missing:"
              echo "   $MERGED_FILE"

              exit 1
            fi

            echo
            echo "✅ Task 2 Global Merge output exists:"
            echo "   $MERGED_FILE"


            ##################################################################
            # TASK 3
            ##################################################################

            echo
            echo
            echo "======================================================================"
            echo "TASK 3 — EVENTUNIT SYNTHESIS / MATERIALIZATION"
            echo "======================================================================"

            python "$TASK3" \
              --date "$DATE" \
              --language "$LANGUAGE"


            ##################################################################
            # TASK 3 COMPLETE CHECK
            ##################################################################

            if [ ! -f "$COMPLETE_MARKER" ]; then

              echo
              echo "❌ Task 3 returned successfully but _COMPLETE is missing."
              echo
              echo "Expected:"
              echo "  $COMPLETE_MARKER"
              echo
              echo "Task 3 must only return success after:"
              echo "  1. EventUnit index generated"
              echo "  2. EventUnit Markdown files generated"
              echo "  3. EventUnit files validated"
              echo "  4. ARTICLE coverage validated"
              echo "  5. Final EventUnit set verified"
              echo "  6. _COMPLETE written"

              exit 1
            fi

            echo
            echo "✅ Task 3 EventUnit generation complete"
            echo "✅ _COMPLETE exists"


            ##################################################################
            # EVENTUNIT VALIDATION
            #
            # PURE BASH
            #
            # NO EMBEDDED PYTHON
            # NO HEREDOC
            # NO PYTHON INDENTATION PROBLEM
            ##################################################################

            echo
            echo
            echo "======================================================================"
            echo "EVENTUNIT VALIDATION"
            echo "======================================================================"

            echo "Date          : $DATE"
            echo "Language      : $LANGUAGE"
            echo "EventUnit dir : $EVENT_UNITS_DIR"
            echo "Complete      : $COMPLETE_MARKER"


            ##################################################################
            # EVENTUNIT DIRECTORY CHECK
            ##################################################################

            if [ ! -d "$LANG_ROOT" ]; then
              echo "❌ EventUnit language directory missing:"
              echo "   $LANG_ROOT"
              exit 1
            fi

            if [ ! -d "$EVENT_UNITS_DIR" ]; then
              echo "❌ EventUnit directory missing:"
              echo "   $EVENT_UNITS_DIR"
              exit 1
            fi


            ##################################################################
            # EVENTUNIT FILE COUNT
            ##################################################################

            EVENTUNIT_COUNT=$(
              find "$EVENT_UNITS_DIR" \
                -maxdepth 1 \
                -type f \
                -name "*.md" \
                | wc -l \
                | tr -d ' '
            )

            echo
            echo "EventUnits    : $EVENTUNIT_COUNT"


            ##################################################################
            # EMPTY EVENTUNIT PROTECTION
            ##################################################################

            if [ "$EVENTUNIT_COUNT" -eq 0 ]; then
              echo "❌ No EventUnits generated"
              exit 1
            fi


            ##################################################################
            # EVENTUNIT STRUCTURAL VALIDATION
            ##################################################################

            INVALID_EVENTUNIT=0

            while IFS= read -r EVENT_FILE; do

              echo
              echo "Validating:"
              echo "  $EVENT_FILE"

              if [ ! -s "$EVENT_FILE" ]; then
                echo "❌ Empty EventUnit:"
                echo "   $EVENT_FILE"
                INVALID_EVENTUNIT=1
                continue
              fi

              if ! grep -Fq "type: event_unit" "$EVENT_FILE"; then
                echo "❌ Missing type: event_unit"
                echo "   $EVENT_FILE"
                INVALID_EVENTUNIT=1
              fi

              if ! grep -Fq "status: completed" "$EVENT_FILE"; then
                echo "❌ Missing status: completed"
                echo "   $EVENT_FILE"
                INVALID_EVENTUNIT=1
              fi

              if ! grep -Fq "event_id:" "$EVENT_FILE"; then
                echo "❌ Missing event_id"
                echo "   $EVENT_FILE"
                INVALID_EVENTUNIT=1
              fi

            done < <(
              find "$EVENT_UNITS_DIR" \
                -maxdepth 1 \
                -type f \
                -name "*.md" \
                -print \
                | sort
            )


            ##################################################################
            # STRUCTURAL VALIDATION RESULT
            ##################################################################

            if [ "$INVALID_EVENTUNIT" -ne 0 ]; then

              echo
              echo "❌ INVALID EVENTUNITS DETECTED"
              exit 1

            fi


            ##################################################################
            # _COMPLETE CHECK
            ##################################################################

            if [ ! -f "$COMPLETE_MARKER" ]; then
              echo "❌ _COMPLETE missing after EventUnit validation"
              exit 1
            fi


            ##################################################################
            # EVENTUNIT VALIDATION COMPLETE
            ##################################################################

            echo
            echo "======================================================================"
            echo "EVENTUNIT VALIDATION COMPLETE"
            echo "======================================================================"

            echo "Date       : $DATE"
            echo "Language   : $LANGUAGE"
            echo "EventUnits : $EVENTUNIT_COUNT"
            echo "_COMPLETE  : ✅"


            ##################################################################
            # PROCESSING UNIT COMPLETE
            ##################################################################

            echo
            echo "======================================================================"
            echo "PROCESSING UNIT COMPLETE"
            echo "======================================================================"

            echo "DATE     : $DATE"
            echo "LANGUAGE : $LANGUAGE"
            echo "STATUS   : COMPLETE"

            echo
            echo "Task chain:"
            echo "  Task 1 — Cluster                 ✅"
            echo "  Task 2 — Global Merge            ✅"
            echo "  Task 3 — EventUnit Materialize   ✅"
            echo "  EventUnit Validation             ✅"
            echo "  _COMPLETE                        ✅"


            ##################################################################
            # IMMEDIATE GIT PUSH + PULL
            ##################################################################

            echo
            echo
            echo "======================================================================"
            echo "IMMEDIATE GIT PUSH + PULL"
            echo "======================================================================"

            git status --short

            if git diff --quiet && git diff --cached --quiet; then

              echo "No changes detected."

            else

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

