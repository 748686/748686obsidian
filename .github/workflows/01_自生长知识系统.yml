name: 01 自生长知识系统 - 主运行

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions 使用 UTC
    # UTC 00:00 = 北京时间 08:00
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:

  knowledge-system:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout 748686obsidian
      # ==========================================================

      - name: Checkout 748686obsidian
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. Define Beijing system date
      #
      # 整个自生长知识系统统一使用北京时间。
      # ==========================================================

      - name: Set Beijing system date
        run: |
          set -e

          export TZ=Asia/Shanghai

          TODAY=$(date +%Y-%m-%d)

          echo "TODAY=$TODAY" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "SYSTEM DATE"
          echo "=========================================="

          echo "Timezone: Asia/Shanghai"
          echo "Today: $TODAY"

      # ==========================================================
      # 3. Checkout Horizon gh-pages FIRST
      #
      # 先检查 Horizon 今天是否已经生成文章。
      #
      # 如果已经存在：
      #   → 不运行 Horizon
      #   → 直接进入后续流程
      #
      # 如果不存在：
      #   → 后面才启动 Horizon
      # ==========================================================

      - name: Checkout Horizon gh-pages for pre-check
        uses: actions/checkout@v4
        with:
          repository: 748686/Horizon
          ref: gh-pages
          path: horizon-pages
          fetch-depth: 1

      # ==========================================================
      # 4. Check whether today's Horizon posts already exist
      # ==========================================================

      - name: Check today's Horizon posts
        id: horizon_precheck
        run: |
          set -e

          POSTS_DIR="horizon-pages/_posts"

          echo "=========================================="
          echo "CHECK TODAY'S HORIZON POSTS"
          echo "=========================================="

          echo "Today:"
          echo "$TODAY"

          echo
          echo "Posts directory:"
          echo "$POSTS_DIR"

          if [ ! -d "$POSTS_DIR" ]; then
            echo
            echo "⚠️ Horizon _posts directory not found"
            echo "HORIZON_NEEDED=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo
          echo "Searching for:"
          echo "${TODAY}-*.md"

          TODAY_COUNT=$(find "$POSTS_DIR" \
            -type f \
            -name "${TODAY}-*.md" \
            | wc -l)

          echo
          echo "Today's Horizon post count:"
          echo "$TODAY_COUNT"

          echo
          echo "Today's posts:"

          find "$POSTS_DIR" \
            -type f \
            -name "${TODAY}-*.md" \
            | sort

          if [ "$TODAY_COUNT" -gt 0 ]; then

            echo
            echo "✅ Today's Horizon posts already exist"
            echo "HORIZON_NEEDED=false" >> "$GITHUB_OUTPUT"

          else

            echo
            echo "⚠️ Today's Horizon posts do not exist"
            echo "HORIZON_NEEDED=true" >> "$GITHUB_OUTPUT"

          fi

      # ==========================================================
      # 5. Checkout Horizon main ONLY if needed
      # ==========================================================

      - name: Checkout Horizon main
        if: steps.horizon_precheck.outputs.HORIZON_NEEDED == 'true'
        uses: actions/checkout@v4
        with:
          repository: 748686/Horizon
          ref: main
          path: horizon
          fetch-depth: 1

      # ==========================================================
      # 6. Setup Python
      # ==========================================================

      - name: Setup Python
        if: steps.horizon_precheck.outputs.HORIZON_NEEDED == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================================
      # 7. Install uv
      # ==========================================================

      - name: Install uv
        if: steps.horizon_precheck.outputs.HORIZON_NEEDED == 'true'
        uses: astral-sh/setup-uv@v6

      # ==========================================================
      # 8. Install Horizon
      # ==========================================================

      - name: Install Horizon
        if: steps.horizon_precheck.outputs.HORIZON_NEEDED == 'true'
        working-directory: horizon
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL HORIZON"
          echo "=========================================="

          uv sync

          echo
          echo "✅ Horizon installed"

      # ==========================================================
      # 9. Check Agnes API configuration
      # ==========================================================

      - name: Check Agnes API configuration
        if: steps.horizon_precheck.outputs.HORIZON_NEEDED == 'true'
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -e

          echo "=========================================="
          echo "CHECK AGNES API CONFIGURATION"
          echo "=========================================="

          if [ -z "$AGNES_API_KEY" ]; then
            echo "❌ AGNES_API_KEY is missing"
            exit 1
          fi

          echo "✅ AGNES_API_KEY exists"

          echo
          echo "API Base:"
          echo "https://api.agnes-ai.cn/v1"

          echo
          echo "Model:"
          echo "agnes-2.5-flash"

      # ==========================================================
      # 10. Run Horizon
      #
      # IMPORTANT:
      #
      # 完全使用 Horizon 自己的配置：
      #
      # horizon/data/config.github.json
      #
      # 不使用：
      #
      # 01_自生长知识系统/00_System/horizon_config.json
      #
      # 也不使用：
      #
      # horizon_runtime_config.json
      # ==========================================================

      - name: Run Horizon
        if: steps.horizon_precheck.outputs.HORIZON_NEEDED == 'true'
        working-directory: horizon
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          echo "=========================================="
          echo "RUN HORIZON"
          echo "=========================================="

          echo "Repository:"
          echo "748686/Horizon"

          echo
          echo "Config:"
          echo "data/config.github.json"

          echo
          echo "API:"
          echo "https://api.agnes-ai.cn/v1"

          echo
          echo "Model:"
          echo "agnes-2.5-flash"

          echo
          echo "Hours:"
          echo "24"

          echo
          echo "Running Horizon..."

          uv run horizon \
            --hours 24 \
            --config data/config.github.json

          echo
          echo "=========================================="
          echo "HORIZON COMPLETED"
          echo "=========================================="

      # ==========================================================
      # 11. If Horizon was run, remove old gh-pages checkout
      #
      # 然后重新拉取最新 gh-pages。
      # ==========================================================

      - name: Prepare latest Horizon gh-pages checkout
        if: steps.horizon_precheck.outputs.HORIZON_NEEDED == 'true'
        run: |
          set -e

          echo "=========================================="
          echo "PREPARE LATEST HORIZON GH-PAGES"
          echo "=========================================="

          rm -rf horizon-pages

          echo "Old Horizon gh-pages checkout removed"

      # ==========================================================
      # 12. Checkout latest Horizon gh-pages AFTER Horizon
      # ==========================================================

      - name: Checkout latest Horizon gh-pages
        if: steps.horizon_precheck.outputs.HORIZON_NEEDED == 'true'
        uses: actions/checkout@v4
        with:
          repository: 748686/Horizon
          ref: gh-pages
          path: horizon-pages
          fetch-depth: 1

      # ==========================================================
      # 13. Final verification
      #
      # 无论：
      #
      # A. 今天原本就有文章
      #
      # B. 刚刚运行 Horizon 后产生文章
      #
      # 都必须在这里再次确认。
      #
      # 如果没有：
      #   → 整个系统停止
      #
      # 如果有：
      #   → 继续 Raw News
      # ==========================================================

      - name: Verify today's Horizon posts
        run: |
          set -e

          POSTS_DIR="horizon-pages/_posts"

          echo "=========================================="
          echo "FINAL VERIFY TODAY'S HORIZON POSTS"
          echo "=========================================="

          echo "Timezone:"
          echo "Asia/Shanghai"

          echo
          echo "Today:"
          echo "$TODAY"

          echo
          echo "Expected:"
          echo "${TODAY}-*.md"

          if [ ! -d "$POSTS_DIR" ]; then
            echo
            echo "❌ Horizon _posts directory not found"
            exit 1
          fi

          TODAY_COUNT=$(find "$POSTS_DIR" \
            -type f \
            -name "${TODAY}-*.md" \
            | wc -l)

          echo
          echo "Today's Horizon post count:"
          echo "$TODAY_COUNT"

          echo
          echo "Today's Horizon posts:"

          find "$POSTS_DIR" \
            -type f \
            -name "${TODAY}-*.md" \
            | sort

          if [ "$TODAY_COUNT" -eq 0 ]; then
            echo
            echo "❌ Horizon did not generate today's posts"
            echo "System stopped before Raw News."
            exit 1
          fi

          echo
          echo "✅ Today's Horizon posts confirmed"

      # ==========================================================
      # 14. Copy TODAY'S Horizon posts → Raw News
      #
      # 只复制：
      #
      # ${TODAY}-*.md
      #
      # 不复制历史文章。
      # ==========================================================

      - name: Copy today's Horizon posts to Raw News
        run: |
          set -e

          POSTS_DIR="horizon-pages/_posts"

          RAW_DIR="01_自生长知识系统/Raw News/$TODAY"

          mkdir -p "$RAW_DIR"

          echo "=========================================="
          echo "COPY TODAY'S HORIZON POSTS → RAW NEWS"
          echo "=========================================="

          echo "Today:"
          echo "$TODAY"

          echo
          echo "Source:"
          echo "$POSTS_DIR"

          echo
          echo "Destination:"
          echo "$RAW_DIR"

          echo
          echo "Copying today's posts..."

          find "$POSTS_DIR" \
            -type f \
            -name "${TODAY}-*.md" \
            -exec cp {} "$RAW_DIR/" \;

          echo
          echo "Raw News result:"

          find "$RAW_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | sort

          RAW_COUNT=$(find "$RAW_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo
          echo "Raw News files:"
          echo "$RAW_COUNT"

          if [ "$RAW_COUNT" -eq 0 ]; then
            echo
            echo "❌ Raw News is empty"
            exit 1
          fi

          echo
          echo "✅ Raw News created successfully"

      # ==========================================================
      # 15. Build Atomic News
      # ==========================================================

      - name: Build Atomic News
        run: |
          set -e

          RAW_DIR="01_自生长知识系统/Raw News/$TODAY"

          ATOMIC_DIR="01_自生长知识系统/Raw News/$TODAY-Atomic"

          ZH_DIR="$ATOMIC_DIR/zh"
          EN_DIR="$ATOMIC_DIR/en"

          mkdir -p "$ZH_DIR"
          mkdir -p "$EN_DIR"

          echo "=========================================="
          echo "BUILD ATOMIC NEWS"
          echo "=========================================="

          echo "Raw:"
          echo "$RAW_DIR"

          echo
          echo "Atomic:"
          echo "$ATOMIC_DIR"

          FOUND=0

          while IFS= read -r file; do

            FOUND=$((FOUND + 1))

            filename=$(basename "$file")

            language="zh"

            if grep -qi \
              -E \
              'language:[[:space:]]*(en|english)' \
              "$file"; then

              language="en"

            elif grep -qi \
              -E \
              'language:[[:space:]]*zh' \
              "$file"; then

              language="zh"

            fi

            if [ "$language" = "en" ]; then

              cp "$file" "$EN_DIR/$filename"

            else

              cp "$file" "$ZH_DIR/$filename"

            fi

          done < <(
            find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | sort
          )

          echo
          echo "Processed:"
          echo "$FOUND"

          if [ "$FOUND" -eq 0 ]; then
            echo
            echo "❌ No Raw News files found"
            exit 1
          fi

          echo
          echo "Chinese Atomic:"

          find "$ZH_DIR" \
            -type f \
            -name "*.md" \
            | sort

          echo
          echo "English Atomic:"

          find "$EN_DIR" \
            -type f \
            -name "*.md" \
            | sort

          echo
          echo "✅ Atomic News completed"

      # ==========================================================
      # 16. Source Enrichment V3
      # ==========================================================

      - name: Run Source Enrichment V3
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL SOURCE ENRICHMENT DEPENDENCIES"
          echo "=========================================="

          python -m pip install --upgrade pip
          python -m pip install requests

          echo
          echo "=========================================="
          echo "HORIZON SOURCE ENRICHMENT V3"
          echo "=========================================="

          ZH="01_自生长知识系统/Raw News/$TODAY-Atomic/zh"

          EN="01_自生长知识系统/Raw News/$TODAY-Atomic/en"

          OUTPUT="01_自生长知识系统/Raw News/$TODAY-Enriched"

          SCRIPT="01_自生长知识系统/scripts/source_enrichment.py"

          echo
          echo "Chinese Atomic:"
          echo "$ZH"

          echo
          echo "English Atomic:"
          echo "$EN"

          echo
          echo "Output:"
          echo "$OUTPUT"

          echo
          echo "API:"
          echo "https://api.agnes-ai.cn/v1"

          echo
          echo "Model:"
          echo "agnes-2.5-flash"

          echo
          echo "Running..."

          python "$SCRIPT" \
            --zh "$ZH" \
            --en "$EN" \
            --output "$OUTPUT" \
            --date "$TODAY"

          echo
          echo "✅ Source Enrichment V3 completed"

      # ==========================================================
      # 17. Validate Chinese Enriched
      # ==========================================================

      - name: Validate Chinese Enriched
        run: |
          set -e

          DIR="01_自生长知识系统/Raw News/$TODAY-Enriched/zh"

          echo "=========================================="
          echo "VALIDATE CHINESE ENRICHED"
          echo "=========================================="

          if [ ! -d "$DIR" ]; then
            echo "❌ Chinese Enriched directory missing"
            exit 1
          fi

          COUNT=$(find "$DIR" \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "Chinese enriched files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "⚠️ No Chinese enriched files"
          else
            echo "✅ Chinese Enriched OK"
          fi

      # ==========================================================
      # 18. Validate English Enriched
      # ==========================================================

      - name: Validate English Enriched
        run: |
          set -e

          DIR="01_自生长知识系统/Raw News/$TODAY-Enriched/en"

          echo "=========================================="
          echo "VALIDATE ENGLISH ENRICHED"
          echo "=========================================="

          if [ ! -d "$DIR" ]; then
            echo "❌ English Enriched directory missing"
            exit 1
          fi

          COUNT=$(find "$DIR" \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "English enriched files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "⚠️ No English enriched files"
          else
            echo "✅ English Enriched OK"
          fi

      # ==========================================================
      # 19. Validate Front Matter
      # ==========================================================

      - name: Validate Front Matter
        run: |
          set -e

          DIR="01_自生长知识系统/Raw News/$TODAY-Enriched"

          echo "=========================================="
          echo "VALIDATE FRONT MATTER"
          echo "=========================================="

          TOTAL=0
          FAILED=0

          while IFS= read -r file; do

            TOTAL=$((TOTAL + 1))

            if ! head -n 1 "$file" | grep -q "^---$"; then

              echo "❌ Missing front matter:"
              echo "$file"

              FAILED=$((FAILED + 1))

            fi

          done < <(
            find "$DIR" \
              -type f \
              -name "*.md" \
              | sort
          )

          echo
          echo "Checked:"
          echo "$TOTAL"

          echo "Failed:"
          echo "$FAILED"

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ Front Matter validation failed"
            exit 1
          fi

          echo "✅ Front Matter OK"

      # ==========================================================
      # 20. Report Source Status
      # ==========================================================

      - name: Report source status
        run: |
          set -e

          DIR="01_自生长知识系统/Raw News/$TODAY-Enriched"

          echo "=========================================="
          echo "SOURCE STATUS"
          echo "=========================================="

          python - <<'PY'

          from pathlib import Path
          from collections import Counter
          import os
          import re

          root = (
              Path("01_自生长知识系统/Raw News")
              / f"{os.environ['TODAY']}-Enriched"
          )

          counter = Counter()

          total = 0

          for path in root.rglob("*.md"):

              total += 1

              text = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              match = re.search(
                  r"^source_status:\s*(.+)$",
                  text,
                  re.MULTILINE
              )

              if match:
                  status = match.group(1).strip()
              else:
                  status = "missing"

              counter[status] += 1

          print(f"Total: {total}")

          for status, count in sorted(
              counter.items()
          ):
              print(
                  f"{status}: {count}"
              )

          PY

      # ==========================================================
      # 21. Run Knowledge Pipeline V2
      # ==========================================================

      - name: Run Knowledge Pipeline V2
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          echo "=========================================="
          echo "KNOWLEDGE PIPELINE V2"
          echo "=========================================="

          echo "API:"
          echo "https://api.agnes-ai.cn/v1"

          echo
          echo "Model:"
          echo "agnes-2.5-flash"

          echo
          echo "Skills:"

          find "01_自生长知识系统/Skills" \
            -type f \
            -name "*.md" \
            | sort

          echo
          echo "Running..."

          python \
            "01_自生长知识系统/scripts/knowledge_pipeline.py"

          echo
          echo "✅ Knowledge Pipeline V2 completed"

      # ==========================================================
      # 22. Run Weekly Report V2
      # ==========================================================

      - name: Run Weekly Report V2
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          echo "=========================================="
          echo "WEEKLY REPORT V2"
          echo "=========================================="

          python \
            "01_自生长知识系统/scripts/weekly_report.py"

          echo
          echo "✅ Weekly Report V2 completed"

      # ==========================================================
      # 23. Show final system result
      # ==========================================================

      - name: Show final result
        run: |
          set -e

          echo "=========================================="
          echo "748686 KNOWLEDGE SYSTEM RESULT"
          echo "=========================================="

          echo
          echo "TIMEZONE:"
          echo "Asia/Shanghai"

          echo
          echo "TODAY:"
          echo "$TODAY"

          echo
          echo "Raw News:"

          find \
            "01_自生长知识系统/Raw News/$TODAY" \
            -type f \
            -name "*.md" \
            | wc -l

          echo
          echo "Atomic News:"

          find \
            "01_自生长知识系统/Raw News/$TODAY-Atomic" \
            -type f \
            -name "*.md" \
            | wc -l

          echo
          echo "Enriched News:"

          find \
            "01_自生长知识系统/Raw News/$TODAY-Enriched" \
            -type f \
            -name "*.md" \
            | wc -l

          echo
          echo "Daily Reports:"

          find \
            "01_自生长知识系统/05_日报" \
            -type f \
            -name "*.md" \
            | sort \
            | tail -10

          echo
          echo "Knowledge:"

          find \
            "01_自生长知识系统/08_知识库" \
            -type f \
            -name "*.md" \
            | sort \
            | tail -10

          echo
          echo "Topics:"

          find \
            "01_自生长知识系统/07_专题报告" \
            -type f \
            -name "*.md" \
            | sort \
            | tail -10

          echo
          echo "Weekly:"

          find \
            "01_自生长知识系统/06_周报" \
            -type f \
            -name "*.md" \
            | sort \
            | tail -10

      # ==========================================================
      # 24. Commit everything
      # ==========================================================

      - name: Commit Knowledge System
        run: |
          set -e

          echo "=========================================="
          echo "COMMIT KNOWLEDGE SYSTEM"
          echo "=========================================="

          git config user.name \
            "748686 Knowledge Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "01_自生长知识系统"

          if git diff --cached --quiet; then

            echo "No changes to commit"

          else

            git commit \
              -m "chore: daily knowledge system $TODAY"

            git push

            echo "✅ Changes pushed to GitHub"

          fi

      # ==========================================================
      # 25. Complete job
      # ==========================================================

      - name: Complete job
        run: |
          echo
          echo "=========================================="
          echo "748686 自生长知识系统"
          echo "=========================================="

          echo
          echo "TIMEZONE:"
          echo "Asia/Shanghai"

          echo
          echo "TODAY:"
          echo "$TODAY"

          echo
          echo "SCHEDULE:"
          echo "08:00 Beijing Time"

          echo
          echo "Horizon:"
          echo "✅ verified"

          echo
          echo "Today's Horizon Posts:"
          echo "✅ verified"

          echo
          echo "Raw News:"
          echo "✅ completed"

          echo
          echo "Atomic News:"
          echo "✅ completed"

          echo
          echo "Source Enrichment V3:"
          echo "✅ completed"

          echo
          echo "27 Skills:"
          echo "✅ Knowledge Pipeline V2 completed"

          echo
          echo "Knowledge Cards:"
          echo "✅ generated"

          echo
          echo "Topic Candidates:"
          echo "✅ generated"

          echo
          echo "Weekly Report:"
          echo "✅ generated"

          echo
          echo "GitHub:"
          echo "✅ pushed"

          echo
          echo "=========================================="
          echo "SYSTEM COMPLETE"
          echo "=========================================="
