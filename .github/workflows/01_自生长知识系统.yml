name: 01 自生长知识系统 - 主运行

on:
  workflow_dispatch:

  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:

  knowledge-system:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout 748686obsidian
      # ==========================================================

      - name: Checkout 748686obsidian
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 2. Setup Python
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================================
      # 3. Install uv
      # ==========================================================

      - name: Install uv
        uses: astral-sh/setup-uv@v6


      # ==========================================================
      # 4. Calculate three processing dates
      #
      # 永远只处理：
      #
      # 前天
      # 昨天
      # 今天
      #
      # 例如：
      # 2026-08-28
      # 2026-08-29
      # 2026-08-30
      # ==========================================================

      - name: Calculate three processing dates
        run: |
          set -e

          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          YESTERDAY=$(TZ=Asia/Shanghai date -d "$TODAY -1 day" +%Y-%m-%d)
          DAY_BEFORE=$(TZ=Asia/Shanghai date -d "$TODAY -2 days" +%Y-%m-%d)

          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          echo "YESTERDAY=$YESTERDAY" >> "$GITHUB_ENV"
          echo "DAY_BEFORE=$DAY_BEFORE" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "PROCESSING DATES"
          echo "=========================================="

          echo "DAY_BEFORE : $DAY_BEFORE"
          echo "YESTERDAY  : $YESTERDAY"
          echo "TODAY      : $TODAY"

          echo
          echo "Timezone:"
          echo "Asia/Shanghai"


      # ==========================================================
      # 5. Checkout Horizon main
      # ==========================================================

      - name: Checkout Horizon main
        uses: actions/checkout@v4
        with:
          repository: 748686/Horizon
          ref: main
          path: horizon


      # ==========================================================
      # 6. Install Horizon
      # ==========================================================

      - name: Install Horizon
        working-directory: horizon
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL HORIZON"
          echo "=========================================="

          uv sync

          if [ ! -f "data/config.github.json" ]; then
            echo "❌ Horizon native config not found"
            exit 1
          fi

          echo "✅ Horizon installed"
          echo "✅ Native config found"


      # ==========================================================
      # 7. Check AGNES
      # ==========================================================

      - name: Check Agnes API configuration
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -e

          if [ -z "$AGNES_API_KEY" ]; then
            echo "❌ AGNES_API_KEY is missing"
            exit 1
          fi

          echo "✅ AGNES_API_KEY exists"


      # ==========================================================
      # 8. Get Horizon gh-pages
      # ==========================================================

      - name: Get Horizon gh-pages
        run: |
          set -e

          rm -rf horizon-pages

          git clone \
            --quiet \
            --depth 1 \
            --branch gh-pages \
            "https://github.com/748686/Horizon.git" \
            horizon-pages

          if [ ! -d "horizon-pages/_posts" ]; then
            echo "❌ Horizon _posts directory not found"
            exit 1
          fi

          echo "✅ Horizon gh-pages downloaded"


      # ==========================================================
      # 9. Check three-day Raw News
      #
      # 三天逐日检查。
      #
      # 已存在：
      #     跳过
      #
      # 不存在：
      #     从 Horizon gh-pages 补回来
      # ==========================================================

      - name: Check three-day Raw News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          mkdir -p "$RAW_ROOT"

          echo "=========================================="
          echo "CHECK THREE-DAY RAW NEWS"
          echo "=========================================="

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            echo
            echo "------------------------------------------"
            echo "RAW CHECK: $DATE"
            echo "------------------------------------------"

            RAW_DIR="$RAW_ROOT/$DATE"

            if [ -d "$RAW_DIR" ]; then

              echo "📁 Raw directory exists: $RAW_DIR"

            else

              echo "❌ Raw directory missing"
              echo "▶️ Creating: $RAW_DIR"

              mkdir -p "$RAW_DIR"

            fi

            COUNT=$(find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Raw files: $COUNT"

            if [ "$COUNT" -gt 0 ]; then

              echo "✅ Raw News already exists"
              echo "⏭️ Skip $DATE"

              continue

            fi

            echo "❌ Raw News content missing"
            echo "▶️ Looking in Horizon"

            HCOUNT=$(find \
              "horizon-pages/_posts" \
              -maxdepth 1 \
              -type f \
              -name "$DATE*.md" \
              | wc -l)

            echo "Horizon files: $HCOUNT"

            if [ "$HCOUNT" -gt 0 ]; then

              while IFS= read -r file; do

                cp "$file" "$RAW_DIR/"

              done < <(
                find \
                  "horizon-pages/_posts" \
                  -maxdepth 1 \
                  -type f \
                  -name "$DATE*.md" \
                  | sort
              )

              echo "✅ Raw News imported: $DATE"

            else

              if [ "$DATE" = "$TODAY" ]; then

                echo "❌ Today's Horizon output missing"
                echo "▶️ Horizon must run"

              else

                echo "❌ Historical Horizon output missing: $DATE"
                echo "Cannot fabricate historical data"

              fi

            fi

          done


      # ==========================================================
      # 10. Determine whether today's Horizon must run
      #
      # 只有 TODAY 的 Raw 仍然没有内容时运行 Horizon。
      # ==========================================================

      - name: Check whether today's Horizon must run
        run: |
          set -e

          RAW_DIR="01_自生长知识系统/Raw News/$TODAY"

          if [ ! -d "$RAW_DIR" ]; then
            mkdir -p "$RAW_DIR"
          fi

          COUNT=$(find "$RAW_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "Today's Raw News: $COUNT"

          if [ "$COUNT" -gt 0 ]; then

            echo "HORIZON_TODAY_READY=true" >> "$GITHUB_ENV"

            echo "✅ Today's Raw News ready"
            echo "⏭️ Horizon does not need to run"

          else

            echo "HORIZON_TODAY_READY=false" >> "$GITHUB_ENV"

            echo "❌ Today's Raw News missing"
            echo "▶️ Horizon must run"

          fi


      # ==========================================================
      # 11. Run Horizon
      # ==========================================================

      - name: Run Horizon
        if: env.HORIZON_TODAY_READY != 'true'
        working-directory: horizon
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          echo "=========================================="
          echo "RUN HORIZON"
          echo "=========================================="

          echo "Date:"
          echo "$TODAY"

          uv run horizon \
            --hours 24 \
            --config data/config.github.json

          echo
          echo "✅ Horizon process finished"


      # ==========================================================
      # 12. Refresh Horizon gh-pages
      # ==========================================================

      - name: Refresh Horizon gh-pages
        if: env.HORIZON_TODAY_READY != 'true'
        run: |
          set -e

          rm -rf horizon-pages

          for i in {1..10}; do

            echo
            echo "=========================================="
            echo "HORIZON OUTPUT CHECK $i / 10"
            echo "=========================================="

            git clone \
              --quiet \
              --depth 1 \
              --branch gh-pages \
              "https://github.com/748686/Horizon.git" \
              horizon-pages

            COUNT=$(find \
              "horizon-pages/_posts" \
              -maxdepth 1 \
              -type f \
              -name "$TODAY*.md" \
              | wc -l)

            echo "Today's Horizon files: $COUNT"

            if [ "$COUNT" -gt 0 ]; then

              echo "✅ Today's Horizon output found"

              break

            fi

            rm -rf horizon-pages

            if [ "$i" -lt 10 ]; then
              sleep 30
            fi

          done

          COUNT=$(find \
            "horizon-pages/_posts" \
            -maxdepth 1 \
            -type f \
            -name "$TODAY*.md" \
            | wc -l)

          if [ "$COUNT" -eq 0 ]; then

            echo "❌ Today's Horizon output not found"

            exit 1

          fi


      # ==========================================================
      # 13. Complete three-day Raw News
      #
      # Horizon 完成后重新检查三天。
      # ==========================================================

      - name: Complete three-day Raw News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            echo
            echo "=========================================="
            echo "COMPLETE RAW: $DATE"
            echo "=========================================="

            RAW_DIR="$RAW_ROOT/$DATE"

            if [ ! -d "$RAW_DIR" ]; then

              echo "❌ Raw directory missing"
              echo "▶️ Creating $RAW_DIR"

              mkdir -p "$RAW_DIR"

            fi

            COUNT=$(find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            if [ "$COUNT" -gt 0 ]; then

              echo "✅ Raw ready: $DATE ($COUNT files)"

              continue

            fi

            HCOUNT=$(find \
              "horizon-pages/_posts" \
              -maxdepth 1 \
              -type f \
              -name "$DATE*.md" \
              | wc -l)

            if [ "$HCOUNT" -gt 0 ]; then

              while IFS= read -r file; do
                cp "$file" "$RAW_DIR/"
              done < <(
                find \
                  "horizon-pages/_posts" \
                  -maxdepth 1 \
                  -type f \
                  -name "$DATE*.md" \
                  | sort
              )

              echo "✅ Raw imported: $DATE"

            else

              echo "❌ Cannot obtain Raw News for $DATE"

              exit 1

            fi

          done


      # ==========================================================
      # 14. Atomic News
      #
      # ★ 核心修改 ★
      #
      # 第一判断：
      #     日期目录是否存在
      #
      # 第二判断：
      #     zh / en 是否存在
      #
      # 第三判断：
      #     对应内容是否存在
      #
      # 不再把“文件数量”作为第一判断。
      # ==========================================================

      - name: Build missing Atomic News
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          echo
          echo "============================================================"
          echo "ATOMIC NEWS - THREE DAY DIRECTORY CHECK"
          echo "============================================================"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            echo
            echo "############################################################"
            echo "ATOMIC DATE: $DATE"
            echo "############################################################"

            RAW_DIR="$RAW_ROOT/$DATE"
            ATOMIC_DIR="$RAW_ROOT/${DATE}-Atomic"
            ZH_DIR="$ATOMIC_DIR/zh"
            EN_DIR="$ATOMIC_DIR/en"

            # ----------------------------------------------------
            # 1. 判断日期目录
            # ----------------------------------------------------

            if [ -d "$ATOMIC_DIR" ]; then

              echo "📁 Atomic directory exists"

            else

              echo "❌ Atomic directory missing"
              echo "▶️ Creating $ATOMIC_DIR"

              mkdir -p "$ATOMIC_DIR"

            fi

            # ----------------------------------------------------
            # 2. 判断 ZH
            # ----------------------------------------------------

            if [ -d "$ZH_DIR" ]; then

              echo "📁 Atomic ZH directory exists"

            else

              echo "❌ Atomic ZH directory missing"
              echo "▶️ Creating $ZH_DIR"

              mkdir -p "$ZH_DIR"

            fi

            # ----------------------------------------------------
            # 3. 判断 EN
            # ----------------------------------------------------

            if [ -d "$EN_DIR" ]; then

              echo "📁 Atomic EN directory exists"

            else

              echo "❌ Atomic EN directory missing"
              echo "▶️ Creating $EN_DIR"

              mkdir -p "$EN_DIR"

            fi

            # ----------------------------------------------------
            # 4. Raw 必须存在
            # ----------------------------------------------------

            if [ ! -d "$RAW_DIR" ]; then

              echo "❌ Raw directory missing: $RAW_DIR"

              exit 1

            fi

            RAW_COUNT=$(find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            if [ "$RAW_COUNT" -eq 0 ]; then

              echo "❌ No Raw News for $DATE"

              exit 1

            fi

            echo "Raw files: $RAW_COUNT"

            # ----------------------------------------------------
            # 5. 对应日报分别进入 ZH / EN
            #
            # 这里保持当前系统已有的集成处理逻辑。
            # 不修改 Raw。
            # ----------------------------------------------------

            while IFS= read -r file; do

              filename=$(basename "$file")

              # 已经存在于 Atomic 中，跳过

              if [ -f "$ZH_DIR/$filename" ] || \
                 [ -f "$EN_DIR/$filename" ]; then

                echo "⏭️ Atomic already exists: $filename"

                continue

              fi

              language="zh"

              if grep -qi \
                -E \
                'language:[[:space:]]*(en|english)' \
                "$file"; then

                language="en"

              elif grep -qi \
                -E \
                'language:[[:space:]]*zh' \
                "$file"; then

                language="zh"

              elif [[ "$filename" == *"-en.md" ]]; then

                language="en"

              elif [[ "$filename" == *"-zh.md" ]]; then

                language="zh"

              fi

              if [ "$language" = "en" ]; then

                cp "$file" "$EN_DIR/$filename"

                echo "✅ Atomic EN: $filename"

              else

                cp "$file" "$ZH_DIR/$filename"

                echo "✅ Atomic ZH: $filename"

              fi

            done < <(
              find "$RAW_DIR" \
                -maxdepth 1 \
                -type f \
                -name "*.md" \
                | sort
            )

            # ----------------------------------------------------
            # 6. 最终检查目录结构
            # ----------------------------------------------------

            if [ ! -d "$ATOMIC_DIR" ]; then

              echo "❌ Atomic directory missing after generation"

              exit 1

            fi

            if [ ! -d "$ZH_DIR" ]; then

              echo "❌ Atomic ZH directory missing after generation"

              exit 1

            fi

            if [ ! -d "$EN_DIR" ]; then

              echo "❌ Atomic EN directory missing after generation"

              exit 1

            fi

            ZH_COUNT=$(find "$ZH_DIR" \
              -type f \
              -name "*.md" \
              | wc -l)

            EN_COUNT=$(find "$EN_DIR" \
              -type f \
              -name "*.md" \
              | wc -l)

            TOTAL=$((ZH_COUNT + EN_COUNT))

            echo
            echo "Atomic ZH: $ZH_COUNT"
            echo "Atomic EN: $EN_COUNT"
            echo "Atomic total: $TOTAL"

            if [ "$TOTAL" -eq 0 ]; then

              echo "❌ Atomic directory exists but contains no files"

              exit 1

            fi

            echo "✅ Atomic complete: $DATE"

          done


      # ==========================================================
      # 15. Verify THREE Atomic directories
      #
      # 只有三天 Atomic 全部存在，
      # 才允许进入 Enriched。
      # ==========================================================

      - name: Verify three-day Atomic structure
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          echo
          echo "============================================================"
          echo "VERIFY THREE-DAY ATOMIC STRUCTURE"
          echo "============================================================"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            ATOMIC_DIR="$RAW_ROOT/${DATE}-Atomic"
            ZH_DIR="$ATOMIC_DIR/zh"
            EN_DIR="$ATOMIC_DIR/en"

            echo
            echo "DATE: $DATE"

            if [ ! -d "$ATOMIC_DIR" ]; then
              echo "❌ Missing Atomic directory: $ATOMIC_DIR"
              exit 1
            fi

            if [ ! -d "$ZH_DIR" ]; then
              echo "❌ Missing Atomic ZH directory: $ZH_DIR"
              exit 1
            fi

            if [ ! -d "$EN_DIR" ]; then
              echo "❌ Missing Atomic EN directory: $EN_DIR"
              exit 1
            fi

            COUNT=$(find "$ATOMIC_DIR" \
              -type f \
              -name "*.md" \
              | wc -l)

            if [ "$COUNT" -eq 0 ]; then
              echo "❌ Atomic directory empty: $DATE"
              exit 1
            fi

            echo "✅ Atomic structure ready: $DATE"

          done

          echo
          echo "✅ THREE-DAY ATOMIC STRUCTURE COMPLETE"


      # ==========================================================
      # 16. Enriched News
      #
      # ★ 核心修改 ★
      #
      # 第一判断：
      #     日期目录是否存在
      #
      # 第二判断：
      #     zh / en 是否存在
      #
      # 第三判断：
      #     内容是否存在
      #
      # 缺哪一天就只处理哪一天。
      # ==========================================================

      - name: Build missing Enriched News
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install requests

          SCRIPT="01_自生长知识系统/scripts/source_enrichment.py"

          RAW_ROOT="01_自生长知识系统/Raw News"

          echo
          echo "============================================================"
          echo "ENRICHED NEWS - THREE DAY DIRECTORY CHECK"
          echo "============================================================"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            echo
            echo "############################################################"
            echo "ENRICHED DATE: $DATE"
            echo "############################################################"

            ATOMIC_DIR="$RAW_ROOT/${DATE}-Atomic"
            ZH_DIR="$ATOMIC_DIR/zh"
            EN_DIR="$ATOMIC_DIR/en"

            OUTPUT="$RAW_ROOT/${DATE}-Enriched"
            OUTPUT_ZH="$OUTPUT/zh"
            OUTPUT_EN="$OUTPUT/en"

            # ----------------------------------------------------
            # 1. Atomic 必须完整
            # ----------------------------------------------------

            if [ ! -d "$ATOMIC_DIR" ]; then

              echo "❌ Atomic directory missing: $ATOMIC_DIR"

              exit 1

            fi

            if [ ! -d "$ZH_DIR" ]; then

              echo "❌ Atomic ZH directory missing: $ZH_DIR"

              exit 1

            fi

            if [ ! -d "$EN_DIR" ]; then

              echo "❌ Atomic EN directory missing: $EN_DIR"

              exit 1

            fi

            # ----------------------------------------------------
            # 2. 判断 Enriched 日期目录
            # ----------------------------------------------------

            if [ -d "$OUTPUT" ]; then

              echo "📁 Enriched directory exists"

            else

              echo "❌ Enriched directory missing"
              echo "▶️ Creating $OUTPUT"

              mkdir -p "$OUTPUT"

            fi

            # ----------------------------------------------------
            # 3. 判断 ZH
            # ----------------------------------------------------

            if [ -d "$OUTPUT_ZH" ]; then

              echo "📁 Enriched ZH directory exists"

            else

              echo "❌ Enriched ZH directory missing"
              echo "▶️ Creating $OUTPUT_ZH"

              mkdir -p "$OUTPUT_ZH"

            fi

            # ----------------------------------------------------
            # 4. 判断 EN
            # ----------------------------------------------------

            if [ -d "$OUTPUT_EN" ]; then

              echo "📁 Enriched EN directory exists"

            else

              echo "❌ Enriched EN directory missing"
              echo "▶️ Creating $OUTPUT_EN"

              mkdir -p "$OUTPUT_EN"

            fi

            # ----------------------------------------------------
            # 5. 判断是否已经有内容
            #
            # 有内容则跳过整个日期。
            # 没有内容才运行 Source Enrichment。
            # ----------------------------------------------------

            ENRICHED_COUNT=$(find "$OUTPUT" \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Existing Enriched files: $ENRICHED_COUNT"

            if [ "$ENRICHED_COUNT" -gt 0 ]; then

              echo "✅ Enriched content already exists"
              echo "⏭️ Skip $DATE"

              continue

            fi

            echo "❌ Enriched content missing"
            echo "▶️ Run Source Enrichment for $DATE"

            python "$SCRIPT" \
              --zh "$ZH_DIR" \
              --en "$EN_DIR" \
              --output "$OUTPUT" \
              --date "$DATE"

            # ----------------------------------------------------
            # 6. 最终目录检查
            # ----------------------------------------------------

            if [ ! -d "$OUTPUT" ]; then

              echo "❌ Enriched directory missing after processing"

              exit 1

            fi

            if [ ! -d "$OUTPUT_ZH" ]; then

              echo "❌ Enriched ZH directory missing after processing"

              exit 1

            fi

            if [ ! -d "$OUTPUT_EN" ]; then

              echo "❌ Enriched EN directory missing after processing"

              exit 1

            fi

            FINAL_COUNT=$(find "$OUTPUT" \
              -type f \
              -name "*.md" \
              | wc -l)

            echo
            echo "Final Enriched count: $FINAL_COUNT"

            if [ "$FINAL_COUNT" -eq 0 ]; then

              echo "❌ Enrichment produced no files for $DATE"

              exit 1

            fi

            echo "✅ Enriched complete: $DATE"

          done


      # ==========================================================
      # 17. Verify THREE Enriched directories
      #
      # 三天全部确认后才能继续。
      # ==========================================================

      - name: Verify three-day Enriched structure
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"

          echo
          echo "============================================================"
          echo "VERIFY THREE-DAY ENRICHED STRUCTURE"
          echo "============================================================"

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            OUTPUT="$RAW_ROOT/${DATE}-Enriched"
            ZH_DIR="$OUTPUT/zh"
            EN_DIR="$OUTPUT/en"

            echo
            echo "DATE: $DATE"

            if [ ! -d "$OUTPUT" ]; then
              echo "❌ Missing Enriched directory: $OUTPUT"
              exit 1
            fi

            if [ ! -d "$ZH_DIR" ]; then
              echo "❌ Missing Enriched ZH directory: $ZH_DIR"
              exit 1
            fi

            if [ ! -d "$EN_DIR" ]; then
              echo "❌ Missing Enriched EN directory: $EN_DIR"
              exit 1
            fi

            COUNT=$(find "$OUTPUT" \
              -type f \
              -name "*.md" \
              | wc -l)

            if [ "$COUNT" -eq 0 ]; then
              echo "❌ Enriched directory empty: $DATE"
              exit 1
            fi

            echo "✅ Enriched structure ready: $DATE"

          done

          echo
          echo "✅ THREE-DAY ENRICHED STRUCTURE COMPLETE"


      # ==========================================================
      # 18. Knowledge Pipeline
      #
      # 三天全部 Raw / Atomic / Enriched 完成之后，
      # 才允许进入这里。
      # ==========================================================

      - name: Run Knowledge Pipeline - three days
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          for DATE in \
            "$DAY_BEFORE" \
            "$YESTERDAY" \
            "$TODAY"
          do

            echo
            echo "=========================================="
            echo "KNOWLEDGE PIPELINE: $DATE"
            echo "=========================================="

            python \
              "01_自生长知识系统/scripts/knowledge_pipeline.py" \
              --date "$DATE"

            echo
            echo "✅ Knowledge Pipeline finished: $DATE"

          done


      # ==========================================================
      # 19. Weekly Report
      # ==========================================================

      - name: Run Weekly Report V2
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          python \
            "01_自生长知识系统/scripts/weekly_report.py"

          echo "✅ Weekly Report completed"


      # ==========================================================
      # 20. Final result
      # ==========================================================

      - name: Show three-day final result
        run: |
          set -e

          echo
          echo "============================================================"
          echo "748686 自生长知识系统 - THREE DAY RESULT"
          echo "============================================================"

          for DATE in \
            "$DAY_BEFORE" \
