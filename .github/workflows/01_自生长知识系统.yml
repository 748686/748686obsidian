name: 748686 自生长知识系统

on:
  workflow_dispatch:
    inputs:
      enable_horizon:
        description: "是否运行 Horizon 新闻采集"
        required: true
        type: choice
        options:
          - "启用"
          - "不启用"
        default: "启用"

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:

  knowledge-system:

    runs-on: ubuntu-latest

    steps:

      ######################################################################
      # 01. CHECKOUT
      ######################################################################

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ######################################################################
      # 02. SAFE GIT PUSH HELPER
      ######################################################################

      - name: Prepare Safe Git Push Helper
        shell: bash
        run: |
          cat > /tmp/748686_git_push_safe.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME:-main}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$BRANCH"

          for i in 1 2 3 4 5; do

            if git push origin "HEAD:$BRANCH"; then
              echo "✅ Git push succeeded."
              exit 0
            fi

            echo "⚠️ Git push failed. Synchronizing with origin..."

            git fetch origin "$BRANCH"

            if git rebase "origin/$BRANCH"; then
              echo "✅ Rebase succeeded."
            else
              echo "⚠️ Rebase failed. Aborting rebase."
              git rebase --abort || true

              git merge --strategy-option=theirs "origin/$BRANCH" || true
            fi

            sleep 3
          done

          echo "❌ Git push failed after multiple retries."
          exit 1
          EOF

          chmod +x /tmp/748686_git_push_safe.sh

          echo "GIT_HELPER=/tmp/748686_git_push_safe.sh" >> "$GITHUB_ENV"

      ######################################################################
      # 03. PYTHON
      ######################################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      ######################################################################
      # 04. UV
      ######################################################################

      - name: Install uv
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install uv

      ######################################################################
      # 05. DATE
      ######################################################################

      - name: Calculate UTC Dates
        shell: bash
        run: |

          TODAY="$(date -u +%Y-%m-%d)"
          YESTERDAY="$(date -u -d "$TODAY -1 day" +%Y-%m-%d)"
          DAY_BEFORE="$(date -u -d "$TODAY -2 days" +%Y-%m-%d)"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            HORIZON_INPUT="${{ inputs.enable_horizon }}"
          else
            HORIZON_INPUT="启用"
          fi

          if [[ "$HORIZON_INPUT" == "启用" ]]; then
            HORIZON_ENABLED="true"
          else
            HORIZON_ENABLED="false"
          fi

          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          echo "YESTERDAY=$YESTERDAY" >> "$GITHUB_ENV"
          echo "DAY_BEFORE=$DAY_BEFORE" >> "$GITHUB_ENV"
          echo "HORIZON_ENABLED=$HORIZON_ENABLED" >> "$GITHUB_ENV"

          echo
          echo "TODAY       = $TODAY"
          echo "YESTERDAY   = $YESTERDAY"
          echo "DAY_BEFORE  = $DAY_BEFORE"
          echo "HORIZON     = $HORIZON_ENABLED"

      ######################################################################
      # 06. CHECK HORIZON
      ######################################################################

      - name: Checkout Horizon
        if: env.HORIZON_ENABLED == 'true'
        shell: bash
        run: |

          rm -rf /tmp/Horizon

          git clone \
            --depth 1 \
            https://github.com/748686/Horizon.git \
            /tmp/Horizon

          cd /tmp/Horizon

          echo "Horizon repository:"
          git log -1 --oneline

      ######################################################################
      # 07. INSTALL HORIZON
      ######################################################################

      - name: Install Horizon
        if: env.HORIZON_ENABLED == 'true'
        shell: bash
        run: |

          cd /tmp/Horizon

          if [[ ! -f "data/config.github.json" ]]; then
            echo "❌ Missing Horizon configuration:"
            echo "data/config.github.json"
            exit 1
          fi

          uv sync

          echo "✅ Horizon installed."

      ######################################################################
      # 08. HORIZON DISABLED STATUS
      ######################################################################

      - name: Horizon Disabled
        if: env.HORIZON_ENABLED != 'true'
        shell: bash
        run: |
          echo "⏸️ Horizon is disabled."
          echo "Existing Raw News will be used."

      ######################################################################
      # 09. AGNES API KEY
      ######################################################################

      - name: Check AGNES API Key
        shell: bash
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |

          if [[ -z "${AGNES_API_KEY:-}" ]]; then
            echo "❌ AGNES_API_KEY is not configured."
            exit 1
          fi

          echo "AGNES_API_KEY is configured."

      ######################################################################
      # 10. HORIZON GH-PAGES
      ######################################################################

      - name: Checkout Horizon gh-pages
        if: env.HORIZON_ENABLED == 'true'
        shell: bash
        run: |

          rm -rf /tmp/Horizon-gh-pages

          git clone \
            --depth 1 \
            --branch gh-pages \
            https://github.com/748686/Horizon.git \
            /tmp/Horizon-gh-pages

          echo "✅ Horizon gh-pages ready."

      ######################################################################
      # 11. ACQUIRE TODAY RAW NEWS
      ######################################################################

      - name: Acquire TODAY Raw News
        shell: bash
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |

          set -e

          ROOT="01_自生长知识系统"
          RAW="$ROOT/Raw News/$TODAY"

          mkdir -p "$RAW"

          EXISTING_COUNT="$(find "$RAW" -maxdepth 1 -type f -name '*.md' -size +0c | wc -l)"

          echo
          echo "TODAY RAW NEWS"
          echo "Directory : $RAW"
          echo "Existing  : $EXISTING_COUNT"

          if [[ "$EXISTING_COUNT" -ge 2 ]]; then
            echo "✅ TODAY Raw News already exists."
            exit 0
          fi

          if [[ "$HORIZON_ENABLED" != "true" ]]; then
            echo "❌ Horizon disabled and TODAY Raw News is incomplete."
            exit 1
          fi

          cd /tmp/Horizon

          echo
          echo "▶ Running Horizon..."

          uv run horizon \
            --hours 24 \
            --config data/config.github.json

          echo
          echo "▶ Waiting for Horizon gh-pages..."

          FOUND="false"

          for i in $(seq 1 10); do

            echo "Attempt $i / 10"

            git -C /tmp/Horizon-gh-pages fetch origin gh-pages
            git -C /tmp/Horizon-gh-pages reset --hard origin/gh-pages

            FOUND_COUNT="$(
              find /tmp/Horizon-gh-pages \
                -type f \
                -name "${TODAY}*.md" \
                -size +0c \
                2>/dev/null | wc -l
            )"

            echo "Found TODAY files: $FOUND_COUNT"

            if [[ "$FOUND_COUNT" -ge 2 ]]; then
              FOUND="true"
              break
            fi

            sleep 30
          done

          if [[ "$FOUND" != "true" ]]; then
            echo "❌ Horizon did not produce enough TODAY articles."
            exit 1
          fi

          echo
          echo "▶ Copying TODAY Raw News..."

          find /tmp/Horizon-gh-pages \
            -type f \
            -name "${TODAY}*.md" \
            -size +0c \
            -exec cp {} "$RAW/" \;

          FINAL_COUNT="$(
            find "$RAW" \
              -maxdepth 1 \
              -type f \
              -name '*.md' \
              -size +0c \
              | wc -l
          )"

          echo "Final TODAY Raw News: $FINAL_COUNT"

          if [[ "$FINAL_COUNT" -lt 2 ]]; then
            echo "❌ TODAY Raw News validation failed."
            exit 1
          fi

      ######################################################################
      # 12. CHECKPOINT TODAY RAW NEWS
      ######################################################################

      - name: Checkpoint TODAY Raw News
        shell: bash
        run: |

          git add "01_自生长知识系统/Raw News/$TODAY"

          if git diff --cached --quiet; then
            echo "ℹ️ No TODAY Raw News changes."
          else
            git commit -m "chore: checkpoint TODAY raw news $TODAY"
            "$GIT_HELPER"
          fi

      ######################################################################
      # 13. ROLLING DATE TRANSACTIONS
      ######################################################################

      - name: Rolling Date Transactions
        shell: bash
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_MODEL: agnes-2.5-flash
        run: |

          set +e

          ROOT="01_自生长知识系统"

          SPLITTER="$ROOT/scripts/horizon_split.py"
          ENRICHMENT="$ROOT/scripts/source_enrichment.py"
          ORCHESTRATOR="$ROOT/scripts/knowledge_rolling.py"

          process_date() {

            local DATE="$1"
            local REQUIRED="$2"

            echo
            echo "======================================================================"
            echo "PROCESS DATE: $DATE"
            echo "REQUIRED: $REQUIRED"
            echo "======================================================================"

            RAW="$ROOT/Raw News/$DATE"
            EVENT_ROOT="$ROOT/Raw News/${DATE}-EventUnit"

            RAW_COUNT="$(
              find "$RAW" \
                -maxdepth 1 \
                -type f \
                -name '*.md' \
                -size +0c \
                2>/dev/null | wc -l
            )"

            echo "Raw News: $RAW_COUNT"

            if [[ "$RAW_COUNT" -lt 2 ]]; then

              if [[ "$REQUIRED" == "true" ]]; then
                echo "❌ TODAY Raw News incomplete."
                return 1
              fi

              echo "⏭️ Historical date has no usable Raw News. SKIP."
              return 10
            fi

            echo
            echo "▶ Running splitter..."

            python "$SPLITTER" \
              --date "$DATE"

            if [[ $? -ne 0 ]]; then
              if [[ "$REQUIRED" == "true" ]]; then
                return 1
              fi

              echo "⏭️ Historical splitter failed. SKIP."
              return 10
            fi

            echo
            echo "▶ Running source enrichment..."

            python "$ENRICHMENT" \
              --date "$DATE"

            if [[ $? -ne 0 ]]; then
              if [[ "$REQUIRED" == "true" ]]; then
                return 1
              fi

              echo "⏭️ Historical enrichment failed. SKIP."
              return 10
            fi

            for LANG in en zh; do

              ATOMIC="$ROOT/Raw News/${DATE}-Atomic/$LANG"
              ENRICHED="$ROOT/Raw News/${DATE}-Enriched/$LANG"

              ATOMIC_COUNT="$(
                find "$ATOMIC" \
                  -type f \
                  -name '*.md' \
                  -size +0c \
                  2>/dev/null | wc -l
              )"

              ENRICHED_COUNT="$(
                find "$ENRICHED" \
                  -type f \
                  -name '*.md' \
                  -size +0c \
                  2>/dev/null | wc -l
              )"

              echo
              echo "$LANG Atomic   : $ATOMIC_COUNT"
              echo "$LANG Enriched  : $ENRICHED_COUNT"

              if [[ "$ATOMIC_COUNT" -eq 0 || "$ENRICHED_COUNT" -eq 0 ]]; then

                if [[ "$REQUIRED" == "true" ]]; then
                  echo "❌ $DATE/$LANG input validation failed."
                  return 1
                fi

                echo "⏭️ Historical $LANG input incomplete. SKIP."
                return 10
              fi

            done

            echo
            echo "▶ Running knowledge rolling..."

            python "$ORCHESTRATOR" \
              --date "$DATE"

            if [[ $? -ne 0 ]]; then

              if [[ "$REQUIRED" == "true" ]]; then
                return 1
              fi

              echo "⏭️ Historical rolling failed. SKIP."
              return 10
            fi

            echo
            echo "▶ Validating EventUnit..."

            EVENT_COUNT="$(
              find "$EVENT_ROOT" \
                -type f \
                -name '*.md' \
                -size +0c \
                2>/dev/null | wc -l
            )"

            if [[ "$EVENT_COUNT" -eq 0 ]]; then

              if [[ "$REQUIRED" == "true" ]]; then
                echo "❌ No EventUnit generated."
                return 1
              fi

              echo "⏭️ Historical date has no EventUnit. SKIP."
              return 10
            fi

            echo "EventUnit: $EVENT_COUNT"

            for LANG in en zh; do

              if [[ ! -f "$EVENT_ROOT/$LANG/_COMPLETE" ]]; then
                echo "❌ Missing $LANG _COMPLETE."

                if [[ "$REQUIRED" == "true" ]]; then
                  return 1
                fi

                return 10
              fi

              ANALYSIS_COUNT="$(
                find "$EVENT_ROOT/$LANG" \
                  -type f \
                  -name '*_analysis.md' \
                  -size +0c \
                  2>/dev/null | wc -l
              )"

              echo "$LANG analysis: $ANALYSIS_COUNT"

              if [[ "$ANALYSIS_COUNT" -ne "$EVENT_COUNT" ]]; then
                echo "❌ Analysis count mismatch."

                if [[ "$REQUIRED" == "true" ]]; then
                  return 1
                fi

                return 10
              fi

              if [[ ! -f "$EVENT_ROOT/$LANG/_SKILLS_COMPLETE" ]]; then
                echo "❌ Missing $LANG _SKILLS_COMPLETE."

                if [[ "$REQUIRED" == "true" ]]; then
                  return 1
                fi

                return 10
              fi

            done

            echo
            echo "✅ $DATE rolling completed."

            git add "$ROOT/Raw News/$DATE" \
                    "$ROOT/Raw News/${DATE}-Atomic" \
                    "$ROOT/Raw News/${DATE}-Enriched" \
                    "$ROOT/Raw News/${DATE}-EventUnit"

            if ! git diff --cached --quiet; then
              git commit -m "chore: checkpoint rolling $DATE"
              "$GIT_HELPER"
            fi

            return 0
          }

          ##################################################################
          # TODAY REQUIRED
          ##################################################################

          process_date "$TODAY" "true"

          TODAY_RESULT=$?

          if [[ "$TODAY_RESULT" -ne 0 ]]; then
            echo "❌ TODAY processing failed."
            exit 1
          fi

          ##################################################################
          # YESTERDAY OPTIONAL
          ##################################################################

          process_date "$YESTERDAY" "false"

          YESTERDAY_RESULT=$?

          if [[ "$YESTERDAY_RESULT" -eq 10 ]]; then
            echo "⏭️ YESTERDAY SKIPPED."
          elif [[ "$YESTERDAY_RESULT" -ne 0 ]]; then
            echo "⏭️ YESTERDAY failed but is historical. Continuing."
          fi

          ##################################################################
          # DAY BEFORE OPTIONAL
          ##################################################################

          process_date "$DAY_BEFORE" "false"

          DAY_BEFORE_RESULT=$?

          if [[ "$DAY_BEFORE_RESULT" -eq 10 ]]; then
            echo "⏭️ DAY_BEFORE SKIPPED."
          elif [[ "$DAY_BEFORE_RESULT" -ne 0 ]]; then
            echo "⏭️ DAY_BEFORE failed but is historical. Continuing."
          fi

          echo
          echo "======================================================================"
          echo "ROLLING DATE TRANSACTIONS COMPLETE"
          echo "======================================================================"

      ######################################################################
      # 14. DAILY REPORT
      ######################################################################

      - name: Generate Daily Report
        shell: bash
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_MODEL: agnes-2.5-flash
        run: |

          python 01_自生长知识系统/scripts/knowledge_daily.py \
            --day-before "$DAY_BEFORE" \
            --yesterday "$YESTERDAY" \
            --today "$TODAY"

      ######################################################################
      # 15. DAILY REPORT CHECKPOINT
      ######################################################################

      - name: Checkpoint Daily Report
        shell: bash
        run: |

          git add "01_自生长知识系统/05_日报"

          if git diff --cached --quiet; then
            echo "ℹ️ No Daily Report changes."
          else
            git commit -m "chore: update daily report $TODAY"
            "$GIT_HELPER"
          fi

      ######################################################################
      # 16. KNOWLEDGE ASSETIZATION
      ######################################################################

      - name: Knowledge Assetization
        shell: bash
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_MODEL: agnes-2.5-flash
        run: |

          python 01_自生长知识系统/scripts/knowledge_asset.py

      ######################################################################
      # 17. KNOWLEDGE ASSET CHECKPOINT
      ######################################################################

      - name: Checkpoint Knowledge Assets
        shell: bash
        run: |

          git add "01_自生长知识系统"

          if git diff --cached --quiet; then
            echo "ℹ️ No Knowledge Asset changes."
          else
            git commit -m "chore: update knowledge assets $TODAY"
            "$GIT_HELPER"
          fi

      ######################################################################
      # 18. WEEKLY REPORT
      ######################################################################

      - name: Generate Weekly Report
        shell: bash
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_MODEL: agnes-2.5-flash
        run: |

          python 01_自生长知识系统/scripts/weekly_report.py \
            --today "$TODAY"

      ######################################################################
      # 19. WEEKLY REPORT CHECKPOINT
      ######################################################################

      - name: Checkpoint Weekly Report
        shell: bash
        run: |

          git add "01_自生长知识系统/06_周报"

          if git diff --cached --quiet; then
            echo "ℹ️ No Weekly Report changes."
          else
            git commit -m "chore: update weekly report $TODAY"
            "$GIT_HELPER"
          fi

      ######################################################################
      # 20. KNOWLEDGE GROWTH
      ######################################################################

      - name: Knowledge Growth
        shell: bash
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_MODEL: agnes-2.5-flash
        run: |

          python 01_自生长知识系统/scripts/knowledge_growth.py \
            --today "$TODAY"

      ######################################################################
      # 21. KNOWLEDGE GROWTH CHECKPOINT
      ######################################################################

      - name: Checkpoint Knowledge Growth
        shell: bash
        run: |

          git add "01_自生长知识系统"

          if git diff --cached --quiet; then
            echo "ℹ️ No Knowledge Growth changes."
          else
            git commit -m "chore: knowledge growth $TODAY"
            "$GIT_HELPER"
          fi

      ######################################################################
      # 22. FINAL ROLLING VALIDATION
      ######################################################################

      - name: Final Rolling Validation
        shell: bash
        run: |

          ROOT="01_自生长知识系统"

          echo
          echo "======================================================================"
          echo "FINAL VALIDATION"
          echo "======================================================================"

          EVENT_ROOT="$ROOT/Raw News/${TODAY}-EventUnit"

          EVENT_COUNT="$(
            find "$EVENT_ROOT" \
              -type f \
              -name '*.md' \
              -size +0c \
              2>/dev/null | wc -l
          )"

          if [[ "$EVENT_COUNT" -eq 0 ]]; then
            echo "❌ TODAY EventUnit validation failed."
            exit 1
          fi

          echo "TODAY EventUnit: $EVENT_COUNT"

          DAILY="$ROOT/05_日报/${TODAY:0:4}/${TODAY:5:2}/${TODAY}.md"

          if [[ ! -s "$DAILY" ]]; then
            echo "❌ Daily Report missing:"
            echo "$DAILY"
            exit 1
          fi

          echo "✅ Daily Report exists."

          KB_COUNT="$(
            find "$ROOT/08_知识库" \
              -type f \
              -name '*.md' \
              -size +0c \
              2>/dev/null | wc -l
          )"

          if [[ "$KB_COUNT" -eq 0 ]]; then
            echo "❌ Knowledge Base is empty."
            exit 1
          fi

          echo "Knowledge Base: $KB_COUNT"

          GRAPH_COUNT="$(
            find "$ROOT/09_知识图谱" \
              -type f \
              -size +0c \
              2>/dev/null | wc -l
          )"

          if [[ "$GRAPH_COUNT" -eq 0 ]]; then
            echo "❌ Knowledge Graph is empty."
            exit 1
          fi

          echo "Knowledge Graph: $GRAPH_COUNT"

          WEEK_YEAR="$(date -u -d "$TODAY" +%G)"
          WEEK_NO="$(date -u -d "$TODAY" +%V)"

          WEEKLY="$ROOT/06_周报/$WEEK_YEAR/W$WEEK_NO.md"

          if [[ ! -s "$WEEKLY" ]]; then
            echo "❌ Weekly Report missing:"
            echo "$WEEKLY"
            exit 1
          fi

          echo "✅ Weekly Report exists."

          GROWTH_MARKER="$ROOT/08_知识库/${TODAY}_COMPLETE"

          if [[ ! -f "$GROWTH_MARKER" ]]; then
            echo "⚠️ Knowledge Growth marker not found:"
            echo "$GROWTH_MARKER"
          else
            echo "✅ Knowledge Growth complete."
          fi

          echo
          echo "✅ FINAL VALIDATION PASSED."

      ######################################################################
      # 23. FINAL COMMIT
      ######################################################################

      - name: Final Commit
        shell: bash
        run: |

          git add "01_自生长知识系统"

          if git diff --cached --quiet; then
            echo "ℹ️ No final changes."
          else
            git commit -m "chore: finalize knowledge system $TODAY"
            "$GIT_HELPER"
          fi

      ######################################################################
      # 24. GENERATE DAILY / WEEKLY IMAGES
      ######################################################################

      - name: Generate Daily Weekly Images
        shell: bash
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_MODEL: agnes-2.5-flash
          FORCE_REGENERATE: "true"
        run: |

          python 01_自生长知识系统/scripts/knowledge_image.py \
            --today "$TODAY"

      ######################################################################
      # 25. IMAGE CHECKPOINT
      ######################################################################

      - name: Image Checkpoint
        shell: bash
        run: |

          IMAGE_ROOT="01_自生长知识系统/04_图片"

          if [[ ! -d "$IMAGE_ROOT" ]]; then
            echo "❌ Image directory missing."
            exit 1
          fi

          IMAGE_COUNT="$(
            find "$IMAGE_ROOT" \
              -type f \
              \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) \
              -size +0c \
              | wc -l
          )"

          echo "Image count: $IMAGE_COUNT"

          if [[ "$IMAGE_COUNT" -eq 0 ]]; then
            echo "❌ No generated images."
            exit 1
          fi

          DAILY_MD_COUNT="$(
            find "01_自生长知识系统/05_日报" \
              -type f \
              -name '*_带图.md' \
              -size +0c \
              2>/dev/null | wc -l
          )"

          WEEKLY_MD_COUNT="$(
            find "01_自生长知识系统/06_周报" \
              -type f \
              -name '*_带图.md' \
              -size +0c \
              2>/dev/null | wc -l
          )"

          echo "Daily illustrated reports : $DAILY_MD_COUNT"
          echo "Weekly illustrated reports: $WEEKLY_MD_COUNT"

          if [[ "$DAILY_MD_COUNT" -eq 0 ]]; then
            echo "❌ Daily *_带图.md is mandatory."
            exit 1
          fi

          git add "$IMAGE_ROOT" \
                  "01_自生长知识系统/05_日报" \
                  "01_自生长知识系统/06_周报"

          if git diff --cached --quiet; then
            echo "ℹ️ No image changes."
          else
            git commit -m "chore: add illustrated daily weekly reports $TODAY"
            "$GIT_HELPER"
          fi

      ######################################################################
      # 26. FEISHU ADVANCED RENDERING
      ######################################################################

      - name: Feishu Advanced Rendering
        if: success()
        shell: bash
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |

          set -euo pipefail

          echo
          echo "######################################################################"
          echo "FEISHU ADVANCED RENDERING"
          echo "######################################################################"

          ####################################################################
          # Secret validation
          ####################################################################

          if [[ -z "${FEISHU_WEBHOOK:-}" ]]; then
            echo "❌ FEISHU_WEBHOOK is missing."
            exit 1
          fi

          if [[ -z "${FEISHU_APP_ID:-}" ]]; then
            echo "❌ FEISHU_APP_ID is missing."
            exit 1
          fi

          if [[ -z "${FEISHU_APP_SECRET:-}" ]]; then
            echo "❌ FEISHU_APP_SECRET is missing."
            exit 1
          fi

          ####################################################################
          # Create temporary renderer
          ####################################################################

          cat > /tmp/feishu_advanced_renderer.py <<'PY'
          #!/usr/bin/env python3

          import json
          import os
          import re
          import sys
          from pathlib import Path
          from urllib import request, parse
          import uuid


          WEBHOOK = os.environ["FEISHU_WEBHOOK"]
          APP_ID = os.environ["FEISHU_APP_ID"]
          APP_SECRET = os.environ["FEISHU_APP_SECRET"]


          def http_json(url, method="GET", data=None, headers=None):

              if headers is None:
                  headers = {}

              body = None

              if data is not None:
                  body = json.dumps(data, ensure_ascii=False).encode("utf-8")
                  headers.setdefault("Content-Type", "application/json")

              req = request.Request(
                  url,
                  data=body,
                  headers=headers,
                  method=method,
              )

              with request.urlopen(req, timeout=60) as response:
                  raw = response.read().decode("utf-8")

              result = json.loads(raw)

              if result.get("code", 0) != 0:
                  raise RuntimeError(
                      f"Feishu API failed: {result}"
                  )

              return result


          def get_tenant_access_token():

              result = http_json(
                  "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal",
                  method="POST",
                  data={
                      "app_id": APP_ID,
                      "app_secret": APP_SECRET,
                  },
              )

              token = result.get("tenant_access_token")

              if not token:
                  raise RuntimeError(
                      f"tenant_access_token missing: {result}"
                  )

              return token


          def upload_image(token, image_path):

              image_path = Path(image_path)

              if not image_path.exists():
                  raise RuntimeError(
                      f"Image does not exist: {image_path}"
                  )

              if image_path.stat().st_size <= 0:
                  raise RuntimeError(
                      f"Image is empty: {image_path}"
                  )

              boundary = "----748686" + uuid.uuid4().hex

              image_bytes = image_path.read_bytes()

              parts = []

              parts.append(
                  (
                      f"--{boundary}\r\n"
                      'Content-Disposition: form-data; name="image_type"\r\n'
                      "\r\n"
                      "message\r\n"
                  ).encode("utf-8")
              )

              filename = image_path.name

              parts.append(
                  (
                      f"--{boundary}\r\n"
                      f'Content-Disposition: form-data; name="image"; filename="{filename}"\r\n'
                      "Content-Type: image/png\r\n"
                      "\r\n"
                  ).encode("utf-8")
              )

              parts.append(image_bytes)

              parts.append(
                  f"\r\n--{boundary}--\r\n".encode("utf-8")
              )

              body = b"".join(parts)

              req = request.Request(
                  "https://open.feishu.cn/open-apis/im/v1/images",
                  data=body,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": f"multipart/form-data; boundary={boundary}",
                  },
                  method="POST",
              )

              with request.urlopen(req, timeout=120) as response:
                  raw = response.read().decode("utf-8")

              result = json.loads(raw)

              if result.get("code", 0) != 0:
                  raise RuntimeError(
                      f"Image upload failed: {result}"
                  )

              image_key = (
                  result.get("data", {})
                  .get("image_key")
              )

              if not image_key:
                  raise RuntimeError(
                      f"image_key missing: {result}"
                  )

              return image_key


          def resolve_image(md_file, raw_path):

              raw_path = raw_path.strip()

              if raw_path.startswith("<") and raw_path.endswith(">"):
                  raw_path = raw_path[1:-1]

              raw_path = raw_path.split("?", 1)[0]
              raw_path = raw_path.split("#", 1)[0]

              if raw_path.startswith("http://"):
                  return None

              if raw_path.startswith("https://"):
                  return None

              candidates = []

              path = Path(raw_path)

              if path.is_absolute():
                  candidates.append(path)

              else:
                  candidates.append(md_file.parent / path)
                  candidates.append(Path.cwd() / path)

              for candidate in candidates:
                  candidate = candidate.resolve()

                  if candidate.exists() and candidate.is_file():
                      return candidate

              return None


          def extract_images(md_file, markdown):

              results = []

              # Standard Markdown:
              # ![alt](path)
              pattern_1 = re.compile(
                  r"!\[[^\]]*\]\(([^)\s]+)(?:\s+['\"][^'\"]*['\"])?\)"
              )

              # HTML:
              # <img src="path">
              pattern_2 = re.compile(
                  r'<img[^>]+src=["\']([^"\']+)["\']',
                  re.IGNORECASE
              )

              for raw in pattern_1.findall(markdown):
                  path = resolve_image(md_file, raw)

                  if path is not None:
                      results.append(path)

              for raw in pattern_2.findall(markdown):
                  path = resolve_image(md_file, raw)

                  if path is not None:
                      results.append(path)

              unique = []

              seen = set()

              for item in results:
                  key = str(item.resolve())

                  if key not in seen:
                      seen.add(key)
                      unique.append(item)

              return unique


          def clean_markdown(markdown):

              # Remove image markdown because actual images are sent as
              # Feishu img elements.
              markdown = re.sub(
                  r"!\[[^\]]*\]\([^)]+\)",
                  "",
                  markdown,
              )

              markdown = re.sub(
                  r'<img[^>]*>',
                  "",
                  markdown,
                  flags=re.IGNORECASE,
              )

              # Remove local image-only HTML leftovers.
              markdown = re.sub(
                  r"\n{3,}",
                  "\n\n",
                  markdown,
              )

              return markdown.strip()


          def split_text(text, limit=5000):

              if not text:
                  return []

              chunks = []

              while len(text) > limit:

                  cut = text.rfind("\n", 0, limit)

                  if cut < limit // 2:
                      cut = limit

                  chunks.append(text[:cut].strip())
                  text = text[cut:].strip()

              if text:
                  chunks.append(text)

              return chunks


          def build_card(title, markdown, image_keys):

              elements = []

              for index, image_key in enumerate(image_keys):

                  elements.append(
                      {
                          "tag": "img",
                          "img_key": image_key,
                          "alt": {
                              "tag": "plain_text",
                              "content": f"图片 {index + 1}",
                          },
                          "title": {
                              "tag": "plain_text",
                              "content": title,
                          },
                          "mode": "fit_horizontal",
                          "preview": True,
                      }
                  )

              text_chunks = split_text(markdown)

              for chunk in text_chunks:

                  elements.append(
                      {
                          "tag": "markdown",
                          "content": chunk,
                      }
                  )

              return {
                  "msg_type": "interactive",
                  "card": {
                      "schema": "2.0",
                      "header": {
                          "template": "blue",
                          "title": {
                              "tag": "plain_text",
                              "content": title,
                          },
                      },
                      "body": {
                          "elements": elements
                      },
                  },
              }


          def send_card(payload):

              body = json.dumps(
                  payload,
                  ensure_ascii=False,
              ).encode("utf-8")

              req = request.Request(
                  WEBHOOK,
                  data=body,
                  headers={
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )

              with request.urlopen(req, timeout=120) as response:
                  raw = response.read().decode("utf-8")

              result = json.loads(raw)

              if result.get("code", 0) != 0:
                  raise RuntimeError(
                      f"Webhook failed: {result}"
                  )

              return result


          def process_report(md_file, title, required):

              md_file = Path(md_file)

              if not md_file.exists():
                  if required:
                      raise RuntimeError(
                          f"Required Daily report missing: {md_file}"
                      )

                  print(
                      f"⏭️ Optional Weekly report missing: {md_file}"
                  )
                  return False

              markdown = md_file.read_text(
                  encoding="utf-8",
                  errors="ignore",
              )

              if not markdown.strip():
                  if required:
                      raise RuntimeError(
                          f"Required report is empty: {md_file}"
                      )

                  print(
                      f"⏭️ Optional report is empty: {md_file}"
                  )
                  return False

              images = extract_images(
                  md_file,
                  markdown,
              )

              if required and not images:
                  raise RuntimeError(
                      f"Required Daily report contains no local images: {md_file}"
                  )

              if not images:
                  print(
                      f"⏭️ Optional Weekly report has no local images: {md_file}"
                  )
                  return False

              print()
              print("=" * 70)
              print(title)
              print("=" * 70)
              print(f"Markdown : {md_file}")
              print(f"Images   : {len(images)}")

              token = get_tenant_access_token()

              image_keys = []

              for image in images:

                  print(f"Uploading: {image}")

                  key = upload_image(
                      token,
                      image,
                  )

                  print(f"image_key: {key}")

                  image_keys.append(key)

              clean = clean_markdown(markdown)

              payload = build_card(
                  title,
                  clean,
                  image_keys,
              )

              result = send_card(payload)

              print()
              print("Feishu response:")
              print(json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2,
              ))

              print(f"✅ {title} sent successfully.")

              return True


          def find_daily(today):

              root = Path(
                  "01_自生长知识系统/05_日报"
              )

              expected = (
                  root
                  / today[:4]
                  / today[5:7]
                  / f"{today}_带图.md"
              )

              if expected.exists():
                  return expected

              matches = list(
                  root.glob(
                      f"{today[:4]}/{today[5:7]}/*_带图.md"
                  )
              )

              matches = [
                  p for p in matches
                  if p.is_file() and p.stat().st_size > 0
              ]

              if not matches:
                  return None

              return sorted(matches)[-1]


          def find_weekly():

              root = Path(
                  "01_自生长知识系统/06_周报"
              )

              if not root.exists():
                  return None

              matches = list(
                  root.rglob("*_带图.md")
              )

              matches = [
                  p for p in matches
                  if p.is_file() and p.stat().st_size > 0
              ]

              if not matches:
                  return None

              return sorted(
                  matches,
                  key=lambda p: p.stat().st_mtime,
              )[-1]


          def main():

              today = os.environ["TODAY"]

              daily = find_daily(today)

              if daily is None:
                  raise RuntimeError(
                      "❌ Daily *_带图.md not found."
                  )

              print()
              print("DAILY ILLUSTRATED REPORT")
              print(daily)

              process_report(
                  daily,
                  f"748686 自生长知识系统｜日报 {today}",
                  True,
              )

              weekly = find_weekly()

              if weekly is None:
                  print()
                  print("⏭️ Weekly *_带图.md not found.")
                  print("⏭️ Weekly Feishu delivery SKIPPED.")
                  return

              print()
              print("WEEKLY ILLUSTRATED REPORT")
              print(weekly)

              process_report(
                  weekly,
                  "748686 自生长知识系统｜周报",
                  False,
              )


          if __name__ == "__main__":
              main()
          PY

          chmod +x /tmp/feishu_advanced_renderer.py

          ####################################################################
          # Execute renderer
