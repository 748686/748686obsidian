name: 01 自生长知识系统 - 主运行

on:
  workflow_dispatch:

  schedule:
    # 北京 / 上海 / 香港时间每天 07:00
    # = UTC 23:00
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:

  knowledge-system:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout 748686obsidian
      # ==========================================================

      - name: Checkout 748686obsidian
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. Checkout Horizon main
      # ==========================================================

      - name: Checkout Horizon main
        uses: actions/checkout@v4
        with:
          repository: 748686/Horizon
          ref: main
          path: horizon

      # ==========================================================
      # 3. Setup Python
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================================
      # 4. Install uv
      # ==========================================================

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # ==========================================================
      # 5. Install Horizon
      # ==========================================================

      - name: Install Horizon
        working-directory: horizon
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL HORIZON"
          echo "=========================================="

          uv sync

          echo
          echo "✅ Horizon installed"

      # ==========================================================
      # 6. Check Agnes API configuration
      # ==========================================================

      - name: Check Agnes API configuration
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -e

          echo "=========================================="
          echo "CHECK AGNES API CONFIGURATION"
          echo "=========================================="

          if [ -z "$AGNES_API_KEY" ]; then
            echo "❌ AGNES_API_KEY is missing"
            exit 1
          fi

          echo "✅ AGNES_API_KEY exists"
          echo "API Base: https://api.agnes-ai.cn/v1"
          echo "Model: agnes-2.5-flash"

      # ==========================================================
      # 7. Define today's date
      # ==========================================================

      - name: Set system date
        run: |
          set -e

          export TZ=Asia/Shanghai

          TODAY=$(date +%Y-%m-%d)

          echo "TODAY=$TODAY" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "SYSTEM DATE"
          echo "=========================================="

          echo "Today: $TODAY"

      # ==========================================================
      # 8. Build Horizon runtime config
      #
      # IMPORTANT:
      # 不覆盖 Horizon 自带的 data/config.github.json
      # 与已经测试通过的 Horizon 测试版保持一致
      # ==========================================================

      - name: Build Horizon runtime config
        run: |
          set -e

          echo "=========================================="
          echo "BUILD HORIZON RUNTIME CONFIG"
          echo "=========================================="

          python - <<'PY'

          import json
          from pathlib import Path

          system_dir = Path(
              "01_自生长知识系统/00_System"
          )

          config_file = (
              system_dir /
              "horizon_config.json"
          )

          rss_file = (
              system_dir /
              "rss_sources.json"
          )

          runtime_file = (
              system_dir /
              "horizon_runtime_config.json"
          )

          print("Config:")
          print(config_file)

          print("RSS:")
          print(rss_file)

          config = json.loads(
              config_file.read_text(
                  encoding="utf-8"
              )
          )

          rss = json.loads(
              rss_file.read_text(
                  encoding="utf-8"
              )
          )

          enabled_sources = [
              item
              for item in rss
              if item.get(
                  "enabled",
                  True
              )
          ]

          config.setdefault(
              "sources",
              {}
          )

          config["sources"]["rss"] = (
              enabled_sources
          )

          runtime_file.write_text(
              json.dumps(
                  config,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print()
          print(
              "✅ Horizon runtime config created"
          )

          print(runtime_file)

          print()
          print(
              f"Enabled RSS sources: "
              f"{len(enabled_sources)}"
          )

          PY

          echo
          echo "=========================================="
          echo "IMPORTANT HORIZON CONFIG"
          echo "=========================================="

          echo "Using Horizon native config:"
          echo "horizon/data/config.github.json"

          echo
          echo "The native Horizon config will NOT be overwritten."

      # ==========================================================
      # 9. Run Horizon
      #
      # 与已经测试通过的 Horizon 测试版完全一致
      # ==========================================================

      - name: Run Horizon
        working-directory: horizon
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          echo "=========================================="
          echo "RUN HORIZON"
          echo "=========================================="

          echo "API: https://api.agnes-ai.cn/v1"
          echo "Model: agnes-2.5-flash"
          echo "Hours: 24"

          echo
          echo "Config:"
          echo "data/config.github.json"

          echo
          echo "Checking Horizon profiles..."

          if [ -d "profiles" ]; then
            find profiles \
              -maxdepth 2 \
              -type f \
              | sort
          else
            echo "profiles directory not found at repository root"
          fi

          echo
          echo "Running Horizon..."

          uv run horizon \
            --hours 24 \
            --config data/config.github.json

          echo
          echo "✅ Horizon completed"

      # ==========================================================
      # 10. Checkout Horizon gh-pages
      # ==========================================================

      - name: Checkout Horizon gh-pages
        uses: actions/checkout@v4
        with:
          repository: 748686/Horizon
          ref: gh-pages
          path: horizon-pages

      # ==========================================================
      # 11. Inspect Horizon output
      # ==========================================================

      - name: Inspect Horizon output
        run: |
          set -e

          echo "=========================================="
          echo "HORIZON OUTPUT"
          echo "=========================================="

          if [ -d "horizon-pages/_posts" ]; then

            COUNT=$(find horizon-pages/_posts \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Horizon posts: $COUNT"

            if [ "$COUNT" -eq 0 ]; then
              echo "❌ Horizon produced no posts"
              exit 1
            fi

            find horizon-pages/_posts \
              -type f \
              -name "*.md" \
              | sort

          else

            echo "❌ Horizon _posts directory not found"
            exit 1

          fi

      # ==========================================================
      # 12. Copy Horizon → Raw News
      # ==========================================================

      - name: Copy Horizon posts to Raw News
        run: |
          set -e

          RAW_DIR="01_自生长知识系统/Raw News/$TODAY"

          mkdir -p "$RAW_DIR"

          echo "=========================================="
          echo "COPY HORIZON → RAW NEWS"
          echo "=========================================="

          find horizon-pages/_posts \
            -type f \
            -name "*.md" \
            -exec cp {} "$RAW_DIR/" \;

          echo
          echo "Raw News:"

          find "$RAW_DIR" \
            -maxdepth 1 \
            -type f \
            | sort

      # ==========================================================
      # 13. Build Atomic News
      # ==========================================================

      - name: Build Atomic News
        run: |
          set -e

          RAW_DIR="01_自生长知识系统/Raw News/$TODAY"

          ATOMIC_DIR="01_自生长知识系统/Raw News/$TODAY-Atomic"

          ZH_DIR="$ATOMIC_DIR/zh"
          EN_DIR="$ATOMIC_DIR/en"

          mkdir -p "$ZH_DIR"
          mkdir -p "$EN_DIR"

          echo "=========================================="
          echo "BUILD ATOMIC NEWS"
          echo "=========================================="

          echo "Raw:"
          echo "$RAW_DIR"

          echo
          echo "Atomic:"
          echo "$ATOMIC_DIR"

          FOUND=0

          while IFS= read -r file; do

            FOUND=$((FOUND + 1))

            filename=$(basename "$file")

            language="zh"

            if grep -qi \
              -E \
              'language:[[:space:]]*(en|english)' \
              "$file"; then

              language="en"

            elif grep -qi \
              -E \
              'language:[[:space:]]*zh' \
              "$file"; then

              language="zh"

            fi

            if [ "$language" = "en" ]; then
              cp "$file" "$EN_DIR/$filename"
            else
              cp "$file" "$ZH_DIR/$filename"
            fi

          done < <(
            find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | sort
          )

          echo
          echo "Processed: $FOUND"

          echo
          echo "Chinese Atomic:"

          find "$ZH_DIR" \
            -type f \
            -name "*.md" \
            | sort

          echo
          echo "English Atomic:"

          find "$EN_DIR" \
            -type f \
            -name "*.md" \
            | sort

      # ==========================================================
      # 14. Source Enrichment V3
      # ==========================================================

      - name: Run Source Enrichment V3
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          ZH="01_自生长知识系统/Raw News/$TODAY-Atomic/zh"
          EN="01_自生长知识系统/Raw News/$TODAY-Atomic/en"
          OUTPUT="01_自生长知识系统/Raw News/$TODAY-Enriched"

          SCRIPT="01_自生长知识系统/scripts/source_enrichment.py"

          echo "=========================================="
          echo "HORIZON SOURCE ENRICHMENT V3"
          echo "=========================================="

          echo "Chinese Atomic:"
          echo "$ZH"

          echo
          echo "English Atomic:"
          echo "$EN"

          echo
          echo "Output:"
          echo "$OUTPUT"

          echo
          echo "API:"
          echo "https://api.agnes-ai.cn/v1"

          echo
          echo "Model:"
          echo "agnes-2.5-flash"

          echo
          echo "Running..."

          python "$SCRIPT" \
            --zh "$ZH" \
            --en "$EN" \
            --output "$OUTPUT" \
            --date "$TODAY"

          echo
          echo "✅ Source Enrichment V3 completed"

      # ==========================================================
      # 15. Validate Chinese Enriched
      # ==========================================================

      - name: Validate Chinese Enriched
        run: |
          set -e

          DIR="01_自生长知识系统/Raw News/$TODAY-Enriched/zh"

          echo "=========================================="
          echo "VALIDATE CHINESE ENRICHED"
          echo "=========================================="

          if [ ! -d "$DIR" ]; then
            echo "❌ Chinese Enriched directory missing"
            exit 1
          fi

          COUNT=$(find "$DIR" \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "Chinese enriched files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "⚠️ No Chinese enriched files"
          else
            echo "✅ Chinese Enriched OK"
          fi

      # ==========================================================
      # 16. Validate English Enriched
      # ==========================================================

      - name: Validate English Enriched
        run: |
          set -e

          DIR="01_自生长知识系统/Raw News/$TODAY-Enriched/en"

          echo "=========================================="
          echo "VALIDATE ENGLISH ENRICHED"
          echo "=========================================="

          if [ ! -d "$DIR" ]; then
            echo "❌ English Enriched directory missing"
            exit 1
          fi

          COUNT=$(find "$DIR" \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "English enriched files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "⚠️ No English enriched files"
          else
            echo "✅ English Enriched OK"
          fi

      # ==========================================================
      # 17. Validate Front Matter
      # ==========================================================

      - name: Validate Front Matter
        run: |
          set -e

          DIR="01_自生长知识系统/Raw News/$TODAY-Enriched"

          echo "=========================================="
          echo "VALIDATE FRONT MATTER"
          echo "=========================================="

          TOTAL=0
          FAILED=0

          while IFS= read -r file; do

            TOTAL=$((TOTAL + 1))

            if ! head -n 1 "$file" | grep -q "^---$"; then

              echo "❌ Missing front matter:"
              echo "$file"

              FAILED=$((FAILED + 1))

            fi

          done < <(
            find "$DIR" \
              -type f \
              -name "*.md" \
              | sort
          )

          echo
          echo "Checked: $TOTAL"
          echo "Failed: $FAILED"

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ Front Matter validation failed"
            exit 1
          fi

          echo "✅ Front Matter OK"

      # ==========================================================
      # 18. Report Source Status
      # ==========================================================

      - name: Report source status
        run: |
          set -e

          DIR="01_自生长知识系统/Raw News/$TODAY-Enriched"

          echo "=========================================="
          echo "SOURCE STATUS"
          echo "=========================================="

          python - <<'PY'

          from pathlib import Path
          from collections import Counter
          import os
          import re

          root = (
              Path("01_自生长知识系统/Raw News")
              / f"{os.environ['TODAY']}-Enriched"
          )

          counter = Counter()

          total = 0

          for path in root.rglob("*.md"):

              total += 1

              text = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              match = re.search(
                  r"^source_status:\s*(.+)$",
                  text,
                  re.MULTILINE
              )

              if match:
                  status = match.group(1).strip()
              else:
                  status = "missing"

              counter[status] += 1

          print(f"Total: {total}")

          for status, count in sorted(
              counter.items()
          ):
              print(
                  f"{status}: {count}"
              )

          PY

      # ==========================================================
      # 19. Run Knowledge Pipeline V2
      # ==========================================================

      - name: Run Knowledge Pipeline V2
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          echo "=========================================="
          echo "KNOWLEDGE PIPELINE V2"
          echo "=========================================="

          echo "API:"
          echo "https://api.agnes-ai.cn/v1"

          echo
          echo "Model:"
          echo "agnes-2.5-flash"

          echo
          echo "Skills:"

          find "01_自生长知识系统/Skills" \
            -type f \
            -name "*.md" \
            | sort

          echo
          echo "Running..."

          python \
            "01_自生长知识系统/scripts/knowledge_pipeline.py"

          echo
          echo "✅ Knowledge Pipeline V2 completed"

      # ==========================================================
      # 20. Run Weekly Report V2
      # ==========================================================

      - name: Run Weekly Report V2
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          echo "=========================================="
          echo "WEEKLY REPORT V2"
          echo "=========================================="

          python \
            "01_自生长知识系统/scripts/weekly_report.py"

          echo
          echo "✅ Weekly Report V2 completed"

      # ==========================================================
      # 21. Show final system result
      # ==========================================================

      - name: Show final result
        run: |
          set -e

          echo "=========================================="
          echo "748686 KNOWLEDGE SYSTEM RESULT"
          echo "=========================================="

          echo
          echo "Raw News:"

          find \
            "01_自生长知识系统/Raw News/$TODAY" \
            -type f \
            -name "*.md" \
            | wc -l

          echo
          echo "Atomic News:"

          find \
            "01_自生长知识系统/Raw News/$TODAY-Atomic" \
            -type f \
            -name "*.md" \
            | wc -l

          echo
          echo "Enriched News:"

          find \
            "01_自生长知识系统/Raw News/$TODAY-Enriched" \
            -type f \
            -name "*.md" \
            | wc -l

          echo
          echo "Daily Reports:"

          find \
            "01_自生长知识系统/05_日报" \
            -type f \
            -name "*.md" \
            | sort \
            | tail -10

          echo
          echo "Knowledge:"

          find \
            "01_自生长知识系统/08_知识库" \
            -type f \
            -name "*.md" \
            | sort \
            | tail -10

          echo
          echo "Topics:"

          find \
            "01_自生长知识系统/07_专题报告" \
            -type f \
            -name "*.md" \
            | sort \
            | tail -10

          echo
          echo "Weekly:"

          find \
            "01_自生长知识系统/06_周报" \
            -type f \
            -name "*.md" \
            | sort \
            | tail -10

      # ==========================================================
      # 22. Commit everything
      # ==========================================================

      - name: Commit Knowledge System
        run: |
          set -e

          echo "=========================================="
          echo "COMMIT KNOWLEDGE SYSTEM"
          echo "=========================================="

          git config user.name \
            "748686 Knowledge Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "01_自生长知识系统"

          if git diff --cached --quiet; then

            echo "No changes to commit"

          else

            git commit \
              -m "chore: daily knowledge system $TODAY"

            git push

            echo "✅ Changes pushed to GitHub"

          fi

      # ==========================================================
      # 23. Complete job
      # ==========================================================

      - name: Complete job
        run: |
          echo
          echo "=========================================="
          echo "748686 自生长知识系统"
          echo "=========================================="

          echo
          echo "TODAY:"
          echo "$TODAY"

          echo
          echo "Horizon:"
          echo "✅ completed"

          echo
          echo "Raw News:"
          echo "✅ completed"

          echo
          echo "Atomic News:"
          echo "✅ completed"

          echo
          echo "Source Enrichment V2:"
          echo "✅ completed"

          echo
          echo "27 Skills:"
          echo "✅ Knowledge Pipeline V2 completed"

          echo
          echo "Knowledge Cards:"
          echo "✅ generated"

          echo
          echo "Topic Candidates:"
          echo "✅ generated"

          echo
          echo "Weekly Report:"
          echo "✅ generated"

          echo
          echo "GitHub:"
          echo "✅ pushed"

          echo
          echo "=========================================="
          echo "SYSTEM COMPLETE"
          echo "=========================================="
