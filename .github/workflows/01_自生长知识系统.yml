name: 01 自生长知识系统 - 主运行

on:
  workflow_dispatch:

  schedule:
    # ==========================================================
    # GitHub Actions cron 使用 UTC
    #
    # 北京时间每天 07:00
    # = UTC 前一天 23:00
    #
    # 注意：
    # 系统内部日期统一使用 Asia/Shanghai
    # ==========================================================
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:

  knowledge-system:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout 748686obsidian
      # ==========================================================

      - name: Checkout 748686obsidian
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. Setup Python
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================================
      # 3. Install uv
      # ==========================================================

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # ==========================================================
      # 4. Set Beijing Time
      #
      # 整个系统只在这里确定 TODAY。
      #
      # 后面所有步骤都使用这个 TODAY。
      #
      # 不再使用 date -u。
      # ==========================================================

      - name: Set Beijing Time
        run: |
          set -e

          export TZ=Asia/Shanghai

          TODAY=$(date +%Y-%m-%d)

          echo "TZ=Asia/Shanghai" >> "$GITHUB_ENV"
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "SYSTEM TIME"
          echo "=========================================="

          echo "Timezone:"
          echo "Asia/Shanghai"

          echo
          echo "Current Beijing time:"
          date '+%Y-%m-%d %H:%M:%S'

          echo
          echo "System date:"
          echo "$TODAY"

      # ==========================================================
      # 5. Checkout Horizon main
      #
      # IMPORTANT:
      #
      # 完全使用 748686/Horizon 自己的系统。
      #
      # 不使用：
      #
      # 01_自生长知识系统/00_System/horizon_config.json
      #
      # 不使用：
      #
      # horizon_runtime_config.json
      #
      # 不重新组装 Horizon 配置。
      #
      # Horizon 自己使用：
      #
      # Horizon/data/config.github.json
      # ==========================================================

      - name: Checkout Horizon main
        uses: actions/checkout@v4
        with:
          repository: 748686/Horizon
          ref: main
          path: horizon

      # ==========================================================
      # 6. Install Horizon
      # ==========================================================

      - name: Install Horizon
        working-directory: horizon
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL HORIZON"
          echo "=========================================="

          uv sync

          echo
          echo "Horizon config:"
          echo "data/config.github.json"

          if [ ! -f "data/config.github.json" ]; then
            echo "❌ Horizon data/config.github.json not found"
            exit 1
          fi

          echo
          echo "✅ Horizon installed"
          echo "✅ Native Horizon config found"

      # ==========================================================
      # 7. Check Agnes API
      # ==========================================================

      - name: Check Agnes API configuration
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -e

          echo "=========================================="
          echo "CHECK AGNES API CONFIGURATION"
          echo "=========================================="

          if [ -z "$AGNES_API_KEY" ]; then
            echo "❌ AGNES_API_KEY is missing"
            exit 1
          fi

          echo "✅ AGNES_API_KEY exists"

          echo
          echo "API Base:"
          echo "https://api.agnes-ai.cn/v1"

          echo
          echo "Model:"
          echo "agnes-2.5-flash"

      # ==========================================================
      # 8. Checkout Horizon gh-pages
      #
      # 第一次检查。
      #
      # 如果今天已经有 Horizon 输出：
      #
      # 不运行 Horizon。
      #
      # 如果今天没有：
      #
      # 才运行 Horizon。
      # ==========================================================

      - name: Checkout Horizon gh-pages - initial
        uses: actions/checkout@v4
        with:
          repository: 748686/Horizon
          ref: gh-pages
          path: horizon-pages-initial

      # ==========================================================
      # 9. Check today's Horizon output
      #
      # 不锁死文件名。
      #
      # 只检查：
      #
      # $TODAY*.md
      #
      # 所以：
      #
      # 2026-08-29-summary.md
      # 2026-08-29-summary-en.md
      # 2026-08-29-summary-zh.md
      # 2026-08-29-xxx.md
      #
      # 都可以。
      #
      # 只要今天存在一个或多个 MD：
      # 就认为 Horizon 今天已经产生结果。
      # ==========================================================

      - name: Check today's Horizon output
        id: horizon_initial_check
        run: |
          set -e

          POSTS_DIR="horizon-pages-initial/_posts"

          echo "=========================================="
          echo "CHECK TODAY'S HORIZON OUTPUT"
          echo "=========================================="

          echo "Timezone: Asia/Shanghai"
          echo "Today: $TODAY"

          echo
          echo "Checking:"
          echo "$POSTS_DIR"

          if [ ! -d "$POSTS_DIR" ]; then

            echo
            echo "❌ Horizon _posts directory not found"

            echo "HORIZON_TODAY_READY=false" >> "$GITHUB_ENV"

            exit 0

          fi

          echo
          echo "Today's files:"

          find "$POSTS_DIR" \
            -maxdepth 1 \
            -type f \
            -name "$TODAY*.md" \
            | sort

          COUNT=$(find "$POSTS_DIR" \
            -maxdepth 1 \
            -type f \
            -name "$TODAY*.md" \
            | wc -l)

          echo
          echo "Today's Horizon file count:"
          echo "$COUNT"

          if [ "$COUNT" -gt 0 ]; then

            echo
            echo "✅ Today's Horizon output already exists"
            echo "⏭️ Horizon will NOT run"

            echo "HORIZON_TODAY_READY=true" >> "$GITHUB_ENV"

          else

            echo
            echo "❌ Today's Horizon output does not exist"
            echo "▶️ Horizon will run"

            echo "HORIZON_TODAY_READY=false" >> "$GITHUB_ENV"

          fi

      # ==========================================================
      # 10. Run Horizon
      #
      # 只有今天没有文件的时候才运行。
      #
      # 完全按照 Horizon 自己的配置运行。
      # ==========================================================

      - name: Run Horizon
        if: env.HORIZON_TODAY_READY != 'true'
        working-directory: horizon
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          echo "=========================================="
          echo "RUN HORIZON"
          echo "=========================================="

          echo "Timezone:"
          echo "Asia/Shanghai"

          echo
          echo "Today:"
          echo "$TODAY"

          echo
          echo "Horizon repository:"
          echo "748686/Horizon"

          echo
          echo "Horizon native config:"
          echo "data/config.github.json"

          echo
          echo "Hours:"
          echo "24"

          echo
          echo "Starting Horizon..."

          uv run horizon \
            --hours 24 \
            --config data/config.github.json

          echo
          echo "=========================================="
          echo "HORIZON PROCESS FINISHED"
          echo "=========================================="

          echo "Horizon process completed."
          echo "Now the system will wait for today's gh-pages output."

      # ==========================================================
      # 11. Wait for today's gh-pages output
      #
      # 重要：
      #
      # Horizon 程序结束
      # 不等于
      # gh-pages 已经立即更新。
      #
      # 所以：
      #
      # 每 30 秒检查一次
      # 最多 5 分钟
      #
      # 一旦看到 TODAY*.md：
      # 立即继续。
      #
      # 5 分钟后仍然没有：
      # 整个 Job 失败并停止。
      # ==========================================================

      - name: Wait for today's Horizon output
        if: env.HORIZON_TODAY_READY != 'true'
        run: |
          set -e

          echo "=========================================="
          echo "WAIT FOR HORIZON GH-PAGES"
          echo "=========================================="

          echo "Today:"
          echo "$TODAY"

          echo
          echo "Maximum wait:"
          echo "5 minutes"

          echo
          echo "Check interval:"
          echo "30 seconds"

          FOUND=false

          for i in {1..10}; do

            echo
            echo "------------------------------------------"
            echo "CHECK $i / 10"
            echo "------------------------------------------"

            rm -rf horizon-pages-check

            git clone \
              --quiet \
              --depth 1 \
              --branch gh-pages \
              "https://github.com/748686/Horizon.git" \
              horizon-pages-check

            POSTS_DIR="horizon-pages-check/_posts"

            if [ ! -d "$POSTS_DIR" ]; then

              echo "_posts directory not found"

            else

              COUNT=$(find "$POSTS_DIR" \
                -maxdepth 1 \
                -type f \
                -name "$TODAY*.md" \
                | wc -l)

              echo "Today's files:"
              echo "$COUNT"

              if [ "$COUNT" -gt 0 ]; then

                echo
                echo "✅ TODAY'S HORIZON FILES FOUND"

                echo
                find "$POSTS_DIR" \
                  -maxdepth 1 \
                  -type f \
                  -name "$TODAY*.md" \
                  | sort

                FOUND=true

                break

              fi

            fi

            if [ "$i" -lt 10 ]; then

              echo
              echo "No today's output yet."
              echo "Waiting 30 seconds..."

              sleep 30

            fi

          done

          if [ "$FOUND" != "true" ]; then

            echo
            echo "=========================================="
            echo "❌ HORIZON OUTPUT NOT FOUND"
            echo "=========================================="

            echo
            echo "Horizon process finished,"
            echo "but today's .md files did not appear"
            echo "in Horizon gh-pages/_posts within 5 minutes."

            echo
            echo "System stops here."
            echo "Atomic / Enrichment / Knowledge Pipeline"
            echo "will NOT run."

            exit 1

          fi

          echo
          echo "✅ Horizon gh-pages is ready"

      # ==========================================================
      # 12. Final checkout Horizon gh-pages
      #
      # 重新获取最新 gh-pages。
      # ==========================================================

      - name: Checkout Horizon gh-pages - final
        run: |
          set -e

          echo "=========================================="
          echo "GET FINAL HORIZON GH-PAGES"
          echo "=========================================="

          rm -rf horizon-pages

          git clone \
            --quiet \
            --depth 1 \
            --branch gh-pages \
            "https://github.com/748686/Horizon.git" \
            horizon-pages

          echo "✅ Latest Horizon gh-pages downloaded"

      # ==========================================================
      # 13. Final verify today's files
      #
      # 在真正复制之前最后确认一次。
      # ==========================================================

      - name: Verify today's Horizon files
        run: |
          set -e

          POSTS_DIR="horizon-pages/_posts"

          echo "=========================================="
          echo "FINAL HORIZON OUTPUT CHECK"
          echo "=========================================="

          echo "Today:"
          echo "$TODAY"

          if [ ! -d "$POSTS_DIR" ]; then

            echo "❌ Horizon _posts directory missing"
            exit 1

          fi

          echo
          echo "Today's Horizon files:"

          find "$POSTS_DIR" \
            -maxdepth 1 \
            -type f \
            -name "$TODAY*.md" \
            | sort

          COUNT=$(find "$POSTS_DIR" \
            -maxdepth 1 \
            -type f \
            -name "$TODAY*.md" \
            | wc -l)

          echo
          echo "Today's file count:"
          echo "$COUNT"

          if [ "$COUNT" -eq 0 ]; then

            echo
            echo "❌ Today's Horizon files disappeared"
            echo "System stops here."

            exit 1

          fi

          echo
          echo "✅ Today's Horizon output confirmed"

      # ==========================================================
      # 14. Copy ONLY today's Horizon files
      #
      # 绝不复制整个 _posts。
      #
      # 只复制：
      #
      # $TODAY*.md
      # ==========================================================

      - name: Copy today's Horizon files to Raw News
        run: |
          set -e

          POSTS_DIR="horizon-pages/_posts"

          RAW_DIR="01_自生长知识系统/Raw News/$TODAY"

          mkdir -p "$RAW_DIR"

          echo "=========================================="
          echo "COPY TODAY'S HORIZON FILES"
          echo "=========================================="

          echo "Source:"
          echo "$POSTS_DIR"

          echo
          echo "Destination:"
          echo "$RAW_DIR"

          COUNT=0

          while IFS= read -r file; do

            filename=$(basename "$file")

            echo
            echo "Copying:"
            echo "$filename"

            cp "$file" "$RAW_DIR/$filename"

            COUNT=$((COUNT + 1))

          done < <(
            find "$POSTS_DIR" \
              -maxdepth 1 \
              -type f \
              -name "$TODAY*.md" \
              | sort
          )

          echo
          echo "Copied files:"
          echo "$COUNT"

          if [ "$COUNT" -eq 0 ]; then

            echo "❌ Nothing copied"
            exit 1

          fi

          echo
          echo "Raw News result:"

          find "$RAW_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | sort

          echo
          echo "✅ Today's Horizon files imported"

      # ==========================================================
      # 15. Build Atomic News
      # ==========================================================

      - name: Build Atomic News
        run: |
          set -e

          RAW_DIR="01_自生长知识系统/Raw News/$TODAY"

          ATOMIC_DIR="01_自生长知识系统/Raw News/$TODAY-Atomic"

          ZH_DIR="$ATOMIC_DIR/zh"
          EN_DIR="$ATOMIC_DIR/en"

          mkdir -p "$ZH_DIR"
          mkdir -p "$EN_DIR"

          echo "=========================================="
          echo "BUILD ATOMIC NEWS"
          echo "=========================================="

          echo "Raw:"
          echo "$RAW_DIR"

          echo
          echo "Atomic:"
          echo "$ATOMIC_DIR"

          FOUND=0

          while IFS= read -r file; do

            FOUND=$((FOUND + 1))

            filename=$(basename "$file")

            language="zh"

            if grep -qi \
              -E \
              'language:[[:space:]]*(en|english)' \
              "$file"; then

              language="en"

            elif grep -qi \
              -E \
              'language:[[:space:]]*zh' \
              "$file"; then

              language="zh"

            else

              if [[ "$filename" == *"-en.md" ]]; then
                language="en"
              elif [[ "$filename" == *"-zh.md" ]]; then
                language="zh"
              fi

            fi

            if [ "$language" = "en" ]; then

              cp "$file" "$EN_DIR/$filename"

            else

              cp "$file" "$ZH_DIR/$filename"

            fi

          done < <(
            find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | sort
          )

          echo
          echo "Processed:"
          echo "$FOUND"

          echo
          echo "Chinese Atomic:"

          find "$ZH_DIR" \
            -type f \
            -name "*.md" \
            | sort

          echo
          echo "English Atomic:"

          find "$EN_DIR" \
            -type f \
            -name "*.md" \
            | sort

      # ==========================================================
      # 16. Source Enrichment V3
      # ==========================================================

      - name: Run Source Enrichment V3
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL SOURCE ENRICHMENT DEPENDENCIES"
          echo "=========================================="

          python -m pip install --upgrade pip
          python -m pip install requests

          echo
          echo "=========================================="
          echo "HORIZON SOURCE ENRICHMENT V3"
          echo "=========================================="

          ZH="01_自生长知识系统/Raw News/$TODAY-Atomic/zh"
          EN="01_自生长知识系统/Raw News/$TODAY-Atomic/en"

          OUTPUT="01_自生长知识系统/Raw News/$TODAY-Enriched"

          SCRIPT="01_自生长知识系统/scripts/source_enrichment.py"

          echo
          echo "Chinese Atomic:"
          echo "$ZH"

          echo
          echo "English Atomic:"
          echo "$EN"

          echo
          echo "Output:"
          echo "$OUTPUT"

          echo
          echo "Running..."

          python "$SCRIPT" \
            --zh "$ZH" \
            --en "$EN" \
            --output "$OUTPUT" \
            --date "$TODAY"

          echo
          echo "✅ Source Enrichment V3 completed"

      # ==========================================================
      # 17. Validate Chinese Enriched
      # ==========================================================

      - name: Validate Chinese Enriched
        run: |
          set -e

          DIR="01_自生长知识系统/Raw News/$TODAY-Enriched/zh"

          echo "=========================================="
          echo "VALIDATE CHINESE ENRICHED"
          echo "=========================================="

          if [ ! -d "$DIR" ]; then
            echo "❌ Chinese Enriched directory missing"
            exit 1
          fi

          COUNT=$(find "$DIR" \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "Chinese enriched files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "⚠️ No Chinese enriched files"
          else
            echo "✅ Chinese Enriched OK"
          fi

      # ==========================================================
      # 18. Validate English Enriched
      # ==========================================================

      - name: Validate English Enriched
        run: |
          set -e

          DIR="01_自生长知识系统/Raw News/$TODAY-Enriched/en"

          echo "=========================================="
          echo "VALIDATE ENGLISH ENRICHED"
          echo "=========================================="

          if [ ! -d "$DIR" ]; then
            echo "❌ English Enriched directory missing"
            exit 1
          fi

          COUNT=$(find "$DIR" \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "English enriched files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "⚠️ No English enriched files"
          else
            echo "✅ English Enriched OK"
          fi

      # ==========================================================
      # 19. Validate Front Matter
      # ==========================================================

      - name: Validate Front Matter
        run: |
          set -e

          DIR="01_自生长知识系统/Raw News/$TODAY-Enriched"

          echo "=========================================="
          echo "VALIDATE FRONT MATTER"
          echo "=========================================="

          TOTAL=0
          FAILED=0

          while IFS= read -r file; do

            TOTAL=$((TOTAL + 1))

            if ! head -n 1 "$file" | grep -q "^---$"; then

              echo "❌ Missing front matter:"
              echo "$file"

              FAILED=$((FAILED + 1))

            fi

          done < <(
            find "$DIR" \
              -type f \
              -name "*.md" \
              | sort
          )

          echo
          echo "Checked:"
          echo "$TOTAL"

          echo
          echo "Failed:"
          echo "$FAILED"

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ Front Matter validation failed"
            exit 1
          fi

          echo "✅ Front Matter OK"

      # ==========================================================
      # 20. Report Source Status
      # ==========================================================

      - name: Report Source Status
        run: |
          set -e

          echo "=========================================="
          echo "SOURCE STATUS"
          echo "=========================================="

          python - <<'PY'

          from pathlib import Path
          from collections import Counter
          import os
          import re

          root = (
              Path("01_自生长知识系统/Raw News")
              / f"{os.environ['TODAY']}-Enriched"
          )

          counter = Counter()

          total = 0

          for path in root.rglob("*.md"):

              total += 1

              text = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              match = re.search(
                  r"^source_status:\s*(.+)$",
                  text,
                  re.MULTILINE
              )

              if match:
                  status = match.group(1).strip()
              else:
                  status = "missing"

              counter[status] += 1

          print(f"Total: {total}")

          for status, count in sorted(
              counter.items()
          ):
              print(
                  f"{status}: {count}"
              )

          PY

      # ==========================================================
      # 21. Knowledge Pipeline V2
      # ==========================================================

      - name: Run Knowledge Pipeline V2
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          echo "=========================================="
          echo "KNOWLEDGE PIPELINE V2"
          echo "=========================================="

          echo
          echo "Skills:"

          find \
            "01_自生长知识系统/Skills" \
            -type f \
            -name "*.md" \
            | sort

          echo
          echo "Running..."

          python \
            "01_自生长知识系统/scripts/knowledge_pipeline.py"

          echo
          echo "✅ Knowledge Pipeline V2 completed"

      # ==========================================================
      # 22. Weekly Report V2
      # ==========================================================

      - name: Run Weekly Report V2
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-2.5-flash
        run: |
          set -e

          echo "=========================================="
          echo "WEEKLY REPORT V2"
          echo "=========================================="

          python \
            "01_自生长知识系统/scripts/weekly_report.py"

          echo
          echo "✅ Weekly Report V2 completed"

      # ==========================================================
      # 23. Show final result
      # ==========================================================

      - name: Show Final System Result
        run: |
          set -e

          echo "=========================================="
          echo "748686 KNOWLEDGE SYSTEM RESULT"
          echo "=========================================="

          echo
          echo "Timezone:"
          echo "Asia/Shanghai"

          echo
          echo "TODAY:"
          echo "$TODAY"

          echo
          echo "=========================================="
          echo "RAW NEWS"
          echo "=========================================="

          find \
            "01_自生长知识系统/Raw News/$TODAY" \
            -type f \
            -name "*.md" \
            | sort

          echo
          echo "Raw count:"

          find \
            "01_自生长知识系统/Raw News/$TODAY" \
            -type f \
            -name "*.md" \
            | wc -l

          echo
          echo "=========================================="
          echo "ATOMIC NEWS"
          echo "=========================================="

          find \
            "01_自生长知识系统/Raw News/$TODAY-Atomic" \
            -type f \
            -name "*.md" \
            | sort

          echo
          echo "Atomic count:"

          find \
            "01_自生长知识系统/Raw News/$TODAY-Atomic" \
            -type f \
            -name "*.md" \
            | wc -l

          echo
          echo "=========================================="
          echo "ENRICHED NEWS"
          echo "=========================================="

          find \
            "01_自生长知识系统/Raw News/$TODAY-Enriched" \
            -type f \
            -name "*.md" \
            | sort

          echo
          echo "Enriched count:"

          find \
            "01_自生长知识系统/Raw News/$TODAY-Enriched" \
            -type f \
            -name "*.md" \
            | wc -l

          echo
          echo "=========================================="
          echo "DAILY REPORTS"
          echo "=========================================="

          find \
            "01_自生长知识系统/05_日报" \
            -type f \
            -name "*.md" \
            | sort \
            | tail -10

          echo
          echo "=========================================="
          echo "KNOWLEDGE"
          echo "=========================================="

          find \
            "01_自生长知识系统/08_知识库" \
            -type f \
            -name "*.md" \
            | sort \
            | tail -10

          echo
          echo "=========================================="
          echo "TOPICS"
          echo "=========================================="

          find \
            "01_自生长知识系统/07_专题报告" \
            -type f \
            -name "*.md" \
            | sort \
            | tail -10

          echo
          echo "=========================================="
          echo "WEEKLY"
          echo "=========================================="

          find \
            "01_自生长知识系统/06_周报" \
            -type f \
            -name "*.md" \
            | sort \
            | tail -10

      # ==========================================================
      # 24. Commit everything
      # ==========================================================

      - name: Commit Knowledge System
        run: |
          set -e

          echo "=========================================="
