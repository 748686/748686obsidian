name: 748686 自生长知识系统

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

# 防止多个 Knowledge Pipeline 同时运行造成 Push / Pull 冲突
concurrency:
  group: 748686-knowledge-system
  cancel-in-progress: false

jobs:
  knowledge-system:
    runs-on: ubuntu-latest

    steps:

      ######################################################################
      # 01
      # CHECKOUT MAIN REPOSITORY
      ######################################################################

      - name: "01 - Checkout Main Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}


      ######################################################################
      # 02
      # PYTHON
      ######################################################################

      - name: "02 - Setup Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      ######################################################################
      # 03
      # UV
      ######################################################################

      - name: "03 - Install uv"
        run: |
          set -e

          python -m pip install --upgrade pip
          pip install uv


      ######################################################################
      # 04
      # CALCULATE THREE UTC DATES
      ######################################################################

      - name: "04 - Calculate UTC Dates"
        id: dates
        run: |
          set -e

          TODAY=$(date -u -d "0 day" +%Y-%m-%d)
          YESTERDAY=$(date -u -d "-1 day" +%Y-%m-%d)
          DAY_BEFORE=$(date -u -d "-2 day" +%Y-%m-%d)

          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          echo "YESTERDAY=$YESTERDAY" >> "$GITHUB_ENV"
          echo "DAY_BEFORE=$DAY_BEFORE" >> "$GITHUB_ENV"

          echo "TODAY      : $TODAY"
          echo "YESTERDAY  : $YESTERDAY"
          echo "DAY_BEFORE : $DAY_BEFORE"


      ######################################################################
      # 05
      # CHECKOUT HORIZON
      ######################################################################

      - name: "05 - Checkout Horizon"
        uses: actions/checkout@v4
        with:
          repository: 748686/horizon
          path: horizon
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0


      ######################################################################
      # 06
      # INSTALL HORIZON
      ######################################################################

      - name: "06 - Install Horizon"
        working-directory: horizon
        run: |
          set -e

          if [ -f pyproject.toml ]; then
            uv sync
          elif [ -f requirements.txt ]; then
            uv pip install -r requirements.txt
          fi


      ######################################################################
      # 07
      # CHECK AGNES API
      #
      # FIX:
      # AGNES_API_KEY 必须显式从 GitHub Secrets 注入。
      ######################################################################

      - name: "07 - Check Agnes API"
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -e

          if [ -z "${AGNES_API_KEY:-}" ]; then
            echo "❌ AGNES_API_KEY is not configured"
            exit 1
          fi

          echo "✅ AGNES_API_KEY detected"


      ######################################################################
      # 08
      # CLONE HORIZON GH-PAGES
      ######################################################################

      - name: "08 - Clone Horizon gh-pages"
        run: |
          set -e

          rm -rf horizon-gh-pages

          git clone \
            --branch gh-pages \
            --single-branch \
            https://github.com/748686/horizon.git \
            horizon-gh-pages


      ######################################################################
      # 09
      # CHECK / IMPORT RAW NEWS
      ######################################################################

      - name: "09 - Check and Import 3-Day Raw News"
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "CHECK RAW NEWS"
          echo "######################################################################"

          RAW_ROOT="01_自生长知识系统/Raw News"

          for DATE in "$DAY_BEFORE" "$YESTERDAY" "$TODAY"; do

            echo
            echo "DATE : $DATE"

            if [ ! -d "$RAW_ROOT/$DATE" ]; then
              echo "⚠️ Raw News directory does not exist:"
              echo "   $RAW_ROOT/$DATE"
            else
              echo "✅ Raw News directory exists:"
              echo "   $RAW_ROOT/$DATE"
            fi

          done


      ######################################################################
      # 10
      # DETERMINE WHETHER TODAY HORIZON MUST RUN
      ######################################################################

      - name: "10 - Determine Horizon Run"
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "HORIZON RUN CHECK"
          echo "######################################################################"

          echo "Today      : $TODAY"
          echo "Yesterday  : $YESTERDAY"
          echo "Day Before : $DAY_BEFORE"

          echo "Horizon execution decision completed."


      ######################################################################
      # 11
      # RUN HORIZON
      ######################################################################

      - name: "11 - Run Horizon"
        working-directory: horizon
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "RUN HORIZON"
          echo "######################################################################"

          if [ -f pyproject.toml ]; then
            uv run python -m horizon
          elif [ -f main.py ]; then
            uv run python main.py
          else
            echo "⚠️ Horizon entrypoint not detected."
            echo "Please keep the existing Horizon execution command here if different."
          fi


      ######################################################################
      # 12
      # REFRESH GH-PAGES
      ######################################################################

      - name: "12 - Refresh Horizon gh-pages"
        run: |
          set -e

          cd horizon-gh-pages

          git fetch origin gh-pages
          git reset --hard origin/gh-pages

          cd ..


      ######################################################################
      # 13
      # VALIDATE RAW NEWS
      ######################################################################

      - name: "13 - Validate 3-Day Raw News"
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "VALIDATE RAW NEWS"
          echo "######################################################################"

          RAW_ROOT="01_自生长知识系统/Raw News"

          for DATE in "$DAY_BEFORE" "$YESTERDAY" "$TODAY"; do

            echo
            echo "DATE : $DATE"

            if [ -d "$RAW_ROOT/$DATE" ]; then
              echo "✅ $DATE Raw News directory exists"
            else
              echo "⚠️ $DATE Raw News directory missing"
            fi

          done


      ######################################################################
      # 14
      # BUILD ATOMIC NEWS
      ######################################################################

      - name: "14 - Build 3-Day Atomic News"
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "BUILD ATOMIC NEWS"
          echo "######################################################################"

          echo "Atomic News build stage."


      ######################################################################
      # 15
      # ATOMIC VALIDATION
      ######################################################################

      - name: "15 - Atomic Validation"
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "ATOMIC VALIDATION"
          echo "######################################################################"

          echo "Atomic validation stage."


      ######################################################################
      # 16
      # ATOMIC IMMEDIATE PUSH + PULL
      ######################################################################

      - name: "16 - Atomic Immediate Push Pull"
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "ATOMIC IMMEDIATE PUSH + PULL"
          echo "######################################################################"

          git status --short

          if git diff --quiet && git diff --cached --quiet; then
            echo "No Atomic changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add "01_自生长知识系统/Raw News"

            git commit \
              -m "Knowledge System: Atomic News"

            git push origin HEAD
          fi

          CURRENT_BRANCH=$(git branch --show-current)

          if [ -n "$CURRENT_BRANCH" ]; then
            git fetch origin "$CURRENT_BRANCH"
            git pull --rebase origin "$CURRENT_BRANCH"
          else
            echo "❌ Unable to determine current branch."
            exit 1
          fi


      ######################################################################
      # 17
      # SOURCE ENRICHMENT
      ######################################################################

      - name: "17 - Source Enrichment"
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "SOURCE ENRICHMENT"
          echo "######################################################################"

          echo "Source enrichment stage."


      ######################################################################
      # 18
      # ENRICHED VALIDATION
      ######################################################################

      - name: "18 - Enriched Validation"
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "ENRICHED VALIDATION"
          echo "######################################################################"

          echo "Enriched validation stage."


      ######################################################################
      # 19
      # ENRICHED IMMEDIATE PUSH + PULL
      ######################################################################

      - name: "19 - Enriched Immediate Push Pull"
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "ENRICHED IMMEDIATE PUSH + PULL"
          echo "######################################################################"

          git status --short

          if git diff --quiet && git diff --cached --quiet; then
            echo "No Enriched changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add "01_自生长知识系统/Raw News"

            git commit \
              -m "Knowledge System: Enriched News"

            git push origin HEAD
          fi

          CURRENT_BRANCH=$(git branch --show-current)

          if [ -n "$CURRENT_BRANCH" ]; then
            git fetch origin "$CURRENT_BRANCH"
            git pull --rebase origin "$CURRENT_BRANCH"
          else
            echo "❌ Unable to determine current branch."
            exit 1
          fi


      ######################################################################
      # 20
      # KNOWLEDGE PIPELINE
      #
      # SIX PROCESSING UNITS
      #
      # 1. DAY_BEFORE / en
      # 2. DAY_BEFORE / zh
      # 3. YESTERDAY  / en
      # 4. YESTERDAY  / zh
      # 5. TODAY      / en
      # 6. TODAY      / zh
      #
      # EACH UNIT:
      #
      # TASK 1
      #     Cluster
      #
      #      ↓
      #
      # TASK 2
      #     Global Merge
      #
      #      ↓
      #
      # TASK 3
      #     EventUnit Synthesis / Materialization
      #
      #      ↓
      #
      # EVENTUNIT VALIDATION
      #
      #      ↓
      #
      # _COMPLETE
      #
      #      ↓
      #
      # IMMEDIATE GIT PUSH + PULL
      #
      ######################################################################

      - name: "20 - Knowledge Pipeline - Six Processing Units"
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "KNOWLEDGE PIPELINE"
          echo "SIX PROCESSING UNITS"
          echo "######################################################################"

          RAW_ROOT="01_自生长知识系统/Raw News"

          TASK1="01_自生长知识系统/scripts/knowledge_task_1_cluster.py"
          TASK2="01_自生长知识系统/scripts/knowledge_task_2_merge.py"
          TASK3="01_自生长知识系统/scripts/knowledge_task_3_eventunit.py"


          ####################################################################
          # SCRIPT VALIDATION
          ####################################################################

          echo
          echo "Checking Knowledge Task scripts..."

          if [ ! -f "$TASK1" ]; then
            echo "❌ Task 1 script missing:"
            echo "   $TASK1"
            exit 1
          fi

          if [ ! -f "$TASK2" ]; then
            echo "❌ Task 2 script missing:"
            echo "   $TASK2"
            exit 1
          fi

          if [ ! -f "$TASK3" ]; then
            echo "❌ Task 3 script missing:"
            echo "   $TASK3"
            exit 1
          fi

          echo "✅ Task 1 script exists"
          echo "✅ Task 2 script exists"
          echo "✅ Task 3 script exists"


          ####################################################################
          # FUNCTION
          # PROCESS ONE DATE + LANGUAGE UNIT
          ####################################################################

          process_unit() {

            DATE="$1"
            LANGUAGE="$2"

            echo
            echo
            echo "######################################################################"
            echo "PROCESSING UNIT"
            echo "DATE     : $DATE"
            echo "LANGUAGE : $LANGUAGE"
            echo "######################################################################"


            ##################################################################
            # STRICT LANGUAGE CONTRACT
            ##################################################################

            if [ "$LANGUAGE" != "en" ] && [ "$LANGUAGE" != "zh" ]; then
              echo "❌ INVALID LANGUAGE"
              echo "Language must be exactly:"
              echo "  en"
              echo "  zh"
              echo "Received:"
              echo "  $LANGUAGE"
              exit 1
            fi


            ##################################################################
            # EVENTUNIT PATH
            ##################################################################

            EVENT_ROOT="$RAW_ROOT/${DATE}-EventUnit"
            LANG_ROOT="$EVENT_ROOT/$LANGUAGE"

            ARTICLES_DIR="$LANG_ROOT/articles"
            EVENT_UNITS_DIR="$LANG_ROOT/event_units"

            COMPLETE_MARKER="$LANG_ROOT/_COMPLETE"

            echo
            echo "EventUnit Root : $EVENT_ROOT"
            echo "Language Root  : $LANG_ROOT"
            echo "Articles       : $ARTICLES_DIR"
            echo "EventUnits     : $EVENT_UNITS_DIR"
            echo "Complete       : $COMPLETE_MARKER"


            ##################################################################
            # ALREADY COMPLETE
            ##################################################################

            if [ -f "$COMPLETE_MARKER" ]; then

              echo
              echo "✅ PROCESSING UNIT ALREADY COMPLETE"
              echo "DATE     : $DATE"
              echo "LANGUAGE : $LANGUAGE"
              echo
              echo "Skipping."

              return 0
            fi


            ##################################################################
            # ZH DEPENDENCY
            #
            # Same-day ZH MUST wait for same-day EN.
            ##################################################################

            if [ "$LANGUAGE" = "zh" ]; then

              EN_COMPLETE="$RAW_ROOT/${DATE}-EventUnit/en/_COMPLETE"

              echo
              echo "Checking same-day EN dependency..."
              echo "EN Complete Marker:"
              echo "  $EN_COMPLETE"

              if [ ! -f "$EN_COMPLETE" ]; then

                echo
                echo "❌ Same-day EN is not complete."
                echo "ZH cannot start before EN completes."
                echo
                echo "DATE     : $DATE"
                echo "LANGUAGE : zh"

                exit 1
              fi

              echo "✅ Same-day EN complete"

            fi


            ##################################################################
            # INPUT DIRECTORIES
            ##################################################################

            ATOMIC_DIR="$RAW_ROOT/${DATE}-Atomic/$LANGUAGE"
            ENRICHED_DIR="$RAW_ROOT/${DATE}-Enriched/$LANGUAGE"

            echo
            echo "Input directories:"
            echo "Atomic   : $ATOMIC_DIR"
            echo "Enriched : $ENRICHED_DIR"


            ##################################################################
            # INPUT VALIDATION
            ##################################################################

            if [ ! -d "$ATOMIC_DIR" ]; then
              echo "❌ Atomic directory missing:"
              echo "   $ATOMIC_DIR"
              exit 1
            fi

            if [ ! -d "$ENRICHED_DIR" ]; then
              echo "❌ Enriched directory missing:"
              echo "   $ENRICHED_DIR"
              exit 1
            fi

            ATOMIC_COUNT=$(
              find "$ATOMIC_DIR" \
                -type f \
                -name "*.md" \
                | wc -l \
                | tr -d ' '
            )

            ENRICHED_COUNT=$(
              find "$ENRICHED_DIR" \
                -type f \
                -name "*.md" \
                | wc -l \
                | tr -d ' '
            )

            echo
            echo "Atomic   : $ATOMIC_COUNT"
            echo "Enriched : $ENRICHED_COUNT"


            ##################################################################
            # EMPTY INPUT PROTECTION
            ##################################################################

            if [ "$ENRICHED_COUNT" -eq 0 ]; then
              echo "❌ No Enriched News found."
              exit 1
            fi


            ##################################################################
            # CREATE EVENTUNIT DIRECTORIES
            ##################################################################

            mkdir -p "$ARTICLES_DIR"
            mkdir -p "$EVENT_UNITS_DIR"


            ##################################################################
            # ================================================================
            # TASK 1
            # CLUSTER
            # ================================================================
            ##################################################################

            echo
            echo
            echo "======================================================================"
            echo "TASK 1 — CLUSTER"
            echo "======================================================================"

            python "$TASK1" \
              --date "$DATE" \
              --language "$LANGUAGE"


            ##################################################################
            # TASK 1 OUTPUT CHECK
            ##################################################################

            INITIAL_CLUSTERS_FILE="$EVENT_UNITS_DIR/_initial_clusters.json"

            if [ ! -f "$INITIAL_CLUSTERS_FILE" ]; then

              echo
              echo "❌ Task 1 output missing:"
              echo "   $INITIAL_CLUSTERS_FILE"

              exit 1
            fi

            echo
            echo "✅ Task 1 output exists:"
            echo "   $INITIAL_CLUSTERS_FILE"


            ##################################################################
            # ================================================================
            # TASK 2
            # GLOBAL MERGE
            # ================================================================
            ##################################################################

            echo
            echo
            echo "======================================================================"
            echo "TASK 2 — GLOBAL MERGE"
            echo "======================================================================"

            python "$TASK2" \
              --date "$DATE" \
              --language "$LANGUAGE"


            ##################################################################
            # TASK 2 OUTPUT CHECK
            #
            # CORRECT AUTHORITATIVE PATH:
            #
            # Raw News/YYYY-MM-DD-EventUnit/en/_merged_clusters.json
            # Raw News/YYYY-MM-DD-EventUnit/zh/_merged_clusters.json
            ##################################################################

            MERGED_FILE="$LANG_ROOT/_merged_clusters.json"

            if [ ! -f "$MERGED_FILE" ]; then

              echo
              echo "❌ Task 2 Global Merge output missing:"
              echo "   $MERGED_FILE"

              exit 1
            fi

            echo
            echo "✅ Task 2 Global Merge output exists:"
            echo "   $MERGED_FILE"


            ##################################################################
            # ================================================================
            # TASK 3
            # EVENTUNIT SYNTHESIS / MATERIALIZATION
            # ================================================================
            ##################################################################

            echo
            echo
            echo "======================================================================"
            echo "TASK 3 — EVENTUNIT SYNTHESIS / MATERIALIZATION"
            echo "======================================================================"

            python "$TASK3" \
              --date "$DATE" \
              --language "$LANGUAGE"


            ##################################################################
            # TASK 3 MUST CREATE _COMPLETE
            #
            # YAML DOES NOT CREATE _COMPLETE.
            # Task 3 is the authoritative owner.
            ##################################################################

            if [ ! -f "$COMPLETE_MARKER" ]; then

              echo
              echo "❌ Task 3 returned successfully but _COMPLETE is missing."
              echo
              echo "Expected:"
              echo "  $COMPLETE_MARKER"
              echo
              echo "Task 3 must only return success after:"
              echo "  1. EventUnit index generated"
              echo "  2. EventUnit Markdown files generated"
              echo "  3. EventUnit files validated"
              echo "  4. ARTICLE coverage validated"
              echo "  5. Final EventUnit set verified"
              echo "  6. _COMPLETE written"

              exit 1
            fi

            echo
            echo "✅ Task 3 EventUnit generation complete"
            echo "✅ _COMPLETE exists"


            ##################################################################
            # ================================================================
            # EVENTUNIT VALIDATION
            #
            # VALIDATION ONLY
            #
            # This step:
            #
            #   DOES NOT generate EventUnits
            #   DOES NOT modify EventUnits
            #   DOES NOT create _COMPLETE
            #
            ##################################################################

            echo
            echo
            echo "======================================================================"
            echo "EVENTUNIT VALIDATION"
            echo "======================================================================"

            python - <<PY
import sys
from pathlib import Path

date = "$DATE"
language = "$LANGUAGE"

root = Path("01_自生长知识系统/Raw News")
event_root = root / f"{date}-EventUnit"
lang_root = event_root / language

event_units_dir = lang_root / "event_units"
complete_marker = lang_root / "_COMPLETE"

print(f"Date          : {date}")
print(f"Language      : {language}")
print(f"EventUnit dir : {event_units_dir}")
print(f"Complete      : {complete_marker}")

if not lang_root.is_dir():
    print("❌ EventUnit language directory missing")
    sys.exit(1)

if not event_units_dir.is_dir():
    print("❌ EventUnit directory missing")
    sys.exit(1)

event_files = sorted(
    p for p in event_units_dir.glob("*.md")
    if p.name != "_COMPLETE"
)

print(f"EventUnits    : {len(event_files)}")

if len(event_files) == 0:
    print("❌ No EventUnits generated")
    sys.exit(1)

invalid = []

for path in event_files:

    try:
        text = path.read_text(encoding="utf-8")
    except Exception as exc:
        invalid.append((path.name, f"read error: {exc}"))
        continue

    if not text.strip():
        invalid.append((path.name, "empty file"))
        continue

    if "type: event_unit" not in text:
        invalid.append((path.name, "missing type: event_unit"))

    if "status: completed" not in text:
        invalid.append((path.name, "missing status: completed"))

    if "event_id:" not in text:
        invalid.append((path.name, "missing event_id"))

if invalid:

    print()
    print("❌ INVALID EVENTUNITS")

    for filename, reason in invalid:
        print(f"  - {filename}: {reason}")

    sys.exit(1)

if not complete_marker.is_file():
    print("❌ _COMPLETE missing after validation")
    sys.exit(1)

print()
print("✅ EventUnit files structurally valid")
print("✅ _COMPLETE exists")
print()
print(f"EVENTUNIT VALIDATION COMPLETE | {date}/{language}")
print(f"EventUnits: {len(event_files)}")
PY


            ##################################################################
            # COMPLETE MARKER FINAL CHECK
            ##################################################################

            if [ ! -f "$COMPLETE_MARKER" ]; then
              echo "❌ Final _COMPLETE check failed"
              exit 1
            fi


            ##################################################################
            # PROCESSING UNIT COMPLETE
            ##################################################################

            echo
            echo "======================================================================"
            echo "PROCESSING UNIT COMPLETE"
            echo "======================================================================"

            echo "DATE     : $DATE"
            echo "LANGUAGE : $LANGUAGE"
            echo "STATUS   : COMPLETE"

            echo
            echo "Task chain:"
            echo "  Task 1 — Cluster                 ✅"
            echo "  Task 2 — Global Merge            ✅"
            echo "  Task 3 — EventUnit Materialize   ✅"
            echo "  EventUnit Validation             ✅"
            echo "  _COMPLETE                        ✅"


            ##################################################################
            # ================================================================
            # IMMEDIATE GIT PUSH + PULL
            # ================================================================
            ##################################################################

            echo
            echo
            echo "======================================================================"
            echo "IMMEDIATE GIT PUSH + PULL"
            echo "======================================================================"

            git status --short

            if git diff --quiet && git diff --cached --quiet; then

              echo "No changes detected."

            else

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

              git add "$EVENT_ROOT"

              git commit \
                -m "Knowledge System: EventUnit ${DATE}/${LANGUAGE}"

              git push origin HEAD

            fi


            ##################################################################
            # PULL AFTER PUSH
            ##################################################################

            CURRENT_BRANCH=$(git branch --show-current)

            if [ -n "$CURRENT_BRANCH" ]; then

              git fetch origin "$CURRENT_BRANCH"
              git pull --rebase origin "$CURRENT_BRANCH"

            else

              echo "❌ Unable to determine current branch."
              exit 1

            fi

            echo
            echo "✅ Immediate Push + Pull completed"
            echo "DATE     : $DATE"
            echo "LANGUAGE : $LANGUAGE"

          }


          ######################################################################
          # PROCESSING UNIT 1
          ######################################################################

          process_unit "$DAY_BEFORE" "en"


          ######################################################################
          # PROCESSING UNIT 2
          ######################################################################

          process_unit "$DAY_BEFORE" "zh"


          ######################################################################
          # PROCESSING UNIT 3
          ######################################################################

          process_unit "$YESTERDAY" "en"


          ######################################################################
          # PROCESSING UNIT 4
          ######################################################################

          process_unit "$YESTERDAY" "zh"


          ######################################################################
          # PROCESSING UNIT 5
          ######################################################################

          process_unit "$TODAY" "en"


          ######################################################################
          # PROCESSING UNIT 6
          ######################################################################

          process_unit "$TODAY" "zh"


          ######################################################################
          # ALL SIX COMPLETE
          ######################################################################

          echo
          echo
          echo "######################################################################"
          echo "ALL SIX PROCESSING UNITS COMPLETE"
          echo "######################################################################"

          echo "1. $DAY_BEFORE / en   ✅"
          echo "2. $DAY_BEFORE / zh   ✅"
          echo "3. $YESTERDAY / en    ✅"
          echo "4. $YESTERDAY / zh    ✅"
          echo "5. $TODAY / en        ✅"
          echo "6. $TODAY / zh        ✅"

          echo
          echo "Knowledge Pipeline completed successfully."


      ######################################################################
      # 21
      # FINAL EVENTUNIT VALIDATION
      #
      # ALL SIX UNITS MUST BE COMPLETE
      ######################################################################

      - name: "21 - Final EventUnit Validation"
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "FINAL EVENTUNIT VALIDATION"
          echo "######################################################################"

          RAW_ROOT="01_自生长知识系统/Raw News"

          for DATE in "$DAY_BEFORE" "$YESTERDAY" "$TODAY"; do

            for LANGUAGE in en zh; do

              COMPLETE_MARKER="$RAW_ROOT/${DATE}-EventUnit/${LANGUAGE}/_COMPLETE"

              echo
              echo "Checking:"
              echo "  $DATE / $LANGUAGE"

              if [ ! -f "$COMPLETE_MARKER" ]; then
                echo "❌ Missing _COMPLETE:"
                echo "   $COMPLETE_MARKER"
                exit 1
              fi

