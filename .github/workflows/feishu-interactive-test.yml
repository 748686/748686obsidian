name: 02_英语学习系统 - 飞书交互测试 V2.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  feishu-interactive-test:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. 测试信息
      # ============================================================

      - name: 显示测试信息
        run: |
          set -e

          echo "============================================================"
          echo "748686 FEISHU INTERACTIVE TEST V2.0"
          echo "============================================================"
          echo
          echo "测试目标："
          echo "GitHub Actions → 飞书消息卡片 → 卡片交互"
          echo
          echo "测试问题："
          echo "1 + 1 = ?"
          echo
          echo "正确答案：B"
          echo
          echo "============================================================"


      # ============================================================
      # 2. 检查 Webhook
      # ============================================================

      - name: 检查飞书 Webhook
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}

        run: |
          set -e

          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "❌ FEISHU_WEBHOOK 未配置"
            exit 1
          fi

          echo "✅ FEISHU_WEBHOOK 已配置"


      # ============================================================
      # 3. 发送交互式卡片
      # ============================================================

      - name: 发送飞书交互测试卡片
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}

        run: |
          set -e

          echo
          echo "============================================================"
          echo "SEND FEISHU INTERACTIVE CARD V2.0"
          echo "============================================================"

          python - <<'PY'

          import json
          import os
          import sys
          import urllib.request
          import urllib.error


          webhook = os.environ["FEISHU_WEBHOOK"]


          # ========================================================
          # 飞书消息卡片
          # ========================================================

          card = {

              "schema": "2.0",

              "config": {
                  "wide_screen_mode": True
              },

              "header": {
                  "title": {
                      "tag": "plain_text",
                      "content": "🧪 748686 飞书交互测试 V2.0"
                  },
                  "template": "blue"
              },

              "body": {

                  "direction": "vertical",

                  "padding": "12px",

                  "elements": [

                      # ------------------------------------------------
                      # 测试说明
                      # ------------------------------------------------

                      {
                          "tag": "markdown",
                          "content": (
                              "**测试目标**\n"
                              "验证飞书消息卡片按钮是否能够产生 "
                              "`card.action.trigger` 交互事件。\n\n"
                              "**问题：1 + 1 = ?**"
                          )
                      },

                      # ------------------------------------------------
                      # A / B / C 按钮
                      #
                      # 使用 action 容器承载按钮
                      # ------------------------------------------------

                      {
                          "tag": "action",

                          "actions": [

                              {
                                  "tag": "button",

                                  "text": {
                                      "tag": "plain_text",
                                      "content": "A. 1"
                                  },

                                  "type": "default",

                                  "value": {
                                      "question_id": "interactive_test_001",
                                      "answer": "A"
                                  }
                              },

                              {
                                  "tag": "button",

                                  "text": {
                                      "tag": "plain_text",
                                      "content": "B. 2"
                                  },

                                  "type": "primary",

                                  "value": {
                                      "question_id": "interactive_test_001",
                                      "answer": "B"
                                  }
                              },

                              {
                                  "tag": "button",

                                  "text": {
                                      "tag": "plain_text",
                                      "content": "C. 3"
                                  },

                                  "type": "default",

                                  "value": {
                                      "question_id": "interactive_test_001",
                                      "answer": "C"
                                  }
                              }

                          ]
                      },

                      # ------------------------------------------------
                      # 操作提示
                      # ------------------------------------------------

                      {
                          "tag": "markdown",
                          "content": (
                              "👉 **请点击 B. 2**\n\n"
                              "点击后，GitHub Actions 中的长连接程序 "
                              "应该收到 `cardAction` 事件。"
                          )
                      }

                  ]
              }
          }


          payload = {
              "msg_type": "interactive",
              "card": card
          }


          # ========================================================
          # HTTP POST
          # ========================================================

          data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")


          request = urllib.request.Request(

              webhook,

              data=data,

              headers={
                  "Content-Type": "application/json; charset=utf-8"
              },

              method="POST"
          )


          try:

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  status = response.status

                  body = response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print()
                  print("HTTP STATUS:", status)
                  print()
                  print("FEISHU RESPONSE:")
                  print(body)
                  print()

                  if status < 200 or status >= 300:

                      print(
                          "❌ 飞书 Webhook 请求失败"
                      )

                      sys.exit(1)


          except urllib.error.HTTPError as e:

              print()
              print(
                  "❌ HTTP ERROR:",
                  e.code
              )

              try:

                  print(
                      e.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                  )

              except Exception:
                  pass

              sys.exit(1)


          except Exception as e:

              print()
              print(
                  "❌ REQUEST ERROR:",
                  repr(e)
              )

              sys.exit(1)


          print()
          print("============================================================")
          print("✅ 飞书交互测试卡片发送成功")
          print("============================================================")

          PY


      # ============================================================
      # 4. 测试说明
      # ============================================================

      - name: 输出下一步
        run: |

          echo
          echo "============================================================"
          echo "748686 FEISHU INTERACTIVE TEST V2.0"
          echo "============================================================"
          echo
          echo "卡片已经发送。"
          echo
          echo "现在请打开飞书："
          echo
          echo "748686知识系统"
          echo
          echo "找到："
          echo "🧪 748686 飞书交互测试 V2.0"
          echo
          echo "然后点击："
          echo "👉 B. 2"
          echo
          echo "============================================================"
          echo
          echo "注意："
          echo
          echo "与此同时必须保持："
          echo
          echo "02_英语学习系统 - Feishu Long Connection Test V2.0"
          echo
          echo "处于 In progress 状态。"
          echo
          echo "============================================================"
