name: 02_英语学习系统 - 飞书交互测试

on:

  workflow_dispatch:

permissions:
  contents: read

jobs:

  feishu-interactive-test:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. 基础信息
      # ============================================================

      - name: 显示测试信息
        run: |
          set -e

          echo "============================================================"
          echo "748686 FEISHU INTERACTIVE TEST"
          echo "============================================================"
          echo
          echo "测试目标："
          echo "GitHub Actions → 飞书机器人 → 交互式答题卡片"
          echo
          echo "测试问题："
          echo "1 + 1 = ?"
          echo
          echo "正确选项：B"
          echo
          echo "============================================================"


      # ============================================================
      # 2. 检查 Secrets
      # ============================================================

      - name: 检查飞书 Webhook
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          set -e

          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "❌ FEISHU_WEBHOOK 未配置"
            exit 1
          fi

          echo "✅ FEISHU_WEBHOOK 已配置"


      # ============================================================
      # 3. 发送飞书交互式测试卡片
      # ============================================================

      - name: 发送飞书交互测试卡片
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          set -e

          echo
          echo "============================================================"
          echo "SEND FEISHU INTERACTIVE CARD"
          echo "============================================================"

          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          webhook = os.environ["FEISHU_WEBHOOK"]

          card = {
              "schema": "2.0",

              "header": {
                  "title": {
                      "tag": "plain_text",
                      "content": "🧪 748686 飞书交互测试"
                  },
                  "template": "blue"
              },

              "body": {
                  "direction": "vertical",
                  "padding": "12px",

                  "elements": [

                      {
                          "tag": "markdown",
                          "content": (
                              "**测试目标**\n"
                              "验证飞书消息卡片按钮是否能够产生交互事件。\n\n"
                              "**问题：1 + 1 = ?**"
                          )
                      },

                      {
                          "tag": "column_set",
                          "flex_mode": "none",

                          "columns": [

                              {
                                  "tag": "column",
                                  "width": "weighted",

                                  "elements": [
                                      {
                                          "tag": "button",
                                          "text": {
                                              "tag": "plain_text",
                                              "content": "A. 1"
                                          },
                                          "type": "default",
                                          "value": {
                                              "question_id": "interactive_test_001",
                                              "answer": "A"
                                          }
                                      }
                                  ]
                              },

                              {
                                  "tag": "column",
                                  "width": "weighted",

                                  "elements": [
                                      {
                                          "tag": "button",
                                          "text": {
                                              "tag": "plain_text",
                                              "content": "B. 2"
                                          },
                                          "type": "primary",
                                          "value": {
                                              "question_id": "interactive_test_001",
                                              "answer": "B"
                                          }
                                      }
                                  ]
                              },

                              {
                                  "tag": "column",
                                  "width": "weighted",

                                  "elements": [
                                      {
                                          "tag": "button",
                                          "text": {
                                              "tag": "plain_text",
                                              "content": "C. 3"
                                          },
                                          "type": "default",
                                          "value": {
                                              "question_id": "interactive_test_001",
                                              "answer": "C"
                                          }
                                      }
                                  ]
                              }

                          ]
                      },

                      {
                          "tag": "markdown",
                          "content": (
                              "👉 **请点击 B. 2**\n\n"
                              "如果点击后没有任何变化，也不用担心。"
                              "这说明下一步需要配置飞书的交互回调服务。"
                          )
                      }

                  ]
              }
          }

          payload = {
              "msg_type": "interactive",
              "card": card
          }

          data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json; charset=utf-8"
              },
              method="POST"
          )

          try:

              with urllib.request.urlopen(request, timeout=30) as response:

                  status = response.status
                  body = response.read().decode("utf-8", errors="replace")

                  print()
                  print("HTTP STATUS:", status)
                  print("FEISHU RESPONSE:")
                  print(body)

                  if status < 200 or status >= 300:
                      print("❌ 飞书 Webhook 请求失败")
                      sys.exit(1)

          except urllib.error.HTTPError as e:

              print()
              print("❌ HTTP ERROR:", e.code)

              try:
                  print(
                      e.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                  )
              except Exception:
                  pass

              sys.exit(1)

          except Exception as e:

              print()
              print("❌ REQUEST ERROR:", repr(e))
              sys.exit(1)

          print()
          print("============================================================")
          print("✅ 飞书交互测试卡片发送成功")
          print("============================================================")
          PY


      # ============================================================
      # 4. 测试结束
      # ============================================================

      - name: 输出测试结果
        run: |
          echo
          echo "============================================================"
          echo "748686 FEISHU INTERACTIVE TEST FINISHED"
          echo "============================================================"
          echo
          echo "请打开飞书「748686知识系统」所在群。"
          echo
          echo "找到："
          echo "🧪 748686 飞书交互测试"
          echo
          echo "然后点击："
          echo "👉 B. 2"
          echo
          echo "当前测试只验证："
          echo "GitHub Actions → 飞书交互式卡片"
          echo
          echo "暂时不会连接："
          echo "- English Exam Parser"
          echo "- English Exam Grader"
          echo "- 61题正式试卷"
          echo
          echo "============================================================"
