name: 02_英语学习系统 - Feishu Callback Test V4.0

on:
  workflow_dispatch:

jobs:
  callback-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install latest Feishu OpenAPI SDK
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install --upgrade --no-cache-dir lark-oapi

      - name: Show SDK Version
        run: |
          python - <<'PY'
          import importlib.metadata

          print("=" * 70)
          print("FEISHU SDK VERSION")
          print("=" * 70)

          print(
              "lark-oapi =",
              importlib.metadata.version("lark-oapi")
          )

          try:
              print(
                  "websockets =",
                  importlib.metadata.version("websockets")
              )
          except Exception:
              pass

          print("=" * 70)
          PY

      - name: Start Low-Level Feishu WebSocket Callback Receiver
        env:
          LARK_APP_ID: ${{ secrets.APP_ID }}
          LARK_APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          set -e

          python - <<'PY'
          import os
          import json
          import time
          import traceback

          import lark_oapi as lark

          from lark_oapi.event.callback.model.p2_card_action_trigger import (
              P2CardActionTrigger,
              P2CardActionTriggerResponse,
          )


          print()
          print("=" * 70)
          print("748686 FEISHU CALLBACK TEST V4.0")
          print("=" * 70)
          print()
          print("MODE:")
          print("  LOW-LEVEL OFFICIAL WEBSOCKET CLIENT")
          print()
          print("PURPOSE:")
          print("  Feishu -> WebSocket -> card.action.trigger")
          print("  -> callback response -> Feishu")
          print()
          print("NO:")
          print("  - grading")
          print("  - parser")
          print("  - exam")
          print("  - answer storage")
          print()
          print("=" * 70)


          APP_ID = os.environ["LARK_APP_ID"]
          APP_SECRET = os.environ["LARK_APP_SECRET"]


          # ============================================================
          # CARD ACTION CALLBACK
          # ============================================================

          def do_card_action_trigger(
              data: P2CardActionTrigger
          ) -> P2CardActionTriggerResponse:

              print()
              print("=" * 70)
              print("🔥🔥🔥 CARD ACTION RECEIVED 🔥🔥🔥")
              print("=" * 70)

              print()
              print("RAW CARD ACTION EVENT:")

              try:
                  raw = lark.JSON.marshal(
                      data,
                      indent=2
                  )

                  print(raw)

              except Exception as e:

                  print(
                      "RAW EVENT PRINT ERROR:",
                      repr(e)
                  )

              # --------------------------------------------------------
              # Extract action.value
              # --------------------------------------------------------

              try:

                  event_data = data.event

                  action_data = event_data.action

                  action_value = action_data.value

                  print()
                  print("=" * 70)
                  print("ACTION VALUE")
                  print("=" * 70)

                  print(
                      json.dumps(
                          action_value,
                          ensure_ascii=False,
                          indent=2,
                      )
                  )

              except Exception as e:

                  print()
                  print(
                      "ACTION VALUE EXTRACTION ERROR:"
                  )

                  print(
                      repr(e)
                  )

                  traceback.print_exc()

              # --------------------------------------------------------
              # IMPORTANT:
              # Return response directly through Feishu WebSocket
              # --------------------------------------------------------

              print()
              print("=" * 70)
              print("RETURNING CALLBACK RESPONSE")
              print("=" * 70)

              print(
                  "toast = "
                  "✅ GitHub 已收到飞书卡片选择"
              )

              print("=" * 70)

              response = {
                  "toast": {
                      "type": "success",
                      "content": "✅ GitHub 已收到飞书卡片选择",
                  }
              }

              return P2CardActionTriggerResponse(
                  response
              )


          # ============================================================
          # EVENT DISPATCHER
          # ============================================================

          event_handler = (
              lark.EventDispatcherHandler
              .builder(
                  "",
                  "",
                  lark.LogLevel.DEBUG,
              )
              .register_p2_card_action_trigger(
                  do_card_action_trigger
              )
              .build()
          )


          print()
          print("=" * 70)
          print("EVENT HANDLER READY")
          print("=" * 70)

          print(
              "✓ card.action.trigger registered"
          )

          print(
              "✓ P2CardActionTriggerResponse enabled"
          )

          print("=" * 70)


          # ============================================================
          # LOW LEVEL WEBSOCKET CLIENT
          # ============================================================

          print()
          print("=" * 70)
          print("STARTING FEISHU WEBSOCKET")
          print("=" * 70)

          print(
              "APP_ID: ***"
          )

          print(
              "APP_SECRET: loaded"
          )

          print()
          print(
              "Waiting for Feishu card action..."
          )

          print()
          print(
              "IMPORTANT:"
          )

          print(
              "Keep this GitHub Action running."
          )

          print(
              "Then click a button in Feishu."
          )

          print("=" * 70)


          client = lark.ws.Client(
              APP_ID,
              APP_SECRET,
              event_handler=event_handler,
              log_level=lark.LogLevel.DEBUG,
          )


          # ============================================================
          # START
          # ============================================================

          try:

              client.start()

          except KeyboardInterrupt:

              print(
                  "Interrupted."
              )

          except Exception as e:

              print()
              print("=" * 70)
              print("❌ WEBSOCKET CLIENT ERROR")
              print("=" * 70)

              print(
                  repr(e)
              )

              traceback.print_exc()

              print("=" * 70)

              raise

          PY
