name: 02_英语学习系统 - Feishu E2E Test V1.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  feishu-e2e-test:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. Install Feishu Channel SDK
      # ============================================================

      - name: Install Feishu Channel SDK
        run: |
          set -e

          echo "============================================================"
          echo "INSTALL FEISHU CHANNEL SDK"
          echo "============================================================"

          python -m pip install --upgrade pip
          python -m pip install lark-channel-sdk

          echo
          echo "============================================================"
          echo "VERIFY SDK"
          echo "============================================================"

          python - <<'PY'
          import lark_channel

          print("lark_channel import: OK")
          print("Feishu Channel SDK: installed")
          PY

      # ============================================================
      # 4. Start E2E Test
      # ============================================================

      - name: Start Feishu E2E Test
        env:
          LARK_APP_ID: ${{ secrets.APP_ID }}
          LARK_APP_SECRET: ${{ secrets.APP_SECRET }}

        run: |
          set -e

          echo "============================================================"
          echo "748686 FEISHU E2E TEST V1.0"
          echo "============================================================"

          mkdir -p 02_英语学习系统/feishu_e2e_test

          python - <<'PY'

          import asyncio
          import json
          import os
          from datetime import datetime, timezone

          from lark_channel import FeishuChannel


          # ============================================================
          # 基础配置
          # ============================================================

          APP_ID = os.environ.get("LARK_APP_ID")
          APP_SECRET = os.environ.get("LARK_APP_SECRET")

          if not APP_ID:
              raise RuntimeError("Missing secret: APP_ID")

          if not APP_SECRET:
              raise RuntimeError("Missing secret: APP_SECRET")


          DATA_DIR = "02_英语学习系统/feishu_e2e_test"

          ANSWER_FILE = os.path.join(
              DATA_DIR,
              "e2e_answers.json"
          )


          # ============================================================
          # 3道测试题
          # ============================================================

          QUESTIONS = [
              {
                  "question_id": "e2e_test_001",
                  "question_number": 1,
                  "question": "1 + 1 = ?",
                  "options": {
                      "A": "1",
                      "B": "2",
                      "C": "3"
                  },
                  "correct_answer": "B"
              },
              {
                  "question_id": "e2e_test_002",
                  "question_number": 2,
                  "question": "2 + 3 = ?",
                  "options": {
                      "A": "4",
                      "B": "5",
                      "C": "6"
                  },
                  "correct_answer": "B"
              },
              {
                  "question_id": "e2e_test_003",
                  "question_number": 3,
                  "question": "5 - 2 = ?",
                  "options": {
                      "A": "2",
                      "B": "3",
                      "C": "4"
                  },
                  "correct_answer": "B"
              }
          ]


          QUESTION_MAP = {
              q["question_id"]: q
              for q in QUESTIONS
          }


          # ============================================================
          # 时间
          # ============================================================

          def utc_now():

              return datetime.now(
                  timezone.utc
              ).isoformat()


          # ============================================================
          # 状态
          # ============================================================

          state = {
              "version": "1.0",
              "test": "feishu_e2e",
              "started_at": utc_now(),
              "answers": {},
              "result": None
          }


          # ============================================================
          # 保存状态
          # ============================================================

          def save_state():

              os.makedirs(
                  DATA_DIR,
                  exist_ok=True
              )

              with open(
                  ANSWER_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      state,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          save_state()


          # ============================================================
          # 打印测试信息
          # ============================================================

          print()
          print("============================================================")
          print("748686 FEISHU E2E TEST V1.0")
          print("============================================================")
          print()

          print(
              "APP_ID:",
              APP_ID
          )

          print(
              "APP_SECRET: loaded"
          )

          print()

          print(
              "Questions:",
              len(QUESTIONS)
          )

          print(
              "Persistent file:",
              ANSWER_FILE
          )

          print()


          # ============================================================
          # 打印测试题
          # ============================================================

          print("============================================================")
          print("E2E QUESTIONS")
          print("============================================================")

          for q in QUESTIONS:

              print()
              print(
                  f"Question {q['question_number']}:"
              )

              print(
                  q["question"]
              )

              print(
                  "A.",
                  q["options"]["A"]
              )

              print(
                  "B.",
                  q["options"]["B"]
              )

              print(
                  "C.",
                  q["options"]["C"]
              )

          print()
          print("============================================================")
          print()


          # ============================================================
          # cardAction
          # ============================================================

          async def on_card_action(event):

              print()
              print()
              print("=" * 70)
              print("748686 FEISHU CARD ACTION RECEIVED")
              print("=" * 70)

              # --------------------------------------------------------
              # 原始事件
              # --------------------------------------------------------

              try:

                  print()
                  print("RAW EVENT:")

                  print(
                      json.dumps(
                          event,
                          ensure_ascii=False,
                          indent=2,
                          default=str
                      )
                  )

              except Exception as e:

                  print(
                      "RAW EVENT PRINT ERROR:",
                      repr(e)
                  )


              # --------------------------------------------------------
              # 提取 action
              # --------------------------------------------------------

              action = None

              try:

                  if isinstance(event, dict):

                      candidate = event.get(
                          "action"
                      )

                      if isinstance(
                          candidate,
                          dict
                      ):

                          action = candidate

                      if action is None:

                          data = event.get(
                              "data"
                          )

                          if isinstance(
                              data,
                              dict
                          ):

                              candidate = data.get(
                                  "action"
                              )

                              if isinstance(
                                  candidate,
                                  dict
                              ):

                                  action = candidate

              except Exception as e:

                  print(
                      "ACTION PARSE ERROR:",
                      repr(e)
                  )


              print()
              print("ACTION:")

              print(
                  json.dumps(
                      action,
                      ensure_ascii=False,
                      indent=2,
                      default=str
                  )
              )


              # --------------------------------------------------------
              # 提取 value
              # --------------------------------------------------------

              value = None

              if isinstance(
                  action,
                  dict
              ):

                  value = action.get(
                      "value"
                  )


              print()
              print("VALUE:")

              print(
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      indent=2,
                      default=str
                  )
              )


              # --------------------------------------------------------
              # 提取 question_id / answer
              # --------------------------------------------------------

              question_id = None
              answer = None

              if isinstance(
                  value,
                  dict
              ):

                  question_id = value.get(
                      "question_id"
                  )

                  answer = value.get(
                      "answer"
                  )


              print()
              print(
                  "QUESTION ID:",
                  question_id
              )

              print(
                  "ANSWER:",
                  answer
              )


              # --------------------------------------------------------
              # 验证题目
              # --------------------------------------------------------

              if question_id not in QUESTION_MAP:

                  print()
                  print(
                      "UNKNOWN QUESTION ID"
                  )

                  return {
                      "toast": {
                          "type": "warning",
                          "content": "未知测试题"
                      }
                  }


              question = QUESTION_MAP[
                  question_id
              ]


              # --------------------------------------------------------
              # 验证答案
              # --------------------------------------------------------

              if answer not in question["options"]:

                  print()
                  print(
                      "INVALID ANSWER"
                  )

                  return {
                      "toast": {
                          "type": "warning",
                          "content": "无效答案"
                      }
                  }


              # --------------------------------------------------------
              # 防止重复提交
              # --------------------------------------------------------

              if question_id in state["answers"]:

                  old_answer = state["answers"][
                      question_id
                  ]["answer"]

                  print()
                  print(
                      "DUPLICATE ANSWER"
                  )

                  print(
                      "Existing:",
                      old_answer
                  )

                  print(
                      "New:",
                      answer
                  )

                  return {
                      "toast": {
                          "type": "info",
                          "content":
                              f"第 {question['question_number']} 题已经回答"
                      }
                  }


              # --------------------------------------------------------
              # 判断正误
              # --------------------------------------------------------

              correct = (
                  answer
                  == question["correct_answer"]
              )


              # --------------------------------------------------------
              # 保存答案
              # --------------------------------------------------------

              state["answers"][
                  question_id
              ] = {

                  "question_id":
                      question_id,

                  "question_number":
                      question["question_number"],

                  "answer":
                      answer,

                  "correct":
                      correct,

                  "received_at":
                      utc_now()
              }


              save_state()


              # --------------------------------------------------------
              # 输出
              # --------------------------------------------------------

              print()
              print(
                  "============================================================"
              )

              print(
                  "ANSWER RECORDED"
              )

              print(
                  "Question:",
                  question_id
              )

              print(
                  "Answer:",
                  answer
              )

              print(
                  "Correct:",
                  correct
              )

              print(
                  "============================================================"
              )


              # --------------------------------------------------------
              # 当前进度
              # --------------------------------------------------------

              answered_count = len(
                  state["answers"]
              )

              total_count = len(
                  QUESTIONS
              )


              print()
              print(
                  f"PROGRESS: "
                  f"{answered_count}/{total_count}"
              )


              # --------------------------------------------------------
              # 全部完成
              # --------------------------------------------------------

              if answered_count == total_count:

                  correct_count = 0

                  for item in state[
                      "answers"
                  ].values():

                      if item.get(
                          "correct"
                      ):

                          correct_count += 1


                  wrong_count = (
                      total_count
                      - correct_count
                  )


                  score = int(
                      correct_count
                      / total_count
                      * 100
                  )


                  state["result"] = {

                      "completed_at":
                          utc_now(),

                      "total":
                          total_count,

                      "correct":
                          correct_count,

                      "wrong":
                          wrong_count,

                      "score":
                          score
                  }


                  save_state()


                  print()
                  print("=" * 70)
                  print("748686 FEISHU E2E TEST COMPLETED")
                  print("=" * 70)

                  print(
                      f"TOTAL: {total_count}"
                  )

                  print(
                      f"CORRECT: {correct_count}"
                  )

                  print(
                      f"WRONG: {wrong_count}"
                  )

                  print(
                      f"SCORE: {score}/100"
                  )

                  print("=" * 70)
                  print()


                  return {
                      "toast": {
                          "type": "success",
                          "content":
                              f"测试完成：{correct_count}/{total_count}，{score}分"
                      }
                  }


              # --------------------------------------------------------
              # 尚未完成
              # --------------------------------------------------------

              remaining = (
                  total_count
                  - answered_count
              )


              return {
                  "toast": {
                      "type": "success",
                      "content":
                          f"第 {question['question_number']} 题已记录，还剩 {remaining} 题"
                  }
              }


          # ============================================================
          # 错误
          # ============================================================

          async def on_error(error):

              print()
              print("=" * 70)
              print("FEISHU CHANNEL ERROR")
              print("=" * 70)

              print(
                  repr(error)
              )

              print()


          # ============================================================
          # 重连
          # ============================================================

          async def on_reconnecting():

              print()
              print("=" * 70)
              print("FEISHU RECONNECTING")
              print("=" * 70)
              print()


          async def on_reconnected():

              print()
              print("=" * 70)
              print("FEISHU RECONNECTED")
              print("=" * 70)
              print()


          # ============================================================
          # 主程序
          # ============================================================

          async def main():

              channel = FeishuChannel(
                  app_id=APP_ID,
                  app_secret=APP_SECRET
              )


              # --------------------------------------------------------
              # 使用已经验证成功的 cardAction
              # --------------------------------------------------------

              channel.on(
                  "cardAction",
                  on_card_action
              )

              channel.on(
                  "error",
                  on_error
              )

              channel.on(
                  "reconnecting",
                  on_reconnecting
              )

              channel.on(
                  "reconnected",
                  on_reconnected
              )


              print(
                  "Registered event handlers:"
              )

              print(
                  "  - cardAction"
              )

              print(
                  "  - error"
              )

              print(
                  "  - reconnecting"
              )

              print(
                  "  - reconnected"
              )

              print()

              print(
                  "Connecting..."
              )

              print()


              await channel.connect()


          # ============================================================
          # 启动
          # ============================================================

          asyncio.run(
              main()
          )

          PY
