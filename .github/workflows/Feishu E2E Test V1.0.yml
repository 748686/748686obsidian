name: 02_英语学习系统 - Feishu Callback Test V3.0

on:
  workflow_dispatch:

jobs:
  callback-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Feishu SDK
        run: |
          python -m pip install --upgrade pip
          pip install -U lark-channel-sdk

      - name: Show SDK Version
        env:
          LARK_APP_ID: ${{ secrets.APP_ID }}
          LARK_APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          python - <<'PY'
          import importlib.metadata

          try:
              print(
                  "lark-channel-sdk version:",
                  importlib.metadata.version("lark-channel-sdk")
              )
          except Exception as e:
              print("SDK version check failed:", e)
          PY

      - name: Start Feishu Callback Receiver
        env:
          LARK_APP_ID: ${{ secrets.APP_ID }}
          LARK_APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          set -e

          python - <<'PY'
          import asyncio
          import json
          import os
          import traceback

          from lark_channel import FeishuChannel


          print("=" * 70)
          print("748686 FEISHU CALLBACK TEST V3.0")
          print("=" * 70)
          print("Purpose:")
          print("  ONLY test Feishu -> GitHub card callback")
          print("  NO grading")
          print("  NO question processing")
          print("  NO answer storage")
          print("=" * 70)

          APP_ID = os.environ["LARK_APP_ID"]
          APP_SECRET = os.environ["LARK_APP_SECRET"]

          print("APP_ID: ***")
          print("APP_SECRET: loaded")


          # ============================================================
          # RAW EVENT SAFE SERIALIZER
          # ============================================================

          def safe_serialize(obj):

              try:
                  if obj is None:
                      return None

                  if isinstance(obj, (str, int, float, bool)):
                      return obj

                  if isinstance(obj, dict):
                      return {
                          str(k): safe_serialize(v)
                          for k, v in obj.items()
                      }

                  if isinstance(obj, (list, tuple)):
                      return [
                          safe_serialize(v)
                          for v in obj
                      ]

                  if hasattr(obj, "model_dump"):
                      try:
                          return safe_serialize(
                              obj.model_dump()
                          )
                      except Exception:
                          pass

                  if hasattr(obj, "dict"):
                      try:
                          return safe_serialize(
                              obj.dict()
                          )
                      except Exception:
                          pass

                  if hasattr(obj, "__dict__"):
                      return {
                          str(k): safe_serialize(v)
                          for k, v in vars(obj).items()
                          if not str(k).startswith("_")
                      }

                  return str(obj)

              except Exception:
                  return str(obj)


          # ============================================================
          # CARD ACTION
          # ============================================================

          async def on_card_action(event):

              print()
              print("=" * 70)
              print("🔥🔥🔥 FEISHU CARD ACTION RECEIVED 🔥🔥🔥")
              print("=" * 70)

              print()
              print("EVENT TYPE:")
              print(type(event))

              print()
              print("RAW EVENT:")

              try:
                  raw = safe_serialize(event)

                  print(
                      json.dumps(
                          raw,
                          ensure_ascii=False,
                          indent=2,
                      )
                  )

              except Exception as e:

                  print(
                      "RAW EVENT SERIALIZATION ERROR:",
                      repr(e),
                  )

              print()
              print("=" * 70)
              print("CALLBACK TEST RESULT")
              print("=" * 70)
              print("Feishu -> GitHub: SUCCESS")
              print("GitHub -> Feishu: RETURNING TOAST")
              print("=" * 70)

              # --------------------------------------------------------
              # 最关键：
              # 直接把结果作为 cardAction callback 返回给飞书
              # --------------------------------------------------------

              return {
                  "toast": {
                      "type": "success",
                      "content": "✅ GitHub 已收到你的选择",
                  }
              }


          # ============================================================
          # ERROR
          # ============================================================

          async def on_error(error):

              print()
              print("=" * 70)
              print("❌ FEISHU CHANNEL ERROR")
              print("=" * 70)

              print(
                  repr(error)
              )

              print()

              traceback.print_exc()

              print("=" * 70)


          # ============================================================
          # RECONNECTING
          # ============================================================

          async def on_reconnecting():

              print()
              print("=" * 70)
              print("⚠️ FEISHU RECONNECTING")
              print("=" * 70)


          # ============================================================
          # RECONNECTED
          # ============================================================

          async def on_reconnected():

              print()
              print("=" * 70)
              print("✅ FEISHU RECONNECTED")
              print("=" * 70)


          # ============================================================
          # REJECT
          # ============================================================

          async def on_reject(event):

              print()
              print("=" * 70)
              print("⚠️ FEISHU EVENT REJECTED")
              print("=" * 70)

              try:
                  print(
                      json.dumps(
                          safe_serialize(event),
                          ensure_ascii=False,
                          indent=2,
                      )
                  )
              except Exception:
                  print(
                      repr(event)
                  )

              print("=" * 70)


          # ============================================================
          # MAIN
          # ============================================================

          async def main():

              channel = FeishuChannel(
                  app_id=APP_ID,
                  app_secret=APP_SECRET,
              )

              # --------------------------------------------------------
              # Card callback
              # --------------------------------------------------------

              channel.on(
                  "cardAction",
                  on_card_action,
              )

              # --------------------------------------------------------
              # Diagnostics
              # --------------------------------------------------------

              channel.on(
                  "error",
                  on_error,
              )

              channel.on(
                  "reconnecting",
                  on_reconnecting,
              )

              channel.on(
                  "reconnected",
                  on_reconnected,
              )

              channel.on(
                  "reject",
                  on_reject,
              )

              print()
              print("=" * 70)
              print("REGISTERED EVENT HANDLERS")
              print("=" * 70)

              print("  ✓ cardAction")
              print("  ✓ error")
              print("  ✓ reconnecting")
              print("  ✓ reconnected")
              print("  ✓ reject")

              print()
              print("=" * 70)
              print("CONNECTING TO FEISHU")
              print("=" * 70)

              await channel.connect()


          asyncio.run(main())

          PY
