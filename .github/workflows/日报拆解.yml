name: 02 日报拆解 - Horizon 双语 V6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  split:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout 748686obsidian

        uses: actions/checkout@v4


      # ============================================================
      # 2. 获取日期
      # ============================================================

      - name: Set date

        id: date

        run: |

          TODAY=$(date -u +%Y-%m-%d)

          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "TODAY"
          echo "=========================================="

          echo "$TODAY"


      # ============================================================
      # 3. 设置路径
      # ============================================================

      - name: Set paths

        id: paths

        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          RAW_DIR="01_自生长知识系统/Raw News/$TODAY"

          OUTPUT="01_自生长知识系统/Raw News/${TODAY}-Atomic"

          ZH="${RAW_DIR}/${TODAY}-summary-zh.md"

          EN="${RAW_DIR}/${TODAY}-summary-en.md"

          SCRIPT="01_自生长知识系统/scripts/horizon_split.py"

          echo "raw_dir=$RAW_DIR" >> "$GITHUB_OUTPUT"

          echo "zh=$ZH" >> "$GITHUB_OUTPUT"

          echo "en=$EN" >> "$GITHUB_OUTPUT"

          echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"

          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"

          echo
          echo "=========================================="
          echo "PATHS"
          echo "=========================================="

          echo "RAW : $RAW_DIR"
          echo "ZH  : $ZH"
          echo "EN  : $EN"
          echo "OUT : $OUTPUT"
          echo "PY  : $SCRIPT"


      # ============================================================
      # 4. 检查日报
      # ============================================================

      - name: Check Horizon digests

        run: |

          set -e

          ZH="${{ steps.paths.outputs.zh }}"

          EN="${{ steps.paths.outputs.en }}"

          echo "=========================================="
          echo "CHECK HORIZON DIGESTS"
          echo "=========================================="


          if [ ! -f "$ZH" ]; then

            echo "❌ Chinese digest missing:"
            echo "$ZH"

            exit 1

          fi


          if [ ! -f "$EN" ]; then

            echo "❌ English digest missing:"
            echo "$EN"

            exit 1

          fi


          echo "✅ Chinese digest found"

          echo "✅ English digest found"


          echo
          echo "Chinese size:"

          wc -c "$ZH"


          echo
          echo "English size:"

          wc -c "$EN"


      # ============================================================
      # 5. 检查 Python
      # ============================================================

      - name: Check splitter

        run: |

          set -e

          SCRIPT="${{ steps.paths.outputs.script }}"

          echo "=========================================="
          echo "CHECK SPLITTER"
          echo "=========================================="


          if [ ! -f "$SCRIPT" ]; then

            echo "❌ Splitter not found:"
            echo "$SCRIPT"

            exit 1

          fi


          echo "✅ Splitter found"

          python --version


      # ============================================================
      # 6. Setup Python
      # ============================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ============================================================
      # 7. 执行双语拆解
      # ============================================================

      - name: Run Horizon Bilingual Split V6

        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          ZH="${{ steps.paths.outputs.zh }}"

          EN="${{ steps.paths.outputs.en }}"

          OUTPUT="${{ steps.paths.outputs.output }}"

          SCRIPT="${{ steps.paths.outputs.script }}"


          echo "=========================================="

          echo "HORIZON BILINGUAL SPLIT V6"

          echo "=========================================="


          python "$SCRIPT" \

            --zh "$ZH" \

            --en "$EN" \

            --output "$OUTPUT" \

            --date "$TODAY"


      # ============================================================
      # 8. 验证目录
      # ============================================================

      - name: Validate output directories

        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          ROOT="01_自生长知识系统/Raw News/${TODAY}-Atomic"

          ZH="$ROOT/zh"

          EN="$ROOT/en"


          echo "=========================================="

          echo "VALIDATE DIRECTORIES"

          echo "=========================================="


          if [ ! -d "$ZH" ]; then

            echo "❌ zh directory missing"

            exit 1

          fi


          if [ ! -d "$EN" ]; then

            echo "❌ en directory missing"

            exit 1

          fi


          echo "✅ zh directory exists"

          echo "✅ en directory exists"


      # ============================================================
      # 9. 验证文件数量
      # ============================================================

      - name: Validate file counts

        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          ROOT="01_自生长知识系统/Raw News/${TODAY}-Atomic"

          ZH="$ROOT/zh"

          EN="$ROOT/en"


          ZH_COUNT=$(find "$ZH" -maxdepth 1 -type f -name "*.md" | wc -l)

          EN_COUNT=$(find "$EN" -maxdepth 1 -type f -name "*.md" | wc -l)


          echo "=========================================="

          echo "FILE COUNTS"

          echo "=========================================="


          echo "Chinese : $ZH_COUNT"

          echo "English : $EN_COUNT"


          if [ "$ZH_COUNT" -eq 0 ]; then

            echo "❌ Chinese files = 0"

            exit 1

          fi


          if [ "$EN_COUNT" -eq 0 ]; then

            echo "❌ English files = 0"

            exit 1

          fi


      # ============================================================
      # 10. 检查内容长度
      # ============================================================

      - name: Validate content quality

        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          ROOT="01_自生长知识系统/Raw News/${TODAY}-Atomic"


          echo "=========================================="

          echo "CONTENT QUALITY CHECK"

          echo "=========================================="


          FAILED=0


          while IFS= read -r FILE

          do

            SIZE=$(wc -c < "$FILE")


            if [ "$SIZE" -lt 250 ]; then

              echo "❌ TOO SHORT: $FILE ($SIZE bytes)"

              FAILED=1

            else

              echo "✅ $FILE ($SIZE bytes)"

            fi

          done < <(

            find "$ROOT" \

              -type f \

              -name "*.md" \

              | sort

          )


          if [ "$FAILED" -eq 1 ]; then

            echo

            echo "❌ Content quality check failed."

            exit 1

          fi


          echo

          echo "✅ Content quality check passed."


      # ============================================================
      # 11. 检查 YAML
      # ============================================================

      - name: Validate front matter

        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          ROOT="01_自生长知识系统/Raw News/${TODAY}-Atomic"


          echo "=========================================="

          echo "FRONT MATTER CHECK"

          echo "=========================================="


          FAILED=0


          while IFS= read -r FILE

          do

            echo

            echo "Checking: $FILE"


            if ! head -n 1 "$FILE" | grep -q "^---$"; then

              echo "❌ Missing YAML front matter"

              FAILED=1

              continue

            fi


            for FIELD in \

              "title:" \

              "date:" \

              "type:" \

              "source:" \

              "language:" \

              "original_source:" \

              "original_url:" \

              "status:"

            do

              if ! grep -q "^$FIELD" "$FILE"; then

                echo "❌ Missing field: $FIELD"

                FAILED=1

              fi

            done


          done < <(

            find "$ROOT" \

              -type f \

              -name "*.md" \

              | sort

          )


          if [ "$FAILED" -eq 1 ]; then

            echo

            echo "❌ Front matter validation failed."

            exit 1

          fi


          echo

          echo "✅ Front matter validation passed."


      # ============================================================
      # 12. 预览中文
      # ============================================================

      - name: Preview Chinese

        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          DIR="01_自生长知识系统/Raw News/${TODAY}-Atomic/zh"


          echo "=========================================="

          echo "CHINESE PREVIEW"

          echo "=========================================="


          FILE=$(find "$DIR" \

            -maxdepth 1 \

            -type f \

            -name "*.md" \

            | sort \

            | head -n 1)


          echo

          echo "$FILE"

          echo

          sed -n '1,80p' "$FILE"


      # ============================================================
      # 13. 预览英文
      # ============================================================

      - name: Preview English

        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          DIR="01_自生长知识系统/Raw News/${TODAY}-Atomic/en"


          echo "=========================================="

          echo "ENGLISH PREVIEW"

          echo "=========================================="


          FILE=$(find "$DIR" \

            -maxdepth 1 \

            -type f \

            -name "*.md" \

            | sort \

            | head -n 1)


          echo

          echo "$FILE"

          echo

          sed -n '1,80p' "$FILE"


      # ============================================================
      # 14. Git 提交
      # ============================================================

      - name: Commit Atomic News

        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          ROOT="01_自生长知识系统/Raw News/${TODAY}-Atomic"


          git config user.name "748686 Knowledge Bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add "$ROOT"


          if git diff --cached --quiet; then

            echo "No Atomic News changes."

          else

            git commit \

              -m "chore: split Horizon bilingual digest into atomic news ${TODAY}"

            git push

          fi


          echo

          echo "=========================================="

          echo "✅ HORIZON BILINGUAL SPLIT V6 COMPLETE"

          echo "=========================================="


          echo

          echo "Output:"

          echo "$ROOT/zh"

          echo "$ROOT/en"
