name: 02 日报拆解 - Horizon 双语版

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout 748686obsidian
      # ============================================================
      - name: Checkout 748686obsidian
        uses: actions/checkout@v4

      # ============================================================
      # 2. 获取 Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. 获取日期
      # ============================================================
      - name: Set date
        id: date
        run: |
          echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. 检查今天 Raw News
      # ============================================================
      - name: Inspect today's Raw News
        run: |
          set -e

          TODAY="${{ steps.date.outputs.today }}"

          RAW_DIR="01_自生长知识系统/Raw News/$TODAY"

          echo "=========================================="
          echo "Today's Raw News"
          echo "=========================================="

          if [ ! -d "$RAW_DIR" ]; then
            echo "❌ Raw News directory not found:"
            echo "$RAW_DIR"
            exit 1
          fi

          find "$RAW_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            -print \
            | sort

      # ============================================================
      # 5. 找中文日报
      # ============================================================
      - name: Find Chinese Horizon digest
        id: zh
        run: |
          set -e

          TODAY="${{ steps.date.outputs.today }}"

          RAW_DIR="01_自生长知识系统/Raw News/$TODAY"

          ZH_FILE="$RAW_DIR/${TODAY}-summary-zh.md"

          echo "=========================================="
          echo "Chinese Horizon Digest"
          echo "=========================================="

          if [ ! -f "$ZH_FILE" ]; then
            echo "❌ Chinese digest not found:"
            echo "$ZH_FILE"

            echo
            echo "Available summary files:"
            find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -iname "*summary*.md" \
              -print

            exit 1
          fi

          echo "✅ Found:"
          echo "$ZH_FILE"

          echo "file=$ZH_FILE" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 6. 找英文日报
      # ============================================================
      - name: Find English Horizon digest
        id: en
        run: |
          set -e

          TODAY="${{ steps.date.outputs.today }}"

          RAW_DIR="01_自生长知识系统/Raw News/$TODAY"

          EN_FILE="$RAW_DIR/${TODAY}-summary-en.md"

          echo "=========================================="
          echo "English Horizon Digest"
          echo "=========================================="

          if [ ! -f "$EN_FILE" ]; then
            echo "❌ English digest not found:"
            echo "$EN_FILE"

            echo
            echo "Available summary files:"
            find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -iname "*summary*.md" \
              -print

            exit 1
          fi

          echo "✅ Found:"
          echo "$EN_FILE"

          echo "file=$EN_FILE" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 7. 检查拆解脚本
      # ============================================================
      - name: Check splitter script
        run: |
          set -e

          SCRIPT="01_自生长知识系统/scripts/horizon_split.py"

          echo "=========================================="
          echo "Splitter"
          echo "=========================================="

          if [ ! -f "$SCRIPT" ]; then
            echo "❌ Splitter script not found:"
            echo "$SCRIPT"
            exit 1
          fi

          echo "✅ Found:"
          echo "$SCRIPT"

      # ============================================================
      # 8. 同时拆解中文 + 英文
      # ============================================================
      - name: Split Chinese and English digests
        run: |
          set -e

          TODAY="${{ steps.date.outputs.today }}"

          ZH_INPUT="${{ steps.zh.outputs.file }}"
          EN_INPUT="${{ steps.en.outputs.file }}"

          OUTPUT="01_自生长知识系统/Raw News/${TODAY}-Atomic"

          echo "=========================================="
          echo "Horizon Bilingual Digest Split"
          echo "=========================================="

          echo "Chinese:"
          echo "$ZH_INPUT"

          echo
          echo "English:"
          echo "$EN_INPUT"

          echo
          echo "Output:"
          echo "$OUTPUT"

          python \
            "01_自生长知识系统/scripts/horizon_split.py" \
            --zh "$ZH_INPUT" \
            --en "$EN_INPUT" \
            --output "$OUTPUT" \
            --date "$TODAY"

      # ============================================================
      # 9. 检查中文
      # ============================================================
      - name: Validate Chinese Atomic News
        run: |
          set -e

          TODAY="${{ steps.date.outputs.today }}"

          DIR="01_自生长知识系统/Raw News/${TODAY}-Atomic/zh"

          echo "=========================================="
          echo "Chinese Atomic News"
          echo "=========================================="

          if [ ! -d "$DIR" ]; then
            echo "❌ Chinese Atomic directory missing"
            exit 1
          fi

          COUNT=$(find "$DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "Chinese files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No Chinese Atomic News"
            exit 1
          fi

          find "$DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | sort

      # ============================================================
      # 10. 检查英文
      # ============================================================
      - name: Validate English Atomic News
        run: |
          set -e

          TODAY="${{ steps.date.outputs.today }}"

          DIR="01_自生长知识系统/Raw News/${TODAY}-Atomic/en"

          echo "=========================================="
          echo "English Atomic News"
          echo "=========================================="

          if [ ! -d "$DIR" ]; then
            echo "❌ English Atomic directory missing"
            exit 1
          fi

          COUNT=$(find "$DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "English files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No English Atomic News"
            exit 1
          fi

          find "$DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | sort

      # ============================================================
      # 11. 检查 Front Matter
      # ============================================================
      - name: Validate Markdown Front Matter
        run: |
          set -e

          TODAY="${{ steps.date.outputs.today }}"

          ROOT="01_自生长知识系统/Raw News/${TODAY}-Atomic"

          echo "=========================================="
          echo "Checking Front Matter"
          echo "=========================================="

          FAILED=0

          while IFS= read -r FILE
          do
            echo
            echo "------------------------------------------"
            echo "$FILE"
            echo "------------------------------------------"

            sed -n '1,12p' "$FILE"

            if ! head -n 1 "$FILE" | grep -q "^---$"; then
              echo "❌ Invalid Front Matter:"
              echo "$FILE"
              FAILED=1
            fi

          done < <(
            find "$ROOT" \
              -type f \
              -name "*.md" \
              | sort \
              | head -n 10
          )

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          echo
          echo "✅ Front Matter validation passed."

      # ============================================================
      # 12. 提交
      # ============================================================
      - name: Commit Atomic News
        run: |
          set -e

          TODAY="${{ steps.date.outputs.today }}"

          git config user.name "748686 Knowledge Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "01_自生长知识系统/Raw News/${TODAY}-Atomic"

          if git diff --cached --quiet; then
            echo "No Atomic News changes."
          else

            git commit \
              -m "chore: split bilingual Horizon digest ${TODAY}"

            git push
          fi

          echo
          echo "=========================================="
          echo "✅ HORIZON BILINGUAL SPLIT COMPLETE"
          echo "=========================================="
