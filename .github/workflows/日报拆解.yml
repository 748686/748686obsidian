name: 02 日报拆解 - Horizon 双语 V6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout 748686obsidian
        uses: actions/checkout@v4

      # ============================================================
      # 2. 获取今天日期
      # ============================================================
      - name: Set date
        id: date
        shell: bash
        run: |
          set -e

          TODAY=$(date -u +%Y-%m-%d)

          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "TODAY"
          echo "=========================================="
          echo "$TODAY"

      # ============================================================
      # 3. 设置所有路径
      # ============================================================
      - name: Set paths
        id: paths
        shell: bash
        run: |
          set -e

          TODAY="${{ steps.date.outputs.today }}"

          RAW_DIR="01_自生长知识系统/Raw News/$TODAY"

          ZH="${RAW_DIR}/${TODAY}-summary-zh.md"
          EN="${RAW_DIR}/${TODAY}-summary-en.md"

          OUTPUT="01_自生长知识系统/Raw News/${TODAY}-Atomic"

          SCRIPT="01_自生长知识系统/scripts/horizon_split.py"

          echo "zh=$ZH" >> "$GITHUB_OUTPUT"
          echo "en=$EN" >> "$GITHUB_OUTPUT"
          echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "PATH CONFIGURATION"
          echo "=========================================="

          echo "DATE:"
          echo "$TODAY"

          echo
          echo "ZH:"
          echo "$ZH"

          echo
          echo "EN:"
          echo "$EN"

          echo
          echo "OUTPUT:"
          echo "$OUTPUT"

          echo
          echo "SCRIPT:"
          echo "$SCRIPT"

      # ============================================================
      # 4. 检查中文日报
      # ============================================================
      - name: Check Chinese digest
        shell: bash
        run: |
          set -e

          FILE="${{ steps.paths.outputs.zh }}"

          echo "=========================================="
          echo "CHECK CHINESE DIGEST"
          echo "=========================================="

          if [ ! -f "$FILE" ]; then
            echo "❌ Chinese Horizon digest not found:"
            echo "$FILE"
            exit 1
          fi

          echo "✅ Chinese digest found"

          echo
          echo "File size:"
          wc -c "$FILE"

      # ============================================================
      # 5. 检查英文日报
      # ============================================================
      - name: Check English digest
        shell: bash
        run: |
          set -e

          FILE="${{ steps.paths.outputs.en }}"

          echo "=========================================="
          echo "CHECK ENGLISH DIGEST"
          echo "=========================================="

          if [ ! -f "$FILE" ]; then
            echo "❌ English Horizon digest not found:"
            echo "$FILE"
            exit 1
          fi

          echo "✅ English digest found"

          echo
          echo "File size:"
          wc -c "$FILE"

      # ============================================================
      # 6. 检查 Python 拆解脚本
      # ============================================================
      - name: Check splitter
        shell: bash
        run: |
          set -e

          SCRIPT="${{ steps.paths.outputs.script }}"

          echo "=========================================="
          echo "CHECK SPLITTER"
          echo "=========================================="

          if [ ! -f "$SCRIPT" ]; then
            echo "❌ Splitter not found:"
            echo "$SCRIPT"
            exit 1
          fi

          echo "✅ Splitter found:"
          echo "$SCRIPT"

          echo
          echo "Python syntax check:"

          python -m py_compile "$SCRIPT"

          echo "✅ Python syntax OK"

      # ============================================================
      # 7. Setup Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 8. 再次确认 Python 参数接口
      # ============================================================
      - name: Check splitter arguments
        shell: bash
        run: |
          set -e

          SCRIPT="${{ steps.paths.outputs.script }}"

          echo "=========================================="
          echo "CHECK SPLITTER ARGUMENTS"
          echo "=========================================="

          python "$SCRIPT" --help

      # ============================================================
      # 9. 执行中文 + 英文双语拆解
      # ============================================================
      - name: Split Chinese and English
        shell: bash
        run: |
          set -e

          TODAY="${{ steps.date.outputs.today }}"

          ZH="${{ steps.paths.outputs.zh }}"
          EN="${{ steps.paths.outputs.en }}"
          OUTPUT="${{ steps.paths.outputs.output }}"
          SCRIPT="${{ steps.paths.outputs.script }}"

          echo "=========================================="
          echo "HORIZON BILINGUAL SPLIT V6"
          echo "=========================================="

          echo
          echo "SCRIPT:"
          echo "$SCRIPT"

          echo
          echo "DATE:"
          echo "$TODAY"

          echo
          echo "CHINESE INPUT:"
          echo "$ZH"

          echo
          echo "ENGLISH INPUT:"
          echo "$EN"

          echo
          echo "OUTPUT:"
          echo "$OUTPUT"

          echo
          echo "=========================================="
          echo "RUNNING SPLITTER"
          echo "=========================================="

          python "$SCRIPT" \
            --zh "$ZH" \
            --en "$EN" \
            --output "$OUTPUT" \
            --date "$TODAY"

          echo
          echo "=========================================="
          echo "SPLITTER FINISHED"
          echo "=========================================="

      # ============================================================
      # 10. 验证 Atomic 根目录
      # ============================================================
      - name: Validate Atomic root
        shell: bash
        run: |
          set -e

          TODAY="${{ steps.date.outputs.today }}"

          DIR="01_自生长知识系统/Raw News/${TODAY}-Atomic"

          echo "=========================================="
          echo "VALIDATE ATOMIC ROOT"
          echo "=========================================="

          if [ ! -d "$DIR" ]; then
            echo "❌ Atomic directory missing:"
            echo "$DIR"
            exit 1
          fi

          echo "✅ Atomic root exists"

          echo
          echo "Directory:"
          find "$DIR" -maxdepth 2 -type d | sort

      # ============================================================
      # 11. 验证中文
      # ============================================================
      - name: Validate Chinese Atomic News
        shell: bash
        run: |
          set -e

          TODAY="${{ steps.date.outputs.today }}"

          DIR="01_自生长知识系统/Raw News/${TODAY}-Atomic/zh"

          echo "=========================================="
          echo "VALIDATE CHINESE ATOMIC NEWS"
          echo "=========================================="

          if [ ! -d "$DIR" ]; then
            echo "❌ Chinese directory missing:"
            echo "$DIR"
            exit 1
          fi

          COUNT=$(find "$DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "Chinese MD files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No Chinese Atomic News generated."
            exit 1
          fi

          echo
          echo "Chinese files:"
          find "$DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | sort

      # ============================================================
      # 12. 验证英文
      # ============================================================
      - name: Validate English Atomic News
        shell: bash
        run: |
          set -e

          TODAY="${{ steps.date.outputs.today }}"

          DIR="01_自生长知识系统/Raw News/${TODAY}-Atomic/en"

          echo "=========================================="
          echo "VALIDATE ENGLISH ATOMIC NEWS"
          echo "=========================================="

          if [ ! -d "$DIR" ]; then
            echo "❌ English directory missing:"
            echo "$DIR"
            exit 1
          fi

          COUNT=$(find "$DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "English MD files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No English Atomic News generated."
            exit 1
          fi

          echo
          echo "English files:"
          find "$DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | sort

      # ============================================================
      # 13. 检查双语数量
      # ============================================================
      - name: Compare bilingual counts
        shell: bash
        run: |
          set -e

          TODAY="${{ steps.date.outputs.today }}"

          ZH_DIR="01_自生长知识系统/Raw News/${TODAY}-Atomic/zh"
          EN_DIR="01_自生长知识系统/Raw News/${TODAY}-Atomic/en"

          ZH_COUNT=$(find "$ZH_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          EN_COUNT=$(find "$EN_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "=========================================="
          echo "BILINGUAL RESULT"
          echo "=========================================="

          echo "ZH: $ZH_COUNT"
          echo "EN: $EN_COUNT"

          if [ "$ZH_COUNT" -le 0 ]; then
            echo "❌ Chinese result is empty."
            exit 1
          fi

          if [ "$EN_COUNT" -le 0 ]; then
            echo "❌ English result is empty."
            exit 1
          fi

          echo
          echo "✅ Both languages generated."

          # ============================================================
      # 14. 验证 YAML Front Matter
      # ============================================================
      - name: Validate Front Matter
        shell: bash
        run: |
          set -e

          TODAY="${{ steps.date.outputs.today }}"

          ZH_DIR="01_自生长知识系统/Raw News/${TODAY}-Atomic/zh"
          EN_DIR="01_自生长知识系统/Raw News/${TODAY}-Atomic/en"

          echo "=========================================="
          echo "VALIDATE FRONT MATTER"
          echo "=========================================="

          for DIR in "$ZH_DIR" "$EN_DIR"
          do
            echo
            echo "Checking directory:"
            echo "$DIR"

            if [ ! -d "$DIR" ]; then
              echo "❌ Directory not found:"
              echo "$DIR"
              exit 1
            fi

            FILE=""

            while IFS= read -r CANDIDATE
            do
              FILE="$CANDIDATE"
              break
            done < <(
              find "$DIR" \
                -maxdepth 1 \
                -type f \
                -name "*.md" \
                -print
            )

            if [ -z "$FILE" ]; then
              echo "❌ No markdown file found in:"
              echo "$DIR"
              exit 1
            fi

            echo
            echo "Checking:"
            echo "$FILE"

            FIRST_LINE=$(head -n 1 "$FILE")

            if [ "$FIRST_LINE" != "---" ]; then
              echo "❌ YAML Front Matter missing:"
              echo "$FILE"
              echo
              echo "First line was:"
              echo "$FIRST_LINE"
              exit 1
            fi

            echo "✅ YAML Front Matter detected"

            echo
            echo "---------- Preview ----------"

            sed -n '1,20p' "$FILE"

            echo
            echo "---------- End Preview ----------"

          done

          echo
          echo "=========================================="
          echo "✅ FRONT MATTER VALIDATION COMPLETE"
          echo "=========================================="
      # ============================================================
      # 15. 检查原文信息字段
      # ============================================================
      - name: Validate source metadata
        shell: bash
        run: |
          set -e

          TODAY="${{ steps.date.outputs.today }}"

          DIR="01_自生长知识系统/Raw News/${TODAY}-Atomic"

          echo "=========================================="
          echo "VALIDATE SOURCE METADATA"
          echo "=========================================="

          FOUND=0

          while IFS= read -r FILE
          do
            if grep -q "^original_source:" "$FILE" || \
               grep -q "^source:" "$FILE"; then

              FOUND=1

              echo "Metadata found:"
              echo "$FILE"

              sed -n '1,18p' "$FILE"

              break
            fi
          done < <(
            find "$DIR" \
              -type f \
              -name "*.md" \
              | sort
          )

          if [ "$FOUND" -eq 0 ]; then
            echo "⚠️ Warning: no source metadata detected."
            echo "The workflow will continue."
          else
            echo "✅ Source metadata detected."
          fi

      # ============================================================
      # 16. Git 提交
      # ============================================================
      - name: Commit Atomic News
        shell: bash
        run: |
          set -e

          TODAY="${{ steps.date.outputs.today }}"

          git config user.name "748686 Knowledge Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "01_自生长知识系统/Raw News/${TODAY}-Atomic"

          if git diff --cached --quiet; then
            echo "No Atomic News changes."
          else

            git commit \
              -m "chore: split bilingual Horizon digest into atomic news ${TODAY}"

            git push
          fi

          echo
          echo "=========================================="
          echo "✅ HORIZON BILINGUAL SPLIT V6 COMPLETE"
          echo "=========================================="

          echo
          echo "Generated:"
          echo "  zh → ${TODAY}-Atomic/zh"
          echo "  en → ${TODAY}-Atomic/en"
