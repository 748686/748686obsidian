              -name "*.md" \
              | wc -l)

          else

            KNOWLEDGE_COUNT=0

          fi

          echo "Knowledge Base   : $KNOWLEDGE_COUNT files"

          GRAPH_ROOT="01_自生长知识系统/09_知识图谱"

          if [ -d "$GRAPH_ROOT" ]; then

            GRAPH_COUNT=$(find "$GRAPH_ROOT" \
              -type f \
              -name "*.md" \
              | wc -l)

          else

            GRAPH_COUNT=0

          fi

          echo "Knowledge Graph  : $GRAPH_COUNT files"

          WEEK_YEAR=$(date -u -d "$TODAY" +%G)
          WEEK_NO=$(date -u -d "$TODAY" +%V)

          WEEKLY_REPORT="01_自生长知识系统/06_周报/${WEEK_YEAR}/W${WEEK_NO}.md"

          if [ -s "$WEEKLY_REPORT" ]; then

            echo "Weekly Report    : COMPLETE"

          else

            echo "Weekly Report    : INCOMPLETE"

          fi

          GROWTH_COMPLETE="01_自生长知识系统/00_System/运行日志/knowledge_growth/${TODAY}_COMPLETE"

          if [ -s "$GROWTH_COMPLETE" ]; then

            echo "Knowledge Growth : COMPLETE"

          else

            echo "Knowledge Growth : INCOMPLETE"

          fi

          echo
          echo "============================================================"
          echo "GIT"
          echo "============================================================"

          git log -1 \
            --pretty=format:"Commit: %H%nAuthor: %an%nDate: %ad%nMessage: %s" \
            --date=iso

          echo

          {
            echo "# 748686 自生长知识系统 — Run Return Log"
            echo
            echo "## Run Information"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Workflow | 01 自生长知识系统 - 主运行 |"
            echo "| Run ID | $GITHUB_RUN_ID |"
            echo "| Run Number | $GITHUB_RUN_NUMBER |"
            echo "| Repository | $GITHUB_REPOSITORY |"
            echo "| Branch | $GITHUB_REF_NAME |"
            echo "| Timezone | UTC |"
            echo "| Horizon Execution | ${HORIZON_ENABLED:-UNKNOWN} |"
            echo "| Today | $TODAY |"
            echo "| Yesterday | $YESTERDAY |"
            echo "| Day Before | $DAY_BEFORE |"
            echo
            echo "## Date Transactions"
            echo
            echo "| Order | Date | Required | Status |"
            echo "|---:|---|---|---|"
            echo "| 1 | $TODAY | YES | SUCCESS / FAILED |"
            echo "| 2 | $YESTERDAY | NO | ${YESTERDAY_STATUS:-SKIPPED} |"
            echo "| 3 | $DAY_BEFORE | NO | ${DAY_BEFORE_STATUS:-SKIPPED} |"
            echo
            echo "## Processing Units"
            echo
            echo "| Date | Language | EventUnit | Analysis | Skills |"
            echo "|---|---|---|---:|---:|---|"

            for DATE in \
              "$TODAY" \
              "$YESTERDAY" \
              "$DAY_BEFORE"
            do

              for LANGUAGE in en zh
              do

                EVENT_DIR="01_自生长知识系统/Raw News/${DATE}-EventUnit/${LANGUAGE}"

                if [ -f "$EVENT_DIR/_COMPLETE" ]; then

                  STATUS="COMPLETE"

                else

                  STATUS="INCOMPLETE"

                fi

                if [ -d "$EVENT_DIR/event_units" ]; then

                  EVENT_COUNT=$(find "$EVENT_DIR/event_units" \
                    -maxdepth 1 \
                    -type f \
                    -name "EVT-*.md" \
                    ! -name "*_analysis.md" \
                    | wc -l)

                  ANALYSIS_COUNT=$(find "$EVENT_DIR/event_units" \
                    -maxdepth 1 \
                    -type f \
                    -name "*_analysis.md" \
                    | wc -l)

                  if [ -s "$EVENT_DIR/event_units/_SKILLS_COMPLETE" ]; then

                    SKILLS_STATUS="COMPLETE"

                  else

                    SKILLS_STATUS="INCOMPLETE"

                  fi

                else

                  EVENT_COUNT=0
                  ANALYSIS_COUNT=0
                  SKILLS_STATUS="INCOMPLETE"

                fi

                echo "| $DATE | $LANGUAGE | $STATUS | $EVENT_COUNT | $ANALYSIS_COUNT | $SKILLS_STATUS |"

              done

            done

            echo
            echo "## Downstream"
            echo
            echo "| Component | Status |"
            echo "|---|---|"

            if [ -s "$DAILY_REPORT" ]; then

              echo "| Daily Report | COMPLETE |"

            else

              echo "| Daily Report | INCOMPLETE |"

            fi

            echo "| Knowledge Base | $KNOWLEDGE_COUNT Markdown files |"
            echo "| Knowledge Graph | $GRAPH_COUNT Markdown files |"

            if [ -s "$WEEKLY_REPORT" ]; then

              echo "| Weekly Report | COMPLETE |"

            else

              echo "| Weekly Report | INCOMPLETE |"

            fi

            if [ -s "$GROWTH_COMPLETE" ]; then

              echo "| Knowledge Growth | COMPLETE |"

            else

              echo "| Knowledge Growth | INCOMPLETE |"

            fi

            echo
            echo "## New Date Transaction Model"
            echo
            echo "Horizon"
            echo " ↓"
            echo "Raw"
            echo " ↓"
            echo "Atomic"
            echo " ↓"
            echo "Enriched"
            echo " ↓"
            echo "Task 1"
            echo " ↓"
            echo "Task 2"
            echo " ↓"
            echo "Task 3"
            echo " ↓"
            echo "_COMPLETE"
            echo " ↓"
            echo "Task 4"
            echo " ↓"
            echo "_SKILLS_COMPLETE"
            echo " ↓"
            echo "Git checkpoint"
            echo " ↓"
            echo "YESTERDAY"
            echo " ↓"
            echo "DAY_BEFORE"

            echo
            echo "## Rules"
            echo
            echo "- TODAY is mandatory"
            echo "- Historical dates are optional catch-up"
            echo "- Historical failure does not terminate the workflow"
            echo "- Each date is an independent transaction"
            echo "- Each completed date is checkpointed"
            echo "- Processing order is TODAY → YESTERDAY → DAY_BEFORE"
            echo "- Language contract is lowercase en / zh"
            echo "- GitHub Actions UTC is the date standard"
            echo "- Horizon execution is selectable for workflow_dispatch"
            echo "- Scheduled runs default to Horizon enabled"
            echo "- Disabling Horizon skips Checkout, Install, gh-pages and execution"
            echo "- Disabling Horizon does not affect downstream knowledge processing"
            echo "- Task 1–Task 4 core logic is unchanged"

            echo
            echo "## Latest Git Commit"
            echo
            echo '```text'

            git log -1 \
              --pretty=format:"%H%n%an%n%ad%n%s" \
              --date=iso

            echo
            echo '```'

          } >> "$GITHUB_STEP_SUMMARY"

          echo
          echo "######################################################################"
          echo "RETURN LOG COMPLETE"
          echo "######################################################################"

      # ==========================================================
      # 19. Complete Job
      # ==========================================================
      - name: Complete Job
        if: success()
        run: |

          echo
          echo "============================================================"
          echo "748686 自生长知识系统"
          echo "============================================================"

          echo
          echo "DATE TRANSACTIONS"
          echo

          echo "1. $TODAY"
          echo "   REQUIRED : YES"
          echo "   STATUS   : SUCCESS"

          echo
          echo "2. $YESTERDAY"
          echo "   REQUIRED : NO"
          echo "   STATUS   : ${YESTERDAY_STATUS:-SKIPPED}"

          echo
          echo "3. $DAY_BEFORE"
          echo "   REQUIRED : NO"
          echo "   STATUS   : ${DAY_BEFORE_STATUS:-SKIPPED}"

          echo
          echo "============================================================"
          echo "HORIZON"
          echo "============================================================"

          echo "Execution : ${HORIZON_ENABLED:-UNKNOWN}"

          if [ "${HORIZON_ENABLED:-false}" = "true" ]; then

            echo "✅ Horizon execution ENABLED"
            echo "✅ Horizon gh-pages available"

          else

            echo "⛔ Horizon execution DISABLED"
            echo "⛔ Horizon gh-pages NOT used"

          fi

          echo
          echo "============================================================"
          echo "PROCESSING MODEL"
          echo "============================================================"

          if [ "${HORIZON_ENABLED:-false}" = "true" ]; then

            echo "Horizon"
            echo " ↓"
            echo "Raw"

          else

            echo "Existing Raw"
            echo " ↓"
            echo "Raw"

          fi

          echo " ↓"
          echo "Atomic"
          echo " ↓"
          echo "Enriched"
          echo " ↓"
          echo "Task 1 → Task 2 → Task 3"
          echo " ↓"
          echo "_COMPLETE"
          echo " ↓"
          echo "Task 4"
          echo " ↓"
          echo "_SKILLS_COMPLETE"
          echo " ↓"
          echo "Git checkpoint"
          echo " ↓"
          echo "YESTERDAY"
          echo " ↓"
          echo "DAY_BEFORE"

          echo
          echo "============================================================"
          echo "TIME STANDARD"
          echo "============================================================"

          echo "✅ GitHub Actions UTC"
          echo "✅ cron UTC"
          echo "✅ Processing dates UTC"
          echo "✅ Language en / zh"
          echo "✅ Task 1–Task 4 date contract unchanged"

          echo
          echo "============================================================"
          echo "TRANSACTION RULE"
          echo "============================================================"

          echo "✅ TODAY failure = Workflow failure"
          echo "✅ Historical failure = SKIPPED"
          echo "✅ Historical skip does not block next date"
          echo "✅ Completed date is checkpointed before next date"
          echo "✅ Horizon execution is optional"

          echo
          echo "============================================================"
          echo "SYSTEM RUN COMPLETE"
          echo "============================================================"

          echo "748686 自生长知识系统 RUN COMPLETE"

      # ==========================================================
      # 20. 置图
      #
      # 使用已经独立测试通过的 knowledge_image.py。
      # Python 内部负责：
      # UTC 日期、日报 / 周报、新闻锚定、图片质量检查、
      # AGNES、图片下载、图片落盘、*_带图.md、最终验证。
      #
      # 日报带图版：必须成功。
      # 周报带图版：可选，没有则 SKIP，不让 Workflow 失败。
      # ==========================================================
      - name: 置图 - 生成日报周报图片
        if: success()
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          FORCE_REGENERATE: "true"
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "748686 自生长知识系统"
          echo "IMAGE PLACEMENT"
          echo "######################################################################"

          test -f "01_自生长知识系统/scripts/knowledge_image.py" || {
            echo "❌ knowledge_image.py not found"
            exit 1
          }

          echo "FORCE_REGENERATE=true"
          echo

          python 01_自生长知识系统/scripts/knowledge_image.py

          echo
          echo "============================================================"
          echo "GENERATED IMAGE FILES"
          echo "============================================================"

          find "01_自生长知识系统/04_图片" \
            -type f \
            | sort \
            | tail -50 || true

          echo
          echo "============================================================"
          echo "GENERATED DAILY IMAGE REPORTS"
          echo "============================================================"

          DAILY_IMAGE_REPORT="$($({
            find "01_自生长知识系统/05_日报" \
              -type f \
              -name "*_带图.md" \
              -print \
              | sort \
              | tail -n 1
          }) )"

          if [ -z "$DAILY_IMAGE_REPORT" ]; then
            echo "❌ 没有生成日报 *_带图.md"
            exit 1
          fi

          echo "Daily illustrated report:"
          echo "$DAILY_IMAGE_REPORT"

          echo
          echo "============================================================"
          echo "GENERATED WEEKLY IMAGE REPORTS"
          echo "============================================================"

          WEEKLY_IMAGE_REPORT="$($({
            find "01_自生长知识系统/06_周报" \
              -type f \
              -name "*_带图.md" \
              -print \
              | sort \
              | tail -n 1
          }) )"

          if [ -z "$WEEKLY_IMAGE_REPORT" ]; then
            echo "⚠️ 当前没有生成周报 *_带图.md"
            echo "ℹ️ Weekly illustrated report is optional."
          else
            echo "Weekly illustrated report:"
            echo "$WEEKLY_IMAGE_REPORT"
          fi

          echo
          echo "============================================================"
          echo "IMAGE RESULT VALIDATION"
          echo "============================================================"

          test -s "$DAILY_IMAGE_REPORT" || {
            echo "❌ Daily *_带图.md is empty"
            exit 1
          }

          echo "✅ Daily illustrated report ready"

          if [ -n "$WEEKLY_IMAGE_REPORT" ]; then
            test -s "$WEEKLY_IMAGE_REPORT" || {
              echo "❌ Weekly *_带图.md is empty"
              exit 1
            }
            echo "✅ Weekly illustrated report ready"
          else
            echo "ℹ️ Weekly illustrated report SKIP"
          fi

          echo
          echo "============================================================"
          echo "IMAGE GIT CHECKPOINT"
          echo "============================================================"

          git config user.name \
            "748686 Knowledge Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "01_自生长知识系统/04_图片" \
            "01_自生长知识系统/05_日报" \
            "01_自生长知识系统/06_周报"

          if git diff --cached --quiet; then

            echo "ℹ️ No new image or illustrated report changes"

          else

            git commit \
              -m "data: generate daily weekly report images $TODAY"

            "$GIT_HELPER" origin main

            echo "✅ Image results PUSH COMPLETE"

            git pull --ff-only origin main

            echo "✅ Image results checkpoint complete"

          fi

          echo
          echo "######################################################################"
          echo "IMAGE PLACEMENT COMPLETE"
          echo "######################################################################"

      # ==========================================================
      # 21. 飞书
      #
      # 日报：必须发送。
      # 周报：有 *_带图.md 才发送，没有则 SKIP。
      #
      # 图片发送链路：
      # 本地 PNG → Feishu image upload → image_key
      # → feishu_report_renderer.py → interactive card
      # → FEISHU_WEBHOOK
      # ==========================================================
      - name: 飞书 - 发送日报周报高级渲染
        if: success()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          set -e

          echo
          echo "######################################################################"
          echo "748686 自生长知识系统"
          echo "FINAL → FEISHU"
          echo "######################################################################"

          test -n "$FEISHU_WEBHOOK" || {
            echo "❌ FEISHU_WEBHOOK 未配置"
            exit 1
          }

          test -n "$APP_ID" || {
            echo "❌ APP_ID 未配置"
            exit 1
          }

          test -n "$APP_SECRET" || {
            echo "❌ APP_SECRET 未配置"
            exit 1
          }

          DAILY_FILE="$($({
            find "01_自生长知识系统/05_日报" \
              -type f \
              -name "*_带图.md" \
              -print \
              | sort \
              | tail -n 1
          }) )"

          if [ -z "$DAILY_FILE" ]; then
            echo "❌ 没有找到日报 *_带图.md"
            exit 1
          fi

          WEEKLY_FILE="$($({
            find "01_自生长知识系统/06_周报" \
              -type f \
              -name "*_带图.md" \
              -print \
              | sort \
              | tail -n 1
          }) )"

          echo
          echo "Daily report:"
          echo "  $DAILY_FILE"

          if [ -n "$WEEKLY_FILE" ]; then
            echo
            echo "Weekly report:"
            echo "  $WEEKLY_FILE"
          else
            echo
            echo "⚠️ 没有找到周报 *_带图.md"
            echo "ℹ️ Weekly report is optional. SKIP."
          fi

          echo
          echo "============================================================"
          echo "RENDER AND SEND DAILY REPORT"
          echo "============================================================"

          python \
            "01_自生长知识系统/scripts/feishu_report_renderer.py" \
            --markdown "$DAILY_FILE" \
            --repo-root "$GITHUB_WORKSPACE" \
            --report-type "日报" \
            --date "$(basename "$DAILY_FILE" | cut -d'_' -f1)" \
            --title "📰 748686 · 每日日报"

          echo "✅ Daily Report sent to Feishu"

          if [ -n "$WEEKLY_FILE" ]; then

            echo
            echo "============================================================"
            echo "RENDER AND SEND WEEKLY REPORT"
            echo "============================================================"

            python \
              "01_自生长知识系统/scripts/feishu_report_renderer.py" \
              --markdown "$WEEKLY_FILE" \
              --repo-root "$GITHUB_WORKSPACE" \
              --report-type "周报" \
              --date "$(basename "$WEEKLY_FILE" | cut -d'_' -f1)" \
              --title "📊 748686 · 每周知识报告"

            echo "✅ Weekly Report sent to Feishu"

          else

            echo
            echo "ℹ️ Weekly Report SKIP"
            echo "ℹ️ 当前没有周报 *_带图.md"

          fi

          echo
          echo "######################################################################"
          echo "FEISHU NOTIFICATION COMPLETE"
          echo "######################################################################"
