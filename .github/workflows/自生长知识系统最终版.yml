name: 748686 自生长知识系统制图飞书

on:
  workflow_dispatch:
    inputs:
      enable_horizon:
        description: "是否运行 Horizon 新闻采集"
        required: true
        default: "启用"
        type: choice
        options:
          - "启用"
          - "不启用"

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  knowledge-system:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout 748686obsidian
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 1.1 Prepare Git safe push helper
      # ==========================================================
      - name: Prepare Git safe push helper
        shell: bash
        run: |
          set -e

          GIT_HELPER="/tmp/748686_git_push_safe.sh"

          cat > "$GIT_HELPER" <<'EOF'
          #!/usr/bin/env bash

          set -u

          REMOTE="${1:-origin}"
          BRANCH="${2:-main}"
          MAX_RETRIES="${3:-3}"
          RETRY_INTERVAL="${4:-5}"

          attempt=1

          while [ "$attempt" -le "$MAX_RETRIES" ]; do

            echo
            echo "============================================================"
            echo "SAFE GIT PUSH"
            echo "============================================================"
            echo "Remote : $REMOTE"
            echo "Branch : $BRANCH"
            echo "Attempt: $attempt / $MAX_RETRIES"

            if git push "$REMOTE" "HEAD:$BRANCH"; then
              echo "✅ Git push succeeded"
              exit 0
            fi

            echo "⚠️ Git push rejected"

            if [ "$attempt" -ge "$MAX_RETRIES" ]; then
              echo "❌ Git push failed after $MAX_RETRIES attempts"
              exit 1
            fi

            echo
            echo "⚠️ Synchronizing local repository with remote..."
            echo "▶️ git fetch $REMOTE $BRANCH"

            if ! git fetch "$REMOTE" "$BRANCH"; then
              echo "❌ git fetch failed"
              exit 1
            fi

            echo
            echo "▶️ git rebase $REMOTE/$BRANCH"

            if ! git rebase "$REMOTE/$BRANCH"; then
              echo "⚠️ Rebase failed"
              echo "▶️ Aborting rebase"

              git rebase --abort || true

              echo "❌ Automatic Git synchronization failed"
              exit 1
            fi

            echo "✅ Rebase complete"

            echo
            echo "⏳ Waiting ${RETRY_INTERVAL}s before retry..."
            sleep "$RETRY_INTERVAL"

            attempt=$((attempt + 1))

          done

          echo "❌ Safe Git push failed"
          exit 1
          EOF

          chmod +x "$GIT_HELPER"

          echo "GIT_HELPER=$GIT_HELPER" >> "$GITHUB_ENV"

          echo "✅ Git safe push helper prepared"
          echo "Helper: $GIT_HELPER"

      # ==========================================================
      # 2. Setup Python
      # ==========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================================
      # 3. Install uv
      # ==========================================================
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # ==========================================================
      # 3.1 Install Image + Feishu dependencies
      #
      # 原有知识系统依赖保持不变。
      # 这里只增加日报 / 周报置图与飞书渲染所需依赖。
      # ==========================================================
      - name: Install Image and Feishu dependencies
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            Pillow \
            pytesseract \
            requests \
            matplotlib

          sudo apt-get update

          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-chi-sim \
            tesseract-ocr-chi-tra

          echo
          echo "============================================================"
          echo "IMAGE + FEISHU DEPENDENCIES READY"
          echo "============================================================"

          python - <<'PY'
          from PIL import Image
          import pytesseract
          import requests
          import matplotlib

          print("Pillow:", Image.__version__)
          print("pytesseract:", pytesseract.__version__)
          print("requests:", requests.__version__)
          print("matplotlib:", matplotlib.__version__)
          print("Tesseract:")
          print(pytesseract.get_tesseract_version())
          print("OCR languages:")
          print(pytesseract.get_languages(config=""))
          PY

      # ==========================================================
      # 4. Calculate processing dates
      #
      # GitHub Actions UTC is the sole date standard.
      #
      # workflow_dispatch:
      #   用户选择 启用 / 不启用
      #
      # schedule:
      #   没有输入参数，默认启用 Horizon，
      #   保持原来的每日自动新闻采集行为。
      # ==========================================================
      - name: Calculate processing dates
        run: |
          set -e

          TODAY=$(date -u +%Y-%m-%d)
          YESTERDAY=$(date -u -d "$TODAY -1 day" +%Y-%m-%d)
          DAY_BEFORE=$(date -u -d "$TODAY -2 days" +%Y-%m-%d)

          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          echo "YESTERDAY=$YESTERDAY" >> "$GITHUB_ENV"
          echo "DAY_BEFORE=$DAY_BEFORE" >> "$GITHUB_ENV"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            if [ "${{ inputs.enable_horizon }}" = "启用" ]; then
              HORIZON_ENABLED="true"
            else
              HORIZON_ENABLED="false"
            fi

          else

            HORIZON_ENABLED="true"

          fi

          echo "HORIZON_ENABLED=$HORIZON_ENABLED" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo "748686 自生长知识系统"
          echo "PROCESSING DATE CONTRACT"
          echo "============================================================"
          echo "Timezone      : UTC"
          echo "TODAY         : $TODAY"
          echo "YESTERDAY     : $YESTERDAY"
          echo "DAY_BEFORE    : $DAY_BEFORE"
          echo
          echo "HORIZON NEWS ACQUISITION:"

          if [ "$HORIZON_ENABLED" = "true" ]; then

            echo "✅ ENABLED"
            echo "→ Checkout Horizon"
            echo "→ Install Horizon"
            echo "→ Use Horizon gh-pages"
            echo "→ Horizon may be executed"
            echo "→ Horizon may acquire news"

          else

            echo "⛔ DISABLED"
            echo "→ Horizon will NOT be checked out"
            echo "→ Horizon will NOT be installed"
            echo "→ Horizon gh-pages will NOT be downloaded"
            echo "→ Horizon will NOT be executed"
            echo "→ Horizon will NOT be used as a news source"

          fi

          echo
          echo "PROCESSING ORDER:"
          echo "1. TODAY"
          echo "2. YESTERDAY"
          echo "3. DAY_BEFORE"

      # ==========================================================
      # 5. Checkout Horizon main
      #
      # 只有启用 Horizon 时才执行。
      # ==========================================================
      - name: Checkout Horizon main
        if: env.HORIZON_ENABLED == 'true'
        uses: actions/checkout@v4
        with:
          repository: 748686/Horizon
          ref: main
          path: horizon

      # ==========================================================
      # 6. Install Horizon
      #
      # 只有启用 Horizon 时才安装。
      # ==========================================================
      - name: Install Horizon
        if: env.HORIZON_ENABLED == 'true'
        working-directory: horizon
        run: |
          set -e

          echo
          echo "============================================================"
          echo "INSTALL HORIZON"
          echo "============================================================"

          uv sync

          if [ ! -f "data/config.github.json" ]; then
            echo "❌ Horizon native config not found"
            exit 1
          fi

          echo "✅ Horizon installed"
          echo "✅ Native config found"
          echo "Config: data/config.github.json"

      # ==========================================================
      # 6.1 Horizon disabled status
      # ==========================================================
      - name: Horizon disabled
        if: env.HORIZON_ENABLED != 'true'
        run: |
          echo
          echo "============================================================"
          echo "HORIZON NEWS ACQUISITION"
          echo "============================================================"
          echo
          echo "⛔ Horizon is DISABLED"
          echo
          echo "The following are skipped:"
          echo "  - Checkout Horizon main"
          echo "  - Install Horizon"
          echo "  - Clone Horizon gh-pages"
          echo "  - Run Horizon"
          echo "  - Fetch news through Horizon"
          echo
          echo "✅ Downstream knowledge pipeline remains enabled"
          echo "✅ Existing Raw News will still be processed"
          echo "✅ Git pull / push checkpoints remain enabled"

      # ==========================================================
      # 7. Check AGNES
      # ==========================================================
      - name: Check Agnes API configuration
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -e

          if [ -z "$AGNES_API_KEY" ]; then
            echo "❌ AGNES_API_KEY is missing"
            exit 1
          fi

          echo "✅ AGNES_API_KEY exists"

      # ==========================================================
      # 8. Get Horizon gh-pages
      #
      # 只有启用 Horizon 时才执行。
      #
      # 注意：
      # 不启用 Horizon 时，这一步完全不会运行。
      # ==========================================================
      - name: Get Horizon gh-pages
        if: env.HORIZON_ENABLED == 'true'
        run: |
          set -e

          echo
          echo "============================================================"
          echo "GET HORIZON GH-PAGES"
          echo "============================================================"

          rm -rf horizon-pages

          git clone \
            --quiet \
            --depth 1 \
            --branch gh-pages \
            "https://github.com/748686/Horizon.git" \
            horizon-pages

          if [ ! -d "horizon-pages/_posts" ]; then
            echo "❌ Horizon _posts directory not found"
            exit 1
          fi

          echo "✅ Horizon gh-pages downloaded"
          echo "Horizon execution : ENABLED"
          echo "Horizon gh-pages  : AVAILABLE"

      # ==========================================================
      # 9. Acquire TODAY Raw News
      #
      # Horizon ENABLED:
      #
      #   1. Local Raw News
      #   2. Existing Horizon gh-pages
      #   3. Run Horizon
      #   4. Horizon 本次运行成功后，
      #      直接读取 Runner 本地 horizon/docs/_posts/
      #
      # Horizon DISABLED:
      #
      #   1. Local / already available Raw News
      #   2. 不访问 Horizon
      #   3. 不运行 Horizon
      #   4. 后续知识处理保持正常
      # ==========================================================
      - name: Acquire TODAY Raw News
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-3.0-flash
        run: |
          set -e

          RAW_ROOT="01_自生长知识系统/Raw News"
          RAW_DIR="$RAW_ROOT/$TODAY"

          mkdir -p "$RAW_DIR"

          COUNT=$(find "$RAW_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo
          echo "============================================================"
          echo "TODAY RAW ACQUISITION"
          echo "============================================================"
          echo "TODAY       : $TODAY"
          echo "Local files : $COUNT"
          echo "Horizon     : $HORIZON_ENABLED"

          # ------------------------------------------------------
          # Local Raw News already exists
          # ------------------------------------------------------
          if [ "$COUNT" -ge 2 ]; then

            echo
            echo "✅ TODAY Raw News already exists"
            echo "⏭️ No Horizon acquisition required"

            exit 0

          fi

          echo
          echo "⚠️ TODAY Raw News incomplete"

          # ------------------------------------------------------
          # Horizon disabled
          #
          # 这里绝对不能访问 Horizon。
          # ------------------------------------------------------
          if [ "$HORIZON_ENABLED" != "true" ]; then

            echo
            echo "============================================================"
            echo "HORIZON DISABLED"
            echo "============================================================"

            echo "Horizon is disabled."
            echo
            echo "The workflow will NOT:"
            echo "  - clone Horizon gh-pages"
            echo "  - execute Horizon"
            echo "  - acquire news through Horizon"
            echo
            echo "TODAY Raw News is not available locally."
            echo
            echo "❌ TODAY Raw News acquisition failed"
            echo "❌ TODAY is mandatory"

            exit 1

          fi

          # ------------------------------------------------------
          # Horizon enabled
          # ------------------------------------------------------
          echo
          echo "▶️ Horizon execution ENABLED"
          echo "▶️ Checking existing Horizon gh-pages"

          if [ ! -d "horizon-pages/_posts" ]; then
            echo "❌ Horizon _posts directory not found"
            exit 1
          fi

          HCOUNT=$(find \
            "horizon-pages/_posts" \
            -maxdepth 1 \
            -type f \
            -name "$TODAY*.md" \
            | wc -l)

          echo "Horizon gh-pages TODAY files: $HCOUNT"

          # ------------------------------------------------------
          # Existing Horizon output
          #
          # 如果 Horizon gh-pages 已经有 TODAY，
          # 直接使用，不再运行 Horizon。
          # ------------------------------------------------------
          if [ "$HCOUNT" -ge 2 ]; then

            echo "✅ TODAY already exists in Horizon gh-pages"
            echo "▶️ Downloading TODAY files directly"
            echo "⏭️ Horizon will NOT be executed"

            while IFS= read -r file; do
              cp "$file" "$RAW_DIR/"
            done < <(
              find "horizon-pages/_posts" \
                -maxdepth 1 \
                -type f \
                -name "$TODAY*.md" \
                | sort
            )

            COUNT=$(find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo
            echo "Final TODAY Raw files: $COUNT"

            if [ "$COUNT" -lt 2 ]; then
              echo "❌ TODAY Raw News still incomplete after gh-pages recovery"
              exit 1
            fi

            echo "✅ TODAY Raw News COMPLETE"
            echo "✅ Existing Horizon gh-pages news reused"

            exit 0

          fi

          # ------------------------------------------------------
          # Today's news is not yet in Horizon gh-pages.
          #
          # 现在才运行本地 Horizon。
          # ------------------------------------------------------
          echo
          echo "⚠️ TODAY not found in Horizon gh-pages"
          echo "▶️ Running Horizon"

          cd horizon

          uv run horizon \
            --hours 24 \
            --config data/config.github.json

          cd ..

          echo
          echo "✅ Horizon process finished"

          # ------------------------------------------------------
          # IMPORTANT:
          #
          # Horizon 已经在当前 Runner 本地完成运行。
          #
          # Horizon 自己生成的 GitHub Pages 文件位于：
          #
          #   horizon/docs/_posts/
          #
          # 这里直接读取本地文件。
          #
          # 不再：
          #   - clone Horizon gh-pages
          #   - 等待远程 gh-pages
          #   - 10 × 30 秒轮询
          # ------------------------------------------------------
          HORIZON_LOCAL_POSTS="horizon/docs/_posts"

          echo
          echo "============================================================"
          echo "READ LOCAL HORIZON OUTPUT"
          echo "============================================================"

          echo "Local Horizon output:"
          echo "  $HORIZON_LOCAL_POSTS"

          if [ ! -d "$HORIZON_LOCAL_POSTS" ]; then
            echo "❌ Horizon local docs/_posts directory not found"
            echo "❌ Horizon did not generate GitHub Pages output"
            echo "❌ TODAY Raw News acquisition failed"
            exit 1
          fi

          echo
          echo "Today's local Horizon files:"

          find "$HORIZON_LOCAL_POSTS" \
            -maxdepth 1 \
            -type f \
            -name "$TODAY*.md" \
            -print \
            | sort

          HCOUNT=$(find \
            "$HORIZON_LOCAL_POSTS" \
            -maxdepth 1 \
            -type f \
            -name "$TODAY*.md" \
            | wc -l)

          echo
          echo "Today's local Horizon files: $HCOUNT"

          # ------------------------------------------------------
          # Horizon 本次运行必须生成至少两个当天文件。
          #
          # 正常情况下：
          #   1 个 EN
          #   1 个 ZH
          # ------------------------------------------------------
          if [ "$HCOUNT" -lt 2 ]; then

            echo "❌ TODAY local Horizon output incomplete"
            echo "❌ Expected bilingual EN + ZH Markdown files"
            echo "❌ TODAY Raw News acquisition failed"

            exit 1

          fi

          # ------------------------------------------------------
          # 直接从 Runner 本地 Horizon 输出复制到：
          #
          # 01_自生长知识系统/Raw News/$TODAY/
          #
          # 不经过 Horizon 远程 gh-pages。
          # ------------------------------------------------------
          echo
          echo "============================================================"
          echo "COPY LOCAL HORIZON OUTPUT TO RAW NEWS"
          echo "============================================================"

          echo "FROM:"
          echo "  $HORIZON_LOCAL_POSTS"

          echo "TO:"
          echo "  $RAW_DIR"

          while IFS= read -r file; do

            echo
            echo "COPY:"
            echo "  $file"
            echo "→ $RAW_DIR/"

            cp "$file" "$RAW_DIR/"

          done < <(
            find "$HORIZON_LOCAL_POSTS" \
              -maxdepth 1 \
              -type f \
              -name "$TODAY*.md" \
              | sort
          )

          # ------------------------------------------------------
          # Final Raw News validation
          # ------------------------------------------------------
          COUNT=$(find "$RAW_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo
          echo "============================================================"
          echo "FINAL TODAY RAW NEWS VALIDATION"
          echo "============================================================"

          echo "Raw News directory:"
          echo "  $RAW_DIR"

          echo "Final TODAY Raw files: $COUNT"

          if [ "$COUNT" -lt 2 ]; then

            echo "❌ TODAY Raw News still incomplete"
            exit 1

          fi

          echo
          echo "Files now in Raw News:"

          find "$RAW_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            -print \
            | sort

          echo
          echo "✅ TODAY Raw News COMPLETE"
          echo "✅ Horizon local output successfully imported"
      # ==========================================================
      # 10. Save TODAY Raw News
      # ==========================================================
      - name: Checkpoint TODAY Raw News
        run: |
          set -e

          RAW_DIR="01_自生长知识系统/Raw News/$TODAY"

          git config user.name \
            "748686 Knowledge Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$RAW_DIR"

          if git diff --cached --quiet; then

            echo "ℹ️ TODAY Raw News already persisted"

          else

            git commit \
              -m "data: acquire Raw News $TODAY"

            "$GIT_HELPER" origin main

            echo "✅ TODAY Raw News PUSH COMPLETE"

          fi

          git pull --ff-only origin main

          echo "✅ TODAY Raw News checkpoint complete"

      # ==========================================================
      # 11. Rolling Date Transaction
      # ==========================================================
      - name: Rolling Date Transactions
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_BASE_URL: https://api.agnes-ai.cn/v1
          AI_MODEL: agnes-3.0-flash
        run: |
          set -u

          RAW_ROOT="01_自生长知识系统/Raw News"
          SPLITTER="01_自生长知识系统/scripts/horizon_split.py"
          ENRICHMENT="01_自生长知识系统/scripts/source_enrichment.py"
          ORCHESTRATOR="01_自生长知识系统/scripts/knowledge_rolling.py"

          echo
          echo
          echo "######################################################################"
          echo "748686 自生长知识系统"
          echo "ROLLING DATE TRANSACTION ENGINE"
          echo "######################################################################"

          if [ ! -f "$SPLITTER" ]; then
            echo "❌ horizon_split.py not found"
            exit 1
          fi

          if [ ! -f "$ENRICHMENT" ]; then
            echo "❌ source_enrichment.py not found"
            exit 1
          fi

          if [ ! -f "$ORCHESTRATOR" ]; then
            echo "❌ knowledge_rolling.py not found"
            exit 1
          fi

          python -m pip install --upgrade pip
          python -m pip install requests

          process_date() {

            DATE="$1"
            REQUIRED="$2"

            echo
            echo
            echo "######################################################################"
            echo "DATE TRANSACTION START"
            echo "######################################################################"

            echo "DATE     : $DATE"
            echo "REQUIRED : $REQUIRED"

            RAW_DIR="$RAW_ROOT/$DATE"

            mkdir -p "$RAW_DIR"

            RAW_COUNT=$(find "$RAW_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo
            echo "------------------------------------------------------------"
            echo "A. RAW NEWS"
            echo "------------------------------------------------------------"

            echo "Raw files: $RAW_COUNT"

            if [ "$RAW_COUNT" -lt 2 ]; then

              echo "⚠️ Raw News incomplete: $DATE"

              if [ "$REQUIRED" = "true" ]; then

                echo "❌ TODAY Raw News is mandatory"

                return 1

              fi

              # --------------------------------------------------
              # Historical date + Horizon disabled
              #
              # 不访问 Horizon。
              # 历史日期允许 SKIP。
              # --------------------------------------------------
              if [ "$HORIZON_ENABLED" != "true" ]; then

                echo
                echo "============================================================"
                echo "HORIZON DISABLED — HISTORICAL RECOVERY SKIPPED"
                echo "============================================================"

                echo "Historical Raw News incomplete: $DATE"
                echo "Horizon is disabled."
                echo "Horizon gh-pages will NOT be downloaded."
                echo "Horizon will NOT be executed."

                echo
                echo "⚠️ Historical date skipped: $DATE"

                return 10

              fi

              # --------------------------------------------------
              # Historical date + Horizon enabled
              # --------------------------------------------------
              echo "Searching Horizon gh-pages for historical date..."

              rm -rf horizon-pages

              if ! git clone \
                --quiet \
                --depth 1 \
                --branch gh-pages \
                "https://github.com/748686/Horizon.git" \
                horizon-pages
              then

                echo "⚠️ Cannot refresh Horizon gh-pages"

                return 10

              fi

              if [ ! -d "horizon-pages/_posts" ]; then

                echo "⚠️ Horizon _posts directory missing"

                return 10

              fi

              HCOUNT=$(find "horizon-pages/_posts" \
                -maxdepth 1 \
                -type f \
                -name "$DATE*.md" \
                | wc -l)

              echo "Historical Horizon files: $HCOUNT"

              if [ "$HCOUNT" -gt 0 ]; then

                while IFS= read -r file; do
                  cp "$file" "$RAW_DIR/"
                done < <(
                  find "horizon-pages/_posts" \
                    -maxdepth 1 \
                    -type f \
                    -name "$DATE*.md" \
                    | sort
                )

              fi

              RAW_COUNT=$(find "$RAW_DIR" \
                -maxdepth 1 \
                -type f \
                -name "*.md" \
                | wc -l)

              echo "Historical Raw files after recovery: $RAW_COUNT"

              if [ "$RAW_COUNT" -lt 2 ]; then

                echo "⚠️ Historical Raw News unavailable: $DATE"

                return 10

              fi

            fi

            echo "✅ Raw News ready: $DATE"

            ATOMIC_ROOT="$RAW_ROOT/${DATE}-Atomic"
            ZH_ATOMIC="$ATOMIC_ROOT/zh"
            EN_ATOMIC="$ATOMIC_ROOT/en"

            mkdir -p "$ZH_ATOMIC"
            mkdir -p "$EN_ATOMIC"

            ZH_COUNT=$(find "$ZH_ATOMIC" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            EN_COUNT=$(find "$EN_ATOMIC" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo
            echo "------------------------------------------------------------"
            echo "B. ATOMIC NEWS"
            echo "------------------------------------------------------------"

            echo "Existing zh: $ZH_COUNT"
            echo "Existing en: $EN_COUNT"

            if [ "$ZH_COUNT" -eq 0 ] || [ "$EN_COUNT" -eq 0 ]; then

              echo "▶️ Building Atomic: $DATE"

              if ! python "$SPLITTER" \
                --raw-root "$RAW_ROOT" \
                --date "$DATE"
              then

                echo "❌ Atomic generation failed: $DATE"

                return 1

              fi

            else

              echo "⏭️ Atomic already exists: $DATE"

            fi

            ZH_COUNT=$(find "$ZH_ATOMIC" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            EN_COUNT=$(find "$EN_ATOMIC" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Final Atomic zh: $ZH_COUNT"
            echo "Final Atomic en: $EN_COUNT"

            if [ "$ZH_COUNT" -eq 0 ] || [ "$EN_COUNT" -eq 0 ]; then

              echo "❌ Atomic incomplete: $DATE"

              return 1

            fi

            echo "✅ Atomic ready: $DATE"

            git config user.name \
              "748686 Knowledge Bot"

            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add \
              "$RAW_DIR" \
              "$ATOMIC_ROOT"

            if git diff --cached --quiet; then

              echo "ℹ️ No Atomic changes to commit"

            else

              git commit \
                -m "data: complete Atomic News $DATE"

              if ! "$GIT_HELPER" origin main; then

                echo "❌ Atomic push failed: $DATE"

                return 1

              fi

              echo "✅ Atomic PUSH COMPLETE"

            fi

            if ! git pull --ff-only origin main; then

              echo "❌ Atomic pull failed: $DATE"

              return 1

            fi

            echo "✅ Atomic checkpoint complete"

            # ----------------------------------------------------
            # D. SOURCE ENRICHMENT
            # ----------------------------------------------------
            ENRICHED_ROOT="$RAW_ROOT/${DATE}-Enriched"
            ZH_ENRICHED="$ENRICHED_ROOT/zh"
            EN_ENRICHED="$ENRICHED_ROOT/en"

            mkdir -p "$ZH_ENRICHED"
            mkdir -p "$EN_ENRICHED"

            ZH_COUNT=$(find "$ZH_ENRICHED" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            EN_COUNT=$(find "$EN_ENRICHED" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo
            echo "------------------------------------------------------------"
            echo "D. SOURCE ENRICHMENT"
            echo "------------------------------------------------------------"

            echo "Existing Enriched zh: $ZH_COUNT"
            echo "Existing Enriched en: $EN_COUNT"

            if [ "$ZH_COUNT" -eq 0 ] || [ "$EN_COUNT" -eq 0 ]; then

              echo "▶️ Building Enriched: $DATE"

              if ! python "$ENRICHMENT" \
                --raw-root "$RAW_ROOT" \
                --date "$DATE"
              then

                echo "❌ Enriched generation failed: $DATE"

                return 1

              fi

            else

              echo "⏭️ Enriched already exists: $DATE"

            fi

            ZH_COUNT=$(find "$ZH_ENRICHED" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            EN_COUNT=$(find "$EN_ENRICHED" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l)

            echo "Final Enriched zh: $ZH_COUNT"
            echo "Final Enriched en: $EN_COUNT"

            if [ "$ZH_COUNT" -eq 0 ] || [ "$EN_COUNT" -eq 0 ]; then

              echo "❌ Enriched incomplete: $DATE"

              return 1

            fi

            echo "✅ Enriched ready: $DATE"

            git add \
              "$ENRICHED_ROOT"

            if git diff --cached --quiet; then

              echo "ℹ️ No Enriched changes to commit"

            else

              git commit \
                -m "data: complete Enriched News $DATE"

              if ! "$GIT_HELPER" origin main; then

                echo "❌ Enriched push failed: $DATE"

                return 1

              fi

              echo "✅ Enriched PUSH COMPLETE"

            fi

            if ! git pull --ff-only origin main; then

              echo "❌ Enriched pull failed: $DATE"

              return 1

            fi

            echo "✅ Enriched checkpoint complete"

            # ----------------------------------------------------
            # F. KNOWLEDGE PIPELINE
            # ----------------------------------------------------
            echo
            echo "------------------------------------------------------------"
            echo "F. KNOWLEDGE PIPELINE"
            echo "------------------------------------------------------------"

            echo "DATE: $DATE"

            if ! python "$ORCHESTRATOR" \
              --date "$DATE"
            then

              echo "❌ Knowledge Pipeline failed: $DATE"

              return 1

            fi

            echo "✅ Knowledge Pipeline complete: $DATE"

            # ----------------------------------------------------
            # G. DATE TRANSACTION VALIDATION
            # ----------------------------------------------------
            echo
            echo "------------------------------------------------------------"
            echo "G. DATE TRANSACTION VALIDATION"
            echo "------------------------------------------------------------"

            for LANGUAGE in en zh
            do

              EVENT_ROOT="$RAW_ROOT/${DATE}-EventUnit/$LANGUAGE"
              EVENT_UNITS_DIR="$EVENT_ROOT/event_units"

              echo
              echo "DATE     : $DATE"
              echo "LANGUAGE : $LANGUAGE"

              if [ ! -f "$EVENT_ROOT/_COMPLETE" ]; then

                echo "❌ Task 3 _COMPLETE missing"

                return 1

              fi

              if [ ! -d "$EVENT_UNITS_DIR" ]; then

                echo "❌ event_units directory missing"

                return 1

              fi

              EVENT_COUNT=$(find "$EVENT_UNITS_DIR" \
                -maxdepth 1 \
                -type f \
                -name "EVT-*.md" \
                ! -name "*_analysis.md" \
                | wc -l)

              ANALYSIS_COUNT=$(find "$EVENT_UNITS_DIR" \
                -maxdepth 1 \
                -type f \
                -name "*_analysis.md" \
                | wc -l)

              echo "EventUnits : $EVENT_COUNT"
              echo "Analysis   : $ANALYSIS_COUNT"

              if [ "$EVENT_COUNT" -eq 0 ]; then

                echo "❌ No EventUnits"

                return 1

              fi

              if [ "$ANALYSIS_COUNT" -ne "$EVENT_COUNT" ]; then

                echo "❌ Event / Analysis mismatch"

                return 1

              fi

              if [ ! -s "$EVENT_UNITS_DIR/_SKILLS_COMPLETE" ]; then

                echo "❌ _SKILLS_COMPLETE missing or empty"

                return 1

              fi

              echo "✅ $DATE $LANGUAGE complete"

            done

            # ----------------------------------------------------
            # H. DATE CHECKPOINT
            # ----------------------------------------------------
            echo
            echo "------------------------------------------------------------"
            echo "H. DATE CHECKPOINT"
            echo "------------------------------------------------------------"

            git config user.name \
              "748686 Knowledge Bot"

            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add \
              "$RAW_ROOT/${DATE}-EventUnit"

            if git diff --cached --quiet; then

              echo "ℹ️ No EventUnit / Skills changes to commit"

            else

              git commit \
                -m "data: complete knowledge pipeline $DATE"

              if ! "$GIT_HELPER" origin main; then

                echo "❌ Knowledge checkpoint push failed: $DATE"

                return 1

              fi

              echo "✅ Knowledge checkpoint PUSH COMPLETE"

            fi

            if ! git pull --ff-only origin main; then

              echo "❌ Knowledge checkpoint pull failed: $DATE"

              return 1

            fi

            echo
            echo "######################################################################"
            echo "DATE TRANSACTION SUCCESS"
            echo "######################################################################"

            echo "DATE     : $DATE"
            echo "STATUS   : SUCCESS"
            echo "CHECKPOINT: PUSHED + PULLED"

            return 0
          }

          # ======================================================
          # TRANSACTION 1 / 3
          # TODAY
          # ======================================================
          echo
          echo
          echo "######################################################################"
          echo "TRANSACTION 1 / 3"
          echo "TODAY"
          echo "######################################################################"

          if ! process_date "$TODAY" "true"; then

            echo
            echo "❌ TODAY TRANSACTION FAILED"
