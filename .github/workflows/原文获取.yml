name: 03 原文获取 - Source Enrichment V3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  enrich:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout 748686obsidian
        uses: actions/checkout@v4


      # ============================================================
      # 2. 获取日期
      # ============================================================

      - name: Set date
        id: date
        run: |

          set -e

          TODAY=$(date -u +%Y-%m-%d)

          echo "today=$TODAY" \
            >> "$GITHUB_OUTPUT"

          echo "DATE:"
          echo "$TODAY"


      # ============================================================
      # 3. 设置路径
      # ============================================================

      - name: Set paths
        id: paths
        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          ATOMIC_ROOT="01_自生长知识系统/Raw News/${TODAY}-Atomic"

          ZH="${ATOMIC_ROOT}/zh"

          EN="${ATOMIC_ROOT}/en"

          OUTPUT="01_自生长知识系统/Raw News/${TODAY}-Enriched"

          echo "zh=$ZH" \
            >> "$GITHUB_OUTPUT"

          echo "en=$EN" \
            >> "$GITHUB_OUTPUT"

          echo "output=$OUTPUT" \
            >> "$GITHUB_OUTPUT"

          echo
          echo "=========================================="
          echo "SOURCE ENRICHMENT V3"
          echo "=========================================="

          echo "ZH:"
          echo "$ZH"

          echo
          echo "EN:"
          echo "$EN"

          echo
          echo "OUTPUT:"
          echo "$OUTPUT"


      # ============================================================
      # 4. 检查 Atomic 中文
      # ============================================================

      - name: Check Chinese Atomic
        run: |

          set -e

          DIR="${{ steps.paths.outputs.zh }}"

          if [ ! -d "$DIR" ]; then

            echo "❌ Chinese Atomic directory missing:"
            echo "$DIR"

            exit 1

          fi

          COUNT=$(find "$DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "Chinese Atomic:"
          echo "$COUNT"

          if [ "$COUNT" -eq 0 ]; then

            echo "❌ No Chinese Atomic files."

            exit 1

          fi


      # ============================================================
      # 5. 检查 Atomic 英文
      # ============================================================

      - name: Check English Atomic
        run: |

          set -e

          DIR="${{ steps.paths.outputs.en }}"

          if [ ! -d "$DIR" ]; then

            echo "❌ English Atomic directory missing:"
            echo "$DIR"

            exit 1

          fi

          COUNT=$(find "$DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "English Atomic:"
          echo "$COUNT"

          if [ "$COUNT" -eq 0 ]; then

            echo "❌ No English Atomic files."

            exit 1

          fi


      # ============================================================
      # 6. 检查脚本
      # ============================================================

      - name: Check Source Enrichment V3
        run: |

          set -e

          SCRIPT="01_自生长知识系统/scripts/source_enrichment.py"

          if [ ! -f "$SCRIPT" ]; then

            echo "❌ Script missing:"
            echo "$SCRIPT"

            exit 1

          fi

          echo "✅ Script found"


      # ============================================================
      # 7. Setup Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ============================================================
      # 8. Install dependencies
      # ============================================================

      - name: Install dependencies
        run: |

          set -e

          python -m pip install --upgrade pip

          pip install requests


      # ============================================================
      # 9. 检查 Agnes API
      # ============================================================

      - name: Check Agnes API configuration
        env:

          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}

        run: |

          set -e

          echo "=========================================="
          echo "CHECK AGNES API"
          echo "=========================================="

          if [ -z "$AGNES_API_KEY" ]; then

            echo "❌ AGNES_API_KEY is NOT configured."

            echo
            echo "GitHub:"
            echo "Settings → Secrets and variables"
            echo "→ Actions → New repository secret"

            exit 1

          fi

          echo "✅ AGNES_API_KEY detected."

          echo "Key length:"
          echo "${#AGNES_API_KEY}"


      # ============================================================
      # 10. Agnes API 最小连接测试
      # ============================================================

      - name: Test Agnes API
        env:

          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}

        run: |

          set -e

          echo "=========================================="
          echo "TEST AGNES API"
          echo "=========================================="

          python - <<'PY'

          import os
          import requests

          url = (
              "https://apihub.agnes-ai.com/v1"
              "/chat/completions"
          )

          payload = {

              "model":
                  "agnes-2.5-flash",

              "messages": [

                  {
                      "role":
                          "user",

                      "content":
                          "Reply only with OK."
                  }

              ],

              "temperature":
                  0,

              "max_tokens":
                  10,

              "stream":
                  False,
          }

          response = requests.post(

              url,

              headers={

                  "Authorization":
                      "Bearer "
                      + os.environ[
                          "AGNES_API_KEY"
                      ],

                  "Content-Type":
                      "application/json",
              },

              json=payload,

              timeout=30,
          )

          print(
              "HTTP:",
              response.status_code
          )

          if response.status_code != 200:

              print(
                  response.text[:1000]
              )

              raise SystemExit(
                  "Agnes API test failed."
              )

          print(
              "✅ Agnes API connection OK."
          )

          PY


      # ============================================================
      # 11. 执行 V3
      # ============================================================

      - name: Run Source Enrichment V3
        env:

          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}

        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          ZH="${{ steps.paths.outputs.zh }}"

          EN="${{ steps.paths.outputs.en }}"

          OUTPUT="${{ steps.paths.outputs.output }}"

          SCRIPT="01_自生长知识系统/scripts/source_enrichment.py"

          echo "=========================================="
          echo "HORIZON SOURCE ENRICHMENT V3"
          echo "=========================================="

          echo
          echo "RSS"
          echo "↓"

          echo "TITLE MATCH"
          echo "↓"

          echo "AGNES API"
          echo "↓"

          echo "WEB FETCH"

          echo
          echo "Starting..."

          python "$SCRIPT" \
            --zh "$ZH" \
            --en "$EN" \
            --output "$OUTPUT" \
            --date "$TODAY"


      # ============================================================
      # 12. 验证中文
      # ============================================================

      - name: Validate Chinese Enriched
        run: |

          set -e

          DIR="${{ steps.paths.outputs.output }}/zh"

          if [ ! -d "$DIR" ]; then

            echo "❌ Chinese Enriched missing."

            exit 1

          fi

          COUNT=$(find "$DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "Chinese Enriched:"
          echo "$COUNT"

          if [ "$COUNT" -eq 0 ]; then

            exit 1

          fi


      # ============================================================
      # 13. 验证英文
      # ============================================================

      - name: Validate English Enriched
        run: |

          set -e

          DIR="${{ steps.paths.outputs.output }}/en"

          if [ ! -d "$DIR" ]; then

            echo "❌ English Enriched missing."

            exit 1

          fi

          COUNT=$(find "$DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "English Enriched:"
          echo "$COUNT"

          if [ "$COUNT" -eq 0 ]; then

            exit 1

          fi


      # ============================================================
      # 14. Front Matter
      # ============================================================

      - name: Validate Front Matter
        run: |

          set -e

          ROOT="${{ steps.paths.outputs.output }}"

          echo "=========================================="
          echo "VALIDATE FRONT MATTER"
          echo "=========================================="

          for DIR in \
            "$ROOT/zh" \
            "$ROOT/en"

          do

            FILE=$(find "$DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | head -n 1)

            if [ -z "$FILE" ]; then

              echo "❌ No markdown file."

              exit 1

            fi

            echo
            echo "Checking:"
            echo "$FILE"

            FIRST=$(head -n 1 "$FILE")

            if [ "$FIRST" != "---" ]; then

              echo "❌ Front Matter missing."

              exit 1

            fi

            echo "✅ Front Matter OK"

            sed -n '1,25p' "$FILE"

          done


      # ============================================================
      # 15. 来源统计
      # ============================================================

      - name: Report source status
        run: |

          set -e

          ROOT="${{ steps.paths.outputs.output }}"

          echo
          echo "=========================================="
          echo "SOURCE STATUS"
          echo "=========================================="

          echo
          echo "Fetched:"
          grep -R \
            'source_status: "fetched"' \
            "$ROOT" \
            --include="*.md" \
            | wc -l || true

          echo
          echo "Unresolved:"
          grep -R \
            'source_status: "unresolved"' \
            "$ROOT" \
            --include="*.md" \
            | wc -l || true

          echo
          echo "RSS + Agnes:"
          grep -R \
            'search_method: "rss+agnes_api"' \
            "$ROOT" \
            --include="*.md" \
            | wc -l || true

          echo
          echo "RSS only:"
          grep -R \
            'search_method: "rss"' \
            "$ROOT" \
            --include="*.md" \
            | wc -l || true

          echo
          echo "Direct URL:"
          grep -R \
            'search_method: "direct_url"' \
            "$ROOT" \
            --include="*.md" \
            | wc -l || true


      # ============================================================
      # 16. Git Commit
      # ============================================================

      - name: Commit Enriched News
        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          git config \
            user.name \
            "748686 Knowledge Bot"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "01_自生长知识系统/Raw News/${TODAY}-Enriched"

          if git diff --cached --quiet; then

            echo "No Enriched News changes."

          else

            git commit \
              -m \
              "chore: source enrichment v3 ${TODAY}"

            git push

          fi

          echo
          echo "=========================================="
          echo "✅ SOURCE ENRICHMENT V3 COMPLETE"
          echo "=========================================="

          echo
          echo "Output:"
          echo \
            "01_自生长知识系统/Raw News/${TODAY}-Enriched/"
