name: 03 原文获取 - Source Enrichment V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  enrich:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout 748686obsidian
        uses: actions/checkout@v4


      # ============================================================
      # 2. 获取日期
      # ============================================================

      - name: Set date
        id: date
        run: |

          echo "today=$(date -u +%Y-%m-%d)" \
            >> "$GITHUB_OUTPUT"


      # ============================================================
      # 3. 设置路径
      # ============================================================

      - name: Set paths
        id: paths
        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          ATOMIC_ROOT="01_自生长知识系统/Raw News/${TODAY}-Atomic"

          ZH="${ATOMIC_ROOT}/zh"
          EN="${ATOMIC_ROOT}/en"

          OUTPUT="01_自生长知识系统/Raw News/${TODAY}-Enriched"

          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "zh=$ZH" >> "$GITHUB_OUTPUT"
          echo "en=$EN" >> "$GITHUB_OUTPUT"
          echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "HORIZON SOURCE ENRICHMENT V2"
          echo "=========================================="

          echo "DATE:"
          echo "$TODAY"

          echo
          echo "ZH:"
          echo "$ZH"

          echo
          echo "EN:"
          echo "$EN"

          echo
          echo "OUTPUT:"
          echo "$OUTPUT"


      # ============================================================
      # 4. 检查中文 Atomic
      # ============================================================

      - name: Check Chinese Atomic
        run: |

          set -e

          DIR="${{ steps.paths.outputs.zh }}"

          if [ ! -d "$DIR" ]; then

            echo "❌ Chinese Atomic directory not found:"
            echo "$DIR"

            exit 1

          fi

          COUNT=$(
            find "$DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l
          )

          echo "Chinese Atomic files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then

            echo "❌ No Chinese Atomic News."

            exit 1

          fi


      # ============================================================
      # 5. 检查英文 Atomic
      # ============================================================

      - name: Check English Atomic
        run: |

          set -e

          DIR="${{ steps.paths.outputs.en }}"

          if [ ! -d "$DIR" ]; then

            echo "❌ English Atomic directory not found:"
            echo "$DIR"

            exit 1

          fi

          COUNT=$(
            find "$DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l
          )

          echo "English Atomic files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then

            echo "❌ No English Atomic News."

            exit 1

          fi


      # ============================================================
      # 6. 检查脚本
      # ============================================================

      - name: Check Source Enrichment V2
        run: |

          set -e

          SCRIPT="01_自生长知识系统/scripts/source_enrichment.py"

          if [ ! -f "$SCRIPT" ]; then

            echo "❌ Source Enrichment V2 not found:"
            echo "$SCRIPT"

            exit 1

          fi

          echo "✅ Source Enrichment V2 found"


      # ============================================================
      # 7. Setup Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ============================================================
      # 8. 安装依赖
      # ============================================================

      - name: Install dependencies
        run: |

          set -e

          python -m pip install --upgrade pip

          pip install \
            requests \
            beautifulsoup4


      # ============================================================
      # 9. 检查 Agnes API
      # ============================================================

      - name: Check Agnes API configuration
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}

        run: |

          set -e

          echo "=========================================="
          echo "AGNES API CONFIGURATION"
          echo "=========================================="

          if [ -z "$AGNES_API_KEY" ]; then

            echo "⚠️ AGNES_API_KEY is not configured."

            echo "The workflow will still run:"
            echo "RSS search → URL validation → pending."

          else

            echo "✅ AGNES_API_KEY detected."

          fi


      # ============================================================
      # 10. 执行 Source Enrichment V2
      # ============================================================

      - name: Run Source Enrichment V2
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_BASE_URL: https://apihub.agnes-ai.com/v1
          AGNES_MODEL: agnes-2.5-flash

        run: |

          set -e

          TODAY="${{ steps.paths.outputs.today }}"

          ZH="${{ steps.paths.outputs.zh }}"
          EN="${{ steps.paths.outputs.en }}"
          OUTPUT="${{ steps.paths.outputs.output }}"

          SCRIPT="01_自生长知识系统/scripts/source_enrichment.py"

          echo "=========================================="
          echo "HORIZON SOURCE ENRICHMENT V2"
          echo "=========================================="

          echo
          echo "Phase 1:"
          echo "Existing URL → direct fetch"

          echo
          echo "Phase 2:"
          echo "Google News RSS → title matching"

          echo
          echo "Phase 3:"
          echo "Agnes API → batch fallback"

          echo
          echo "Phase 4:"
          echo "URL validation → article extraction"

          echo
          echo "Running..."

          python "$SCRIPT" \
            --zh "$ZH" \
            --en "$EN" \
            --output "$OUTPUT" \
            --date "$TODAY"


      # ============================================================
      # 11. 验证中文
      # ============================================================

      - name: Validate Chinese Enriched
        run: |

          set -e

          TODAY="${{ steps.paths.outputs.today }}"

          DIR="01_自生长知识系统/Raw News/${TODAY}-Enriched/zh"

          if [ ! -d "$DIR" ]; then

            echo "❌ Chinese Enriched directory missing:"
            echo "$DIR"

            exit 1

          fi

          COUNT=$(
            find "$DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l
          )

          echo "Chinese Enriched files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then

            echo "❌ No Chinese Enriched files."

            exit 1

          fi


      # ============================================================
      # 12. 验证英文
      # ============================================================

      - name: Validate English Enriched
        run: |

          set -e

          TODAY="${{ steps.paths.outputs.today }}"

          DIR="01_自生长知识系统/Raw News/${TODAY}-Enriched/en"

          if [ ! -d "$DIR" ]; then

            echo "❌ English Enriched directory missing:"
            echo "$DIR"

            exit 1

          fi

          COUNT=$(
            find "$DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | wc -l
          )

          echo "English Enriched files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then

            echo "❌ No English Enriched files."

            exit 1

          fi


      # ============================================================
      # 13. Front Matter 验证
      # ============================================================

      - name: Validate Front Matter
        run: |

          set -e

          TODAY="${{ steps.paths.outputs.today }}"

          ROOT="01_自生长知识系统/Raw News/${TODAY}-Enriched"

          echo "=========================================="
          echo "VALIDATE FRONT MATTER"
          echo "=========================================="

          for DIR in \
            "$ROOT/zh" \
            "$ROOT/en"
          do

            FILE=$(
              find "$DIR" \
                -maxdepth 1 \
                -type f \
                -name "*.md" \
                | head -n 1 || true
            )

            if [ -z "$FILE" ]; then

              echo "❌ No markdown file:"
              echo "$DIR"

              exit 1

            fi

            echo
            echo "Checking:"
            echo "$FILE"

            if ! head -n 1 "$FILE" \
              | grep -q "^---$"; then

              echo "❌ Front Matter missing."

              exit 1

            fi

            echo "✅ Front Matter detected"

            sed -n '1,25p' "$FILE"

          done


      # ============================================================
      # 14. 来源状态统计
      # ============================================================

      - name: Report source status
        run: |

          set -e

          TODAY="${{ steps.paths.outputs.today }}"

          ROOT="01_自生长知识系统/Raw News/${TODAY}-Enriched"

          echo "=========================================="
          echo "SOURCE STATUS REPORT"
          echo "=========================================="

          echo
          echo "Fetched:"
          grep -R \
            'source_status: "fetched"' \
            "$ROOT" \
            --include="*.md" \
            | wc -l || true

          echo
          echo "Pending:"
          grep -R \
            'source_status: "pending_search"' \
            "$ROOT" \
            --include="*.md" \
            | wc -l || true

          echo
          echo "Google News RSS:"
          grep -R \
            'search_method: "google_news_rss"' \
            "$ROOT" \
            --include="*.md" \
            | wc -l || true

          echo
          echo "Agnes API:"
          grep -R \
            'search_method: "agnes_api"' \
            "$ROOT" \
            --include="*.md" \
            | wc -l || true


      # ============================================================
      # 15. Git 提交
      # ============================================================

      - name: Commit Enriched News
        run: |

          set -e

          TODAY="${{ steps.paths.outputs.today }}"

          git config \
            user.name \
            "748686 Knowledge Bot"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "01_自生长知识系统/Raw News/${TODAY}-Enriched"

          if git diff --cached --quiet; then

            echo "No Enriched News changes."

          else

            git commit \
              -m "chore: source enrichment v2 ${TODAY}"

            git push

          fi

          echo
          echo "=========================================="
          echo "✅ SOURCE ENRICHMENT V2 COMPLETE"
          echo "=========================================="

          echo
          echo "Output:"
          echo "Raw News/${TODAY}-Enriched/"
          echo "├── zh"
          echo "└── en"
