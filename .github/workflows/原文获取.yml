name: 03 原文获取 - Source Enrichment V2.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  enrich:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout 748686obsidian
        uses: actions/checkout@v4

      # ============================================================
      # 2. 获取日期
      # ============================================================

      - name: Set date
        id: date
        run: |

          set -e

          TODAY=$(date -u +%Y-%m-%d)

          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "DATE"
          echo "=========================================="
          echo "$TODAY"

      # ============================================================
      # 3. 设置路径
      # ============================================================

      - name: Set paths
        id: paths
        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          ATOMIC_ROOT="01_自生长知识系统/Raw News/${TODAY}-Atomic"

          ZH="${ATOMIC_ROOT}/zh"
          EN="${ATOMIC_ROOT}/en"

          OUTPUT="01_自生长知识系统/Raw News/${TODAY}-Enriched"

          echo "zh=$ZH" >> "$GITHUB_OUTPUT"
          echo "en=$EN" >> "$GITHUB_OUTPUT"
          echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "SOURCE ENRICHMENT PATHS"
          echo "=========================================="

          echo "ZH:"
          echo "$ZH"

          echo
          echo "EN:"
          echo "$EN"

          echo
          echo "OUTPUT:"
          echo "$OUTPUT"

      # ============================================================
      # 4. 检查 Atomic
      # ============================================================

      - name: Check Atomic News
        run: |

          set -e

          ZH="${{ steps.paths.outputs.zh }}"
          EN="${{ steps.paths.outputs.en }}"

          echo "=========================================="
          echo "CHECK ATOMIC NEWS"
          echo "=========================================="

          if [ ! -d "$ZH" ]; then
            echo "❌ Chinese Atomic directory missing:"
            echo "$ZH"
            exit 1
          fi

          if [ ! -d "$EN" ]; then
            echo "❌ English Atomic directory missing:"
            echo "$EN"
            exit 1
          fi

          ZH_COUNT=$(find "$ZH" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          EN_COUNT=$(find "$EN" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "Chinese: $ZH_COUNT"
          echo "English: $EN_COUNT"

          if [ "$ZH_COUNT" -eq 0 ]; then
            echo "❌ No Chinese Atomic News."
            exit 1
          fi

          if [ "$EN_COUNT" -eq 0 ]; then
            echo "❌ No English Atomic News."
            exit 1
          fi

      # ============================================================
      # 5. 检查 Source Enrichment V2.1
      # ============================================================

      - name: Check source enrichment script
        run: |

          set -e

          SCRIPT="01_自生长知识系统/scripts/source_enrichment.py"

          echo "=========================================="
          echo "CHECK SOURCE ENRICHMENT V2.1"
          echo "=========================================="

          if [ ! -f "$SCRIPT" ]; then
            echo "❌ Script not found:"
            echo "$SCRIPT"
            exit 1
          fi

          echo "✅ Script found:"
          echo "$SCRIPT"

      # ============================================================
      # 6. Setup Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 7. 检查 Agnes API
      # ============================================================

      - name: Check Agnes API configuration
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_API_BASE_URL: ${{ secrets.AGNES_API_BASE_URL }}
          AGNES_API_MODEL: ${{ secrets.AGNES_API_MODEL }}

        run: |

          set -e

          echo "=========================================="
          echo "CHECK AGNES API CONFIGURATION"
          echo "=========================================="

          if [ -z "$AGNES_API_KEY" ]; then

            echo "❌ AGNES_API_KEY is missing."

            echo
            echo "Please create GitHub repository secret:"
            echo "AGNES_API_KEY"

            exit 1

          fi

          echo "✅ AGNES_API_KEY detected."

          if [ -n "$AGNES_API_BASE_URL" ]; then
            echo "AGNES_API_BASE_URL configured."
          else
            echo "AGNES_API_BASE_URL not set."
            echo "Using default OpenAI-compatible endpoint."
          fi

          if [ -n "$AGNES_API_MODEL" ]; then
            echo "AGNES_API_MODEL configured."
          else
            echo "AGNES_API_MODEL not set."
            echo "Using default model."
          fi

      # ============================================================
      # 8. 执行 V2.1
      # ============================================================

      - name: Run Source Enrichment V2.1
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_API_BASE_URL: ${{ secrets.AGNES_API_BASE_URL }}
          AGNES_API_MODEL: ${{ secrets.AGNES_API_MODEL }}

        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          ZH="${{ steps.paths.outputs.zh }}"
          EN="${{ steps.paths.outputs.en }}"
          OUTPUT="${{ steps.paths.outputs.output }}"

          SCRIPT="01_自生长知识系统/scripts/source_enrichment.py"

          echo "=========================================="
          echo "HORIZON SOURCE ENRICHMENT V2.1"
          echo "=========================================="

          echo "Date:"
          echo "$TODAY"

          echo
          echo "Chinese:"
          echo "$ZH"

          echo
          echo "English:"
          echo "$EN"

          echo
          echo "Output:"
          echo "$OUTPUT"

          echo
          echo "Search strategy:"
          echo "1. Direct URL"
          echo "2. Google News RSS"
          echo "3. Bing News RSS"
          echo "4. Parallel title matching"
          echo "5. AGNES API fallback"
          echo "6. Source page fetch"

          echo
          echo "Running..."

          python "$SCRIPT" \
            --zh "$ZH" \
            --en "$EN" \
            --output "$OUTPUT" \
            --date "$TODAY"

      # ============================================================
      # 9. 验证中文
      # ============================================================

      - name: Validate Chinese Enriched
        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          DIR="01_自生长知识系统/Raw News/${TODAY}-Enriched/zh"

          echo "=========================================="
          echo "VALIDATE CHINESE ENRICHED"
          echo "=========================================="

          if [ ! -d "$DIR" ]; then
            echo "❌ Directory missing:"
            echo "$DIR"
            exit 1
          fi

          COUNT=$(find "$DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "Chinese Enriched files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No Chinese Enriched files."
            exit 1
          fi

      # ============================================================
      # 10. 验证英文
      # ============================================================

      - name: Validate English Enriched
        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          DIR="01_自生长知识系统/Raw News/${TODAY}-Enriched/en"

          echo "=========================================="
          echo "VALIDATE ENGLISH ENRICHED"
          echo "=========================================="

          if [ ! -d "$DIR" ]; then
            echo "❌ Directory missing:"
            echo "$DIR"
            exit 1
          fi

          COUNT=$(find "$DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.md" \
            | wc -l)

          echo "English Enriched files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No English Enriched files."
            exit 1
          fi

      # ============================================================
      # 11. Front Matter
      # ============================================================

      - name: Validate Front Matter
        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          ROOT="01_自生长知识系统/Raw News/${TODAY}-Enriched"

          echo "=========================================="
          echo "VALIDATE FRONT MATTER"
          echo "=========================================="

          for DIR in \
            "$ROOT/zh" \
            "$ROOT/en"
          do

            FILE=$(find "$DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.md" \
              | head -n 1 || true)

            if [ -z "$FILE" ]; then
              echo "❌ No markdown file:"
              echo "$DIR"
              exit 1
            fi

            echo
            echo "Checking:"
            echo "$FILE"

            FIRST_LINE=$(head -n 1 "$FILE")

            if [ "$FIRST_LINE" != "---" ]; then
              echo "❌ Front Matter missing."
              exit 1
            fi

            echo "✅ Front Matter detected"

            sed -n '1,25p' "$FILE"

          done

      # ============================================================
      # 12. 来源统计
      # ============================================================

      - name: Report source status
        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          ROOT="01_自生长知识系统/Raw News/${TODAY}-Enriched"

          echo "=========================================="
          echo "SOURCE STATUS REPORT"
          echo "=========================================="

          echo
          echo "Fetched:"
          grep -R \
            'source_status: "fetched"' \
            "$ROOT" \
            --include="*.md" \
            | wc -l || true

          echo
          echo "Search Match:"
          grep -R \
            'search_method: "rss_title_match"' \
            "$ROOT" \
            --include="*.md" \
            | wc -l || true

          echo
          echo "AGNES Match:"
          grep -R \
            'search_method: "rss_then_agnes"' \
            "$ROOT" \
            --include="*.md" \
            | wc -l || true

          echo
          echo "Pending Search:"
          grep -R \
            'source_status: "pending_search"' \
            "$ROOT" \
            --include="*.md" \
            | wc -l || true

          echo
          echo "Fetch Failed:"
          grep -R \
            'source_status: "fetch_failed"' \
            "$ROOT" \
            --include="*.md" \
            | wc -l || true

      # ============================================================
      # 13. 找出 unresolved 新闻
      # ============================================================

      - name: Report unresolved news
        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          ROOT="01_自生长知识系统/Raw News/${TODAY}-Enriched"

          echo "=========================================="
          echo "UNRESOLVED NEWS"
          echo "=========================================="

          grep -R \
            -l \
            'source_status: "pending_search"' \
            "$ROOT" \
            --include="*.md" \
            || true

      # ============================================================
      # 14. Git Commit
      # ============================================================

      - name: Commit Enriched News
        run: |

          set -e

          TODAY="${{ steps.date.outputs.today }}"

          git config user.name \
            "748686 Knowledge Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "01_自生长知识系统/Raw News/${TODAY}-Enriched"

          if git diff --cached --quiet; then

            echo "No Enriched News changes."

          else

            git commit \
              -m "chore: source enrichment v2.1 ${TODAY}"

            git push

          fi

          echo
          echo "=========================================="
          echo "✅ SOURCE ENRICHMENT V2.1 COMPLETE"
          echo "=========================================="

          echo
          echo "Output:"
          echo "Raw News/${TODAY}-Enriched/"
          echo "  ├── zh"
          echo "  └── en"
