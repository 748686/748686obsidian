name: Feishu Image Test

on:
  workflow_dispatch:

jobs:
  send-image-test:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # ============================================================
      # 2. 找一张现有日报图片
      # ============================================================
      - name: Find test image
        id: find_image
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FEISHU IMAGE TEST"
          echo "========================================"

          IMAGE=$(find "01_自生长知识系统/04_图片" \
            -type f \
            \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) \
            | sort \
            | tail -n 1)

          if [ -z "$IMAGE" ]; then
            echo "❌ 没有找到图片"
            exit 1
          fi

          echo "Image:"
          echo "$IMAGE"

          echo "IMAGE_PATH=$IMAGE" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 3. Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 4. 尝试通过现有 FEISHU_WEBHOOK 发送图片
      # ============================================================
      - name: Send image to Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          IMAGE_PATH: ${{ steps.find_image.outputs.IMAGE_PATH }}
        shell: bash
        run: |
          python <<'PY'
          import os
          import json
          import base64
          import urllib.request

          webhook = os.environ["FEISHU_WEBHOOK"]
          image_path = os.environ["IMAGE_PATH"]

          print("========================================")
          print("FEISHU IMAGE TEST")
          print("========================================")
          print(f"Image: {image_path}")

          with open(image_path, "rb") as f:
              image_data = f.read()

          print(f"Image size: {len(image_data):,} bytes")

          # --------------------------------------------------------
          # 测试方式：
          # 尝试把图片内容直接放入 Webhook 请求。
          #
          # 注意：
          # 飞书标准 image 消息通常需要 image_key。
          # 这里故意不使用 App ID / App Secret，
          # 只是验证当前群机器人是否接受这种直接图片方式。
          # --------------------------------------------------------

          encoded = base64.b64encode(image_data).decode("ascii")

          payload = {
              "msg_type": "image",
              "content": {
                  "image_base64": encoded
              }
          }

          body = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=body,
              headers={
                  "Content-Type": "application/json; charset=utf-8"
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
                  response_body = response.read().decode("utf-8", errors="replace")

              print("----------------------------------------")
              print(f"HTTP Status: {status}")
              print(f"Response: {response_body}")
              print("----------------------------------------")

              if status != 200:
                  raise RuntimeError(
                      f"Feishu returned HTTP {status}"
                  )

              # 飞书通常会在 JSON 中返回 code。
              try:
                  result = json.loads(response_body)
              except Exception:
                  result = {}

              code = result.get("code")

              if code not in (None, 0):
                  print(f"⚠️ Feishu API code = {code}")
                  print("⚠️ 这说明当前 Webhook 很可能不接受这种图片发送格式。")
              else:
                  print("✅ Webhook 请求已经被飞书接受。")

          except Exception as e:
              print("----------------------------------------")
              print("❌ 请求失败")
              print(str(e))
              print("----------------------------------------")
              raise
          PY

      # ============================================================
      # 5. 测试结束
      # ============================================================
      - name: Test finished
        run: |
          echo "========================================"
          echo "Feishu image test finished."
          echo "请检查飞书群聊。"
          echo "========================================"
