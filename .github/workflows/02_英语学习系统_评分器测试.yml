name: 02_英语学习系统 - Grader V1.0 测试

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grader-test:
    name: English Exam Grader V1.0 FULL TEST
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Python
      # =========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =========================================================
      # 3. 确定 UTC 日期
      # =========================================================

      - name: Determine UTC test dates
        id: dates
        shell: bash
        run: |
          set -e

          TODAY="$(date -u +%Y-%m-%d)"
          YESTERDAY="$(date -u -d '1 day ago' +%Y-%m-%d)"

          echo "============================================================"
          echo "748686 ENGLISH LEARNING SYSTEM"
          echo "GRADER V1.0 TEST"
          echo "============================================================"
          echo
          echo "UTC TODAY     : $TODAY"
          echo "UTC YESTERDAY : $YESTERDAY"

          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "yesterday=$YESTERDAY" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 4. 检查 Grader 文件
      # =========================================================

      - name: Check Grader files
        shell: bash
        run: |
          set -e

          echo
          echo "============================================================"
          echo "CHECK GRADER FILES"
          echo "============================================================"

          PARSER="02_英语学习系统/scripts/english_exam_parser.py"
          GRADER="02_英语学习系统/scripts/english_exam_grader.py"
          TEST="02_英语学习系统/scripts/test_english_exam_grader_v1_0.py"

          if [ ! -f "$PARSER" ]; then
            echo "❌ 未找到: $PARSER"
            exit 1
          fi

          if [ ! -f "$GRADER" ]; then
            echo "❌ 未找到: $GRADER"
            exit 1
          fi

          if [ ! -f "$TEST" ]; then
            echo "❌ 未找到: $TEST"
            exit 1
          fi

          echo
          echo "✅ english_exam_parser.py"
          echo "✅ english_exam_grader.py"
          echo "✅ test_english_exam_grader_v1_0.py"

      # =========================================================
      # 5. 寻找当前日期考试 JSON
      # =========================================================

      - name: Locate current exam JSON
        id: locate_exam
        env:
          TODAY: ${{ steps.dates.outputs.today }}
          YESTERDAY: ${{ steps.dates.outputs.yesterday }}
        shell: bash
        run: |
          set -e

          echo
          echo "============================================================"
          echo "LOCATE EXAM JSON"
          echo "============================================================"

          FOUND=""

          TODAY_DIR="02_英语学习系统/output/$TODAY"
          YESTERDAY_DIR="02_英语学习系统/output/$YESTERDAY"

          echo
          echo "检查 UTC 今天:"
          echo "  $TODAY_DIR"

          if [ -d "$TODAY_DIR" ]; then
            while IFS= read -r file; do
              if jq -e '.questions | type == "array" and length == 61' "$file" >/dev/null 2>&1; then
                FOUND="$file"
                break
              fi
            done < <(
              find "$TODAY_DIR" \
                -type f \
                -name "*.json" \
                | sort
            )
          else
            echo "  ⚠️ 今天目录不存在"
          fi

          if [ -z "$FOUND" ]; then
            echo
            echo "今天没有找到 61 题考试 JSON。"
            echo "检查 UTC 昨天:"
            echo "  $YESTERDAY_DIR"

            if [ -d "$YESTERDAY_DIR" ]; then
              while IFS= read -r file; do
                if jq -e '.questions | type == "array" and length == 61' "$file" >/dev/null 2>&1; then
                  FOUND="$file"
                  break
                fi
              done < <(
                find "$YESTERDAY_DIR" \
                  -type f \
                  -name "*.json" \
                  | sort
              )
            else
              echo "  ⚠️ 昨天目录不存在"
            fi
          fi

          if [ -z "$FOUND" ]; then
            echo
            echo "❌ 未找到当前日期范围内的 61 题考试 JSON"
            echo
            echo "搜索范围:"
            echo "  $TODAY_DIR"
            echo "  $YESTERDAY_DIR"

            echo
            echo "现有 output 日期目录:"

            if [ -d "02_英语学习系统/output" ]; then
              find "02_英语学习系统/output" \
                -maxdepth 1 \
                -mindepth 1 \
                -type d \
                | sort
            else
              echo "  output 目录不存在"
            fi

            exit 1
          fi

          echo
          echo "============================================================"
          echo "✅ FOUND EXAM JSON"
          echo "============================================================"
          echo
          echo "$FOUND"

          echo "exam_json=$FOUND" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 6. 验证考试结构
      # =========================================================

      - name: Validate exam structure
        env:
          EXAM_JSON: ${{ steps.locate_exam.outputs.exam_json }}
        shell: bash
        run: |
          set -e

          echo
          echo "============================================================"
          echo "VALIDATE EXAM STRUCTURE"
          echo "============================================================"

          TOTAL="$(jq '.questions | length' "$EXAM_JSON")"

          echo
          echo "文件:"
          echo "  $EXAM_JSON"

          echo
          echo "题目数量:"
          echo "  $TOTAL"

          if [ "$TOTAL" -ne 61 ]; then
            echo
            echo "❌ 题目数量错误"
            exit 1
          fi

          LISTENING="$(jq '[.questions[] | select(.type == "listening")] | length' "$EXAM_JSON")"
          SINGLE="$(jq '[.questions[] | select(.type == "single_choice")] | length' "$EXAM_JSON")"
          MULTIPLE="$(jq '[.questions[] | select(.type == "multiple_choice")] | length' "$EXAM_JSON")"
          CLOZE="$(jq '[.questions[] | select(.type == "cloze")] | length' "$EXAM_JSON")"
          READING="$(jq '[.questions[] | select(.type == "reading")] | length' "$EXAM_JSON")"
          TRANSLATION="$(jq '[.questions[] | select(.type == "translation")] | length' "$EXAM_JSON")"
          WRITING="$(jq '[.questions[] | select(.type == "writing")] | length' "$EXAM_JSON")"

          echo
          echo "题型统计:"
          echo "  listening       : $LISTENING"
          echo "  single_choice   : $SINGLE"
          echo "  multiple_choice : $MULTIPLE"
          echo "  cloze           : $CLOZE"
          echo "  reading         : $READING"
          echo "  translation     : $TRANSLATION"
          echo "  writing         : $WRITING"

          if [ "$LISTENING" -ne 15 ]; then exit 1; fi
          if [ "$SINGLE" -ne 10 ]; then exit 1; fi
          if [ "$MULTIPLE" -ne 10 ]; then exit 1; fi
          if [ "$CLOZE" -ne 10 ]; then exit 1; fi
          if [ "$READING" -ne 5 ]; then exit 1; fi
          if [ "$TRANSLATION" -ne 10 ]; then exit 1; fi
          if [ "$WRITING" -ne 1 ]; then exit 1; fi

          echo
          echo "✅ 61 道题"
          echo "✅ 15 listening"
          echo "✅ 10 single_choice"
          echo "✅ 10 multiple_choice"
          echo "✅ 10 cloze"
          echo "✅ 5 reading"
          echo "✅ 10 translation"
          echo "✅ 1 writing"
          echo
          echo "✅ EXAM STRUCTURE PASSED"

      # =========================================================
      # 7. Grader V1.0 完整自动测试
      # =========================================================

      - name: Run Grader V1.0 FULL TEST
        env:
          EXAM_JSON: ${{ steps.locate_exam.outputs.exam_json }}
        shell: bash
        run: |
          set -e

          echo
          echo "============================================================"
          echo "RUN ENGLISH EXAM GRADER V1.0 FULL TEST"
          echo "============================================================"
          echo
          echo "考试 JSON:"
          echo "  $EXAM_JSON"
          echo
          echo "测试脚本:"
          echo "  02_英语学习系统/scripts/test_english_exam_grader_v1_0.py"
          echo

          python \
            "02_英语学习系统/scripts/test_english_exam_grader_v1_0.py" \
            --exam-json "$EXAM_JSON"

      # =========================================================
      # 8. 最终确认
      # =========================================================

      - name: Final Test Summary
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo "🎉 GRADER V1.0 FULL TEST PASSED"
          echo "============================================================"
          echo
          echo "已验证:"
          echo "  ✅ 61 道题结构"
          echo "  ✅ 50 道自动评分题"
          echo "  ✅ 11 道人工/语义处理题"
          echo "  ✅ 50/50 全部正确"
          echo "  ✅ 单选评分"
          echo "  ✅ 多选集合匹配"
          echo "  ✅ 完形评分"
          echo "  ✅ 阅读评分"
          echo "  ✅ 听力评分"
          echo "  ✅ 故意错误识别"
          echo "  ✅ 错题回顾"
          echo "  ✅ 翻译人工复核"
          echo "  ✅ 写作人工复核"
          echo "  ✅ 提交结果卡"
          echo
          echo "Parser V1.3：未修改"
          echo "Grader V1.0：未修改"
          echo
          echo "============================================================"
