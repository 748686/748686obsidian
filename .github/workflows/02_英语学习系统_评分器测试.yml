name: 02_英语学习系统 - Grader V1.0 测试

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grader-test:
    name: English Exam Grader V1.0 FULL TEST
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Python
      # =========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =========================================================
      # 3. 检查评分器文件
      # =========================================================

      - name: Check Grader Files
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "748686 ENGLISH LEARNING SYSTEM"
          echo "GRADER V1.0 TEST"
          echo "============================================================"

          test -f \
            "02_英语学习系统/scripts/english_exam_parser.py"

          test -f \
            "02_英语学习系统/scripts/english_exam_grader.py"

          test -f \
            "02_英语学习系统/scripts/english_exam_grader_test.py"

          echo
          echo "✅ Parser V1.3 文件存在"
          echo "✅ Grader V1.0 文件存在"
          echo "✅ Grader Test 文件存在"

      # =========================================================
      # 4. 检查真实 exam.json
      # =========================================================

      - name: Inspect Exam JSON
        shell: bash
        run: |
          set -e

          EXAM_JSON="02_英语学习系统/output/2026-09-08/.system/exam.json"

          echo
          echo "============================================================"
          echo "INSPECT EXAM JSON"
          echo "============================================================"

          if [ ! -f "$EXAM_JSON" ]; then
            echo "❌ 文件不存在："
            echo "   $EXAM_JSON"
            exit 1
          fi

          echo
          echo "文件："
          echo "  $EXAM_JSON"

          echo
          echo "JSON 顶层结构："

          python - "$EXAM_JSON" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("keys:")
          for key in data.keys():
              print(f"  - {key}")

          print()
          print("version:")
          print(f"  {data.get('version', '<无 version 字段>')}")

          questions = data.get("questions", [])

          print()
          print("questions:")
          print(f"  {len(questions)}")

          if questions:
              print()
              print("第一道题：")
              print(json.dumps(
                  questions[0],
                  ensure_ascii=False,
                  indent=2,
              ))
          PY

      # =========================================================
      # 5. 运行 Grader V1.0
      # =========================================================

      - name: Run Grader V1.0 FULL TEST
        shell: bash
        run: |
          set -e

          EXAM_JSON="02_英语学习系统/output/2026-09-08/.system/exam.json"

          echo
          echo "============================================================"
          echo "RUN ENGLISH EXAM GRADER V1.0"
          echo "============================================================"

          python \
            "02_英语学习系统/scripts/english_exam_grader_test.py" \
            --exam-json "$EXAM_JSON"

      # =========================================================
      # 6. 完成
      # =========================================================

      - name: Test Passed
        run: |
          echo
          echo "============================================================"
          echo "🎉 GRADER V1.0 TEST PASSED"
          echo "============================================================"
