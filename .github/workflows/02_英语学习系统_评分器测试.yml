name: 02_英语学习系统 - Grader V1.0 测试

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grader-test:
    name: English Exam Grader V1.0 FULL TEST
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Python
      # =========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =========================================================
      # 3. 确定 UTC 日期
      # =========================================================

      - name: Determine UTC test dates
        id: dates
        shell: bash
        run: |
          set -e

          TODAY="$(date -u +%Y-%m-%d)"
          YESTERDAY="$(date -u -d '1 day ago' +%Y-%m-%d)"

          echo "============================================================"
          echo "748686 ENGLISH LEARNING SYSTEM"
          echo "GRADER V1.0 TEST"
          echo "============================================================"
          echo
          echo "UTC TODAY     : $TODAY"
          echo "UTC YESTERDAY : $YESTERDAY"

          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "yesterday=$YESTERDAY" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 4. 检查 Parser / Grader / Test 文件
      # =========================================================

      - name: Check Grader files
        shell: bash
        run: |
          set -e

          echo
          echo "============================================================"
          echo "CHECK GRADER FILES"
          echo "============================================================"

          PARSER="02_英语学习系统/scripts/english_exam_parser.py"
          GRADER="02_英语学习系统/scripts/english_exam_grader.py"
          TEST="02_英语学习系统/scripts/test_english_exam_grader_v1_0.py"

          if [ ! -f "$PARSER" ]; then
            echo "❌ 未找到: $PARSER"
            exit 1
          fi

          if [ ! -f "$GRADER" ]; then
            echo "❌ 未找到: $GRADER"
            exit 1
          fi

          if [ ! -f "$TEST" ]; then
            echo "❌ 未找到: $TEST"
            exit 1
          fi

          echo
          echo "✅ english_exam_parser.py"
          echo "✅ english_exam_grader.py"
          echo "✅ test_english_exam_grader_v1_0.py"

      # =========================================================
      # 5. 寻找真实考试 Markdown
      #
      # 正确数据链：
      #
      # 真实试卷 Markdown
      #       ↓
      # 真实答案与解析 Markdown
      #       ↓
      # Parser V1.6
      #       ↓
      # 临时 exam.json
      #       ↓
      # Grader V1.0
      #
      # 只检查 UTC 今天 / UTC 昨天
      # =========================================================

      - name: Locate real exam Markdown
        id: locate_exam
        env:
          TODAY: ${{ steps.dates.outputs.today }}
          YESTERDAY: ${{ steps.dates.outputs.yesterday }}
        shell: bash
        run: |
          set -e

          echo
          echo "============================================================"
          echo "LOCATE REAL EXAM MARKDOWN"
          echo "============================================================"

          FOUND_DATE=""
          EXAM=""
          ANSWERS=""

          for DATE in "$TODAY" "$YESTERDAY"; do

            DIR="02_英语学习系统/output/$DATE/配套试卷"

            echo
            echo "检查日期:"
            echo "  $DATE"
            echo "检查目录:"
            echo "  $DIR"

            if [ ! -d "$DIR" ]; then
              echo "  ⚠️ 配套试卷目录不存在"
              continue
            fi

            CANDIDATE="$(find "$DIR" \
              -maxdepth 1 \
              -type f \
              -name "*_试卷.md" \
              | sort \
              | head -n 1)"

            if [ -z "$CANDIDATE" ]; then
              echo "  ⚠️ 未找到 *_试卷.md"
              continue
            fi

            BASENAME="$(basename "$CANDIDATE" "_试卷.md")"
            CANDIDATE_ANSWERS="$DIR/${BASENAME}_答案与解析.md"

            echo
            echo "发现试卷:"
            echo "  $CANDIDATE"

            echo
            echo "寻找答案与解析:"
            echo "  $CANDIDATE_ANSWERS"

            if [ ! -f "$CANDIDATE_ANSWERS" ]; then
              echo "  ⚠️ 对应答案与解析不存在"
              continue
            fi

            FOUND_DATE="$DATE"
            EXAM="$CANDIDATE"
            ANSWERS="$CANDIDATE_ANSWERS"

            break
          done

          if [ -z "$EXAM" ]; then
            echo
            echo "❌ 未找到当前日期范围内的真实考试 Markdown"
            echo
            echo "搜索范围:"
            echo "  UTC 今天    : $TODAY"
            echo "  UTC 昨天    : $YESTERDAY"
            echo
            echo "期望结构:"
            echo "  02_英语学习系统/output/YYYY-MM-DD/配套试卷/"
            echo "    *_试卷.md"
            echo "    *_答案与解析.md"
            echo
            echo "现有 output 日期目录:"

            if [ -d "02_英语学习系统/output" ]; then
              find "02_英语学习系统/output" \
                -maxdepth 1 \
                -mindepth 1 \
                -type d \
                | sort
            else
              echo "  output 目录不存在"
            fi

            exit 1
          fi

          echo
          echo "============================================================"
          echo "✅ FOUND REAL EXAM"
          echo "============================================================"
          echo
          echo "考试日期:"
          echo "  $FOUND_DATE"
          echo
          echo "试卷:"
          echo "  $EXAM"
          echo
          echo "答案与解析:"
          echo "  $ANSWERS"

          echo "date=$FOUND_DATE" >> "$GITHUB_OUTPUT"
          echo "exam=$EXAM" >> "$GITHUB_OUTPUT"
          echo "answers=$ANSWERS" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 6. Parser V1.6
      #
      # 将真实 Markdown 临时转换成 exam.json
      #
      # 注意：
      # 这个 JSON 只存在于 GitHub Actions runner 的 /tmp
      # 不写回仓库
      # =========================================================

      - name: Run Parser V1.6 and create temporary exam JSON
        env:
          EXAM: ${{ steps.locate_exam.outputs.exam }}
          ANSWERS: ${{ steps.locate_exam.outputs.answers }}
        shell: bash
        run: |
          set -e

          echo
          echo "============================================================"
          echo "RUN ENGLISH EXAM PARSER V1.6"
          echo "============================================================"
          echo
          echo "真实试卷:"
          echo "  $EXAM"
          echo
          echo "答案与解析:"
          echo "  $ANSWERS"
          echo

          JSON="/tmp/748686_exam_parser_v1_6.json"

          rm -f "$JSON"

          python \
            "02_英语学习系统/scripts/english_exam_parser.py" \
            --exam "$EXAM" \
            --answers "$ANSWERS" \
            --output "$JSON" \
            --validate

          if [ ! -s "$JSON" ]; then
            echo
            echo "❌ Parser V1.6 没有生成有效 JSON"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "✅ PARSER V1.6 PASSED"
          echo "============================================================"
          echo
          echo "临时 JSON:"
          echo "  $JSON"
          echo
          echo "Parser V1.6 已成功将真实试卷转换为 Grader 输入。"

      # =========================================================
      # 7. 验证 Parser 生成的临时 JSON
      # =========================================================

      - name: Validate parsed exam JSON
        shell: bash
        run: |
          set -e

          JSON="/tmp/748686_exam_parser_v1_6.json"

          echo
          echo "============================================================"
          echo "VALIDATE PARSED EXAM JSON"
          echo "============================================================"

          if [ ! -s "$JSON" ]; then
            echo "❌ JSON 不存在或为空"
            exit 1
          fi

          VERSION="$(python -c '
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print(data.get("version", ""))
          ' "$JSON")"

          echo
          echo "Parser JSON version:"
          echo "  $VERSION"

          if [ "$VERSION" != "1.6" ]; then
            echo
            echo "❌ Parser JSON version 不是 1.6"
            exit 1
          fi

          TOTAL="$(python -c '
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          questions = data.get("questions")

          if not isinstance(questions, list):
              raise SystemExit("questions 不是数组")

          print(len(questions))
          ' "$JSON")"

          echo
          echo "Parser 输出题目数量:"
          echo "  $TOTAL"

          if [ "$TOTAL" -ne 61 ]; then
            echo
            echo "❌ Parser 输出不是 61 道题"
            exit 1
          fi

          echo
          echo "✅ Parser V1.6 version = 1.6"
          echo "✅ Parser V1.6 输出 61 道题"
          echo "✅ 临时 exam.json 结构正常"

      # =========================================================
      # 8. Grader V1.0 完整自动测试
      # =========================================================

      - name: Run Grader V1.0 FULL TEST
        shell: bash
        run: |
          set -e

          EXAM_JSON="/tmp/748686_exam_parser_v1_6.json"

          echo
          echo "============================================================"
          echo "RUN ENGLISH EXAM GRADER V1.0 FULL TEST"
          echo "============================================================"
          echo
          echo "考试 JSON:"
          echo "  $EXAM_JSON"
          echo
          echo "测试脚本:"
          echo "  02_英语学习系统/scripts/test_english_exam_grader_v1_0.py"
          echo

          python \
            "02_英语学习系统/scripts/test_english_exam_grader_v1_0.py" \
            --exam-json "$EXAM_JSON"

      # =========================================================
      # 9. 最终确认
      # =========================================================

      - name: Final Test Summary
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo "🎉 GRADER V1.0 FULL TEST PASSED"
          echo "============================================================"
          echo
          echo "真实数据链:"
          echo "  真实考试 Markdown"
          echo "        ↓"
          echo "  Parser V1.6"
          echo "        ↓"
          echo "  临时 exam.json"
          echo "        ↓"
          echo "  Grader V1.0"
          echo
          echo "已验证:"
          echo "  ✅ Parser JSON version = 1.6"
          echo "  ✅ 61 道题结构"
          echo "  ✅ 50 道自动评分题"
          echo "  ✅ 11 道人工/语义处理题"
          echo "  ✅ 50/50 全部正确"
          echo "  ✅ 单选评分"
          echo "  ✅ 多选集合匹配"
          echo "  ✅ 完形评分"
          echo "  ✅ 阅读评分"
          echo "  ✅ 听力评分"
          echo "  ✅ 故意错误识别"
          echo "  ✅ 错题回顾"
          echo "  ✅ 翻译人工复核"
          echo "  ✅ 写作人工复核"
          echo "  ✅ 提交结果卡"
          echo
          echo "Parser V1.6：正常"
          echo "Grader V1.0：未修改"
          echo "测试脚本：V1.0"
          echo
          echo "临时 exam.json：仅用于本次 Actions 测试，不写入仓库"
          echo
          echo "============================================================"
