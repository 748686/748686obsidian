name: 748686 飞书单词背景效果测试 V4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feishu-word-highlight-test-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install requests

      - name: Check test script
        run: |
          set -e

          SCRIPT="02_英语学习系统/scripts/feishu_word_highlight_test_v4.py"

          echo
          echo "============================================================"
          echo "CHECK FEISHU WORD HIGHLIGHT TEST V4"
          echo "============================================================"

          if [ ! -f "$SCRIPT" ]; then
            echo "❌ 测试 Python 文件不存在："
            echo "$SCRIPT"
            exit 1
          fi

          echo "✓ 测试文件存在："
          echo "$SCRIPT"

      - name: Send Feishu test
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}

        run: |
          set -e

          echo
          echo "============================================================"
          echo "748686 FEISHU WORD HIGHLIGHT TEST V4"
          echo "============================================================"

          python \
            "02_英语学习系统/scripts/feishu_word_highlight_test_v4.py"

          echo
          echo "============================================================"
          echo "✓ FEISHU WORD HIGHLIGHT TEST V4 FINISHED"
          echo "============================================================"
