name: 748686 飞书单词蓝底效果测试

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feishu-word-highlight-test:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # 3. 安装依赖
      # ======================================================

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ======================================================
      # 4. 检查测试文件
      # ======================================================

      - name: Check test script
        run: |
          set -e

          SCRIPT="02_英语学习系统/scripts/feishu_word_highlight_test.py"

          echo
          echo "============================================================"
          echo "CHECK FEISHU WORD HIGHLIGHT TEST"
          echo "============================================================"

          if [ ! -f "$SCRIPT" ]; then
            echo "❌ 测试 Python 文件不存在："
            echo "$SCRIPT"
            exit 1
          fi

          echo "✓ 测试文件存在："
          echo "$SCRIPT"

      # ======================================================
      # 5. 执行飞书测试
      # ======================================================

      - name: Send Feishu word highlight test
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          set -e

          echo
          echo "============================================================"
          echo "748686 FEISHU WORD HIGHLIGHT TEST"
          echo "============================================================"

          python \
            "02_英语学习系统/scripts/feishu_word_highlight_test.py"

          echo
          echo "============================================================"
          echo "✓ FEISHU WORD HIGHLIGHT TEST FINISHED"
          echo "============================================================"
