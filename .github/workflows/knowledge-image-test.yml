name: 748686 日报周报插图独立测试

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  knowledge-image-test:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout 748686obsidian
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. Python
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

           # ==========================================================
      # 3. 安装图片质量检查 + OCR
      # ==========================================================

      - name: 安装 Pillow 和 Tesseract OCR
        run: |
          set -e

          echo "============================================================"
          echo "INSTALL IMAGE QA + OCR"
          echo "============================================================"

          python -m pip install --upgrade pip

          python -m pip install \
            Pillow \
            pytesseract

          sudo apt-get update

          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-chi-sim \
            tesseract-ocr-chi-tra

          echo
          echo "============================================================"
          echo "VERIFY IMAGE QA + OCR"
          echo "============================================================"

          python - <<'PY'
          from PIL import Image
          import pytesseract

          print("Pillow installed successfully")
          print("Pillow version:", Image.__version__)

          print()
          print("Tesseract version:")
          print(pytesseract.get_tesseract_version())

          print()
          print("OCR languages:")
          print(pytesseract.get_languages(config=""))
          PY
      # ==========================================================
      # 4. 检查测试文件
      # ==========================================================

      - name: 检查图片生成程序
        run: |
          set -e

          echo "============================================================"
          echo "CHECK knowledge_image.py"
          echo "============================================================"

          test -f "01_自生长知识系统/scripts/knowledge_image.py"

          echo "knowledge_image.py 存在"
          echo

      # ==========================================================
      # 5. 显示测试环境
      # ==========================================================

      - name: 检查测试环境
        run: |
          set -e

          echo "============================================================"
          echo "IMAGE TEST ENVIRONMENT"
          echo "============================================================"

          echo "Python:"
          python --version

          echo
          echo "Pillow:"
          python -c "from PIL import Image; print(Image.__version__)"

          echo
          echo "FORCE_REGENERATE:"
          echo "true"

          echo

      # ==========================================================
      # 6. 显示当前报告情况
      # ==========================================================

      - name: 检查日报周报
        run: |
          set -e

          echo "============================================================"
          echo "CURRENT DAILY REPORTS"
          echo "============================================================"

          find "01_自生长知识系统/05_日报" \
            -type f \
            -name "*.md" \
            | sort \
            | tail -20 || true

          echo
          echo "============================================================"
          echo "CURRENT WEEKLY REPORTS"
          echo "============================================================"

          find "01_自生长知识系统/06_周报" \
            -type f \
            -name "*.md" \
            | sort \
            | tail -20 || true

          echo

      # ==========================================================
      # 7. 执行图片生成
      #
      # Python 内部负责：
      #
      # UTC 日期
      # 日报前天/昨天/今天
      # 周报
      # 新闻锚定
      # 图片质量检查
      # AGNES API
      # 图片下载
      # 图片落盘
      # *_带图.md
      # 验证
      #
      # YAML 不参与任何图片逻辑。
      # ==========================================================

      - name: 生成日报周报图片
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          FORCE_REGENERATE: "true"
        run: |
          set -e

          echo "============================================================"
          echo "748686 IMAGE TEST"
          echo "============================================================"

          echo "FORCE_REGENERATE=true"
          echo

          python 01_自生长知识系统/scripts/knowledge_image.py

          echo
          echo "============================================================"
          echo "IMAGE SCRIPT FINISHED"
          echo "============================================================"

      # ==========================================================
      # 8. 检查生成结果
      # ==========================================================

      - name: 验证图片和带图报告
        run: |
          set -e

          echo "============================================================"
          echo "GENERATED IMAGE FILES"
          echo "============================================================"

          find "01_自生长知识系统/04_图片" \
            -type f \
            | sort \
            | tail -50 || true

          echo
          echo "============================================================"
          echo "GENERATED DAILY IMAGE REPORTS"
          echo "============================================================"

          find "01_自生长知识系统/05_日报" \
            -type f \
            -name "*_带图.md" \
            | sort \
            | tail -20 || true

          echo
          echo "============================================================"
          echo "GENERATED WEEKLY IMAGE REPORTS"
          echo "============================================================"

          find "01_自生长知识系统/06_周报" \
            -type f \
            -name "*_带图.md" \
            | sort \
            | tail -20 || true

          echo

      # ==========================================================
      # 9. Git 状态
      # ==========================================================

      - name: 查看 Git 变更
        run: |
          echo "============================================================"
          echo "GIT STATUS"
          echo "============================================================"

          git status --short

          echo
          echo "============================================================"
          echo "CHANGED FILES"
          echo "============================================================"

          git diff --stat || true

      # ==========================================================
      # 10. 提交测试结果
      #
      # 只提交本次图片测试产生的文件。
      # ==========================================================

      - name: 保存测试结果
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "01_自生长知识系统/04_图片" \
            "01_自生长知识系统/05_日报" \
            "01_自生长知识系统/06_周报"

          if git diff --cached --quiet; then
            echo "没有新的图片或带图报告需要提交。"
          else
            git commit -m "test: 生成日报周报图片测试结果"
            git push
          fi

      # ==========================================================
      # 11. 最终输出
      # ==========================================================

      - name: 测试完成
        run: |
          echo
          echo "============================================================"
          echo "748686 日报周报插图独立测试完成"
          echo "============================================================"
          echo
          echo "请检查："
          echo
          echo "01_自生长知识系统/04_图片/日报/"
          echo "01_自生长知识系统/04_图片/周报/"
          echo
          echo "以及："
          echo
          echo "01_自生长知识系统/05_日报/"
          echo "01_自生长知识系统/06_周报/"
          echo
          echo "重点检查 *_带图.md 中的图片是否正常。"
          echo
