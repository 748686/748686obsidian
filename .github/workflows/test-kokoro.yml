name: TEST - Kokoro Voice

on:
  workflow_dispatch:

jobs:
  test-kokoro:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kokoro-onnx soundfile numpy

      - name: Create voice inspection script
        run: |
          cat > /tmp/test_voice.py <<'PYTHON'
          from pathlib import Path
          import sys
          import inspect

          from kokoro_onnx import Kokoro


          PROJECT_ROOT = Path("02_英语学习系统")

          MODEL_PATH = (
              PROJECT_ROOT
              / "models"
              / "kokoro"
              / "kokoro-v1.1-zh.fp16.onnx"
          )

          VOICES_PATH = (
              PROJECT_ROOT
              / "models"
              / "kokoro"
              / "voices-v1.1-zh.bin"
          )


          print()
          print("=" * 70)
          print("748686 英语学习系统")
          print("Kokoro Voice Inspection")
          print("=" * 70)

          print()
          print("MODEL")
          print("-" * 70)
          print(MODEL_PATH)
          print(f"Size: {MODEL_PATH.stat().st_size:,} bytes")

          print()
          print("VOICES")
          print("-" * 70)
          print(VOICES_PATH)
          print(f"Size: {VOICES_PATH.stat().st_size:,} bytes")


          print()
          print("=" * 70)
          print("LOAD KOKORO")
          print("=" * 70)

          try:
              kokoro = Kokoro(
                  str(MODEL_PATH),
                  str(VOICES_PATH),
              )
          except Exception as exc:
              print()
              print("FAILED TO LOAD KOKORO")
              print(type(exc).__name__)
              print(exc)
              sys.exit(1)

          print()
          print("✓ Kokoro loaded successfully")


          print()
          print("=" * 70)
          print("KOKORO OBJECT")
          print("=" * 70)

          print()

          attributes = sorted(
              name
              for name in dir(kokoro)
              if not name.startswith("__")
          )

          for name in attributes:
              print(f"  {name}")


          print()
          print("=" * 70)
          print("VOICE RELATED ATTRIBUTES")
          print("=" * 70)

          found = False

          for name in attributes:

              if "voice" not in name.lower():
                  continue

              print()
              print(f"ATTRIBUTE: {name}")

              try:
                  value = getattr(kokoro, name)

                  print(f"TYPE: {type(value)}")

                  if isinstance(value, dict):

                      print(f"COUNT: {len(value)}")

                      for key in sorted(
                          str(k)
                          for k in value.keys()
                      ):
                          print(f"  VOICE: {key}")

                      found = True

                  elif isinstance(
                      value,
                      (list, tuple, set),
                  ):

                      print(f"COUNT: {len(value)}")

                      for item in value:
                          print(f"  VOICE: {item}")

                      found = True

                  else:

                      text = str(value)

                      if len(text) > 2000:
                          text = text[:2000] + "..."

                      print(text)

              except Exception as exc:

                  print(
                      f"ERROR READING ATTRIBUTE: "
                      f"{type(exc).__name__}: {exc}"
                  )


          print()
          print("=" * 70)
          print("KOKORO SOURCE")
          print("=" * 70)

          try:
              print(
                  inspect.getsource(
                      Kokoro
                  )
              )
          except Exception as exc:
              print(
                  "Could not print source:",
                  type(exc).__name__,
                  exc,
              )


          print()
          print("=" * 70)
          print("RESULT")
          print("=" * 70)

          if found:
              print()
              print("✓ Voice-related data was found.")
              print()
              print(
                  "Please use the VOICE names printed above "
                  "for the next test."
              )
          else:
              print()
              print(
                  "⚠ No public voice list was exposed."
              )
              print()
              print(
                  "The Kokoro package source above will show "
                  "how the voices file is accessed."
              )

          print()
          print("=" * 70)
          PYTHON

      - name: Inspect Kokoro voices
        run: |
          python /tmp/test_voice.py
