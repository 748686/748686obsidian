name: TEST - Kokoro Audio

on:
  workflow_dispatch:

jobs:
  test-kokoro:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kokoro-onnx soundfile numpy

      - name: Check Kokoro files
        run: |
          echo "============================================================"
          echo "KOKORO FILE CHECK"
          echo "============================================================"

          MODEL="02_英语学习系统/models/kokoro/kokoro-v1.1-zh.fp16.onnx"
          VOICES="02_英语学习系统/models/kokoro/voices-v1.1-zh.bin"

          echo
          echo "MODEL"
          echo "------------------------------------------------------------"
          ls -lh "$MODEL"
          wc -c "$MODEL"

          echo
          echo "VOICES"
          echo "------------------------------------------------------------"
          ls -lh "$VOICES"
          wc -c "$VOICES"

          echo
          echo "GIT LFS"
          echo "------------------------------------------------------------"
          git lfs ls-files || true

          echo
          echo "MODEL HEADER"
          echo "------------------------------------------------------------"
          head -c 200 "$MODEL" | strings || true

      - name: Create Kokoro test script
        run: |
          cat > /tmp/test_kokoro.py <<'PYTHON'
          from pathlib import Path
          import random
          import sys
          import time

          import numpy as np
          import soundfile as sf
          from kokoro_onnx import Kokoro


          PROJECT_ROOT = Path("02_英语学习系统")

          MODEL_PATH = (
              PROJECT_ROOT
              / "models"
              / "kokoro"
              / "kokoro-v1.1-zh.fp16.onnx"
          )

          VOICES_PATH = (
              PROJECT_ROOT
              / "models"
              / "kokoro"
              / "voices-v1.1-zh.bin"
          )

          OUTPUT_DIR = (
              PROJECT_ROOT
              / "output"
              / "kokoro_test"
          )

          OUTPUT_PATH = OUTPUT_DIR / "kokoro_test.mp3"

          LANGUAGE = "en-us"
          SPEED = 1.0

          TEST_SENTENCES = [
              "This is a test of the Kokoro text to speech system.",
              "The local Kokoro model is working successfully.",
              "This is a completely local audio generation test.",
              "Today is a good day to learn something new.",
              "The audio generation test has passed successfully.",
          ]


          def fail(message):
              print()
              print("TEST FAILED")
              print()
              print(message)
              print()
              sys.exit(1)


          print()
          print("=" * 70)
          print("748686 英语学习系统")
          print("Kokoro Standalone Test")
          print("=" * 70)

          print()
          print("CONFIG")
          print(f"  Model    : {MODEL_PATH}")
          print(f"  Voices   : {VOICES_PATH}")
          print(f"  Language : {LANGUAGE}")
          print(f"  Speed    : {SPEED}")


          print()
          print("=" * 70)
          print("FILE CHECK")
          print("=" * 70)

          if not MODEL_PATH.exists():
              fail(f"ONNX model not found:\n{MODEL_PATH}")

          if not VOICES_PATH.exists():
              fail(f"Voices file not found:\n{VOICES_PATH}")

          model_size = MODEL_PATH.stat().st_size
          voices_size = VOICES_PATH.stat().st_size

          print(f"  ONNX exists")
          print(f"    Size: {model_size:,} bytes")

          print()
          print(f"  Voices exists")
          print(f"    Size: {voices_size:,} bytes")


          print()
          print("=" * 70)
          print("LFS / MODEL CONTENT CHECK")
          print("=" * 70)

          with MODEL_PATH.open("rb") as file:
              header = file.read(512)

          header_text = header.decode(
              "utf-8",
              errors="ignore",
          )

          if "version https://git-lfs.github.com/spec/v1" in header_text:
              fail(
                  "The ONNX file is a Git LFS pointer, "
                  "not the actual model."
              )

          print("  ✓ Model is not a Git LFS pointer")

          print()
          print("  First 32 bytes:")
          print("   ", header[:32].hex(" "))


          print()
          print("=" * 70)
          print("LOAD KOKORO MODEL")
          print("=" * 70)

          print()
          print("  Loading local Kokoro model...")

          started = time.time()

          try:
              kokoro = Kokoro(
                  str(MODEL_PATH),
                  str(VOICES_PATH),
              )
          except Exception as exc:
              print()
              print("  KOKORO MODEL LOAD FAILED")
              print()
              print(f"  Error type: {type(exc).__name__}")
              print()
              print(f"  Error: {exc}")
              print()
              sys.exit(1)

          elapsed = time.time() - started

          print()
          print("  ✓ KOKORO MODEL LOADED SUCCESSFULLY")
          print(f"  Loading time: {elapsed:.2f}s")


          print()
          print("=" * 70)
          print("AVAILABLE VOICES")
          print("=" * 70)

          available_voices = []

          for attribute in (
              "voices",
              "available_voices",
              "_voices",
          ):
              if hasattr(kokoro, attribute):
                  value = getattr(kokoro, attribute)

                  if isinstance(value, dict):
                      available_voices = list(value.keys())

                  elif isinstance(
                      value,
                      (list, tuple, set),
                  ):
                      available_voices = list(value)

                  if available_voices:
                      print(f"  Source: kokoro.{attribute}")
                      break

          if available_voices:
              available_voices = sorted(
                  str(voice)
                  for voice in available_voices
              )

              print()
              print(
                  f"  Total voices: {len(available_voices)}"
              )

              print()

              for voice in available_voices:
                  print(f"    {voice}")

          else:
              print()
              print("  Voice list is not exposed by this version.")


          print()
          print("=" * 70)
          print("SELECT TEST VOICE")
          print("=" * 70)

          preferred_voices = [
              "af_sarah",
              "am_adam",
              "af_bella",
              "af_nicole",
              "af_sky",
              "am_michael",
              "am_fenrir",
              "am_puck",
          ]

          selected_voice = None

          if available_voices:

              for voice in preferred_voices:
                  if voice in available_voices:
                      selected_voice = voice
                      break

              if selected_voice is None:
                  selected_voice = available_voices[0]

          else:
              selected_voice = "af_sarah"

          print()
          print(f"  Selected voice: {selected_voice}")


          print()
          print("=" * 70)
          print("TTS GENERATION TEST")
          print("=" * 70)

          text = random.choice(TEST_SENTENCES)

          print()
          print("  Test sentence:")
          print()
          print(f"    {text}")

          print()
          print(f"  Voice    : {selected_voice}")
          print(f"  Language : {LANGUAGE}")
          print(f"  Speed    : {SPEED}")

          print()
          print("  Generating audio...")

          started = time.time()

          try:
              samples, sample_rate = kokoro.create(
                  text,
                  voice=selected_voice,
                  speed=SPEED,
                  lang=LANGUAGE,
              )

          except Exception as exc:
              print()
              print("  TTS GENERATION FAILED")
              print()
              print(f"  Error type: {type(exc).__name__}")
              print()
              print(f"  Error: {exc}")
              print()
              sys.exit(1)

          elapsed = time.time() - started

          sample_count = len(samples)

          if sample_count <= 0:
              fail("Kokoro returned empty audio.")

          duration = sample_count / float(sample_rate)

          print()
          print("  ✓ TTS GENERATION SUCCESS")
          print(f"  Generation time: {elapsed:.2f}s")
          print(f"  Sample rate    : {sample_rate}")
          print(f"  Samples        : {sample_count}")
          print(f"  Duration       : {duration:.2f}s")


          print()
          print("=" * 70)
          print("SAVE MP3")
          print("=" * 70)

          OUTPUT_DIR.mkdir(
              parents=True,
              exist_ok=True,
          )

          print()
          print(f"  Output:")
          print(f"    {OUTPUT_PATH}")

          try:
              sf.write(
                  str(OUTPUT_PATH),
                  np.asarray(samples),
                  sample_rate,
                  format="MP3",
              )

          except Exception as exc:
              print()
              print("  MP3 SAVE FAILED")
              print()
              print(f"  Error type: {type(exc).__name__}")
              print()
              print(f"  Error: {exc}")
              print()
              sys.exit(1)

          if not OUTPUT_PATH.exists():
              fail("MP3 file was not created.")

          output_size = OUTPUT_PATH.stat().st_size

          if output_size <= 0:
              fail("MP3 file is empty.")

          print()
          print("  ✓ MP3 CREATED SUCCESSFULLY")
          print(f"  File size: {output_size:,} bytes")


          print()
          print("=" * 70)
          print("TEST COMPLETE")
          print("=" * 70)

          print()
          print("  ✓ ONNX model loaded")
          print("  ✓ Voices file loaded")
          print(f"  ✓ Voice '{selected_voice}' works")
          print("  ✓ TTS inference succeeded")
          print("  ✓ MP3 generated")

          print()
          print("  TEST RESULT: PASS")

          print()
          print(f"  Audio:")
          print(f"    {OUTPUT_PATH}")

          print()
          print("=" * 70)
          PYTHON

      - name: Run Kokoro test
        run: |
          python /tmp/test_kokoro.py

      - name: Show generated audio
        if: always()
        run: |
          echo "============================================================"
          echo "GENERATED AUDIO"
          echo "============================================================"

          ls -lah \
            02_英语学习系统/output/kokoro_test/ \
            || true

      - name: Upload test audio
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-test-audio
          path: 02_英语学习系统/output/kokoro_test/kokoro_test.mp3
          if-no-files-found: error
