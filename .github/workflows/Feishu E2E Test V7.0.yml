name: 748686 FEISHU E2E CALLBACK TEST V7.0

on:
  workflow_dispatch:

jobs:
  feishu-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Setup Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 3. Install Feishu SDK
      # ============================================================

      - name: Install Feishu SDK
        run: |
          python -m pip install --upgrade pip
          pip install -U lark-oapi


      # ============================================================
      # 4. Check V7.0 Python file
      # ============================================================

      - name: Check V7.0 Python
        run: |
          test -f "02_英语学习系统/scripts/feishu_e2e_v7.py"

          echo
          echo "============================================================"
          echo "V7.0 PYTHON FILE FOUND"
          echo "============================================================"
          echo

          ls -lh "02_英语学习系统/scripts/feishu_e2e_v7.py"


      # ============================================================
      # 5. Run V7.0
      # ============================================================

      - name: Run Feishu E2E V7.0
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}

        run: |

          echo
          echo "============================================================"
          echo "748686 FEISHU E2E CALLBACK TEST V7.0"
          echo "============================================================"
          echo

          echo "Starting:"
          echo "02_英语学习系统/scripts/feishu_e2e_v7.py"

          echo
          echo "============================================================"
          echo

          python "02_英语学习系统/scripts/feishu_e2e_v7.py"
